- id: EG-EDA/CD-A4-01
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: cadc
  layer: eda
  ctd: 3.2.P.5.1
  title:
    en: Microbial limits for non-sterile products
    ar: الحدود الميكروبية للمستحضرات غير المعقمة
  question:
    en: >-
      Does the specification of the non-sterile product state TAMC, TYMC and specified microorganisms by route per Annex IV Table 1
      (non-aqueous oral 10^3/10^2 cfu, E. coli absent; aqueous oral 10^2/10^1, E. coli absent; cutaneous, nasal, oromucosal and auricular
      10^2/10^1, S. aureus and P. aeruginosa absent; vaginal also C. albicans absent; inhalation also bile-tolerant Gram-negatives absent;
      rectal 10^3/10^2), interpreted as maximum counts of 20, 200 and 2000, with method, neutraliser and reference stated and B. cepacia
      where USP requires it?
    ar: >-
      هل تحدد مواصفات المستحضر غير المعقم العد الكلي للهوائيات والعد الكلي للخمائر والفطريات والكائنات المحددة حسب طريق الإعطاء وفق الجدول 1
      من الملحق الرابع (الفموية غير المائية 10^3/10^2 وحدة مكوّنة للمستعمرات مع غياب الإشريكية القولونية؛ والفموية المائية 10^2/10^1 مع
      غيابها؛ والجلدية والأنفية والفموية المخاطية والأذنية 10^2/10^1 مع غياب المكورات العنقودية الذهبية والزائفة الزنجارية؛ والمهبلية مع
      غياب المبيضة البيضاء أيضاً؛ والاستنشاقية مع غياب سالبات الجرام المتحملة للصفراء أيضاً؛ والشرجية 10^3/10^2)، مفسَّرة كحد أقصى 20 و200
      و2000، مع بيان الطريقة والمعادل الكيميائي والمرجع واختبار B. cepacia حيث يشترطه USP؟
  applies: '''sterile'' not in dosage_specifics'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should include the microbiological quality tests (TAMC, TYMC and specified microorganisms) with the acceptance criteria
      of Annex IV Table 1 for the route of administration, stating the method, any neutraliser and the pharmacopoeial reference.
    ar: >-
      يجب على مقدم الطلب إدراج اختبارات الجودة الميكروبيولوجية (العد الكلي للهوائيات، والعد الكلي للخمائر والفطريات، والكائنات المحددة)
      بمعايير القبول الواردة في الجدول 1 من الملحق الرابع لطريق الإعطاء، مع بيان الطريقة وأي معادل كيميائي والمرجع الدستوري.
  action:
    type: edit_data
    target: specs.product
  evidence:
    slots:
      - EG-EDA/P-09
    keywords:
      - TAMC
      - TYMC
      - total aerobic
      - cfu
      - microbial
      - Escherichia coli
    data:
      - specs.product
  cite:
    - src: eda-gl-cadc-002-v2
      at: Annex IV §1, Table 1 and Note (3)
      quote: >-
        101 cfu: maximum acceptable count =20, 102 cfu: maximum acceptable count =200, 103 cfu: maximum acceptable count =2000; and so
        forth.
- id: EG-EDA/CD-A4-02
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: cadc
  layer: eda
  ctd: 3.2.P.5.1
  title:
    en: Sterility test specification
    ar: مواصفة اختبار العقامة
  question:
    en: >-
      For a sterile product, does the specification include the sterility test stating the technique (direct inoculation or membrane
      filtration), any neutraliser with its percentage, the sterilisation method of the product (filtration, steam, dry heat, irradiation or
      ethylene oxide), the acceptance criterion 'complies' and the pharmacopoeial reference, with a method suitability certificate for
      products with antimicrobial activity?
    ar: >-
      بالنسبة للمستحضر المعقم، هل تتضمن المواصفات اختبار العقامة مع بيان التقنية (التلقيح المباشر أو الترشيح الغشائي)، وأي معادل كيميائي
      ونسبته، وطريقة تعقيم المستحضر (الترشيح أو البخار أو الحرارة الجافة أو التشعيع أو غاز أكسيد الإيثيلين)، ومعيار القبول «مطابق»، والمرجع
      الدستوري، مع شهادة ملاءمة الطريقة للمستحضرات ذات النشاط المضاد للميكروبات؟
  applies: '''sterile'' in dosage_specifics'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should include the sterility test in the specification stating the technique, neutraliser, sterilisation method of the
      product and pharmacopoeial reference, and provide a method suitability certificate where the product has antimicrobial activity.
    ar: >-
      يجب على مقدم الطلب إدراج اختبار العقامة في المواصفات مع بيان التقنية والمعادل الكيميائي وطريقة تعقيم المستحضر والمرجع الدستوري، وتقديم
      شهادة ملاءمة الطريقة إذا كان للمستحضر نشاط مضاد للميكروبات.
  action:
    type: edit_data
    target: specs.product
  evidence:
