    en: >-
      Is the post-approval stability protocol and commitment (Annex IX) submitted, committing to complete the long-term study (12 and/or 24
      months) on the submitted pilot batches, to run stability on commercial batches and ongoing studies under the same protocol, with the
      Annex X declaration to report any OOS in ongoing or long-term studies?
    ar: >-
      هل قُدم بروتوكول وتعهد الثبات بعد الموافقة (الملحق التاسع) متضمناً التعهد بإكمال دراسة الصلاحية طويلة الأمد (12 و/أو 24 شهراً) على
      التشغيلات التجريبية المقدمة، وإجراء دراسات الثبات على التشغيلات التجارية والدراسات المستمرة بنفس البروتوكول، مع إقرار الملحق العاشر
      بالإبلاغ عن أي نتائج خارج المواصفات في الدراسات المستمرة أو طويلة الأمد؟
