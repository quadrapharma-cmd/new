  ctd: ST-T
  title:
    en: Specification test content
    ar: محتوى اختبارات المواصفات
  question:
    en: >-
      Do the specifications include physical tests (with justification of mottling where applicable), assay of actives, quantitation of
      impurities and related substances, assay of preservatives/stabilizers/chelating agents/antioxidants where present, microbiological
      tests, and performance or functionality tests (dissolution, viscosity, dose delivery per actuation)?
    ar: >-
      هل تتضمن المواصفات الاختبارات الفيزيائية (مع تبرير التبقع حيثما ينطبق)، ومعايرة المواد الفعالة، وتقدير الشوائب والمواد ذات الصلة،
      ومعايرة المواد الحافظة والمثبتات والعوامل المخلبية ومضادات الأكسدة عند وجودها، والاختبارات الميكروبيولوجية، واختبارات الأداء أو
      الوظيفة (الانحلال، اللزوجة، الجرعة المنطلقة لكل ضغطة)؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should include in the specifications the physical, chemical (assay, impurities and related substances,
      preservative/stabilizer/chelating agent/antioxidant content), microbiological and performance/functionality tests required for the
      dosage form.
    ar: >-
      يجب على مقدم الطلب تضمين المواصفات الاختبارات الفيزيائية والكيميائية (المعايرة، الشوائب والمواد ذات الصلة، محتوى المادة
      الحافظة/المثبت/العامل المخلبي/مضاد الأكسدة) والميكروبيولوجية واختبارات الأداء/الوظيفة المطلوبة للشكل الصيدلي.
  action:
