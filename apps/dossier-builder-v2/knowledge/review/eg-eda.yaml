    keywords:
      - protocol
      - ethics committee
      - IRB
      - signed
    data: []
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.5 Study protocol
      quote: >-
        A signed and dated study protocol together with the study report should be presented to the authority in order to obtain the
        marketing authorization
- id: EG-EDA/BE-03
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Study design justified
    ar: تبرير تصميم الدراسة
  question:
    en: >-
      Is the study design justified: a two-formulation, two-period, two-sequence crossover in healthy subjects as default (or the published
      product-specific guidance), with a replicated design (e.g. four-period TRTR-RTRT using the same lots) where reference-scaling is
      intended, and a parallel design only where justified?
    ar: >-
      هل تصميم الدراسة مبرر: تصميم متقاطع بمستحضرين وفترتين وتسلسلين في متطوعين أصحاء كتصميم افتراضي (أو وفق الإرشادات المنشورة الخاصة
      بالمنتج)، مع تصميم مكرر (مثل أربع فترات TRTR-RTRT بنفس التشغيلات) عند اعتزام استخدام التوسيع المرجعي، وتصميم متوازٍ فقط عند وجود مبرر؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should justify the study design against the published guidance; in the absence of product-specific guidance the default
      is a two-way crossover design, and a replicated crossover design (same lots of test and reference) is needed when reference-scaled
      bioequivalence is applied.
    ar: >-
      يجب على مقدم الطلب تبرير تصميم الدراسة وفق الإرشادات المنشورة؛ وفي غياب إرشادات خاصة بالمنتج يكون التصميم الافتراضي تصميماً متقاطعاً
      ثنائي الاتجاه، ويلزم تصميم متقاطع مكرر (بنفس تشغيلات المستحضر المختبر والمرجعي) عند تطبيق التكافؤ الحيوي الموسع مرجعياً.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - crossover
      - cross-over
      - two-period
      - replicate
      - parallel
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.7.1 Types of Experimental Design
      quote: in case of no guidance for API the default design is two -way cross over design
- id: EG-EDA/BE-04
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Adequate washout period
    ar: كفاية فترة الغسيل
  question:
    en: >-
      Is the washout period the same for all subjects, more than five terminal half-lives of the API (extended for active metabolites) and
      at least seven days, with pre-dose samples in period two assayed and shown to be below 5% of Cmax?
    ar: >-
      هل فترة الغسيل واحدة لجميع المتطوعين وتزيد عن خمسة أضعاف نصف العمر النهائي للمادة الفعالة (وتُمدد للمستقلبات الفعالة) ولا تقل عن سبعة
      أيام، مع تحليل عينات ما قبل الجرعة في الفترة الثانية وإثبات أنها أقل من 5% من Cmax؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should justify the washout period (more than five terminal half-lives, the same for all subjects and at least seven
      days) and report the period-two pre-dose concentrations, which should be below 5% of Cmax.
    ar: >-
      يجب على مقدم الطلب تبرير فترة الغسيل (أكثر من خمسة أضعاف نصف العمر النهائي، وموحدة لجميع المتطوعين، ولا تقل عن سبعة أيام) وتقديم
      تركيزات ما قبل الجرعة في الفترة الثانية، والتي يجب أن تكون أقل من 5% من Cmax.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - wash-out
      - washout
      - half-life
      - pre-dose
      - predose
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.7.2 Single dose studies
      quote: The minimum wash-out period should be at least seven days.
- id: EG-EDA/BE-05
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: 'Modified release: fasting and fed studies'
    ar: 'الإطلاق المعدل: دراستا الصيام والتغذية'
  question:
    en: >-
      For a modified-release product, were single-dose crossover studies on the highest strength conducted under both fasting and fed
      conditions with the same design, a pharmaceutically equivalent modified-release reference, and the omission of either study justified;
      if two separate two-way studies were run, were they submitted as two files with the bioanalytical/in vitro part once?
    ar: >-
      بالنسبة لمستحضر الإطلاق المعدل، هل أُجريت دراسات متقاطعة بجرعة وحيدة على أعلى تركيز في حالتي الصيام والتغذية بنفس التصميم، مع مستحضر
      مرجعي معدل الإطلاق مكافئ صيدلانياً، وتبرير إغفال أي من الدراستين؛ وإذا أُجريت دراستان منفصلتان ثنائيتا الاتجاه، هل قُدمتا كملفين مع
      جزء التحليل الحيوي/المختبري مرة واحدة؟
  applies: '''modified_release'' in dosage_specifics'
  severity: critical
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should submit bioequivalence studies for the modified-release product under both fasting and fed conditions (same
      design, highest strength, pharmaceutically equivalent modified-release reference) or scientifically justify the omission of either
      study.
    ar: >-
      يجب على مقدم الطلب تقديم دراستي تكافؤ حيوي لمستحضر الإطلاق المعدل في حالتي الصيام والتغذية (بنفس التصميم وعلى أعلى تركيز ومع مرجع معدل
      الإطلاق مكافئ صيدلانياً) أو تبرير إغفال أي منهما تبريراً علمياً.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - fed
      - fasting
      - high-fat
      - high fat
      - modified release
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.7.6 Studies involving modified-release products; 3.12; Section 6 First, rule 3
      quote: a pharmacokinetic bioequivalence study under fed conditions is generally required, in addition to the study under fasting state
- id: EG-EDA/BE-06
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Subject selection criteria
    ar: معايير اختيار المتطوعين
  question:
    en: >-
      Does the protocol state clear inclusion/exclusion criteria with healthy subjects aged 18-55 years, weight in the normal range (BMI
      preferably 18.5-30 kg/m2), preferably non-smokers, screened by laboratory tests, medical history and examination, excluding pregnant
      or lactating women and subjects with relevant GI, convulsive, depressive or hepatic disorders?
    ar: >-
      هل يحدد البروتوكول معايير إدراج واستبعاد واضحة لمتطوعين أصحاء تتراوح أعمارهم بين 18 و55 عاماً، بوزن ضمن المدى الطبيعي (مؤشر كتلة الجسم
      يفضل بين 18.5 و30 كجم/م2)، ويفضل غير المدخنين، تم فحصهم بالاختبارات المعملية والتاريخ المرضي والفحص السريري، مع استبعاد الحوامل
      والمرضعات ومن لديهم اضطرابات معدية معوية أو تشنجية أو اكتئابية أو كبدية ذات صلة؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should provide the inclusion and exclusion criteria and demographic data showing healthy subjects aged 18-55 years with
      weight in the normal range (BMI preferably 18.5-30 kg/m2), screened by laboratory tests, medical history and physical examination.
    ar: >-
      يجب على مقدم الطلب تقديم معايير الإدراج والاستبعاد والبيانات الديموغرافية التي تبين متطوعين أصحاء بعمر 18-55 عاماً ووزن ضمن المدى
      الطبيعي (مؤشر كتلة الجسم يفضل 18.5-30 كجم/م2) تم فحصهم بالاختبارات المعملية والتاريخ المرضي والفحص السريري.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - inclusion
      - exclusion
      - BMI
      - Body Mass Index
      - healthy
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.8.1 Selection of subjects
      quote: subjects should be between the ages of 18 and 55 years, and their weight should be within the normal range
- id: EG-EDA/BE-07
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Sample size calculation and minimum 24
    ar: حساب حجم العينة والحد الأدنى 24
  question:
    en: >-
      Is the number of subjects justified by a sample-size calculation in the protocol (error CV from pilot/previous/published data, 5%
      significance, desired power, expected deviation from the comparator and the 80-125% limits), with a minimum of 24 subjects recruited
      or a justification otherwise?
    ar: >-
      هل عدد المتطوعين مبرر بحساب حجم العينة في البروتوكول (معامل التباين من دراسة تجريبية أو سابقة أو بيانات منشورة، ومستوى معنوية 5%،
      والقوة الإحصائية المطلوبة، والانحراف المتوقع عن المستحضر المقارن، وحدود 80-125%)، مع تجنيد 24 متطوعاً على الأقل أو تقديم مبرر لخلاف
      ذلك؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should provide the sample-size calculation from the protocol and justify the number of subjects; a minimum of 24
      subjects is required unless otherwise justified.
    ar: يجب على مقدم الطلب تقديم حساب حجم العينة من البروتوكول وتبرير عدد المتطوعين؛ ويلزم 24 متطوعاً على الأقل ما لم يُقدم مبرر لخلاف ذلك.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - sample size
      - sample-size
      - statistical power
      - coefficient of variation
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.8.3 Number of subjects
      quote: A minimum of 24 subjects is required (If otherwise, it should be justified).
- id: EG-EDA/BE-08
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Drop-outs, withdrawals and add-on
    ar: المنسحبون والمستبعدون والدراسة الإضافية
  question:
    en: >-
      Are all drop-outs and withdrawals reported with their reasons, were drop-outs not replaced (unless replacement or an add-on design
      using not less than half the initial number was pre-specified in the protocol), and were all treated subjects, not only spare
      subjects, planned for inclusion in the analysis?
    ar: >-
      هل أُبلغ عن جميع حالات الانسحاب والاستبعاد مع أسبابها، ولم يُستبدل المنسحبون (ما لم يكن الاستبدال أو تصميم الدراسة الإضافية بما لا يقل
      عن نصف العدد الأولي محدداً مسبقاً في البروتوكول)، وهل خُطط لإدراج جميع المتطوعين المعالجين في التحليل وليس المتطوعين الاحتياطيين فقط؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should report all drop-outs and withdrawals with reasons (Table 13/14), confirm that drop-outs were not replaced unless
      pre-specified, and that any add-on study used not less than half the number of subjects of the initial study under the same protocol
      and batches.
    ar: >-
      يجب على مقدم الطلب الإبلاغ عن جميع حالات الانسحاب والاستبعاد مع أسبابها (الجدولان 13 و14)، وتأكيد عدم استبدال المنسحبين ما لم يكن ذلك
      محدداً مسبقاً، وأن أي دراسة إضافية استخدمت ما لا يقل عن نصف عدد متطوعي الدراسة الأولية بنفس البروتوكول والتشغيلات.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - drop-out
      - dropout
      - withdraw
      - add-on
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.8.4 Drop-outs and withdrawals
      quote: Reasons for withdrawal (e.g. adverse drug reaction or personal reasons) must be reported.
- id: EG-EDA/BE-09
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Pre-specified exclusion of subject data
    ar: استبعاد بيانات المتطوعين المحدد مسبقاً
  question:
    en: >-
      Were decisions to exclude a subject made before bioanalysis on pre-defined rules (e.g. vomiting at or before 2 times median Tmax for
      IR products, pre-dose concentration above 5% of Cmax, reference AUC below 5% of the geometric mean), with excluded samples still
      assayed and listed and no exclusion for statistical or PK reasons alone?
    ar: >-
      هل اتُخذت قرارات استبعاد المتطوعين قبل التحليل الحيوي وفق قواعد محددة مسبقاً (مثل القيء عند أو قبل ضعف وسيط Tmax لمستحضرات الإطلاق
      الفوري، أو تركيز ما قبل الجرعة أعلى من 5% من Cmax، أو AUC للمرجع أقل من 5% من المتوسط الهندسي)، مع تحليل عينات المستبعدين وإدراجها
      وعدم الاستبعاد لأسباب إحصائية أو حركية دوائية فقط؟
  applies: 'true'
  severity: major
  auto:
    kind: none
  deficiency:
    en: >-
      The applicant should document that every exclusion of a subject was decided before bioanalysis according to protocol rules, list the
      assayed results of excluded subjects, and remove any exclusion based solely on statistical or pharmacokinetic grounds.
    ar: >-
      يجب على مقدم الطلب توثيق أن كل استبعاد لمتطوع تقرر قبل التحليل الحيوي وفق قواعد البروتوكول، وإدراج نتائج تحليل عينات المستبعدين،
      وإلغاء أي استبعاد قائم على أسس إحصائية أو حركية دوائية فقط.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - vomit
      - emesis
      - exclu
      - pre-dose
      - outlier
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.8.5 Reasons for exclusion
      quote: the decision to exclude a subject from the statistical analysis must be made before bioanalysis.
- id: EG-EDA/BE-10
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Two-stage sequential design conditions
    ar: شروط التصميم التتابعي ذي المرحلتين
  question:
    en: >-
      Where a two-stage design was used, was it pre-specified in the protocol with the adjusted significance levels for the interim and
      final analyses (overall type I error kept at 5%), a stage term in the ANOVA, no more than two stages, a washout between stages not
      exceeding two weeks, and no use with replicate or multi-arm designs?
    ar: >-
      عند استخدام تصميم ذي مرحلتين، هل حُدد مسبقاً في البروتوكول مع مستويات المعنوية المعدلة للتحليل المرحلي والنهائي (مع الحفاظ على خطأ
      النوع الأول الكلي عند 5%)، وإدراج حد المرحلة في نموذج ANOVA، وعدم تجاوز مرحلتين، وفترة غسيل بين المرحلتين لا تتجاوز أسبوعين، وعدم
      استخدامه مع التصاميم المكررة أو متعددة الأذرع؟
  applies: 'true'
  severity: major
  auto:
    kind: none
  deficiency:
    en: >-
      The applicant should show that the two-stage approach and its adjusted significance levels were pre-specified in the protocol, that a
      stage factor was included in the final ANOVA, and that the center rules (maximum two stages, washout between stages not exceeding two
      weeks) were met.
    ar: >-
      يجب على مقدم الطلب إثبات أن نهج المرحلتين ومستويات المعنوية المعدلة كانت محددة مسبقاً في البروتوكول، وأن عامل المرحلة أُدرج في نموذج
      ANOVA النهائي، وأن قواعد المراكز (مرحلتان كحد أقصى وفترة غسيل بينهما لا تتجاوز أسبوعين) قد استُوفيت.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - two-stage
      - two stage
      - interim
      - alpha
      - '0.0294'
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.9 Two-stage sequential design; Section 6 First, rule (6)
      quote: The plan to use a two -stage sequential approach must be pre -specified in the protocol along with the adjusted significance levels
- id: EG-EDA/BE-11
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Fasting or fed condition and meal
    ar: حالة الصيام أو التغذية ووجبة الدراسة
  question:
    en: >-
      Is the choice of fasting and/or fed study justified from the comparator labelling and product risk (both for high-risk products), and
      for a fed study is the meal composition and caloric breakdown reported (high-fat about 50% of calories and 900-1000 kcal where
      required) with dosing 30 minutes after the start of the meal unless the SmPC states otherwise?
    ar: >-
      هل اختيار دراسة الصيام و/أو التغذية مبرر وفق نشرة المستحضر المقارن ومخاطر المنتج (كلتاهما للمنتجات عالية الخطورة)، وفي دراسة التغذية
      هل أُبلغ عن تركيب الوجبة وتوزيعها الحراري (عالية الدهون نحو 50% من السعرات و900-1000 سعر حراري عند الاقتضاء) مع إعطاء الجرعة بعد 30
      دقيقة من بدء الوجبة ما لم ينص ملخص خصائص المنتج على خلاف ذلك؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should provide the rationale for the fasting/fed condition(s) and, for a fed study, the composition and caloric
      breakdown of the meal (Table 17), which for high-risk products should be a high-fat (about 50% of calories), high-calorie (about
      900-1000 kcal) meal.
    ar: >-
      يجب على مقدم الطلب تقديم مبررات اختيار حالة الصيام/التغذية، وفي دراسة التغذية تركيب الوجبة وتوزيعها الحراري (الجدول 17)، والتي يجب أن
      تكون للمنتجات عالية الخطورة وجبة عالية الدهون (نحو 50% من السعرات) وعالية السعرات (نحو 900-1000 سعر حراري).
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - fasting
      - fed
      - kcal
      - meal
      - high-fat
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.10 Fasting or/and fed conditions; Table 17
      quote: >-
        The meal should be a high-fat (approximately 50% of total caloric content of the meal) and high-calorie (approximately 900 to 1000
        kcal) meal
- id: EG-EDA/BE-12
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Standardization of study conditions
    ar: توحيد ظروف الدراسة
  question:
    en: >-
      Were study conditions standardized and reported: overnight fast of at least 10 hours, dose with 150-250 ml water, no water one hour
      before and after dosing, standard meal about four hours post-dose, controlled posture and activity, and restriction of alcohol,
      caffeine, interacting foods and concomitant medicines?
    ar: >-
      هل وُحدت ظروف الدراسة وأُبلغ عنها: صيام ليلي لا يقل عن 10 ساعات، وإعطاء الجرعة مع 150-250 مل من الماء، ومنع الماء لساعة قبل الجرعة
      وبعدها، ووجبة قياسية بعد نحو أربع ساعات من الجرعة، وضبط الوضعية والنشاط البدني، وتقييد الكحول والكافيين والأطعمة المتفاعلة والأدوية
      المصاحبة؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should describe the standardization of fasting (at least 10 hours), fluid intake (150-250 ml water with the dose),
      meals, posture, physical activity and restricted substances in the protocol and report.
    ar: >-
      يجب على مقدم الطلب وصف توحيد الصيام (10 ساعات على الأقل) وتناول السوائل (150-250 مل ماء مع الجرعة) والوجبات والوضعية والنشاط البدني
      والمواد المقيدة في البروتوكول والتقرير.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - overnight fast
      - 10 hours
      - '150'
      - posture
      - standardiz
    data: []
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.11 Study standardization
      quote: Medicines are usually given after an overnight fast of at least 10 hours, and volunteers are allowed free access to water.
- id: EG-EDA/BE-13
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Test batch identity and documentation
    ar: هوية التشغيلة المختبرة وتوثيقها
  question:
    en: >-
      Is the test product identical to the projected commercial product (composition, manufacturing method and equipment), manufactured
      under GMP, ideally from a production batch, with batch-control results of the test product and the lot numbers, expiry dates and batch
      size stated for test and reference (Table 12)?
    ar: >-
      هل المستحضر المختبر مطابق للمستحضر التجاري المزمع (التركيبة وطريقة التصنيع والمعدات)، ومصنع وفق ممارسات التصنيع الجيدة، ويفضل من
      تشغيلة إنتاجية، مع بيان نتائج مراقبة التشغيلة للمستحضر المختبر وأرقام التشغيلات وتواريخ الانتهاء وحجم التشغيلة للمستحضرين المختبر
      والمرجعي (الجدول 12)؟
  applies: 'true'
  severity: critical
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should state the batch-control results of the test product, the lot numbers, expiry dates and batch size of both test
      and reference products, and confirm that the biobatch is identical in composition and manufacturing method to the product submitted
      for registration.
    ar: >-
      يجب على مقدم الطلب بيان نتائج مراقبة التشغيلة للمستحضر المختبر، وأرقام التشغيلات وتواريخ الانتهاء وحجم التشغيلة للمستحضرين المختبر
      والمرجعي، وتأكيد أن التشغيلة الحيوية مطابقة في التركيبة وطريقة التصنيع للمستحضر المقدم للتسجيل.
  action:
    type: edit_data
    target: batches
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - batch
      - lot number
      - expiry
      - GMP
      - batch size
    data:
      - batches
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.12.1 Generic product; Table 12 Product Information
      quote: >-
        Batch-control results of the generic product, the lot numbers and expiry dates of both generic and reference listed products should
        be stated.
- id: EG-EDA/BE-14
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Acceptable reference product and source
    ar: المستحضر المرجعي المقبول ومصدره
  question:
    en: >-
      Is the reference product one of the accepted options (FDA Orange Book RLD/RS or NDA, ANSM reference, MHRA or reference-country PAR,
      WHO comparator list, European reference product), purchased from an EDA reference country or from the Egyptian market/under licence
      from the licensing sponsor, with country of origin, lot number, expiry date and potency within 5% of the test reported?
    ar: >-
      هل المستحضر المرجعي من الخيارات المقبولة (المنتج المرجعي أو المعيار المرجعي أو NDA في الكتاب البرتقالي لـ FDA، أو المرجع في ANSM، أو
      تقارير التقييم العامة لـ MHRA أو لدولة مرجعية، أو قائمة المقارنات لمنظمة الصحة العالمية، أو المنتج المرجعي الأوروبي)، ومشترى من دولة
      مرجعية معتمدة لدى الهيئة أو من السوق المصري/بترخيص من الجهة المرخِّصة، مع بيان بلد المنشأ ورقم التشغيلة وتاريخ الانتهاء والفاعلية ضمن
      5% من المستحضر المختبر؟
  applies: 'true'
  severity: critical
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should justify the selection of the reference product according to the listed options, report its country of origin, lot
      number and expiry date, and show that the assayed content of test and reference differs by not more than 5%; a non-listed reference
      requires a prior request to EDA.
    ar: >-
      يجب على مقدم الطلب تبرير اختيار المستحضر المرجعي وفق الخيارات المدرجة، وبيان بلد منشئه ورقم تشغيلته وتاريخ انتهائه، وإثبات أن الفرق في
      المحتوى المعاير بين المستحضرين المختبر والمرجعي لا يتجاوز 5%؛ ويتطلب المرجع غير المدرج طلباً مسبقاً إلى الهيئة.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - Orange Book
      - reference listed
      - country of origin
      - lot number
      - comparator
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.12.2 Reference listed product; 2.12.1
      quote: The country of origin of the reference product should be reported together with lot number and expiry date.
- id: EG-EDA/BE-15
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Strength and dose studied
    ar: التركيز والجرعة المدروسان
  question:
    en: >-
      Was the molar-equivalent dose given as a single unit of the most sensitive (usually highest) marketed strength, and if a lower
      strength or more than one unit was used, is this justified (safety/tolerability or high solubility with linear PK, proportional
      strengths and acceptable comparative dissolution; analytical difficulties without exceeding the maximal daily dose)?
    ar: >-
      هل أُعطيت الجرعة المكافئة مولياً كوحدة واحدة من التركيز المسوق الأكثر حساسية (عادة الأعلى)، وإذا استُخدم تركيز أقل أو أكثر من وحدة،
      فهل بُرر ذلك (السلامة/التحمل أو الذوبانية العالية مع حركية دوائية خطية وتركيزات متناسبة وانحلال مقارن مقبول؛ أو صعوبات تحليلية دون
      تجاوز الجرعة اليومية القصوى)؟
  applies: 'true'
  severity: major
  auto:
    kind: none
  deficiency:
    en: >-
      The applicant should justify the strength and dose administered in the bioequivalence study; normally the highest marketed strength is
      given as a single unit, and any lower strength or multiple units require the conditions of section 2.13.1 to be met.
    ar: >-
      يجب على مقدم الطلب تبرير التركيز والجرعة المعطاة في دراسة التكافؤ الحيوي؛ وعادة يُعطى أعلى تركيز مسوق كوحدة واحدة، ويتطلب أي تركيز أقل
      أو وحدات متعددة استيفاء شروط القسم 2.13.1.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - highest strength
      - strength
      - dose administered
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.13.1 Selection of dose
      quote: Generally the marketed strength with the greatest sensitivity to bioequivalence assessment should be administered as a single unit.
- id: EG-EDA/BE-16
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Blood sampling schedule
    ar: جدول سحب عينات الدم
  question:
    en: >-
      Does the sampling schedule include a pre-dose sample, at least 2 points before Cmax, 2 around Cmax and 3-4 in the elimination phase
      (12-18 samples per subject per dose, early 5-15 minute sample, continued for at least three half-lives to accrue 80% of AUC0-inf, but
      not beyond 72 hours), with actual clock times recorded?
    ar: >-
      هل يتضمن جدول السحب عينة قبل الجرعة، ونقطتين على الأقل قبل Cmax، ونقطتين حول Cmax، و3-4 نقاط في طور الإطراح (12-18 عينة لكل متطوع لكل
      جرعة، مع عينة مبكرة عند 5-15 دقيقة، والاستمرار لثلاثة أنصاف عمر على الأقل لتجميع 80% من AUC0-inf دون تجاوز 72 ساعة)، مع تسجيل الأوقات
      الفعلية للسحب؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should justify the sampling schedule: a pre-dose sample, at least 2 points before Cmax, 2 points around Cmax and 3-4
      points in the elimination phase, an early 5-15 minute sample, and sampling for at least three terminal half-lives (not more than 72
      hours), with actual sampling times reported.
    ar: >-
      يجب على مقدم الطلب تبرير جدول السحب: عينة قبل الجرعة، ونقطتان على الأقل قبل Cmax، ونقطتان حول Cmax، و3-4 نقاط في طور الإطراح، وعينة
      مبكرة عند 5-15 دقيقة، والسحب لثلاثة أنصاف عمر نهائية على الأقل (بما لا يزيد عن 72 ساعة)، مع بيان أوقات السحب الفعلية.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - pre-dose
      - predose
      - sampling
      - 72 hours
      - 72 h
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.13.2 Sampling times; 2.7.3
      quote: a pre-dose sample, at least 2 points before Cmax, 2 points around Cmax and 3 – 4 points during the elimination phase.
- id: EG-EDA/BE-17
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Pharmacokinetic parameters and methods
    ar: معاملات الحركية الدوائية وطرق حسابها
  question:
    en: >-
      Were AUC0-t and Cmax (plus AUC0-inf, Tmax, T1/2 and Kel; AUC0-tau, Cmax,ss and fluctuation at steady state; Ae and Rmax for urine)
      calculated by non-compartmental methods with the trapezoidal rule, and does AUC0-t cover at least 80% of AUC0-inf in most subjects (or
      AUC0-72 used)?
    ar: >-
      هل حُسبت AUC0-t وCmax (إضافة إلى AUC0-inf وTmax وT1/2 وKel؛ وAUC0-tau وCmax,ss والتذبذب في حالة الاستقرار؛ وAe وRmax للبول) بطرق غير
      حجرية باستخدام قاعدة شبه المنحرف، وهل تغطي AUC0-t ما لا يقل عن 80% من AUC0-inf لدى معظم المتطوعين (أو استُخدمت AUC0-72)؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should report AUC0-t, Cmax, AUC0-inf, Tmax, T1/2 and Kel calculated by non-compartmental methods, state the AUC
      calculation method, and discuss any subjects in whom AUC0-t covers less than 80% of AUC0-inf.
    ar: >-
      يجب على مقدم الطلب الإبلاغ عن AUC0-t وCmax وAUC0-inf وTmax وT1/2 وKel محسوبة بطرق غير حجرية، وبيان طريقة حساب AUC، ومناقشة أي متطوعين
      تغطي لديهم AUC0-t أقل من 80% من AUC0-inf.
  action:
    type: edit_data
    target: be
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - AUC
      - Cmax
      - Tmax
      - non-compartmental
      - trapezoidal
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.14 Parameters to be assessed; 2.8.5
      quote: Non-compartmental methods should be used for determination of pharmacokinetic parameters in bioequivalence studies.
- id: EG-EDA/BE-18
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Parent compound or metabolite analysed
    ar: تحليل المركب الأصلي أو المستقلب
  question:
    en: >-
      Does the protocol state which entity is analysed (parent drug as the rule; a metabolite only for a pro-drug or when the parent cannot
      be reliably measured with justification, and primary metabolites formed pre-systemically that contribute to safety/efficacy), and were
      washout and sampling adjusted for the metabolite where measured?
    ar: >-
      هل يحدد البروتوكول الكيان الذي يُحلل (الدواء الأصلي كقاعدة؛ والمستقلب فقط في حالة طليعة الدواء أو عند تعذر قياس الأصل بشكل موثوق مع
      التبرير، والمستقلبات الأولية المتكونة قبل الدوران الجهازي والمساهمة في السلامة/الفعالية)، وهل عُدلت فترة الغسيل وأوقات السحب للمستقلب
      عند قياسه؟
  applies: 'true'
  severity: major
  auto:
    kind: none
  deficiency:
    en: >-
      The applicant should state in the protocol the priority of the analytes (pro-drug, parent drug or metabolite), base the bioequivalence
      evaluation on the parent compound unless a justified exception applies, and present data supporting that metabolite exposure reflects
      the parent drug where a metabolite is used.
    ar: >-
      يجب على مقدم الطلب تحديد أولوية المواد المحللة في البروتوكول (طليعة الدواء أو الدواء الأصلي أو المستقلب)، والاعتماد في تقييم التكافؤ
      الحيوي على المركب الأصلي ما لم ينطبق استثناء مبرر، وتقديم بيانات تدعم أن تعرض المستقلب يعكس الدواء الأصلي عند استخدام مستقلب.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - metabolite
      - parent
      - pro-drug
      - prodrug
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.15 Parent compound or metabolites
      quote: >-
        It is important to state a priority in the study protocol which chemical entities (pro-drug, drug (APIs) or metabolite) will be
        analyzed
- id: EG-EDA/BE-19
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.4
  title:
    en: LLOQ and calibration range fit study
    ar: حد الكمية الأدنى ومدى المعايرة
  question:
    en: >-
      Is the LLOQ not higher than 5% of Cmax (at least five times the blank response, precision within 20% CV and accuracy within 20%), and
      is the calibration range appropriate to the study concentrations with at least 2 QC levels within the measured range and no
      extrapolation outside LLOQ-ULOQ?
    ar: >-
      هل حد الكمية الأدنى (LLOQ) لا يتجاوز 5% من Cmax (واستجابته خمسة أضعاف استجابة العينة الفارغة على الأقل، ودقته ضمن 20% CV وصحته ضمن
      20%)، وهل مدى المعايرة مناسب لتركيزات الدراسة مع مستويين على الأقل من عينات مراقبة الجودة ضمن المدى المقاس ودون استقراء خارج
      LLOQ-ULOQ؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should demonstrate that the LLOQ is not higher than 5% of Cmax with acceptable precision and accuracy at the LLOQ, and
      that the calibration range covers the study sample concentrations with at least 2 QC levels within the measured range.
    ar: >-
      يجب على مقدم الطلب إثبات أن حد الكمية الأدنى لا يتجاوز 5% من Cmax مع دقة وصحة مقبولتين عند هذا الحد، وأن مدى المعايرة يغطي تركيزات
      عينات الدراسة مع مستويين على الأقل من عينات مراقبة الجودة ضمن المدى المقاس.
  action:
    type: upload
    target: M5-06
  evidence:
    slots:
      - EG-EDA/M5-06
    keywords:
      - LLOQ
      - lower limit of quantification
      - lower limit of quantitation
      - calibration range
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.19.6 Lower limit of quantification; 2.18; 2.20.4
      quote: for bioequivalence studies the LLOQ should be not higher than 5% of the C max
  anchor_cite:
