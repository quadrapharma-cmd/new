      quote: Should include stability-indicating analytical- procedures used for physical, chemical and microbiological analysis
- id: EG-EDA/ST-23
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: stability
  layer: eda
  ctd: ST-T
  title:
    en: Method references and CADC commitment
    ar: مراجع الطرق وتعهد مطابقة CADC
  question:
    en: >-
      Are the most updated finished product monograph, the commitment from the stability site that the assay/related
      substances/preservative/antioxidant methods are those validated at CADC, the certificate of the reference standard used, and full
      documents for any stability-only test submitted?
    ar: >-
      هل قُدمت أحدث دراسة دستورية للمنتج النهائي، وتعهد من موقع الثبات بأن طرق المعايرة والمواد ذات الصلة والمادة الحافظة ومضاد الأكسدة هي
      نفسها المعتمدة لدى الإدارة المركزية للرقابة الدوائية، وشهادة المادة المرجعية المستخدمة، والمستندات الكاملة لأي اختبار يُجرى في الثبات
      فقط؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should submit the most updated monograph, a commitment from the stability testing site that the submitted methods are
      the same as those validated at CADC, the certificate of the primary or secondary reference standard, and procedure, validation and
      results for any test performed in stability only.
    ar: >-
      يجب على مقدم الطلب تقديم أحدث دراسة دستورية، وتعهداً من موقع اختبار الثبات بأن الطرق المقدمة هي نفسها المعتمدة لدى الإدارة المركزية
      للرقابة الدوائية، وشهادة المادة المرجعية الأولية أو الثانوية، والإجراء والتحقق والنتائج لأي اختبار يُجرى في الثبات فقط.
