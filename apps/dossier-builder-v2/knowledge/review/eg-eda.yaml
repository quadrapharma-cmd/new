      information, drop-outs, standard curve/QC, reanalysis SOPs, fed meal composition) completed, one per study where required?
    ar: >-
      هل استُوفيت جداول ملخص التكافؤ الحيوي (الجداول 1-17: ملخص التقديم، وملخصات الدراسات، والملخص الإحصائي، والتحقق من الطريقة لكل مادة
      محللة، والانحلال لجميع التركيزات، وتركيبة جميع التركيزات، والبيانات الديموغرافية، والأحداث الضارة، وإعادة التحليل، ومعلومات الدراسة
      والمنتج، والمنسحبون، ومنحنى المعايرة/مراقبة الجودة، وإجراءات إعادة التحليل، وتركيب وجبة دراسة التغذية)، بجدول لكل دراسة عند الاقتضاء؟
  applies: 'true'
