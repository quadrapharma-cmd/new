- id: EG-EDA/ST-24
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: stability
  layer: eda
  ctd: ST-D
  title:
    en: Assay chromatograms per interval
    ar: كروماتوجرامات المعايرة لكل فترة
  question:
