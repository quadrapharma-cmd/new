      at: 4.5.1.4 BCS-Class II Weak Acids biowaivers
      quote: The generic product is rapidly dissolving (no less than 85% in pH 6.8 in 30minutes)
- id: EG-EDA/BE-42
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.3
  title:
    en: 'Additional strengths: dose-proportionality waiver'
    ar: 'التركيزات الإضافية: إعفاء التناسب في الجرعة'
  question:
    en: >-
      Where additional strengths are waived, has one strength been shown bioequivalent in vivo, are all strengths made by the same process
      with the same qualitative and quantitatively proportional composition (or the permitted deviations: API below 5% of core weight with
      filler-only change, or high-potency API up to 10 mg with total weight within 10%), and is comparative dissolution on 12 units of every
      test strength versus the respective reference strength submitted?
    ar: >-
      عند طلب إعفاء التركيزات الإضافية، هل أُثبت التكافؤ الحيوي في الجسم الحي لتركيز واحد، وهل جميع التركيزات مصنعة بنفس العملية وبنفس
      التركيبة النوعية والمتناسبة كمياً (أو ضمن الانحرافات المسموح بها: مادة فعالة أقل من 5% من وزن القلب مع تغيير المادة المالئة فقط، أو
      مادة فعالة عالية الفاعلية حتى 10 مجم مع وزن كلي ضمن 10%)، وهل قُدم انحلال مقارن على 12 وحدة لكل تركيز مختبر مقابل التركيز المرجعي
      المقابل؟
  applies: dossier_kind == 'generic'
  severity: major
  auto:
    kind: none
  deficiency:
    en: >-
      The applicant should justify the waiver for the additional strength(s) by showing the same manufacturing process, qualitatively
      identical and quantitatively proportional composition (or a permitted deviation per section 4.5.2), and comparative dissolution on 12
      dosage units of each test strength against the respective reference strength.
    ar: >-
      يجب على مقدم الطلب تبرير إعفاء التركيز/التركيزات الإضافية بإثبات نفس عملية التصنيع وتركيبة متطابقة نوعياً ومتناسبة كمياً (أو انحراف
      مسموح به وفق القسم 4.5.2)، وانحلال مقارن على 12 وحدة جرعية لكل تركيز مختبر مقابل التركيز المرجعي المقابل.
  action:
    type: upload
    target: M5-05
  evidence:
    slots:
      - EG-EDA/M5-05
      - EG-EDA/P-01
    keywords:
      - proportional
      - additional strength
      - waiver
      - 12 dosage units
    data:
      - composition
      - results
  cite:
    - src: eda-gl-capp-024-v4
      at: 4.5.2 Biowaivers based on dose-proportionality of formulations
      quote: Comparative dissolution testing should be conducted on 12 dosage units each of all strengths of the test
