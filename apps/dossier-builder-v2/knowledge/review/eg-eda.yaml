    ar: >-
      يجب على مقدم الطلب تقديم معلومات موجزة عن عملية تصنيع المادة الفعالة وضوابطها (3.2.S.2.1 إلى 3.2.S.2.6) أو تقديم تبرير عند عدم توفر
