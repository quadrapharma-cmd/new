    ar: >-
      هل بُررت فترة الاستخدام بعد الفتح أو إعادة التكوين أو التخفيف ببيانات تجريبية على تشغيلتين على الأقل (تجريبيتين على الأقل، إحداهما
      مختارة قرب نهاية مدة الصلاحية)، وهل ذُكرت مع ظروف تخزينها في معلومات المنتج؟
  applies: >-
    'powder_inj_with_solvent' in dosage_specifics or 'sterile' in dosage_specifics or 'suspension' in dosage_specifics or 'oral_solution' in
    dosage_specifics
  severity: major
  auto:
    kind: text
  deficiency:
