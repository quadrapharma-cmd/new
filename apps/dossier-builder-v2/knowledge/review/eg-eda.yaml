  ctd: 5.3.1.4
  title:
    en: Reanalysis of study samples controlled
    ar: ضبط إعادة تحليل عينات الدراسة
  question:
    en: >-
      Were the reasons for reanalysis and the rule for selecting the reported value pre-defined in the protocol/SOP, with no reanalysis for
      pharmacokinetic reasons, and are the reanalysed samples tabulated (Table 10) with initial value, reason, repeat values and accepted
      value?
    ar: >-
      هل حُددت أسباب إعادة التحليل وقاعدة اختيار القيمة المبلغ عنها مسبقاً في البروتوكول/إجراء العمل القياسي، دون إعادة تحليل لأسباب حركية
      دوائية، وهل جُدولت العينات المعاد تحليلها (الجدول 10) مع القيمة الأولية والسبب وقيم الإعادة والقيمة المقبولة؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should provide the pre-defined reanalysis criteria and a table of all reanalysed samples (number and percentage, reason,
      initial and repeat values, reported value); reanalysis for pharmacokinetic reasons is not acceptable.
    ar: >-
      يجب على مقدم الطلب تقديم معايير إعادة التحليل المحددة مسبقاً وجدولاً بجميع العينات المعاد تحليلها (العدد والنسبة والسبب والقيم الأولية
      والمعادة والقيمة المبلغ عنها)؛ ولا تُقبل إعادة التحليل لأسباب حركية دوائية.
