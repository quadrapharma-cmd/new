      هل يقدم القسم 3.2.S.2 اسم وعنوان ومسؤولية كل مصنع للمادة الفعالة ووصفاً موجزاً لعملية التصنيع وضوابطها والمواد والخطوات الحرجة
      والمركبات الوسيطة، أو تبريراً عند عدم توفر هذه البيانات (مثل الجزيئات الراسخة أو القديمة)؟
