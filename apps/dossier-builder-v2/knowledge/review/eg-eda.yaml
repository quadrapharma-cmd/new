      at: Annex III §2.1.5 Uniformity of dosage unit
      quote: >-
        Uniformity of dosage units USP <905>, Ph.Eur. 2.9.40. and JP 6.02 where target Value (T) =100% otherwise stated in the product
        monograph.
  anchor_cite:
