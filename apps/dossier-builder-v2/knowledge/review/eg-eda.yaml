      Are stamped assay chromatograms provided for each time interval (each in a separate PDF) showing product name, batch number and
      injection date/time, with 3 injections of standard and test, system suitability charts, and covering assay, impurities,
      preservatives/antioxidants and dissolution where applicable?
    ar: >-
      هل قُدمت كروماتوجرامات المعايرة مختومة لكل فترة زمنية (كل فترة في ملف PDF منفصل) موضحاً بها اسم المنتج ورقم التشغيلة وتاريخ ووقت
      الحقن، مع 3 حقنات للمعيار والعينة، ومخططات ملاءمة النظام، وتغطي المعايرة والشوائب والمواد الحافظة/مضادات الأكسدة والانحلال حيثما
      ينطبق؟
  applies: 'true'
