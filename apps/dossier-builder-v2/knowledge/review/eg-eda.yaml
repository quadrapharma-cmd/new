  ctd: 3.2.S.4.1
  title:
    en: API CoA follows the referenced pharmacopoeia
    ar: شهادة تحليل المادة الفعالة وفق الدستور المرجعي
  question:
    en: >-
      Does the API certificate of analysis follow the pharmacopoeia named in the composition, and for an in-house API, are the supplier's
      specifications compliant with or tighter than the pharmacopoeial monograph, or, where no monograph exists, are impurities controlled
      per ICH Q3A with chiral identity where relevant?
    ar: >-
      هل تتبع شهادة تحليل المادة الفعالة دستور الأدوية المذكور في التركيب؟ وبالنسبة للمادة الفعالة غير الدستورية، هل مواصفات المورد مطابقة
      لدراسة دستور الأدوية أو أشد منها، أو عند عدم وجود دراسة دستورية هل تُضبط الشوائب وفق ICH Q3A مع اختبار هوية الكيرالية عند الاقتضاء؟
  applies: 'true'
  severity: major
  auto:
    kind: none
  deficiency:
    en: >-
      The applicant should submit an API certificate of analysis whose specifications follow the pharmacopoeia referenced in the
      composition, or for an in-house API demonstrate that the supplier's specifications comply with or are tighter than the monograph
      (impurities per ICH Q3A where no monograph exists).
    ar: >-
      يجب على مقدم الطلب تقديم شهادة تحليل للمادة الفعالة تتبع مواصفاتها دستور الأدوية المشار إليه في التركيب، أو للمادة الفعالة غير
      الدستورية إثبات أن مواصفات المورد مطابقة للدراسة الدستورية أو أشد منها (والشوائب وفق ICH Q3A عند عدم وجود دراسة).
  action:
