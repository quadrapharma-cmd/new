- id: EG-EDA/CD-66-03
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: cadc
  layer: eda
  ctd: 3.2.P.1
  title:
    en: Calculation sheet for salt and IU potency
    ar: ورقة حساب مكافئ الملح والفاعلية بالوحدات الدولية
  question:
    en: >-
      Where the active is a salt, is a separate calculation sheet for the salt-to-base equivalency provided, and where potency is expressed
      in international units, is the amount marked with (*) and footnoted that the quantity used depends on the potency of the raw material?
    ar: >-
      إذا كانت المادة الفعالة ملحاً، فهل قُدّمت ورقة حساب منفصلة لمكافئ الملح إلى القاعدة؟ وإذا كانت الفاعلية تُحسب بالوحدات الدولية، فهل
      وُضعت علامة (*) على الكمية مع حاشية أسفل الجدول توضح أن الكمية المستخدمة تعتمد على فاعلية المادة الخام؟
  applies: 'true'
  severity: major
  auto:
    kind: none
  deficiency:
    en: >-
      The applicant should submit a separate calculation sheet for the equivalency of the salt to the base and, for actives expressed in
      international units, mark the amount with (*) and add the potency footnote below the composition table.
    ar: >-
      يجب على مقدم الطلب تقديم ورقة حساب منفصلة لمكافئ الملح إلى القاعدة، وبالنسبة للمواد الفعالة المعبر عنها بالوحدات الدولية وضع علامة (*)
      على الكمية وإضافة حاشية الفاعلية أسفل جدول التركيب.
  action:
    type: upload
    target: M1-32
  evidence:
    slots:
      - EG-EDA/M1-32
      - EG-EDA/P-01
    keywords:
      - equivalent to
      - salt
      - base
      - potency
      - international unit
      - IU
    data:
      - composition
  cite:
    - src: eda-gl-cadc-002-v2
      at: §6.6.2.1 and §6.6.2.2
      quote: There should be a separate calculation sheet to calculate equivalency of salt to the base.
