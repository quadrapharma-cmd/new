- id: EG-EDA/BE-20
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.4
  title:
    en: Selectivity and carry-over
    ar: النوعية والانتقال المتبقي
  question:
    en: >-
      Was selectivity proved in at least 6 individual blank matrix sources (interference below 20% of LLOQ for the analyte and 5% for the
      IS, including metabolites, co-medications and back-conversion where relevant), and carry-over assessed by blanks after the ULOQ
      standard with the same limits?
    ar: >-
      هل أُثبتت النوعية في 6 مصادر فردية على الأقل من المصفوفة الفارغة (تداخل أقل من 20% من LLOQ للمادة المحللة و5% للمعيار الداخلي، بما
      يشمل المستقلبات والأدوية المصاحبة والتحول العكسي عند الاقتضاء)، وهل قُيّم الانتقال المتبقي بحقن عينات فارغة بعد معيار ULOQ بنفس
      الحدود؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should provide selectivity data from at least 6 individual sources of blank matrix and carry-over data from blank
      samples injected after the ULOQ standard, meeting the limits of 20% of the LLOQ for the analyte and 5% for the internal standard.
    ar: >-
      يجب على مقدم الطلب تقديم بيانات النوعية من 6 مصادر فردية على الأقل من المصفوفة الفارغة وبيانات الانتقال المتبقي من عينات فارغة محقونة
      بعد معيار ULOQ، بما يستوفي حدود 20% من LLOQ للمادة المحللة و5% للمعيار الداخلي.
  action:
    type: upload
    target: M5-06
