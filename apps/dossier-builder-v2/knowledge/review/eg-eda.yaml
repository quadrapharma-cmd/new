  question:
    en: >-
      For a parenteral product, does the specification state the bacterial endotoxin limit per the pharmacopoeia or, for a
      non-pharmacopoeial product, BEL = K/M (K = 5 EU/kg for intravenous and other injections, 0.2 EU/kg intrathecal, 100 EU/m² for products
      dosed per body surface; M = maximum dose per kg in 1 h), with the detailed method including inhibition/enhancement testing and the
      reference edition, and is a rabbit pyrogen test proposed only with proven LAL incompatibility?
    ar: >-
      بالنسبة للمستحضر الحقني، هل تحدد المواصفات حد الذيفان الداخلي البكتيري وفق دستور الأدوية، أو للمستحضر غير الدستوري BEL = K/M (حيث K =
      5 وحدة ذيفان/كجم للحقن الوريدي وغيره، و0.2 وحدة/كجم داخل القراب، و100 وحدة/م² للمستحضرات المجرَّعة حسب مساحة سطح الجسم؛ وM = الجرعة
      القصوى لكل كجم خلال ساعة)، مع الطريقة المفصلة شاملة اختبار التثبيط/التعزيز وإصدار المرجع، وهل يُقترح اختبار البيروجينات في الأرانب فقط
      عند إثبات عدم التوافق مع تقنية LAL؟
  applies: admin_route == 'parenteral'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should include the bacterial endotoxins test in the specification with the pharmacopoeial limit or the calculated limit
      (BEL = K/M), the detailed method including inhibition/enhancement testing and the reference edition; a rabbit test is accepted only
      with a complete justification of LAL incompatibility.
    ar: >-
      يجب على مقدم الطلب إدراج اختبار الذيفانات الداخلية البكتيرية في المواصفات بالحد الدستوري أو الحد المحسوب (BEL = K/M)، مع الطريقة
      المفصلة شاملة اختبار التثبيط/التعزيز وإصدار المرجع؛ ولا يُقبل اختبار الأرانب إلا بتبرير كامل لعدم التوافق مع تقنية LAL.
  action:
    type: edit_data
    target: specs.product
  evidence:
