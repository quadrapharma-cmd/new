  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Exemption of aqueous solutions justified
    ar: تبرير إعفاء المحاليل المائية
  question:
    en: >-
      Where exemption from equivalence studies is claimed for an aqueous solution (parenteral, oral, otic/ophthalmic/nasal, topical or
      nebulizer), has the applicant shown that the product contains the same APIs in the same molar concentration and the same or similar
      excipients in comparable concentrations as the reference product, with any excipient difference justified for its effect on
      absorption, disposition or GI transit?
    ar: >-
      عند طلب الإعفاء من دراسات التكافؤ لمحلول مائي (حقني أو فموي أو أذني/عيني/أنفي أو موضعي أو للاستنشاق بالرذاذ)، هل أثبت مقدم الطلب أن
      المستحضر يحتوي على نفس المواد الفعالة بنفس التركيز المولي ونفس السواغات أو سواغات مماثلة بتركيزات مقارنة للمستحضر المرجعي، مع تبرير أي
      اختلاف في السواغات من حيث تأثيره على الامتصاص أو التوزع أو العبور المعدي المعوي؟
  applies: aqueous_solution
  severity: critical
  auto:
    kind: none
  deficiency:
    en: >-
      The applicant should demonstrate that the product contains the same APIs in the same molar concentration and the same or similar
      excipients in comparable concentrations as the reference listed product, and justify that any excipient difference does not affect
      safety or efficacy.
    ar: >-
      يجب على مقدم الطلب إثبات أن المستحضر يحتوي على نفس المواد الفعالة بنفس التركيز المولي ونفس السواغات أو سواغات مماثلة بتركيزات مقارنة
      للمستحضر المرجعي، وتبرير أن أي اختلاف في السواغات لا يؤثر على السلامة أو الفعالية.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
      - EG-EDA/P-01
    keywords:
      - excipient
      - same molar
      - reference
      - exempt
      - waiver
    data:
      - composition
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.2 Pharmaceutical products exempted from equivalence studies; 3.9; 3.10
      quote: The generic product should contain the same APIs in the same molar concentration
- id: EG-EDA/BE-02
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Signed protocol and ethics approval
    ar: البروتوكول الموقع وموافقة لجنة الأخلاقيات
  question:
    en: >-
      Is the study protocol signed and dated by the investigator and sponsor, approved by an IRB/ethics committee before the study, and
      submitted together with the study report, with any protocol change signed and included in the final report?
    ar: >-
      هل بروتوكول الدراسة موقع ومؤرخ من الباحث والجهة الراعية، ومعتمد من مجلس المراجعة المؤسسي/لجنة الأخلاقيات قبل الدراسة، ومقدم مع تقرير
      الدراسة، مع توقيع أي تعديل في البروتوكول وإدراجه في التقرير النهائي؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should submit the signed and dated study protocol with the IRB/ethics committee approval together with the study report,
      including any signed protocol amendments.
    ar: >-
      يجب على مقدم الطلب تقديم بروتوكول الدراسة الموقع والمؤرخ مع موافقة مجلس المراجعة المؤسسي/لجنة الأخلاقيات إلى جانب تقرير الدراسة،
      متضمناً أي تعديلات موقعة على البروتوكول.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
