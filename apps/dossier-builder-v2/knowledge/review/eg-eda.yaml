- id: EG-EDA/BE-24
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.4
  title:
    en: Analyte stability covering study samples
    ar: ثبات المادة المحللة يغطي عينات الدراسة
  question:
    en: >-
      Were stock/working solution, freeze-thaw (minimum three cycles, frozen at least 12 hours each), bench-top,
      processed-sample/autosampler and long-term stability shown, with long-term stability in the freezer exceeding the time from first
      sample collection to last analysis (Table 11), QCs within 15% and % stability calculated against fresh samples for drug and IS?
    ar: >-
      هل أُثبت ثبات المحاليل الأم والعاملة، والتجميد والإذابة (ثلاث دورات على الأقل بتجميد 12 ساعة على الأقل لكل دورة)، وعلى سطح العمل،
      والعينات المعالجة/في حاقن العينات، والثبات طويل الأمد في المجمد لمدة تتجاوز الفترة من أول سحب للعينات إلى آخر تحليل (الجدول 11)، مع
      عينات مراقبة جودة ضمن 15% وحساب نسبة الثبات مقابل العينات الطازجة للدواء والمعيار الداخلي؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should provide stability data (stock and working solutions, at least three freeze-thaw cycles, bench-top, processed
      sample and long-term) and demonstrate that the long-term stability period exceeds the time between the first sample collection and the
      last sample analysis.
    ar: >-
      يجب على مقدم الطلب تقديم بيانات الثبات (المحاليل الأم والعاملة، وثلاث دورات تجميد وإذابة على الأقل، وسطح العمل، والعينات المعالجة،
      والثبات طويل الأمد) وإثبات أن فترة الثبات طويل الأمد تتجاوز الفترة بين أول سحب للعينات وآخر تحليل لها.
  action:
    type: upload
    target: M5-06
  evidence:
    slots:
      - EG-EDA/M5-06
    keywords:
      - freeze
      - thaw
      - long-term stability
      - long term stability
      - bench
    data: []
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.19.16 Stability; Table 11
      quote: >-
        frozen at the intended storage temperature which should exceed the time between the date of first sample collection and the date of
        last sample analysis
- id: EG-EDA/BE-25
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
