- id: EG-EDA/CD-A1-01
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: cadc
  layer: eda
  ctd: 3.2.P.5.1
  title:
    en: Uniformity of mass per Ph. Eur. 2.9.5
    ar: تجانس الكتلة وفق Ph. Eur. 2.9.5
  question:
    en: >-
      For solid dosage units (tablets, capsules, suppositories, single-dose powders and granules), does the specification include uniformity
      of mass per Ph. Eur. 2.9.5 (not more than 2 individual masses deviate from the average by more than the percentage deviation and none
      by more than twice it), unless uniformity of content is prescribed for all actives?
    ar: >-
      بالنسبة لوحدات الجرعة الصلبة (الأقراص والكبسولات والتحاميل والمساحيق والحبيبات أحادية الجرعة)، هل تتضمن المواصفات اختبار تجانس الكتلة
      وفق Ph. Eur. 2.9.5 (لا تنحرف أكثر من كتلتين فرديتين عن المتوسط بأكثر من نسبة الانحراف المقررة ولا تنحرف أي منها بأكثر من ضعفها)، ما لم
      يكن تجانس المحتوى مقرراً لجميع المواد الفعالة؟
  applies: admin_route in ('oral','rectal','vaginal') and 'oral_solution' not in dosage_specifics and 'suspension' not in dosage_specifics
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should include the uniformity of mass test (Ph. Eur. 2.9.5) with its acceptance criteria in the finished product
      specification, or demonstrate that uniformity of content is prescribed and authorised for all active substances.
    ar: >-
      يجب على مقدم الطلب إدراج اختبار تجانس الكتلة (Ph. Eur. 2.9.5) بمعايير قبوله في مواصفات المستحضر النهائي، أو إثبات أن اختبار تجانس
      المحتوى مقرر ومعتمد لجميع المواد الفعالة.
  action:
    type: edit_data
    target: specs.product
  evidence:
    slots:
      - EG-EDA/P-09
    keywords:
      - uniformity of mass
      - mass uniformity
      - average mass
      - 2.9.5
      - uniformity of dosage units
      - weight variation
    data:
      - specs.product
  cite:
    - src: eda-gl-cadc-002-v2
      at: Annex I, tables 2, 7, 9, 12 and 14
      quote: Not more than 2 of the individual masses deviate from the average mass (actual) by more than the percentage deviation.
- id: EG-EDA/CD-A1-02
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: cadc
  layer: eda
  ctd: 3.2.P.5.1
  title:
    en: Disintegration test and Q6A substitution
    ar: اختبار التفتت وإحلاله محل الانحلال
  question:
    en: >-
      Does the specification include disintegration per USP <701> / Ph. Eur. 2.9.1 for immediate-release, orally lyophilised and
      delayed-release tablets and for capsules (not for extended-release tablets), and where disintegration replaces dissolution for a
      locally acting API, is a justification per ICH Q6A submitted together with the dissolution method performed?
    ar: >-
      هل تتضمن المواصفات اختبار التفتت وفق USP <701> / Ph. Eur. 2.9.1 للأقراص فورية التحرر والأقراص المجففة بالتجميد فموياً والأقراص متأخرة
      التحرر وللكبسولات (وليس للأقراص ممتدة التحرر)؟ وفي حال إحلال التفتت محل الانحلال لمادة فعالة موضعية التأثير، هل قُدّم تبرير وفق ICH
      Q6A مع طريقة الانحلال التي أُجريت؟
  applies: >-
    admin_route == 'oral' and 'oral_solution' not in dosage_specifics and 'suspension' not in dosage_specifics and 'modified_release' not in
    dosage_specifics
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should include the disintegration test (USP <701> / Ph. Eur. 2.9.1) in the specification or, where disintegration is
      proposed instead of dissolution, submit a justification according to ICH Q6A together with the dissolution method performed.
    ar: >-
      يجب على مقدم الطلب إدراج اختبار التفتت (USP <701> / Ph. Eur. 2.9.1) في المواصفات، أو في حال اقتراح التفتت بدلاً من الانحلال تقديم
      تبرير وفق ICH Q6A مع طريقة الانحلال التي أُجريت.
  action:
    type: edit_data
    target: specs.product
  evidence:
    slots:
      - EG-EDA/P-09
      - EG-EDA/P-13
    keywords:
      - disintegration
      - '701'
      - 2.9.1
    data:
      - specs.product
  cite:
    - src: eda-gl-cadc-002-v2
      at: Annex I, table 2 (capsules) and table 14 (tablets)
      quote: >-
        Disintegration could substitute dissolution as a performance test if a justification submitted by the manufacturer that it obeys the
        ICH Q6A guidelines.
  anchor_cite:
    - src: ich-q6a
- id: EG-EDA/CD-A1-03
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: cadc
  layer: eda
  ctd: 3.2.P.5.1
  title:
    en: Dissolution method source and parameters
    ar: مصدر طريقة الانحلال ومعاييرها
  question:
    en: >-
      Is the dissolution method taken from the USP/BP monograph, the FDA dissolution methods database (with a comparative profile in the
      most suitable media) or developed in-house per Annex II, and does the specification state all parameters: filter type, medium
      composition and pH, volume, apparatus, rpm, temperature, sinkers, sampling time and Q, with USP <711> / Ph. Eur. 2.9.3 acceptance
      stages?
    ar: >-
      هل طريقة الانحلال مأخوذة من دراسة USP/BP أو من قاعدة بيانات طرق الانحلال لدى FDA (مع منحنى مقارن في أنسب الأوساط) أو مطوَّرة داخلياً
      وفق الملحق الثاني، وهل تذكر المواصفات جميع المعايير: نوع المرشح، وتركيب الوسط ورقمه الهيدروجيني، والحجم، والجهاز، وسرعة الدوران، ودرجة
      الحرارة، والمثقلات، وزمن السحب، وقيمة Q، مع مراحل القبول وفق USP <711> / Ph. Eur. 2.9.3؟
  applies: admin_route in ('oral','rectal','vaginal') and 'oral_solution' not in dosage_specifics and not aqueous_solution
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should state the source of the dissolution method and all its parameters (filter type, medium composition and pH,
      volume, apparatus, rpm, temperature, sinkers, sampling time and Q) with the USP <711> acceptance criteria in the specification.
    ar: >-
      يجب على مقدم الطلب بيان مصدر طريقة الانحلال وجميع معاييرها (نوع المرشح، وتركيب الوسط ورقمه الهيدروجيني، والحجم، والجهاز، وسرعة
      الدوران، ودرجة الحرارة، والمثقلات، وزمن السحب، وقيمة Q) مع معايير القبول وفق USP <711> في المواصفات.
  action:
    type: edit_data
    target: specs.product
  evidence:
    slots:
      - EG-EDA/P-09
      - EG-EDA/P-10
    keywords:
      - dissolution
      - apparatus
      - rpm
      - medium
      - sinker
      - filter
    data:
      - specs.product
  cite:
    - src: eda-gl-cadc-002-v2
      at: Annex I, table 2 (capsules), item 4 Dissolution
      quote: Filter type (common types Nylon, PVDF & PTFE) o Media composition & pH o Media volume o Apparatus type o RPM o Temperature
- id: EG-EDA/CD-A1-04
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: cadc
  layer: eda
  ctd: 3.2.P.5.1
  title:
    en: Tablet friability, hardness and subdivision
    ar: هشاشة الأقراص وصلابتها وتجزئتها
  question:
    en: >-
      For tablets, does the specification include friability (USP <1216> / Ph. Eur. 2.9.7) and breaking force for uncoated tablets unless
      controlled in-process, and for scored tablets the subdivision test per Ph. Eur. 0478 (NMT 1 individual mass outside 85–115 % of the
      average and none outside 75–125 %), or else is the package marked 'Indivisible' with a justification?
    ar: >-
      بالنسبة للأقراص، هل تتضمن المواصفات اختبار الهشاشة (USP <1216> / Ph. Eur. 2.9.7) وقوة الكسر للأقراص غير المغلفة ما لم تُضبط كرقابة
      أثناء التشغيل، وللأقراص المحززة اختبار التجزئة وفق Ph. Eur. 0478 (لا تخرج أكثر من كتلة فردية واحدة عن 85–115 % من المتوسط ولا تخرج أي
      منها عن 75–125 %)، وإلا فهل كُتبت عبارة «غير قابل للتجزئة» على العبوة مع تبرير؟
  applies: >-
    admin_route == 'oral' and 'capsule_hard' not in dosage_specifics and 'oral_solution' not in dosage_specifics and 'suspension' not in
    dosage_specifics
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should include friability and breaking force (uncoated tablets) and, for scored tablets, the subdivision test with the
      Ph. Eur. 0478 limits (NMT 1 unit outside 85–115 %, none outside 75–125 %) in the specification, or justify their omission and mark the
      package 'Indivisible'.
    ar: >-
      يجب على مقدم الطلب إدراج اختباري الهشاشة وقوة الكسر (للأقراص غير المغلفة)، وللأقراص المحززة اختبار التجزئة بحدود Ph. Eur. 0478 (لا
      تخرج أكثر من وحدة واحدة عن 85–115 % ولا تخرج أي منها عن 75–125 %) في المواصفات، أو تبرير إغفالها وكتابة عبارة «غير قابل للتجزئة» على
      العبوة.
  action:
    type: edit_data
    target: specs.product
  evidence:
    slots:
      - EG-EDA/P-09
    keywords:
      - friability
      - hardness
      - breaking force
      - subdivision
      - indivisible
      - score
    data:
      - specs.product
  cite:
    - src: eda-gl-cadc-002-v2
      at: Annex I, table 14 (tablets), items 5–7
      quote: NMT 1 individual mass is outside the limits of 85- 115 % of the average mass.
- id: EG-EDA/CD-A1-05
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: cadc
  layer: eda
  ctd: 3.2.P.5.6
