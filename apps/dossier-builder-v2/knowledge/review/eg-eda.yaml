  question:
    en: >-
      Is an identification test for each API included in the specification sheet and in the finished product certificate of analysis, noting
      that titrimetry is not accepted as an identification test?
    ar: >-
      هل أُدرج اختبار هوية لكل مادة فعالة في ورقة المواصفات وفي شهادة تحليل المستحضر النهائي، علماً بأن المعايرة الحجمية لا تُقبل اختباراً
      للهوية؟
