    - src: eda-gl-cadc-002-v2
      at: Annex IV §2 Sterility testing, 2.2 Test specifications
      quote: Sterilization method of the product By filtration, steam, dry heat, irradiation or ethylene oxide gas
- id: EG-EDA/CD-A4-03
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: cadc
  layer: eda
  ctd: 3.2.P.5.1
  title:
    en: Bacterial endotoxin limit
