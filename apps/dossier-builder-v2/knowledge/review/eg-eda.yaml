      Does the specification include the fill test appropriate to the dosage form: deliverable volume USP <698> for oral liquids, container
      content USP <697> for parenterals, and minimum fill USP <755> for topical, nasal, ophthalmic, otic, rectal, vaginal and inhalation
      preparations and aerosols?
    ar: >-
      هل تتضمن المواصفات اختبار الملء المناسب للشكل الصيدلي: الحجم القابل للتسليم USP <698> للسوائل الفموية، ومحتوى العبوة USP <697> للحقن،
      والحد الأدنى للملء USP <755> للمستحضرات الموضعية والأنفية والعينية والأذنية والشرجية والمهبلية والاستنشاقية والإيروسولات؟
  applies: >-
    aqueous_solution or 'oral_solution' in dosage_specifics or 'suspension' in dosage_specifics or 'topical' in dosage_specifics or
