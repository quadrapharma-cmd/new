# Assessor knowledge pack — EDA departments plus the international layer
# حزمة معرفة المُقيِّم — إدارات هيئة الدواء المصرية + الطبقة الدولية
# Ported from the old program (rulepacks/eda.review.v1); edit here from now on.
- id: EG-EDA/SC-COVER-01
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: screening
  layer: eda
  ctd: '1.0'
  title:
    en: Cover letter completeness statement
    ar: إقرار الاكتمال في خطاب التغطية
  question:
    en: Does the cover letter state that the submitted data are true, complete and correct?
    ar: هل يذكر خطاب التغطية أن البيانات المقدمة صحيحة وكاملة ودقيقة؟
  severity: minor
  auto:
    kind: text
  deficiency:
    en: The cover letter should include a statement that the submitted data are true, complete and correct.
    ar: يجب أن يتضمن خطاب التغطية إقراراً بأن البيانات المقدمة صحيحة وكاملة ودقيقة.
  action:
    type: generate
    target: cover
  evidence:
    slots:
      - EG-EDA/M1-43
    keywords:
      - true, complete and correct
      - complete and correct
      - true and complete
      - صحيحة وكاملة
  cite:
    - src: eda-np-capp-065-v5
      at: 1.0 cover letter (eCTD) · general notes
      quote: The soft copy must be complete for the file to be accepted for assessment
  anchor_cite:
    - src: who-pq-screening
      at: §1 cover letter
- id: EG-EDA/SC-SOFT-01
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: screening
  layer: eda
  ctd: '1.0'
  title:
    en: Complete soft copy
    ar: اكتمال النسخة الإلكترونية
  question:
    en: Is the soft copy complete — every required Module 1 item has a document and no required slot is empty?
    ar: هل النسخة الإلكترونية كاملة — لكل بند مطلوب في الوحدة 1 مستند ولا توجد خانة مطلوبة فارغة؟
  severity: critical
  auto:
    kind: data
    check: m1_complete
  deficiency:
    en: >-
      The soft copy is incomplete: required Module 1 items are missing. The file is not accepted for assessment until the soft copy is
      complete.
    ar: 'النسخة الإلكترونية غير مكتملة: توجد بنود مطلوبة في الوحدة 1 ناقصة. لا يُقبل الملف للتقييم قبل اكتمال النسخة الإلكترونية.'
  action:
    type: upload
    target: board
  evidence:
    data:
      - board.missing_required
  cite:
    - src: eda-np-capp-065-v5
      at: General notes, note 1
      quote: The soft copy must be complete for the file to be accepted for assessment
- id: EG-EDA/SC-PDF-01
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: screening
  layer: eda
  ctd: '1.0'
  title:
    en: Searchable PDFs
    ar: ملفات PDF قابلة للبحث
  question:
    en: Are all company documents scanned and searchable PDFs (a text layer in every company PDF)?
    ar: هل جميع مستندات الشركة ملفات PDF ممسوحة وقابلة للبحث (طبقة نصية في كل ملف)؟
  severity: critical
  auto:
    kind: data
    check: pdfs_searchable
  deficiency:
    en: >-
      All documents must be scanned and searchable PDF. The listed company documents have no text layer; make the text layer when scanning
      (the scanner's software, Acrobat, or a phone app that saves searchable PDFs) and replace them.
    ar: >-
      يجب أن تكون جميع المستندات PDF ممسوحة وقابلة للبحث. مستندات الشركة المذكورة بلا طبقة نصية؛ اعمل النص وقت المسح (برنامج السكانر أو
      Acrobat أو تطبيق بيحفظ PDF قابل للبحث) واستبدلها.
  action:
    type: upload
    target: documents
  evidence:
    data:
      - documents.searchable
  cite:
    - src: eda-np-capp-065-v5
      at: General notes, note 4
      quote: All submitted documents should be scanned and searchable PDF files.
- id: EG-EDA/SC-VALID-01
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: screening
  layer: eda
  ctd: 1.1 · 1.2
  title:
    en: Validity of dated certificates
    ar: صلاحية الشهادات المؤرخة
  question:
    en: >-
      Is every dated certificate in Module 1 (GMP, CPP, licences, pricing, register of trade) within its validity period at the planned
      submission date?
    ar: هل كل شهادة مؤرخة في الوحدة 1 (GMP، CPP، التراخيص، التسعير، السجل التجاري) سارية في تاريخ التقديم المخطط؟
  severity: critical
  auto:
    kind: data
    check: certificates_valid
  deficiency:
    en: >-
      The listed certificates are expired or expire within 90 days; a valid certificate (or evidence of the renewal request where the
      checklist allows it) should be provided.
    ar: الشهادات المذكورة منتهية الصلاحية أو تنتهي خلال 90 يوماً؛ يجب تقديم شهادة سارية (أو دليل طلب التجديد حيث تسمح القائمة بذلك).
  action:
    type: request_issuer
    target: documents
  evidence:
    data:
      - documents.valid_until
  cite:
    - src: eda-np-capp-065-v5
      at: 1.1.5 pricing certificate · 1.1.17.2 register of trade · 1.2.4 GMP
      quote: Must be valid
- id: EG-EDA/SC-CEP-01
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: screening
  layer: eda
  ctd: 1.2.4.3
  title:
    en: CEP valid and authorised
    ar: شهادة CEP سارية ومفوَّضة
  question:
    en: >-
      Is the CEP valid on the EDQM database (not suspended or withdrawn), with all annexes, and is the declaration of access (authorisation
      box) completed and signed by the CEP holder?
    ar: هل شهادة CEP سارية في قاعدة بيانات EDQM (غير موقوفة أو مسحوبة)، مع جميع الملاحق، ومربع التفويض مستكمل وموقَّع من حامل الشهادة؟
  applies: '''CEP'' in api_options'
  severity: critical
  auto:
    kind: data
    check: cep_valid
  deficiency:
    en: >-
      The CEP should be valid (not withdrawn or suspended), submitted with all its annexes, and the box of authorisation should be filled
      and signed by the CEP holder in favour of the applicant.
    ar: >-
      يجب أن تكون شهادة CEP سارية (غير مسحوبة أو موقوفة)، مقدَّمة بجميع ملاحقها، مع استكمال مربع التفويض وتوقيعه من حامل الشهادة لصالح مقدم
      الطلب.
  action:
    type: request_issuer
    target: M1-39
  evidence:
    slots:
      - EG-EDA/M1-39
    keywords:
      - declaration of access
      - access
      - annex
    data:
      - apis.cep_status
  cite:
    - src: eda-np-capp-040-v1
      at: Option 2 — CEP
      quote: Box of authorization in the CEP is not filled or signed by the CEP holder
  anchor_cite:
    - src: who-pq-screening
      at: CEP — check the valid version on the EDQM site
- id: EG-EDA/SC-CEP-02
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: screening
  layer: eda
  ctd: 1.2.4.3
  title:
    en: CEP commitment letter
    ar: خطاب الالتزام الخاص بشهادة CEP
  question:
    en: Is the applicant's written commitment to inform EDA if the CEP is revised, renewed or withdrawn provided?
    ar: هل يوجد تعهد كتابي من مقدم الطلب بإخطار الهيئة في حال تعديل شهادة CEP أو تجديدها أو سحبها؟
  applies: '''CEP'' in api_options'
  severity: major
  auto:
    kind: slot
  deficiency:
    en: A commitment letter acknowledging that EDA will be informed of any CEP withdrawal or update should be provided.
    ar: يجب تقديم خطاب التزام بإخطار الهيئة بأي سحب أو تحديث لشهادة CEP.
  action:
    type: generate
    target: cep_commitment
  evidence:
    slots:
      - EG-EDA/M1-40
    keywords:
      - commit
      - withdraw
      - revis
      - inform
  cite:
    - src: eda-np-capp-040-v1
      at: Option 2 — CEP
      quote: Absence of the acknowledgement commitment letter by the applicant to EDA in case of CEP withdrawal or updates
- id: EG-EDA/SC-SITE-01
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: screening
  layer: eda
  ctd: 1.1.17 · 3.2.P.3.1
  title:
    en: Sites consistent across the file
    ar: اتساق المواقع عبر الملف
  question:
    en: Are the manufacturing sites named in Module 1 (licences, GMP, CPP) the same as those in 3.2.P.3.1 and 3.2.S.2.1, with full addresses?
    ar: هل مواقع التصنيع المذكورة في الوحدة 1 (التراخيص، GMP، CPP) هي نفسها في 3.2.P.3.1 و3.2.S.2.1 وبعناوين كاملة؟
  severity: critical
  auto:
    kind: data
    check: sites_consistent
  deficiency:
    en: >-
      The manufacturers and sites stated in Module 1 should be identical to those in 3.2.P.3.1 / 3.2.S.2.1 and on the CPP; for imported
      products the manufacturers must not differ from the CPP.
    ar: يجب أن تتطابق أسماء المصنّعين والمواقع في الوحدة 1 مع 3.2.P.3.1 / 3.2.S.2.1 ومع شهادة CPP؛ وللمنتجات المستوردة يجب ألا تختلف عن CPP.
  action:
    type: edit_data
    target: apis
  evidence:
    slots:
      - EG-EDA/M1-14
      - EG-EDA/M1-37
      - EG-EDA/M1-38
      - EG-EDA/P-03
      - EG-EDA/S-04
    keywords:
      - manufactur
      - site
      - address
    data:
      - apis.address_gmp
  cite:
    - src: eda-np-capp-040-v1
      at: 3.2.P.3.1
      quote: 'For Imported products: Manufactures in this section are different than that in the CPP'
  anchor_cite:
    - src: who-pq-screening
      at: full site address including unit and block
- id: EG-EDA/SC-COMP-01
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: screening
  layer: eda
  ctd: 1.2.1 · 3.2.P.1
  title:
    en: Composition identical everywhere
    ar: تطابق التركيب في كل المستندات
  question:
    en: Is the composition in the composition certificate identical to 3.2.P.1 and to any approval or CPP that states the composition?
    ar: هل التركيب في شهادة التركيب مطابق لـ 3.2.P.1 ولأي موافقة أو شهادة CPP تذكر التركيب؟
  severity: critical
  auto:
    kind: none
  deficiency:
    en: >-
      The composition stated in the qualitative-quantitative formula should be identical to the composition in every approval and on the
      CPP.
    ar: يجب أن يتطابق التركيب في الصيغة الكمية والنوعية مع التركيب في كل موافقة وعلى شهادة CPP.
  action:
    type: rebuild
    target: M1-31
  evidence:
    slots:
      - EG-EDA/M1-31
      - EG-EDA/P-01
      - EG-EDA/M1-14
    keywords:
      - composition
      - mg
      - excipient
    data:
      - composition
  cite:
    - src: eda-np-capp-040-v1
      at: 3.2.P.1
      quote: Difference between composition in Q.F and any approval containing composition or CPP
- id: EG-EDA/SC-LEG-01
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: screening
  layer: eda
  ctd: 1.1.13 · 1.1.17.7
  title:
    en: Legalisation of foreign documents
    ar: تصديق المستندات الأجنبية
  question:
    en: >-
      Are the CPP / eCPP and the foreign agreements (storage, agency) legalised as the checklist requires (chamber of commerce and embassy,
      or eCPP verifiable online)?
    ar: >-
      هل شهادة CPP / eCPP والعقود الأجنبية (التخزين، الوكالة) مصدَّقة كما تطلب القائمة (الغرفة التجارية والسفارة، أو eCPP قابلة للتحقق
      إلكترونياً)؟
  applies: origin == 'imported'
  severity: critical
  auto:
    kind: text
  deficiency:
    en: >-
      The CPP and the foreign agreements should be legalised (chamber of commerce and Egyptian embassy) or submitted as an electronically
      verifiable eCPP.
    ar: يجب تصديق شهادة CPP والعقود الأجنبية (الغرفة التجارية والسفارة المصرية) أو تقديم eCPP قابلة للتحقق إلكترونياً.
  action:
    type: request_issuer
    target: M1-14
  evidence:
    slots:
      - EG-EDA/M1-14
      - EG-EDA/M1-24
    keywords:
      - legalis
      - legaliz
      - embassy
      - apostille
      - chamber
      - eCPP
  cite:
    - src: eda-np-capp-065-v5
      at: 1.1.13 CPP · 1.1.17.7 agreements
      quote: legalised
