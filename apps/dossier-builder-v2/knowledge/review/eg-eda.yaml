    ar: التحقق من الصحة والدقة
  question:
    en: >-
      Were within-run and between-run accuracy and precision determined with at least 5 samples per level at LLOQ, low, medium and high QC
      in at least three runs on two different days, with mean accuracy within 15% (20% at LLOQ) and CV not exceeding 15% (20% at LLOQ),
      calculated on area ratios?
    ar: >-
      هل حُددت الصحة والدقة ضمن التشغيلة وبين التشغيلات بخمس عينات على الأقل لكل مستوى عند LLOQ والمستويات المنخفض والمتوسط والمرتفع لعينات
      مراقبة الجودة في ثلاث تشغيلات على الأقل في يومين مختلفين، مع صحة متوسطة ضمن 15% (20% عند LLOQ) ومعامل تباين لا يتجاوز 15% (20% عند
      LLOQ)، محسوبة على نسب المساحات؟
  applies: 'true'
