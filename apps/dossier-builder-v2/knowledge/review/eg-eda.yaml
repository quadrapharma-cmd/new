- id: EG-EDA/BE-40
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.3
  title:
    en: BCS class I/III biowaiver criteria
    ar: معايير الإعفاء الحيوي لفئتي BCS الأولى والثالثة
  question:
    en: >-
      For a BCS-based biowaiver, is high solubility shown (highest single dose dissolved in 250 ml at pH 1-6.8 and 37 plus or minus 1
      degrees C in at least three buffers and at the pKa), absorption documented (85% or more for class I, below 85% for class III),
      dissolution very rapid (more than 85% in 15 minutes) or similarly rapid (85% in 30 minutes, class I only), excipients not affecting
      bioavailability (qualitatively the same and quantitatively very similar for class III), and the drug not NTI, not non-linear, not
      modified release and not absorbed in the oral cavity?
    ar: >-
      بالنسبة للإعفاء الحيوي القائم على BCS، هل أُثبتت الذوبانية العالية (أعلى جرعة وحيدة تذوب في 250 مل عند pH 1-6.8 و37 ± 1 درجة مئوية في
      ثلاثة محاليل منظمة على الأقل وعند pKa)، ووُثق الامتصاص (85% أو أكثر للفئة الأولى، وأقل من 85% للفئة الثالثة)، وكان الانحلال سريعاً
      جداً (أكثر من 85% خلال 15 دقيقة) أو سريعاً بالمثل (85% خلال 30 دقيقة للفئة الأولى فقط)، ولم تؤثر السواغات على التوافر الحيوي (متطابقة
      نوعياً ومتشابهة جداً كمياً للفئة الثالثة)، والدواء ليس ذا مؤشر علاجي ضيق ولا حركية لا خطية ولا إطلاق معدل ولا يُمتص في تجويف الفم؟
  applies: bcs_waiver
  severity: critical
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should document the BCS biowaiver conditions: pH-solubility profile in at least three buffers (pH 1.2, 4.5, 6.8 and the
      pKa) at 37 plus or minus 1 degrees C for the highest single dose in 250 ml, human absorption data, very rapid or similarly rapid
      comparative dissolution, and an excipient comparison, and confirm that none of the exclusions (NTI, non-linear PK, modified release,
      oral-cavity absorption, different ester/ether/isomer) applies.
    ar: >-
      يجب على مقدم الطلب توثيق شروط الإعفاء الحيوي القائم على BCS: منحنى الذوبانية مع pH في ثلاثة محاليل منظمة على الأقل (pH 1.2 و4.5 و6.8
      وعند pKa) عند 37 ± 1 درجة مئوية لأعلى جرعة وحيدة في 250 مل، وبيانات الامتصاص في الإنسان، وانحلالاً مقارناً سريعاً جداً أو سريعاً
      بالمثل، ومقارنة السواغات، وتأكيد عدم انطباق أي من الاستثناءات (المؤشر العلاجي الضيق، الحركية اللاخطية، الإطلاق المعدل، الامتصاص في
      تجويف الفم، اختلاف الإستر أو الإيثر أو الأيزومر).
  action:
    type: upload
    target: M5-05
  evidence:
    slots:
      - EG-EDA/M5-05
    keywords:
      - BCS
      - solubility
      - permeability
      - 85%
      - 15 minutes
    data:
      - results
      - composition
  cite:
    - src: eda-gl-capp-024-v4
      at: 4.5.1 Biowaivers based on the BCS (4.5.1.1-4.5.1.3 and exclusions)
      quote: Either very rapid (> 85 % within 15 minutes) or similarly rapid (85 % within 30 minutes) in vitro dissolution characteristics
  anchor_cite:
    - src: ich-m9
- id: EG-EDA/BE-41
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.3
  title:
    en: BCS class II weak acid biowaiver
    ar: الإعفاء الحيوي للأحماض الضعيفة من فئة BCS الثانية
  question:
    en: >-
      For a BCS class II weak acid biowaiver, does the API have a dose:solubility ratio of 250 ml or less at pH 6.8, is the generic rapidly
      dissolving (not less than 85% at pH 6.8 in 30 minutes) with profiles similar to the reference at pH 1.2, 4.5 and 6.8, are the
      excipients (e.g. surfactants) critically evaluated, and is Cmax not critical to the therapeutic effect?
    ar: >-
      بالنسبة للإعفاء الحيوي لحمض ضعيف من فئة BCS الثانية، هل نسبة الجرعة إلى الذوبانية للمادة الفعالة 250 مل أو أقل عند pH 6.8، وهل
      المستحضر الجنيس سريع الانحلال (لا يقل عن 85% عند pH 6.8 خلال 30 دقيقة) بمنحنيات مشابهة للمرجع عند pH 1.2 و4.5 و6.8، وهل قُيمت السواغات
      (مثل خافضات التوتر السطحي) تقييماً نقدياً، وهل Cmax غير حرجة للتأثير العلاجي؟
  applies: bcs_waiver
  severity: critical
  auto:
    kind: none
  deficiency:
    en: >-
      The applicant should demonstrate for the weak acid API a dose:solubility ratio of 250 ml or less at pH 6.8, rapid dissolution of not
      less than 85% at pH 6.8 in 30 minutes, similar profiles to the reference at pH 1.2, 4.5 and 6.8, and a critical evaluation of the type
      and amount of excipients such as surfactants.
    ar: >-
      يجب على مقدم الطلب إثبات أن نسبة الجرعة إلى الذوبانية للمادة الفعالة الحمضية الضعيفة 250 مل أو أقل عند pH 6.8، وانحلالاً سريعاً لا يقل
      عن 85% عند pH 6.8 خلال 30 دقيقة، ومنحنيات مشابهة للمرجع عند pH 1.2 و4.5 و6.8، وتقييماً نقدياً لنوع وكميات السواغات مثل خافضات التوتر
      السطحي.
  action:
    type: upload
    target: M5-05
  evidence:
