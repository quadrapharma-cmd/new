- id: EG-EDA/ST-22
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: stability
  layer: eda
  ctd: ST-T
  title:
    en: Stability-indicating analytical methods
    ar: طرق التحليل الدالة على الثبات
  question:
    en: >-
      Are the methods of analysis (3.2.P.5.2) presented by the stability site, signed and stamped, stability-indicating for the physical,
      chemical and microbiological tests, following the pharmacopoeial procedure where one exists, with Annex IV (ICH impurity thresholds)
      completed and any deviation from ICH limits justified?
    ar: >-
      هل قُدمت طرق التحليل (3.2.P.5.2) من موقع الثبات موقعة ومختومة، ودالة على الثبات للاختبارات الفيزيائية والكيميائية والميكروبيولوجية،
      ومتبعة للطريقة الدستورية عند وجودها، مع استيفاء الملحق الرابع (حدود ICH للشوائب) وتبرير أي انحراف عن حدود ICH؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should submit stability-indicating analytical procedures signed and stamped by the stability testing site, follow the
      pharmacopoeial procedure where available, complete Annex IV for the ICH impurity thresholds and justify any deviation from the ICH
      limits.
    ar: >-
      يجب على مقدم الطلب تقديم إجراءات تحليلية دالة على الثبات موقعة ومختومة من موقع اختبار الثبات، واتباع الطريقة الدستورية عند توفرها،
      واستيفاء الملحق الرابع لحدود ICH للشوائب، وتبرير أي انحراف عن حدود ICH.
