    ar: >-
      يجب على مقدم الطلب تقديم بيانات الصحة والدقة ضمن التشغيلة وبين التشغيلات عند LLOQ والمستويات المنخفض والمتوسط والمرتفع لعينات مراقبة
      الجودة (خمس عينات على الأقل لكل مستوى، وثلاث تشغيلات على الأقل في يومين مختلفين) بما يستوفي 15% (20% عند LLOQ).
  action:
