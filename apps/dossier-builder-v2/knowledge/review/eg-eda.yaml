      at: Technical Documents Folder, Finished product specifications (3.2.P.5.1), Chemical analysis
      quote: >-
        Should include assay of active ingredient(s), quantitation of impurities and related substances, and assay of preservative(s),
        stabilizers, chelating agents and/or antioxidant(s)
