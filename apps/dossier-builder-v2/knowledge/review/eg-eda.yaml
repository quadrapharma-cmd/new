- id: EG-EDA/RR-07
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: quality
  layer: eda
  ctd: 3.2.S.7
  title:
    en: API stability summary, commitment and data
    ar: ملخص ثبات المادة الفعالة والتعهد والبيانات
  question:
    en: >-
      Does 3.2.S.7 provide the stability summary and conclusions (studies, protocols, storage conditions and retest date), the post-approval
      protocol and commitment (or a justification for an old molecule) and recent stability data in tabular, graphical or narrative form,
      unless the CEP specifies an equal or longer retest period under the same or harsher conditions?
    ar: >-
      هل يقدم القسم 3.2.S.7 ملخص الثبات والاستنتاجات (الدراسات والبروتوكولات وظروف التخزين وتاريخ إعادة الاختبار)، وبروتوكول وتعهد الثبات
      بعد الموافقة (أو تبريراً لجزيء قديم)، وبيانات ثبات حديثة بشكل جدولي أو بياني أو سردي، ما لم تحدد شهادة CEP فترة إعادة اختبار مساوية أو
      أطول في ظروف مماثلة أو أشد؟
  applies: activity == 're_registration'
  severity: major
  auto:
    kind: slot
  deficiency:
    en: >-
      The applicant should provide the API stability summary and conclusions, the post-approval stability protocol and commitment (or
      justification), and the results of recent stability studies, unless the CEP exception for the retest period and storage conditions
      applies.
    ar: >-
      يجب على مقدم الطلب تقديم ملخص ثبات المادة الفعالة واستنتاجاته، وبروتوكول وتعهد الثبات بعد الموافقة (أو التبرير)، ونتائج دراسات الثبات
      الحديثة، ما لم ينطبق استثناء شهادة CEP الخاص بفترة إعادة الاختبار وظروف التخزين.
