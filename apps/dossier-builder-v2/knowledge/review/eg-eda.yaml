    ar: يجب الإقرار بتقييم مخاطر النيتروزامين للمادة الفعالة والمنتج النهائي، وعند وجود خطر تقديم اختبار تأكيدي واستراتيجية ضبط.
  action:
    type: upload
    target: P-12
  evidence:
    slots:
      - EG-EDA/S-07
      - EG-EDA/P-12
      - EG-EDA/M1-43
    keywords:
