  title:
    en: Calibration curve acceptance
    ar: معايير قبول منحنى المعايرة
  question:
    en: >-
      Does each calibration curve use at least six non-zero levels plus blank and zero samples in the study matrix, with back-calculated
      concentrations within 15% of nominal (20% at LLOQ) for at least 75% of standards, reported slope/intercept and at least 3 curves from
      validation?
    ar: >-
      هل يستخدم كل منحنى معايرة ستة مستويات غير صفرية على الأقل إضافة إلى عينة فارغة وعينة صفرية في مصفوفة الدراسة، مع تركيزات محسوبة عكسياً
      ضمن 15% من القيمة الاسمية (20% عند LLOQ) لما لا يقل عن 75% من المعايير، وبيان الميل والتقاطع و3 منحنيات على الأقل من التحقق؟
  applies: 'true'
