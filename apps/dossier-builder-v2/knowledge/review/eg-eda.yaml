      bioequivalence study and each analyte where required, and submit all method validation SOPs.
    ar: >-
      يجب على مقدم الطلب استيفاء جداول ملخص التكافؤ الحيوي في القسم 7 (الجداول 1-17)، مع جدول منفصل لكل دراسة تكافؤ حيوي ولكل مادة محللة عند
      الاقتضاء، وتقديم جميع إجراءات العمل القياسية للتحقق من الطريقة.
