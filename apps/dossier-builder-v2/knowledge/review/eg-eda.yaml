- id: EG-EDA/SC-WHO-NITRO
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: screening
  layer: prep
  ctd: 3.2.P.5.5 · 3.2.S.3.2
  title:
    en: Nitrosamine risk declared
    ar: إقرار تقييم مخاطر النيتروزامين
  question:
    en: Is a nitrosamine risk assessment (or a declaration of its outcome) included in the dossier?
    ar: هل يتضمن الملف تقييم مخاطر النيتروزامين (أو إقراراً بنتيجته)؟
  severity: minor
  auto:
    kind: text
  deficiency:
