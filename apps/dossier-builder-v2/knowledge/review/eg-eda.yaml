- id: EG-EDA/CD-A1-09
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: cadc
  layer: eda
  ctd: 3.2.P.5.1
  title:
    en: Inhalation and nasal performance tests
    ar: اختبارات أداء مستحضرات الاستنشاق والأنف
  question:
    en: >-
      For inhalation and nasal products, does the specification include the performance tests of Annex I: valve or pump delivery (shot
      weight), number of deliveries per container, droplet or particle size distribution by laser diffraction (USP <601>), aerodynamic
      particle size by cascade impactor (inhalation), spray pattern and plume geometry (USP <5>), leak rate and water content?
    ar: >-
      بالنسبة لمستحضرات الاستنشاق والأنف، هل تتضمن المواصفات اختبارات الأداء الواردة في الملحق الأول: تسليم الصمام أو المضخة (وزن الدفعة)،
      وعدد الجرعات في العبوة، وتوزيع حجم القطيرات أو الجسيمات بحيود الليزر (USP <601>)، وحجم الجسيمات الهوائي الديناميكي بالمصادم التتابعي
      (للاستنشاق)، ونمط الرش وهندسة السحابة (USP <5>)، ومعدل التسرب، ومحتوى الماء؟
  applies: admin_route in ('inhalation','nasal')
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should include the applicable inhalation/nasal performance tests (delivery per actuation, number of deliveries,
      droplet/particle size distribution, aerodynamic particle size, spray pattern and plume geometry, leak rate) in the specification
      according to USP <601>, <603>, <604> and <5>.
    ar: >-
      يجب على مقدم الطلب إدراج اختبارات الأداء المنطبقة لمستحضرات الاستنشاق/الأنف (التسليم لكل ضغطة، وعدد الجرعات، وتوزيع حجم
      القطيرات/الجسيمات، وحجم الجسيمات الهوائي الديناميكي، ونمط الرش وهندسة السحابة، ومعدل التسرب) في المواصفات وفق USP <601> و<603> و<604>
      و<5>.
  action:
    type: edit_data
    target: specs.product
  evidence:
    slots:
      - EG-EDA/P-09
    keywords:
      - cascade impactor
      - aerodynamic
      - spray pattern
      - plume geometry
      - droplet size
      - delivered dose
    data:
      - specs.product
  cite:
    - src: eda-gl-cadc-002-v2
      at: Annex I, table 1 (aerosols), items 5–11
      quote: Perform these tests only on inhalation and nasal aerosol (metered dose)
- id: EG-EDA/CD-A2-01
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: cadc
  layer: eda
  ctd: 3.2.P.2.2
  title:
    en: In-house dissolution for BCS I/III products
    ar: طريقة الانحلال الداخلية لمستحضرات BCS I/III
  question:
    en: >-
      For an in-house dissolution method on an immediate-release tablet or capsule of a BCS class I or III (high-solubility) drug swallowed
      intact and not NTI, does the development follow Guide I: basket 100 rpm or paddle 50 rpm (75 rpm with justification), 500 mL (900 mL
      with justification) of 0.1 N HCl without surfactant at 37 ± 0.5 °C, and a criterion of Q = 80 % in 30 minutes?
    ar: >-
      بالنسبة لطريقة انحلال داخلية لقرص أو كبسولة فورية التحرر تحتوي مادة فعالة من الفئة I أو III في نظام التصنيف البيوصيدلاني (عالية
      الذوبان) تُبلع كاملة وليست ضيقة المجال العلاجي، هل اتبع التطوير الدليل الأول: السلة بسرعة 100 دورة/دقيقة أو المجداف بسرعة 50
      دورة/دقيقة (75 بتبرير)، و500 مل (900 مل بتبرير) من حمض الهيدروكلوريك 0.1 عياري دون مادة خافضة للتوتر السطحي عند 37 ± 0.5 °م، ومعيار Q
      = 80 % خلال 30 دقيقة؟
  applies: >-
    admin_route == 'oral' and 'oral_solution' not in dosage_specifics and 'suspension' not in dosage_specifics and 'modified_release' not in
    dosage_specifics
  severity: major
  auto:
    kind: none
  deficiency:
    en: >-
      For a high-solubility (BCS I/III) immediate-release product the applicant should develop the in-house dissolution method according to
      Guide I of Annex II (0.1 N HCl, 500 mL, basket 100 rpm or paddle 50 rpm, 37 ± 0.5 °C) and set the criterion Q = 80 % in 30 minutes, or
      justify every deviation.
    ar: >-
      يجب على مقدم الطلب، للمستحضر فوري التحرر عالي الذوبان (BCS I/III)، تطوير طريقة الانحلال الداخلية وفق الدليل الأول في الملحق الثاني
      (حمض الهيدروكلوريك 0.1 عياري، 500 مل، السلة 100 دورة/دقيقة أو المجداف 50 دورة/دقيقة، 37 ± 0.5 °م) وتحديد المعيار Q = 80 % خلال 30
      دقيقة، أو تبرير كل انحراف.
  action:
    type: upload
    target: P-02
  evidence:
    slots:
      - EG-EDA/P-02
      - EG-EDA/P-10
    keywords:
      - BCS
      - Q=80
      - 80% in 30
      - 0.1 N HCl
      - 0.1N HCl
      - 500 mL
    data: []
  cite:
    - src: eda-gl-cadc-002-v2
      at: Annex II §1, Guide I
      quote: >-
        (1) Basket method: 100 rpm. (2) Paddle method: 50 rpm (or 75 rpm with appropriate justification) Dissolution criteria Q=80% in 30
        minutes.
  anchor_cite:
    - src: fda-dissolution-ir-1997
      at: >-
        Dissolution Testing and Acceptance Criteria for IR Solid Oral Dosage Form Drug Products Containing High Solubility Drug Substances,
        August 2018
- id: EG-EDA/CD-A2-02
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: cadc
  layer: eda
  ctd: 3.2.P.2.2
  title:
    en: In-house dissolution medium and agitation (Guide II)
    ar: وسط الانحلال والتحريك في الطريقة الداخلية (الدليل الثاني)
  question:
    en: >-
      For an in-house dissolution method on a BCS class II or IV immediate-release product, does the development report justify the medium
      volume (500, 900 or 1000 mL), an aqueous medium of pH 1.2–6.8 (pH 6.8 for SIF, pH 1.2 without enzymes for SGF, not above pH 8.0), the
      need for and amount of surfactant, enzymes for gelatin capsules and deaeration, and agitation of 50–100 rpm basket or 50–75 rpm paddle
      (never above 150 rpm), with water and hydro-alcoholic media avoided?
    ar: >-
      بالنسبة لطريقة انحلال داخلية لمستحضر فوري التحرر من الفئة II أو IV في نظام التصنيف البيوصيدلاني، هل يبرر تقرير التطوير حجم الوسط (500
      أو 900 أو 1000 مل)، ووسطاً مائياً برقم هيدروجيني 1.2–6.8 (6.8 لمحاكاة سائل الأمعاء، و1.2 دون إنزيمات لمحاكاة سائل المعدة، ولا يتجاوز
      8.0)، والحاجة إلى المادة الخافضة للتوتر السطحي وكميتها، والإنزيمات لكبسولات الجيلاتين وإزالة الهواء، والتحريك بسرعة 50–100 دورة/دقيقة
      للسلة أو 50–75 للمجداف (دون تجاوز 150)، مع تجنب الماء والأوساط الكحولية المائية؟
  applies: >-
    admin_route == 'oral' and 'oral_solution' not in dosage_specifics and 'suspension' not in dosage_specifics and 'modified_release' not in
    dosage_specifics
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should submit dissolution method development data justifying the medium (volume, pH 1.2–6.8, surfactant, enzymes,
      deaeration) and the agitation rate (basket 50–100 rpm, paddle 50–75 rpm) according to Guide II of Annex II.
    ar: >-
      يجب على مقدم الطلب تقديم بيانات تطوير طريقة الانحلال التي تبرر الوسط (الحجم، والرقم الهيدروجيني 1.2–6.8، والمادة الخافضة للتوتر
      السطحي، والإنزيمات، وإزالة الهواء) وسرعة التحريك (السلة 50–100 دورة/دقيقة، والمجداف 50–75 دورة/دقيقة) وفق الدليل الثاني في الملحق
      الثاني.
  action:
    type: upload
    target: P-02
  evidence:
    slots:
      - EG-EDA/P-02
    keywords:
      - dissolution medium
      - sink
      - surfactant
      - pH 6.8
      - pH 1.2
      - rpm
    data: []
  cite:
    - src: eda-gl-cadc-002-v2
      at: Annex II §1, Guide II
      quote: An aqueous medium with pH range 1.2 to 6.8 (ionic strength of buffers the same as in USP) should be used.
  anchor_cite:
    - src: fda-dissolution-ir-1997
      at: Dissolution Testing of Immediate Release Solid Oral Dosage Forms, August 1997
- id: EG-EDA/CD-A2-03
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: cadc
  layer: eda
  ctd: 3.2.P.2.2
  title:
    en: Comparative dissolution f1/f2 criteria
    ar: معايير f1/f2 لدراسة الانحلال المقارنة
  question:
    en: >-
      Does the comparative dissolution study report the dissolution parameters, test and reference measured under exactly the same
      conditions and time points (e.g. 15, 30, 45, 60 minutes), only one point after 85 % dissolution, CV not more than 20 % at early points
      and 10 % at others, and similarity shown by f1 of 0–15 and f2 of 50–100?
    ar: >-
      هل تورد دراسة الانحلال المقارنة معايير الانحلال، وقياس المستحضرين الاختباري والمرجعي في الظروف ونقاط الزمن نفسها تماماً (مثل 15 و30
      و45 و60 دقيقة)، ونقطة واحدة فقط بعد انحلال 85 %، ومعامل اختلاف لا يتجاوز 20 % في النقاط المبكرة و10 % في غيرها، وتماثلاً يثبته f1 بين
      0 و15 وf2 بين 50 و100؟
  applies: dossier_kind == 'generic' and admin_route == 'oral' and 'oral_solution' not in dosage_specifics
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should submit a comparative dissolution study following Annex II §2: identical conditions and time points for test and
      reference, one point after 85 % dissolution, CV ≤ 20 % (early) / ≤ 10 % (later), and f1 (0–15) and f2 (50–100) values.
    ar: >-
      يجب على مقدم الطلب تقديم دراسة انحلال مقارنة وفق الملحق الثاني §2: ظروف ونقاط زمن متطابقة للمستحضرين الاختباري والمرجعي، ونقطة واحدة
      بعد انحلال 85 %، ومعامل اختلاف ≤ 20 % (مبكراً) / ≤ 10 % (لاحقاً)، وقيمتي f1 (0–15) وf2 (50–100).
  action:
    type: upload
    target: P-02
  evidence:
    slots:
      - EG-EDA/P-02
    keywords:
      - f2
      - f1
      - similarity factor
      - coefficient of variation
      - 85%
      - comparative dissolution
    data: []
  cite:
    - src: eda-gl-cadc-002-v2
      at: Annex II §2 Comparative dissolution study
      quote: Generally, f1 values up to 15 (0-15) and f2 values greater than 50 (50-100) ensure sameness or equivalence of the two curves
  anchor_cite:
    - src: fda-dissolution-ir-1997
      at: Dissolution Testing of Immediate Release Solid Oral Dosage Forms, August 1997
- id: EG-EDA/CD-A3-01
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: cadc
