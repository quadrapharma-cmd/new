      For a mass spectrometric method, was the matrix effect investigated in at least 6 lots of blank matrix from individual donors (not
      pooled) at low and high concentration, with the IS-normalised matrix factor CV not greater than 15% and haemolysed/lipaemic matrix
      considered where relevant?
    ar: >-
      بالنسبة لطريقة مطيافية الكتلة، هل دُرس تأثير المصفوفة في 6 دفعات على الأقل من المصفوفة الفارغة من متبرعين أفراد (غير مجمعة) عند تركيز
      منخفض ومرتفع، مع معامل تباين لعامل المصفوفة المعاير بالمعيار الداخلي لا يتجاوز 15%، ومراعاة المصفوفة المنحلة الدم أو الدهنية عند
