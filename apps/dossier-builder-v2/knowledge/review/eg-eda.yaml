      aged samples?
    ar: >-
      بالنسبة للمستحضر المعقم الذي يُعاد تكوينه أو يُخفف، هل أُثبت التوافق مع جميع المخففات على مدى نطاق التخفيف المذكور في النشرة ولمدة
      التخزين المذكورة (مثل 24 ساعة في درجة حرارة الغرفة المضبوطة و72 ساعة في الثلاجة)، ويفضل على عينات قديمة العمر؟
  applies: '''powder_inj_with_solvent'' in dosage_specifics or (admin_route == ''parenteral'' and ''sterile'' in dosage_specifics)'
