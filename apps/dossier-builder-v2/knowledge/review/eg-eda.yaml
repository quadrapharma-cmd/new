- id: EG-EDA/CD-A3-05
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: cadc
  layer: eda
  ctd: 3.2.P.5.5
  title:
    en: Residual solvents per ICH Q3C
    ar: المذيبات المتبقية وفق ICH Q3C
  question:
    en: >-
      Are residual solvents assessed according to ICH Q3C (unless the specific monograph states otherwise) using USP <467> or an alternative
      method verified or validated per USP <1467>, and where a solvent is controlled in an intermediate such as granules or pellets, is it
      still included in the finished product specification?
    ar: >-
      هل تُقيَّم المذيبات المتبقية وفق ICH Q3C (ما لم تنص الدراسة الدستورية الخاصة على خلاف ذلك) باستخدام USP <467> أو طريقة بديلة جرى
      التحقق منها أو التثبت من صلاحيتها وفق USP <1467>، وإذا كان المذيب مضبوطاً في منتج وسيط كالحبيبات أو الكريات فهل يظل مدرجاً في مواصفات
      المستحضر النهائي؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should include residual solvents in the finished product specification with limits according to ICH Q3C and a procedure
      per USP <467> or an alternative method verified/validated according to USP <1467>.
    ar: >-
      يجب على مقدم الطلب إدراج المذيبات المتبقية في مواصفات المستحضر النهائي بحدود وفق ICH Q3C وطريقة وفق USP <467> أو طريقة بديلة جرى
      التحقق منها/التثبت من صلاحيتها وفق USP <1467>.
  action:
    type: edit_data
