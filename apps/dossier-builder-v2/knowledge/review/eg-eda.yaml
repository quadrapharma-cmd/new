- id: EG-EDA/QM-S13-01
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: quality
  layer: eda
  ctd: 3.2.S.1.3
  title:
    en: General properties discussed
    ar: مناقشة الخواص العامة
  question:
    en: >-
      Are aqueous solubility at different pH, solubility in organic solvents, hygroscopicity and, for a low-solubility API, particle size
      distribution and polymorphism discussed?
    ar: >-
      هل نوقشت الذوبانية المائية عند درجات pH مختلفة، والذوبانية في المذيبات العضوية، والاسترطاب، وللمادة قليلة الذوبان توزيع حجم الجسيمات
      وتعدد الأشكال البلورية؟
  severity: major
  auto:
    kind: text
    min_hits: 2
  deficiency:
    en: >-
      3.2.S.1.3 should discuss aqueous solubility at different pH values, solubility in organic solvents, hygroscopicity, and for a
