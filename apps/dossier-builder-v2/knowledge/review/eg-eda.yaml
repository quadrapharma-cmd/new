  ctd: 5.3.1.4
  title:
    en: Analytical run acceptance
    ar: معايير قبول التشغيلة التحليلية
  question:
    en: >-
      Did each run contain blank, zero, at least 6 calibration levels and at least 3 QC levels in duplicate (or 5% of study samples), with
      all samples of a subject analysed together where possible, and were runs accepted only when calibration standards met 15%/20% and at
      least 67% of QCs and 50% at each level were within 15%?
    ar: >-
      هل احتوت كل تشغيلة على عينة فارغة وصفرية و6 مستويات معايرة على الأقل و3 مستويات على الأقل من عينات مراقبة الجودة بالتكرار (أو 5% من
      عينات الدراسة)، مع تحليل جميع عينات المتطوع الواحد معاً حيثما أمكن، وهل قُبلت التشغيلات فقط عند استيفاء معايير المعايرة 15%/20% وكون
      67% على الأقل من عينات مراقبة الجودة و50% عند كل مستوى ضمن 15%؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should document the run composition and the pre-defined run acceptance criteria and show that every accepted run met
      them (calibration standards within 15%, 20% at LLOQ; at least 67% of QCs and 50% at each level within 15%), listing failed runs with
      reasons.
    ar: >-
      يجب على مقدم الطلب توثيق تكوين التشغيلة ومعايير قبولها المحددة مسبقاً وإثبات أن كل تشغيلة مقبولة استوفتها (معايير المعايرة ضمن 15%
      و20% عند LLOQ؛ و67% على الأقل من عينات مراقبة الجودة و50% عند كل مستوى ضمن 15%)، مع قائمة بالتشغيلات الفاشلة وأسبابها.
  action:
    type: upload
    target: M5-06
  evidence:
    slots:
      - EG-EDA/M5-06
    keywords:
      - acceptance criteria
      - QC
      - quality control
      - 67%
    data: []
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.20.2 Analytical run; 2.20.3 Acceptance criteria of an analytical run
      quote: At least 67% of the QC samples and at least 50% at each concentration level should comply with this criterion.
- id: EG-EDA/BE-26
  kind: rule
