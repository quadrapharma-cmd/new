    ar: >-
      يجب على مقدم الطلب عرض منحنيات المعايرة (ستة مستويات غير صفرية على الأقل مع عينة فارغة وعينة صفرية، و3 منحنيات على الأقل من التحقق) مع
      التركيزات المحسوبة عكسياً والصحة ضمن 15% (20% عند LLOQ) لما لا يقل عن 75% من المعايير.
