      quote: Please provide a separate table for each Bioequivalence Study.
- id: EG-EDA/BE-44
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: EDA sample withdrawal report and center rules
    ar: تقرير سحب العينات وقواعد مراكز الهيئة
  question:
    en: >-
      For a study conducted in an Egyptian BE center, is the sample withdrawal report issued by the EDA inspector included (trade name,
      strength, dosage form, manufacturer, batch type and number, dates, study type and center), and does the file show compliance with the
      center rules (approved volunteer list, ethics approval naming the product, complementary in vitro study before dosing, samples kept at
      -80 C, analysis within the center)?
    ar: >-
      بالنسبة لدراسة أُجريت في مركز تكافؤ حيوي مصري، هل أُدرج تقرير سحب العينات الصادر عن مفتش هيئة الدواء (الاسم التجاري والتركيز والشكل
      الصيدلي والمصنع ونوع التشغيلة ورقمها والتواريخ ونوع الدراسة والمركز)، وهل يبين الملف الالتزام بقواعد المراكز (قائمة المتطوعين
      المعتمدة، وموافقة لجنة الأخلاقيات باسم المنتج، والدراسة المختبرية التكميلية قبل الجرعات، وحفظ العينات عند -80 درجة مئوية، والتحليل
      داخل المركز)؟
  applies: 'true'
  severity: major
  auto:
    kind: none
  deficiency:
    en: >-
      The applicant should submit the EDA sample withdrawal report for the bioequivalence or comparative in vitro study and evidence of
      compliance with the Section 6 center rules (approved volunteers, dated ethics approval naming the product, complementary in vitro
      study completed before sampling).
    ar: >-
      يجب على مقدم الطلب تقديم تقرير سحب العينات الصادر عن هيئة الدواء لدراسة التكافؤ الحيوي أو الدراسة المختبرية المقارنة وما يثبت الالتزام
      بقواعد المراكز في القسم 6 (المتطوعون المعتمدون، وموافقة أخلاقية مؤرخة باسم المنتج، وإتمام الدراسة المختبرية التكميلية قبل سحب
      العينات).
  action:
