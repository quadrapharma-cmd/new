- id: EG-EDA/ST-28
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: stability
  layer: eda
  ctd: ST-D
  title:
    en: OOS, OOT and dissolution reporting
    ar: النتائج خارج المواصفات والاتجاه وعرض الانحلال
  question:
    en: >-
      Are dissolution results expressed as average and range of individual results at each interval, any out-of-specification, out-of-trend
      or significant change scientifically justified, skipped tests justified, and statistical analysis submitted where applicable?
    ar: >-
      هل عُبّر عن نتائج الانحلال كمتوسط ومدى للنتائج الفردية في كل فترة، وهل بُررت علمياً أي نتائج خارج المواصفات أو خارج الاتجاه أو أي تغير
      جوهري، وبُررت الاختبارات المتخطاة، وقُدم التحليل الإحصائي حيثما ينطبق؟
  applies: 'true'
  severity: major
  auto:
