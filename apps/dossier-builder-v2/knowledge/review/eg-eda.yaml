- id: EG-EDA/ST-25
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: stability
  layer: eda
  ctd: ST-T
  title:
    en: Validation of analytical procedures
    ar: التحقق من صلاحية الإجراءات التحليلية
  question:
    en: >-
      Is validation data for assay, impurities, preservative/antioxidant content and dissolution submitted as in CTD P.5.3/approved by CADC,
      with complete validation (specificity, precision, linearity, accuracy, ruggedness, robustness, tabulated results) when a new method is
      used, revalidation after a composition change, and method transfer per USP 1224 after a site transfer?
    ar: >-
      هل قُدمت بيانات التحقق من صلاحية طرق المعايرة والشوائب ومحتوى المادة الحافظة/مضاد الأكسدة والانحلال كما في القسم P.5.3 أو المعتمدة لدى
      CADC، مع تحقق كامل (النوعية والدقة والخطية والصحة والمتانة والصلابة مع جداول النتائج) عند استخدام طريقة جديدة، وإعادة التحقق بعد تغيير
      التركيبة، ونقل الطريقة وفق USP 1224 بعد نقل الموقع؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should submit the validation of the analytical procedures (assay, impurities, preservative/antioxidant, dissolution)
      consistent with P.5.3/CADC; complete validation data for any new method, revalidation for a composition change, and method transfer
      according to USP 1224 for a site transfer.
    ar: >-
      يجب على مقدم الطلب تقديم التحقق من صلاحية الإجراءات التحليلية (المعايرة، الشوائب، المادة الحافظة/مضاد الأكسدة، الانحلال) بما يتوافق مع
      P.5.3/CADC، وبيانات تحقق كاملة لأي طريقة جديدة، وإعادة التحقق عند تغيير التركيبة، ونقل الطريقة وفق USP 1224 عند نقل الموقع.
  action:
    type: upload
    target: P-10
  evidence:
    slots:
      - EG-EDA/P-10
    keywords:
      - validation
      - specificity
      - linearity
      - accuracy
      - precision
    data: []
  cite:
    - src: eda-np-capp-090-v2
      at: Technical Documents Folder, 5-Validation of analytical procedure
      quote: >-
        In case of new method applied in stability dossier differs than that in section p.5.3, complete method validation data should be
        submitted
- id: EG-EDA/ST-26
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: stability
  layer: eda
  ctd: ST-T
  title:
    en: Stress testing 10-30% degradation
    ar: اختبارات الإجهاد بتحلل 10-30%
  question:
    en: >-
      Are forced degradation studies reported in Annex V under conditions drastic enough to yield 10-30% degradation (acid, alkali,
      oxidation, heat, light/photostability), with validation chromatograms per API showing active and degradation peaks, and scientific
      evidence for any API found stable?
    ar: >-
      هل أُبلغ عن دراسات التحلل القسري في الملحق الخامس تحت ظروف قاسية بما يكفي لإحداث تحلل بنسبة 10-30% (حمضي، قلوي، أكسدة، حرارة، ضوء/ثبات
      ضوئي)، مع كروماتوجرامات التحقق لكل مادة فعالة توضح قمم المادة الفعالة ونواتج التحلل، ودليل علمي لأي مادة فعالة وُجدت ثابتة؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should complete Annex V with stress conditions drastic enough to yield 10-30% degradation, provide the stress
      chromatograms for each API with adequate resolution of active and degradation peaks, and submit references and scientific evidence for
      any product found stable under stress.
    ar: >-
      يجب على مقدم الطلب استيفاء الملحق الخامس بظروف إجهاد قاسية بما يكفي لإحداث تحلل بنسبة 10-30%، وتقديم كروماتوجرامات الإجهاد لكل مادة
      فعالة بدقة فصل كافية لقمم المادة الفعالة ونواتج التحلل، وتقديم مراجع ودليل علمي لأي منتج وُجد ثابتاً تحت الإجهاد.
  action:
    type: upload
    target: P-10
  evidence:
    slots:
      - EG-EDA/P-10
    keywords:
      - forced degradation
      - stress
      - degradation
      - photostab
    data: []
  cite:
    - src: eda-np-capp-090-v2
      at: Technical Documents Folder, In Case of Full Validation Data, Notes; Annex V
      quote: please apply conditions drastic enough to yield 10-30% degradation and fill Annex V (TRS 929 annex 5)
  anchor_cite:
    - src: who-trs929-annex5
- id: EG-EDA/ST-27
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: stability
  layer: eda
  ctd: ST-D
  title:
    en: Stability tables and summary content
    ar: محتوى جداول وملخص الثبات
  question:
    en: >-
      Are the stability tables (3.2.P.8.3) signed and stamped by the stability site and do they state product name, dosage form, strength,
      batch number, batch size and type, manufacturing and expiry dates, study start date, conditions, intervals and pack, with physical,
      chemical and microbiological results within shelf-life specifications, and a summary per Annex VI?
    ar: >-
      هل جداول الثبات (3.2.P.8.3) موقعة ومختومة من موقع الثبات، وهل تذكر اسم المنتج والشكل الصيدلي والتركيز ورقم التشغيلة وحجمها ونوعها
      وتاريخي التصنيع والانتهاء وتاريخ بدء الدراسة والظروف والفترات والعبوة، مع نتائج فيزيائية وكيميائية وميكروبيولوجية ضمن مواصفات
      الصلاحية، وملخص وفق الملحق السادس؟
  applies: 'true'
  severity: critical
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should submit signed and stamped stability tables stating product name, dosage form, strength, batch number, batch size
      and type, manufacturing and expiry dates, start date, storage conditions, testing intervals and pack, with results within shelf-life
      specifications, and a stability summary according to Annex VI.
    ar: >-
      يجب على مقدم الطلب تقديم جداول ثبات موقعة ومختومة تذكر اسم المنتج والشكل الصيدلي والتركيز ورقم التشغيلة وحجمها ونوعها وتاريخي التصنيع
      والانتهاء وتاريخ البدء وظروف التخزين وفترات الاختبار والعبوة، مع نتائج ضمن مواصفات الصلاحية، وملخص ثبات وفق الملحق السادس.
