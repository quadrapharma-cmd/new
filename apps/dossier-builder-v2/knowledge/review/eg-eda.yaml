    ar: >-
      يجب على مقدم الطلب التعبير عن نتائج الانحلال كمتوسط ومدى للنتائج الفردية لكل فترة زمنية، وتبرير أي نتائج خارج المواصفات أو خارج
      الاتجاه أو تغير جوهري أو اختبار متخطى تبريراً علمياً، وتقديم التحليل الإحصائي حيثما ينطبق.
