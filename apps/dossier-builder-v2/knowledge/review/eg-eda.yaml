      - NDMA
      - N-nitroso
      - نيتروزامين
  cite:
    - src: who-pq-screening
      at: nitrosamine
      quote: Nitrosamine RA declared
  anchor_cite:
    - src: ema-nitrosamines-qa
      at: rev.
    - src: fda-nitrosamines
- id: EG-EDA/SC-WHO-BELIST
