- id: EG-EDA/CD-A3-06
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: cadc
  layer: eda
  ctd: 3.2.P.5.1
  title:
    en: Uniformity of dosage units with target value
    ar: تجانس وحدات الجرعة مع القيمة المستهدفة
  question:
    en: >-
      Does the specification include uniformity of dosage units per USP <905> / Ph. Eur. 2.9.40 / JP 6.02 with target value T = 100 % (or T
      stated in the monograph when assay limits are asymmetric, e.g. 90–115 %), with a correction factor where the content uniformity
      procedure differs from the assay, excluding multivitamin and trace-element preparations?
    ar: >-
      هل تتضمن المواصفات اختبار تجانس وحدات الجرعة وفق USP <905> / Ph. Eur. 2.9.40 / JP 6.02 بقيمة مستهدفة T = 100 % (أو T المذكورة في
      الدراسة الدستورية عند عدم تماثل حدود المقايسة، مثل 90–115 %)، مع معامل تصحيح عندما تختلف طريقة تجانس المحتوى عن طريقة المقايسة،
      باستثناء مستحضرات الفيتامينات المتعددة والعناصر النزرة؟
  applies: >-
    'oral_solution' not in dosage_specifics and not aqueous_solution and 'suspension' not in dosage_specifics and 'topical' not in
    dosage_specifics
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should include uniformity of dosage units (USP <905> / Ph. Eur. 2.9.40) in the specification, stating the target value T
      where the assay limits are asymmetric and any correction factor applied.
    ar: >-
      يجب على مقدم الطلب إدراج اختبار تجانس وحدات الجرعة (USP <905> / Ph. Eur. 2.9.40) في المواصفات، مع بيان القيمة المستهدفة T عند عدم
      تماثل حدود المقايسة وأي معامل تصحيح مطبق.
  action:
    type: edit_data
    target: specs.product
  evidence:
