- id: EG-EDA/CD-A3-03
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: cadc
  layer: eda
  ctd: 3.2.P.5.1
  title:
    en: Assay limits for API, preservative, antioxidant
    ar: حدود المقايسة للمادة الفعالة والمادة الحافظة ومضاد الأكسدة
  question:
    en: >-
      Are the assay limits expressed on the active moiety and set at 90–110 % of label claim for the API (90 % to 110 % plus overage where a
      stability overage is approved), 80–120 % for the preservative, and justified manufacturer limits for the antioxidant, with any wider
      limit justified only by the specific monograph or approved stability specifications?
    ar: >-
      هل حدود المقايسة معبَّر عنها بالجزء الفعال ومحددة بـ 90–110 % من الكمية المعلنة للمادة الفعالة (ومن 90 % إلى 110 % زائد الفائض عند
      اعتماد فائض ثباتي)، و80–120 % للمادة الحافظة، وحدود المصنّع المبررة لمضاد الأكسدة، مع تبرير أي حد أوسع بالدراسة الدستورية الخاصة أو
      مواصفات الثبات المعتمدة فقط؟
  applies: 'true'
  severity: major
  auto:
    kind: none
  deficiency:
    en: >-
      The applicant should set the assay limits in terms of the active moiety at 90–110 % of label claim for the API and 80–120 % for the
      preservative, justify the antioxidant limit scientifically, and justify any wider limit by the specific monograph or the approved
      stability specifications.
    ar: >-
      يجب على مقدم الطلب تحديد حدود المقايسة بدلالة الجزء الفعال عند 90–110 % من الكمية المعلنة للمادة الفعالة و80–120 % للمادة الحافظة،
      وتبرير حد مضاد الأكسدة علمياً، وتبرير أي حد أوسع بالدراسة الدستورية الخاصة أو مواصفات الثبات المعتمدة.
  action:
    type: edit_data
    target: specs.product
  evidence:
    slots:
      - EG-EDA/P-09
      - EG-EDA/P-13
    keywords:
      - '90.0'
      - '110.0'
      - 90-110
      - 80-120
      - overage
      - assay
    data:
      - specs.product
      - composition
  cite:
    - src: eda-gl-cadc-002-v2
      at: Annex III §2.1.4
      quote: General acceptance limit for the API is 90-110% of the Labeled claim.
- id: EG-EDA/CD-A3-04
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: cadc
  layer: eda
  ctd: 3.2.P.5.5
  title:
    en: Organic impurities controlled per monograph and Q3B
    ar: ضبط الشوائب العضوية وفق الدستور وICH Q3B
  question:
    en: >-
      Is a related substances / organic impurities test included as in the finished product monograph (applied to any capsule type or tablet
      coat covered by a USP monograph), or where the monograph has none, is a stability-indicating method provided so that unjustified peaks
      can be assessed according to ICH Q3B?
    ar: >-
      هل أُدرج اختبار المواد ذات الصلة / الشوائب العضوية كما في دراسة المستحضر النهائي بدستور الأدوية (ويُطبق على أي نوع كبسولة أو تغليف قرص
      تشمله دراسة USP)، أو عند خلو الدراسة منه هل قُدّمت طريقة دالّة على الثبات بحيث تُقيَّم القمم غير المبررة وفق ICH Q3B؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should include the organic impurities / related substances test of the monograph in the specification or, where none
      exists, provide a stability-indicating method and control unjustified peaks according to ICH Q3B.
    ar: >-
      يجب على مقدم الطلب إدراج اختبار الشوائب العضوية / المواد ذات الصلة الوارد في الدراسة الدستورية في المواصفات، أو عند عدم وجوده تقديم
      طريقة دالّة على الثبات وضبط القمم غير المبررة وفق ICH Q3B.
  action:
    type: upload
    target: P-12
  evidence:
