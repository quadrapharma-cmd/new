    ar: اكتمال مستندات الملف التنظيمي
  question:
    en: >-
      Does the Group 2 regulatory folder contain all twelve documents of Annex VI: registration licence and relevant approvals, registration
      form, quantitative composition, sample analysis request and sample collection report, API CoAs, finished product specifications,
      finished product CoA, box approval, payment receipt, MSDS for every API, antioxidant and preservative, a declaration of the sample
      collection category and number of batches, and a declaration that the file information is correct?
    ar: >-
      هل يحتوي الملف التنظيمي للمجموعة الثانية على المستندات الاثني عشر الواردة في الملحق السادس: ترخيص التسجيل والموافقات ذات الصلة، ونموذج
      التسجيل، والتركيب الكمي، وطلب تحليل العينة ومحضر سحبها، وشهادات تحليل المواد الفعالة، ومواصفات المستحضر النهائي، وشهادة تحليل المستحضر
      النهائي، وموافقة العبوة، وإيصال السداد، وصحيفة بيانات سلامة المواد لكل مادة فعالة ومضاد أكسدة ومادة حافظة، وإقراراً بفئة سحب العينات
      وعدد التشغيلات المسحوبة، وإقراراً بصحة المعلومات الواردة في الملف؟
  applies: 'true'
  severity: critical
