- id: EG-EDA/BE-27
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.4
  title:
    en: Incurred sample reanalysis performed
    ar: إجراء إعادة تحليل العينات الفعلية
  question:
    en: >-
      Was incurred sample reanalysis performed on 10% of samples (5% of the number above 1000) taken around Cmax and in the elimination
      phase, in separate runs on different days against fresh calibrators, with at least 67% of repeats within 20% of the mean, or is its
      absence scientifically justified (not acceptable for back-conversion drugs such as clopidogrel, atorvastatin, ramipril)?
    ar: >-
      هل أُجريت إعادة تحليل العينات الفعلية على 10% من العينات (و5% مما يزيد عن 1000) مأخوذة حول Cmax وفي طور الإطراح، في تشغيلات منفصلة
      وأيام مختلفة مقابل معايير طازجة، مع 67% على الأقل من التكرارات ضمن 20% من المتوسط، أو هل بُرر غيابها علمياً (غير مقبول للأدوية ذات
      التحول العكسي مثل كلوبيدوجريل وأتورفاستاتين وراميبريل)؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should provide incurred sample reanalysis results (10% of samples below 1000 and 5% above, around Cmax and in the
      elimination phase) with at least 67% of repeats within 20% of their mean, or a scientific justification for its absence addressing
      back-conversion, other ISR data, repeat analyses, PK plausibility and the 90% CI width.
    ar: >-
      يجب على مقدم الطلب تقديم نتائج إعادة تحليل العينات الفعلية (10% من العينات دون 1000 و5% فوقها، حول Cmax وفي طور الإطراح) مع 67% على
      الأقل من التكرارات ضمن 20% من متوسطها، أو تبريراً علمياً لغيابها يتناول التحول العكسي وبيانات ISR الأخرى وإعادة التحاليل ومعقولية
      الحركية الدوائية وعرض فترة الثقة 90%.
  action:
    type: upload
    target: M5-06
  evidence:
    slots:
      - EG-EDA/M5-06
    keywords:
      - incurred sample
      - ISR
      - reanalys
    data: []
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.21 Requirement to perform incurred sample reanalysis (ISR)
      quote: 10% of the samples should be reanalysed in case the number of samples is less than 1000 samples
- id: EG-EDA/BE-28
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Statistical method and model
    ar: الطريقة والنموذج الإحصائي
  question:
    en: >-
      Were AUC and Cmax log-transformed and analysed by ANOVA (formulation, period, sequence, subject) pre-specified in the protocol, with
      90% confidence intervals by two one-sided tests at 5%, validated software, no post hoc or data-driven adjustments, and outlier
      handling specified a priori?
    ar: >-
      هل حُولت AUC وCmax لوغاريتمياً وحُللت بتحليل التباين ANOVA (المستحضر والفترة والتسلسل والمتطوع) المحدد مسبقاً في البروتوكول، مع فترات
      ثقة 90% باختبارين أحاديي الجانب عند 5%، وبرمجيات متحقق من صلاحيتها، ودون تعديلات لاحقة أو موجهة بالبيانات، ومع تحديد مسبق لكيفية
      التعامل مع القيم الشاذة؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should present the pre-specified statistical model (ANOVA on log-transformed AUC and Cmax with formulation, period,
      sequence and subject factors), the 90% confidence intervals, the validated software used, and the a priori rules for outliers, in
      sufficient detail for the analysis to be repeated.
    ar: >-
      يجب على مقدم الطلب عرض النموذج الإحصائي المحدد مسبقاً (ANOVA على AUC وCmax المحولتين لوغاريتمياً بعوامل المستحضر والفترة والتسلسل
      والمتطوع)، وفترات الثقة 90%، والبرمجيات المتحقق من صلاحيتها، والقواعد المسبقة للقيم الشاذة، بتفصيل يكفي لإعادة التحليل.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - ANOVA
      - 90%
      - confidence interval
      - log-transformed
      - log transformed
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.22 Statistical analysis
      quote: It is only acceptable to use a validated software for statistical analysis.
- id: EG-EDA/BE-29
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: At least 24 evaluable subjects
    ar: 24 متطوعاً قابلاً للتقييم على الأقل
  question:
    en: >-
      Did at least 24 subjects provide evaluable data for the primary statistical analysis (for a crossover design, or per treatment arm for
      a parallel design), with exclusions documented at the end of clinical sampling and before sample analysis?
    ar: >-
      هل قدم 24 متطوعاً على الأقل بيانات قابلة للتقييم للتحليل الإحصائي الأساسي (للتصميم المتقاطع، أو لكل ذراع علاجية في التصميم المتوازي)،
      مع توثيق الاستبعادات عند نهاية مرحلة السحب السريري وقبل تحليل العينات؟
  applies: 'true'
  severity: critical
  auto:
    kind: none
  deficiency:
    en: >-
      The study is not acceptable with fewer than 24 subjects with evaluable data for the primary statistical analysis; the applicant should
      provide the number of evaluable subjects and the documented exclusion decisions.
    ar: >-
      لا تُقبل الدراسة بأقل من 24 متطوعاً ببيانات قابلة للتقييم للتحليل الإحصائي الأساسي؛ ويجب على مقدم الطلب بيان عدد المتطوعين القابلين
      للتقييم وقرارات الاستبعاد الموثقة.
  action:
    type: edit_data
    target: be
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - evaluable
      - completed
      - subjects
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.22.1 General considerations
      quote: A study will not be considered acceptable if there are fewer than 24 subjects with evaluable data for primary statistical analysis
- id: EG-EDA/BE-30
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: 90% CI within 80-125% for AUC and Cmax
    ar: فترة الثقة 90% ضمن 80-125% لـ AUC وCmax
  question:
    en: >-
      Do the 90% confidence intervals of the test/reference geometric mean ratios for AUC and Cmax lie within 80.00-125.00% (tightened for a
      narrow therapeutic range), with Tmax reported descriptively (non-parametric analysis only where rapid onset is clinically relevant)
      and T1/2 descriptively?
    ar: >-
      هل تقع فترات الثقة 90% لنسب المتوسطات الهندسية (المختبر/المرجعي) لـ AUC وCmax ضمن 80.00-125.00% (مع تضييقها للمدى العلاجي الضيق)، مع
      عرض Tmax وصفياً (وتحليل لا معلمي فقط عندما يكون سرعة بدء التأثير ذا أهمية سريرية) وT1/2 وصفياً؟
  applies: 'true'
  severity: critical
  auto:
    kind: none
  deficiency:
    en: >-
      Bioequivalence is not demonstrated: the 90% confidence interval for AUC and/or Cmax falls outside 80-125%; the applicant should
      provide the statistical summary (Table 3) with least-squares geometric means, ratios and 90% CIs for AUC0-t, AUC0-inf and Cmax.
    ar: >-
      لم يُثبت التكافؤ الحيوي: فترة الثقة 90% لـ AUC و/أو Cmax تقع خارج 80-125%؛ ويجب على مقدم الطلب تقديم الملخص الإحصائي (الجدول 3)
      بالمتوسطات الهندسية بطريقة المربعات الصغرى والنسب وفترات الثقة 90% لـ AUC0-t وAUC0-inf وCmax.
  action:
    type: none
    target: be
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - '80.00'
      - '125.00'
      - 80-125
      - 80 – 125
      - confidence interval
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.23 Acceptance ranges (2.23.1 AUC-ratio, 2.23.2 Cmax-ratio, 2.23.3 Tmax-difference)
      quote: >-
        The 90% confidence interval for this measure of relative bioavailability should lie within a bioequivalence range of 0.80–1.25 (80 –
        125%).
- id: EG-EDA/BE-31
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Report completeness and identity statement
    ar: اكتمال التقرير وإقرار المطابقة
  question:
    en: >-
      Does the signed study report name the investigators, site and study period, give the names, batch numbers, expiry dates and
      composition of the products, include the in vitro dissolution results and a signed statement that the test product is identical to the
      product submitted for registration?
    ar: >-
      هل يذكر تقرير الدراسة الموقع أسماء الباحثين وموقع الدراسة وفترة تنفيذها، وأسماء المستحضرات وأرقام تشغيلاتها وتواريخ انتهائها
      وتركيبتها، ويتضمن نتائج الانحلال المختبري وإقراراً موقعاً بأن المستحضر المختبر مطابق للمستحضر المقدم للتسجيل؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should complete the study report with the investigators' names and signatures, site and period, product names, batch
      numbers, expiry dates and test product composition, the dissolution results, and a signed statement that the test product is identical
      to the product submitted for registration.
    ar: >-
      يجب على مقدم الطلب استكمال تقرير الدراسة بأسماء الباحثين وتوقيعاتهم وموقع الدراسة وفترتها وأسماء المستحضرات وأرقام التشغيلات وتواريخ
      الانتهاء وتركيبة المستحضر المختبر ونتائج الانحلال، وإقرار موقع بأن المستحضر المختبر مطابق للمستحضر المقدم للتسجيل.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - identical
      - signed statement
      - batch number
      - expiry
    data: []
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.24 Reporting of results
      quote: >-
        the applicant should submit a signed statement confirming that the test product is identical to the pharmaceutical product which is
        submitted for registration
- id: EG-EDA/BE-32
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Individual data, plots and listings
    ar: البيانات الفردية والرسوم والقوائم
  question:
    en: >-
      Are all individual concentrations with sampling times tabulated per formulation and per analytical run (including excluded runs with
      their standards and QCs), individual concentration-time curves plotted on linear and log-linear scales, PK parameters tabulated per
      subject with descriptive statistics, and drop-outs accounted for?
    ar: >-
      هل جُدولت جميع التركيزات الفردية مع أوقات السحب لكل مستحضر ولكل تشغيلة تحليلية (بما فيها التشغيلات المستبعدة مع معاييرها وعينات مراقبة
      جودتها)، ورُسمت منحنيات التركيز-الزمن الفردية على مقياسين خطي ولوغاريتمي-خطي، وجُدولت معاملات الحركية الدوائية لكل متطوع مع الإحصاءات
      الوصفية، وأُخذ المنسحبون في الحسبان؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should provide tabulated individual concentrations and sampling times for each formulation and analytical run,
      individual concentration-time plots on linear and log-linear scales, individual and descriptive PK parameters, and the accounting of
      drop-outs and withdrawn subjects.
    ar: >-
      يجب على مقدم الطلب تقديم جداول التركيزات الفردية وأوقات السحب لكل مستحضر وتشغيلة تحليلية، ورسوم التركيز-الزمن الفردية على مقياسين خطي
      ولوغاريتمي-خطي، ومعاملات الحركية الدوائية الفردية والوصفية، وبيان المنسحبين والمستبعدين.
  action:
    type: upload
    target: M5-10
  evidence:
    slots:
      - EG-EDA/M5-04
      - EG-EDA/M5-10
    keywords:
      - individual
      - linear
      - log
      - concentration-time
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.24 Reporting of results
      quote: Individual blood concentration / time curves should be plotted on a linear / linear and log / linear scale.
- id: EG-EDA/BE-33
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.4
  title:
    en: Validation and analytical report contents
    ar: محتوى تقريري التحقق والتحليل
  question:
    en: >-
      Does the validation report include the summary, method and assay details, reference standards, calibration/QC preparation, run
      acceptance criteria, deviations, tables of all runs (passed/failed with reasons), calibration and QC results and stability data, and
      does the analytical report include sample tracking, all runs with results, failed runs, reassays and all chromatograms of the runs
      covering 20% of subjects?
    ar: >-
      هل يتضمن تقرير التحقق الملخص وتفاصيل الطريقة والتحليل والمواد المرجعية وتحضير عينات المعايرة ومراقبة الجودة ومعايير قبول التشغيلة
      والانحرافات وجداول جميع التشغيلات (الناجحة/الفاشلة مع الأسباب) ونتائج المعايرة ومراقبة الجودة وبيانات الثبات، وهل يتضمن التقرير
      التحليلي تتبع العينات وجميع التشغيلات بنتائجها والتشغيلات الفاشلة وإعادة التحاليل وجميع كروماتوجرامات التشغيلات التي تغطي 20% من
      المتطوعين؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should submit a complete bioanalytical validation report and analytical report as listed in sections 2.24.1 and 2.24.2,
      appending all chromatograms from the runs that include 20% of the subjects with their QC samples and calibration standards.
    ar: >-
      يجب على مقدم الطلب تقديم تقرير تحقق حيوي وتقرير تحليلي كاملين وفق القسمين 2.24.1 و2.24.2، مع إرفاق جميع كروماتوجرامات التشغيلات التي
      تشمل 20% من المتطوعين مع عينات مراقبة الجودة ومعايير المعايرة الخاصة بها.
  action:
    type: upload
    target: M5-06
  evidence:
    slots:
      - EG-EDA/M5-06
    keywords:
      - validation report
      - analytical report
      - chromatogram
      - 20%
    data: []
  cite:
    - src: eda-gl-capp-024-v4
      at: 2.24.1 Validation report; 2.24.2 Analytical report
      quote: >-
        all chromatograms from the runs which include 20% of the subjects, including the corresponding QC samples and calibration standards
        should be appended
  anchor_cite:
    - src: ich-m10
- id: EG-EDA/BE-34
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: 'Fixed-dose combination: all actives'
    ar: 'التوليفة ثابتة الجرعة: جميع المواد الفعالة'
  question:
    en: >-
      For a fixed-dose combination, was the generic compared with the pharmaceutically equivalent reference FDC (or justified free
      combination), the bioanalytical method validated for all compounds, sampling adequate for all APIs, and the 90% confidence intervals
      of all active ingredients within the acceptance limits?
    ar: >-
      بالنسبة للتوليفة ثابتة الجرعة، هل قورن المستحضر الجنيس بالتوليفة المرجعية المكافئة صيدلانياً (أو بتوليفة حرة مبررة)، وتم التحقق من
      الطريقة التحليلية الحيوية لجميع المركبات، وكان السحب كافياً لجميع المواد الفعالة، ووقعت فترات الثقة 90% لجميع المواد الفعالة ضمن حدود
      القبول؟
  applies: 'true'
  severity: critical
  auto:
    kind: none
  deficiency:
    en: >-
      The applicant should present the statistical analysis for every active ingredient of the fixed-dose combination with the 90%
      confidence intervals within the acceptance limits, and validation of the bioanalytical method for all measured compounds.
    ar: >-
      يجب على مقدم الطلب عرض التحليل الإحصائي لكل مادة فعالة في التوليفة ثابتة الجرعة مع فترات ثقة 90% ضمن حدود القبول، والتحقق من الطريقة
      التحليلية الحيوية لجميع المركبات المقاسة.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - fixed-dose
      - fixed dose
      - combination
      - all active
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 3.1 Fixed-dose combination products
      quote: the 90% confidence intervals of test / reference ratio of all active ingredients should be within acceptance limits
- id: EG-EDA/BE-35
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: 'Highly variable drug: reference scaling'
    ar: 'الدواء عالي التباين: التوسيع المرجعي'
  question:
    en: >-
      Where widened Cmax limits are claimed for a highly variable drug, was a three-way partial or four-way full replicate design used with
      the approach pre-defined in the protocol, the reference intra-subject CV for Cmax shown to exceed 30% (sWR at or above 0.294) and not
      due to outliers, the limits widened at most to 69.84-143.19%, the Cmax GMR within 80.00-125.00%, and AUC assessed unscaled?
    ar: >-
      عند طلب توسيع حدود Cmax لدواء عالي التباين، هل استُخدم تصميم مكرر جزئي ثلاثي الاتجاه أو كامل رباعي الاتجاه مع تحديد النهج مسبقاً في
      البروتوكول، وأُثبت أن معامل التباين داخل الفرد للمرجع لـ Cmax يتجاوز 30% (sWR عند 0.294 أو أعلى) وليس ناتجاً عن قيم شاذة، ووُسعت
      الحدود بحد أقصى 69.84-143.19%، ووقعت نسبة المتوسط الهندسي لـ Cmax ضمن 80.00-125.00%، وقُيمت AUC دون توسيع؟
  applies: 'true'
  severity: critical
  auto:
    kind: none
  deficiency:
    en: >-
      The applicant should demonstrate from a replicate design that the reference intra-subject variability for Cmax exceeds 30%, apply the
      pre-specified scaled limits not wider than 69.84-143.19% with the Cmax GMR within 80.00-125.00%, and keep the standard 80-125%
      criterion for AUC.
    ar: >-
      يجب على مقدم الطلب الإثبات من تصميم مكرر أن التباين داخل الفرد للمرجع لـ Cmax يتجاوز 30%، وتطبيق الحدود الموسعة المحددة مسبقاً بما لا
      يتجاوز 69.84-143.19% مع نسبة متوسط هندسي لـ Cmax ضمن 80.00-125.00%، والإبقاء على المعيار القياسي 80-125% لـ AUC.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - highly variable
      - reference-scaled
      - reference scaled
      - sWR
      - replicate
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 3.2 Highly variable drugs
      quote: the acceptance criteria for C max can be widened to a maximum of 69.84 –143.19%
- id: EG-EDA/BE-36
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: Narrow therapeutic index limits
    ar: حدود الأدوية ذات المؤشر العلاجي الضيق
  question:
    en: >-
      For a narrow therapeutic index drug, was the AUC acceptance interval tightened to 90.00-111.11% (also for Cmax where it matters for
      safety, efficacy or drug monitoring), or a four-way fully replicated design used with reference-scaled limits capped at 80-125%, the
      unscaled 80-125% also passed and the test/reference within-subject SD ratio upper 90% CI at or below 2.5, with potency specifications
      of 95.0-105.0%?
    ar: >-
      بالنسبة لدواء ذي مؤشر علاجي ضيق، هل ضُيقت فترة القبول لـ AUC إلى 90.00-111.11% (ولـ Cmax أيضاً عند أهميتها للسلامة أو الفعالية أو
      مراقبة مستوى الدواء)، أو استُخدم تصميم مكرر كامل رباعي الاتجاه بحدود موسعة مرجعياً لا تتجاوز 80-125% مع اجتياز حدود 80-125% غير
      الموسعة وكون الحد الأعلى لفترة الثقة 90% لنسبة الانحراف المعياري داخل الفرد بين المختبر والمرجع 2.5 أو أقل، مع مواصفات فاعلية
      95.0-105.0%؟
  applies: 'true'
  severity: critical
  auto:
    kind: none
  deficiency:
    en: >-
      The applicant should apply the NTI acceptance interval of 90.00-111.11% for AUC (and Cmax where relevant) or the four-way replicate
      reference-scaled approach with the variability comparison (upper 90% CI of the SD ratio at or below 2.5), and set assayed potency
      specifications of 95.0-105.0%.
    ar: >-
      يجب على مقدم الطلب تطبيق فترة القبول للأدوية ذات المؤشر العلاجي الضيق 90.00-111.11% لـ AUC (ولـ Cmax عند الاقتضاء) أو نهج التصميم
      المكرر رباعي الاتجاه الموسع مرجعياً مع مقارنة التباين (الحد الأعلى لفترة الثقة 90% لنسبة الانحراف المعياري 2.5 أو أقل)، ووضع مواصفات
      فاعلية معايرة 95.0-105.0%.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
      - EG-EDA/P-09
    keywords:
      - narrow therapeutic
      - NTI
      - '90.00'
      - '111.11'
      - '95.0'
    data:
      - be
      - specs.product
  cite:
    - src: eda-gl-capp-024-v4
      at: 3.3 Narrow therapeutic index drugs
      quote: The acceptance interval for AUC of NTI drugs should be tightened to 90.00 –111.11 %.
- id: EG-EDA/BE-37
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.2
  title:
    en: 'Locally acting products: systemic exposure'
    ar: 'المستحضرات موضعية التأثير: التعرض الجهازي'
  question:
    en: >-
      For a locally applied, locally acting product, is equivalence addressed per the applicable guidance (solution waiver only with the
      same type of solution and concentration and justified excipients), and where systemic exposure carries a risk of systemic adverse
      reactions, is it measured and shown not higher than the reference (upper 90% CI not exceeding 125.00)?
    ar: >-
      بالنسبة لمستحضر موضعي التطبيق والتأثير، هل عولج التكافؤ وفق الإرشادات المنطبقة (الإعفاء للمحاليل فقط بنفس نوع المحلول والتركيز مع
      تبرير السواغات)، وعندما يحمل التعرض الجهازي خطر تفاعلات ضارة جهازية، هل قيس وأُثبت أنه ليس أعلى من المرجع (الحد الأعلى لفترة الثقة 90%
      لا يتجاوز 125.00)؟
  applies: local_action
  severity: major
  auto:
    kind: none
  deficiency:
    en: >-
      The applicant should justify the equivalence approach for the locally acting product and, where systemic exposure entails a risk of
      systemic adverse reactions, measure it and show that the upper limit of the 90% confidence interval does not exceed 125.00.
    ar: >-
      يجب على مقدم الطلب تبرير نهج التكافؤ للمستحضر موضعي التأثير، وعندما ينطوي التعرض الجهازي على خطر تفاعلات ضارة جهازية، قياسه وإثبات أن
      الحد الأعلى لفترة الثقة 90% لا يتجاوز 125.00.
  action:
    type: upload
    target: M5-04
  evidence:
    slots:
      - EG-EDA/M5-04
    keywords:
      - systemic exposure
      - locally acting
      - local action
      - '125.00'
    data:
      - be
  cite:
    - src: eda-gl-capp-024-v4
      at: 3.13 Locally acting locally applied products
      quote: the upper limit of the 90% confidence interval should not exceed the upper bioequivalence acceptance limit 125.00
- id: EG-EDA/BE-38
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.3
  title:
    en: Comparative dissolution test conditions
    ar: ظروف اختبار الانحلال المقارن
  question:
    en: >-
      Were comparative dissolution profiles generated with USP apparatus I or II (basket usually 100 rpm, paddle 50-75 rpm), 900 ml or less
      at 37 plus or minus 1 degrees C, in pH 1.2, 4.5 and 6.8 plus the most suitable FDA/pharmacopoeial medium (two stages only for
      delayed-release), no surfactant, 12 units of each product, sampling at least every 15 minutes including 15 minutes, and a validated
      method?
    ar: >-
      هل أُنشئت منحنيات الانحلال المقارن بجهاز USP الأول أو الثاني (السلة عادة 100 دورة/دقيقة والمجداف 50-75 دورة/دقيقة)، في 900 مل أو أقل
      عند 37 ± 1 درجة مئوية، في أوساط pH 1.2 و4.5 و6.8 إضافة إلى الوسط الأنسب وفق FDA أو دساتير الأدوية (مرحلتان فقط للإطلاق المتأخر)، دون
      مادة خافضة للتوتر السطحي، على 12 وحدة من كل مستحضر، بسحب كل 15 دقيقة على الأقل بما فيها نقطة 15 دقيقة، وبطريقة تحليل متحقق من
      صلاحيتها؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should provide comparative dissolution profiles under the usual conditions (apparatus I or II, 900 ml or less, 37 plus
      or minus 1 degrees C, pH 1.2, 4.5 and 6.8 plus the most suitable medium, no surfactant, 12 units of each product, sampling at least
      every 15 minutes) with a validated analytical method (Table 6).
    ar: >-
      يجب على مقدم الطلب تقديم منحنيات انحلال مقارن بالظروف المعتادة (الجهاز الأول أو الثاني، 900 مل أو أقل، 37 ± 1 درجة مئوية، أوساط pH 1.2
      و4.5 و6.8 إضافة إلى الوسط الأنسب، دون مادة خافضة للتوتر السطحي، 12 وحدة من كل مستحضر، وسحب كل 15 دقيقة على الأقل) بطريقة تحليل متحقق
      من صلاحيتها (الجدول 6).
  action:
    type: upload
    target: M5-05
  evidence:
    slots:
      - EG-EDA/M5-05
    keywords:
      - pH 1.2
      - pH 4.5
      - pH 6.8
      - paddle
      - basket
    data:
      - results
  cite:
    - src: eda-gl-capp-024-v4
      at: 4.2 The usual experimental conditions for in vitro dissolution testing; Section 6 First, rule 4
      quote: 'Number of dosage units: A minimum of 12 dosage units of each product should be evaluated.'
- id: EG-EDA/BE-39
  kind: rule
  authority: EG-EDA
  set: eg-eda-review
  area: be
  layer: eda
  ctd: 5.3.1.3
  title:
    en: Dissolution similarity f2 and f1
    ar: تشابه الانحلال f2 وf1
  question:
    en: >-
      Is similarity shown with f2 of 50 or more (and f1 reported) using at least three identical time points, 12 individual values per
      point, not more than one mean above 85%, CV below 20% at the first point and below 10% thereafter, without omitting early points, or
      justified as very rapidly dissolving (more than 85% in 15 minutes in all media for both products)?
    ar: >-
      هل أُثبت التشابه بقيمة f2 تساوي 50 أو أكثر (مع بيان f1) باستخدام ثلاث نقاط زمنية متطابقة على الأقل، و12 قيمة فردية لكل نقطة، وبما لا
      يزيد عن متوسط واحد أعلى من 85%، ومعامل تباين أقل من 20% عند النقطة الأولى وأقل من 10% بعدها، دون إغفال النقاط المبكرة، أو بُرر كمنتج
      سريع الانحلال جداً (أكثر من 85% خلال 15 دقيقة في جميع الأوساط لكلا المستحضرين)؟
  applies: 'true'
  severity: major
  auto:
    kind: text
  deficiency:
    en: >-
      The applicant should report f2 (and f1) for each medium meeting the conditions of section 4.4 (at least three identical time points,
      12 units, not more than one mean above 85%, CV limits of 20% and 10%), with f2 of 50 or more, or demonstrate that more than 85%
      dissolves within 15 minutes for both products in all media.
    ar: >-
      يجب على مقدم الطلب الإبلاغ عن f2 (وf1) لكل وسط مع استيفاء شروط القسم 4.4 (ثلاث نقاط زمنية متطابقة على الأقل، و12 وحدة، وبما لا يزيد عن
      متوسط واحد أعلى من 85%، وحدود معامل التباين 20% و10%)، بقيمة f2 تساوي 50 أو أكثر، أو إثبات انحلال أكثر من 85% خلال 15 دقيقة لكلا
      المستحضرين في جميع الأوساط.
