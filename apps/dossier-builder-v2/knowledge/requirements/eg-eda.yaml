    nta065_v5: 1.1.9
  ectd:
    - 1.3.1
  title:
    en: 'Leaflet — One Submission: proposed SmPC & PIL (EN + AR, Word) + most updated reference SmPC & PIL'
    ar: النشرة المقترحة عربي وإنجليزي Word + المرجع
  status: in-force
  acceptance: >-
    Word files EN & AR (SmPC & PIL); PDF copy in eCTD + Word in xxxx-workingdocuments; aligned with reference; warnings per pharmacology
    guidelines.
  note: >-
    Rolling: approved valid leaflet. PIL-only imported/innovator: legalised COO letter. Non-English: translation declaration.
    Non-referenced: committee approval
