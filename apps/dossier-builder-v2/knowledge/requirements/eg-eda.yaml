- id: EG-EDA/M1-14
  kind: requirement
  authority: EG-EDA
  set: eg-eda-ctd
  module: 1
  group: MODULE 1 — Administrative (NP.CAPP.065 v5, 01/11/2025)
  ctd: 1.1.13
  numbers:
    nta065_v5: 1.1.13
  ectd:
    - 1.2.6.1
  title:
    en: CPP / eCPP from competent authority in COO
    ar: شهادة CPP
  status: in-force
  acceptance: >-
    Valid; COO; Egypt named as importing country; date; trade name; forms & strengths; licence holder address; marketed ≥1 year in COO (or
    explained); actives as salt/hydrate with qty; inactives with qty; capsule shell for capsules; Egyptian name noted or separate legalised
    declaration; signed/stamped by chamber/notary/foreign affairs + legalised by Egyptian Embassy (eCPP exempt).
  note: 'Local: only under-licence products. eCPP accepted without legalisation if company provides a verification method'
  matrix:
    I: R
    G_IMP: R
    G_LOC: R
  applies: column != 'G_LOC' or licence == 'under_licence'
  doc_class: third_party_certificate
  produced_by: Third party
  rebuild:
    verdict: No — re-obtain
    needs: 'Re-obtain from competent authority. Tool: placement only. (Hard copy also required — EG draft §2.7.)'
  required:
    I: R
    G_IMP: R
    G_LOC: R
  logic_note: checklist condition column
  cite:
    - src: eda-np-capp-065-v5
      at: 1.1.13
