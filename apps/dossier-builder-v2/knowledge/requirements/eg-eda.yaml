- id: EG-EDA/M1-09
  kind: requirement
  authority: EG-EDA
  set: eg-eda-ctd
  module: 1
  group: MODULE 1 — Administrative (NP.CAPP.065 v5, 01/11/2025)
  ctd: 1.1.9
