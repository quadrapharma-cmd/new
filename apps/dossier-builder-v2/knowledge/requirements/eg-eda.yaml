- id: EG-EDA/M5-04
  kind: requirement
  authority: EG-EDA
  set: eg-eda-ctd
  module: 5
  group: 'MODULE 5 — Clinical (generics: partial)'
  ctd: 5.3.1.2
  numbers:
    nta065_v5: 5.3.1.2
  ectd:
    - 5.3.1.2
  title:
    en: Comparative BA & BE study reports
    ar: تقرير دراسة التكافؤ الحيوي
  status: in-force
  acceptance: PDF searchable; node extension per study (EG draft §3.6.2).
  matrix:
    I: R
    G_IMP: R
    G_LOC: R
  applies: 'true'
  doc_class: company_technical
  produced_by: Company
  rebuild:
    verdict: No — re-obtain
    needs: CRO report per GL.CAPP.024 v4 (effective 01/07/2026); node extension per study.
  required:
    I: R
    G_IMP:
      cases:
        - when: biowaiver != ''
          level: R
          reason:
            en: >-
              No equivalence study: the product is exempt (aqueous solution / BCS). This slot holds the exemption justification (same API
              and molar concentration, same or similar excipients; BCS data where claimed) instead of a BE report.
            ar: >-
              مفيش دراسة تكافؤ مطلوبة: المستحضر معفي (محلول مائي / BCS). البند ده بيتحط فيه مبرر الإعفاء (نفس المادة الفعالة بنفس التركيز،
              ومواد مضافة مماثلة، وبيانات BCS لو مطلوبة) بدل تقرير الدراسة.
          cite:
            - src: eda-gl-capp-024-v4
              at: §2.2 p.25 (aqueous solutions, powders for solution, gases) and §4.5.1 p.119-121 (BCS I, III, II weak acids)
        - when: local_equivalence
          level: R
          reason:
            en: >-
              Locally acting product that is not a solution: no exemption. Equivalence must be shown by comparative clinical,
              pharmacodynamic, skin-PK or in-vitro data instead of a plasma BE study; measure systemic exposure if it carries a systemic
              risk.
            ar: >-
              مستحضر موضعي التأثير ومش محلول: مفيش إعفاء. لازم إثبات التكافؤ بدراسة إكلينيكية مقارنة، أو دراسة ديناميكية، أو قياس في الجلد،
              أو اختبارات معملية مقارنة، بدل دراسة التكافؤ في البلازما. ولو فيه خطر امتصاص للجسم، لازم يتقاس.
          cite:
            - src: eda-gl-capp-024-v4
              at: §3.13 p.111-112
        - level: R
    G_LOC:
      cases:
        - when: biowaiver != ''
          level: R
          reason:
            en: >-
              No equivalence study: the product is exempt (aqueous solution / BCS). This slot holds the exemption justification (same API
              and molar concentration, same or similar excipients; BCS data where claimed) instead of a BE report.
            ar: >-
              مفيش دراسة تكافؤ مطلوبة: المستحضر معفي (محلول مائي / BCS). البند ده بيتحط فيه مبرر الإعفاء (نفس المادة الفعالة بنفس التركيز،
              ومواد مضافة مماثلة، وبيانات BCS لو مطلوبة) بدل تقرير الدراسة.
          cite:
            - src: eda-gl-capp-024-v4
              at: §2.2 p.25 (aqueous solutions, powders for solution, gases) and §4.5.1 p.119-121 (BCS I, III, II weak acids)
        - when: local_equivalence
          level: R
          reason:
            en: >-
              Locally acting product that is not a solution: no exemption. Equivalence must be shown by comparative clinical,
              pharmacodynamic, skin-PK or in-vitro data instead of a plasma BE study; measure systemic exposure if it carries a systemic
              risk.
            ar: >-
              مستحضر موضعي التأثير ومش محلول: مفيش إعفاء. لازم إثبات التكافؤ بدراسة إكلينيكية مقارنة، أو دراسة ديناميكية، أو قياس في الجلد،
              أو اختبارات معملية مقارنة، بدل دراسة التكافؤ في البلازما. ولو فيه خطر امتصاص للجسم، لازم يتقاس.
          cite:
            - src: eda-gl-capp-024-v4
              at: §3.13 p.111-112
        - level: R
  cite:
    - src: eda-np-capp-065-v5
      at: M5
