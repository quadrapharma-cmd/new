    I: R
    G_IMP: R
    G_LOC: R
  applies: 'true'
  doc_class: company_technical
  produced_by: Company
  rebuild:
    verdict: Partly
    needs: >-
      Reference SmPC/PIL text + product data → tool drafts EN/AR SmPC & PIL in standard section order; medical translation review by company
      required.
  required:
    I: R
    G_IMP: R
    G_LOC: R
  cite:
    - src: eda-np-capp-065-v5
      at: 1.1.9
