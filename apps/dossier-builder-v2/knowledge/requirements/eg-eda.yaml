- id: EG-EDA/M1-01
  kind: requirement
  authority: EG-EDA
  set: eg-eda-ctd
  module: 1
  group: MODULE 1 — Administrative (NP.CAPP.065 v5, 01/11/2025)
  ctd: 1.1.1
  numbers:
    nta065_v5: 1.1.1
  ectd:
    - 1.2.1
  title:
    en: Application form (Annex I) + Arabic undertaking
    ar: نموذج الطلب + التعهد
  status: in-force
  acceptance: >-
    All Annex I fields filled; one API box per API; manufacturer address as on GMP; variations table (re-reg); signed by
    chairman/MD/authorised signatory; company stamp; dated. eCTD: file form-af.pdf, operation 'new'.
  note: Annex I fields; undertaking per decree case (3-year/5-year transfer clause)
  matrix:
    I: R
    G_IMP: R
    G_LOC: R
  applies: 'true'
  doc_class: generated
  produced_by: Company
  rebuild:
    verdict: Yes — rebuild
    needs: >-
      Product/Application/Parties sheets + APIs sheet + list of variations (re-reg) + signatory. Output: print on company letterhead → sign
      → stamp → scan.
  required:
    I: R
    G_IMP: R
    G_LOC: R
  cite:
    - src: eda-np-capp-065-v5
      at: Annex I
    - src: eda-eg-m1-ectd-spec-draft-v1
      at: §3.2.4.1
  ectd_cite:
    - src: eda-eg-m1-ectd-spec-draft-v1
      at: App. 2
      status: draft
