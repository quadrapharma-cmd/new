- id: GCC/GCC-1.7.10
  kind: requirement
  authority: GCC
  set: gcc-m1
  module: 1
  group: MODULE 1 — Regional administrative information (GCC)
  ctd: 1.7.10
  ectd:
    - 1.7.10
  title:
    en: Letter of access or acknowledgment to the DMF / CEP
    ar: خطاب الإتاحة لملف المادة الفعالة (DMF) / شهادة الـ CEP
  status: in-force
  acceptance: >-
    DMF: a letter from the DMF owner or authorized agent permitting the authority to refer to the DMF for the applicant — name of the
    holder; version number and date of the applicant's part and of the restricted part; a letter that the DMF remains current if unchanged
    for five years; whether the restricted part was sent to the authority. CEP: the valid certificate with its annexes, the declaration of
    access filled in by the holder, and a written assurance that no significant change in the manufacturing method took place since it was
    granted or last revised.
  note: One per active substance filed through a DMF or a CEP.
  applies: 'true'
  doc_class: third_party_certificate
  produced_by: Third party
  per:
    over: apis
    where: option == 'DMF' or option == 'CEP'
  kinds:
    - loa
    - cep
  required:
    I: R
    G_IMP: R
    G_LOC: R
  cite:
    - src: sfda-data-requirements-v4
      at: §1.7.10
  ectd_cite:
    - src: gcc-m1-spec-v15
      at: Appendix 2
      status: in-force
