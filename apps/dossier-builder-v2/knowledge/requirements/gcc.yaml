- id: GCC/GCC-1.7.2
  kind: requirement
  authority: GCC
  set: gcc-m1
  module: 1
  group: MODULE 1 — Regional administrative information (GCC)
  ctd: 1.7.2
  ectd:
    - 1.7.2
  title:
    en: CPP or free-sales certificate
    ar: شهادة المستحضر الصيدلي (CPP) أو البيع الحر
  status: in-force
  acceptance: >-
    CPP per the WHO format. If there is none: a marketing authorization or free-sales certificate from the country of origin giving the
    trade name there, the number and date of the authorization, the active and inactive substances with their concentrations, a statement
    that the product is marketed there (or the reason it is not, with an authorization from a reference country), proof of at least one year
    of registration there, the SPC and the leaflet.
  applies: 'true'
  doc_class: third_party_certificate
  produced_by: Third party
  kinds:
    - cpp
  required:
    I:
      cases:
        - when: gcc_agency == 'SA'
          level: O
          reason:
            en: >-
              SFDA: the CPP / free-sales certificate is optional and no longer required for new marketing authorization applications in any
              pathway; SFDA may still ask for it at any time.
            ar: 'السعودية: شهادة الـ CPP / البيع الحر اختيارية ومش مطلوبة لطلبات التسجيل الجديدة في أي مسار؛ والهيئة ممكن تطلبها في أي وقت.'
          cite:
            - src: sfda-data-requirements-v4
              at: §1.7.2
        - level: R
          note:
            en: >-
              Outside Saudi Arabia the certificate is taken as required for an imported product: the other GCC authorities' own texts were
              not read for this pack — confirm with the authority.
            ar: 'برّه السعودية الشهادة محسوبة مطلوبة للمستحضر المستورد: نصوص باقي هيئات الخليج ما اتقرتش للملف ده — راجع مع الهيئة.'
    G_IMP:
      cases:
        - when: gcc_agency == 'SA'
          level: O
          reason:
            en: >-
              SFDA: the CPP / free-sales certificate is optional and no longer required for new marketing authorization applications in any
              pathway; SFDA may still ask for it at any time.
            ar: 'السعودية: شهادة الـ CPP / البيع الحر اختيارية ومش مطلوبة لطلبات التسجيل الجديدة في أي مسار؛ والهيئة ممكن تطلبها في أي وقت.'
          cite:
            - src: sfda-data-requirements-v4
              at: §1.7.2
        - level: R
          note:
            en: >-
              Outside Saudi Arabia the certificate is taken as required for an imported product: the other GCC authorities' own texts were
              not read for this pack — confirm with the authority.
            ar: 'برّه السعودية الشهادة محسوبة مطلوبة للمستحضر المستورد: نصوص باقي هيئات الخليج ما اتقرتش للملف ده — راجع مع الهيئة.'
    G_LOC: NR
  cite:
    - src: sfda-data-requirements-v4
      at: §1.7.2
  ectd_cite:
    - src: gcc-m1-spec-v15
      at: Appendix 2
      status: in-force
