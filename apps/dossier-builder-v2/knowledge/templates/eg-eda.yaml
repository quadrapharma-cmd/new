        en: >-
          Product development rationale, biopharmaceutics, clinical pharmacology, efficacy, safety, benefit–risk conclusions, literature
          references.
        ar: منطق التطوير، البيوصيدلانيات، الفارماكولوجي السريري، الفعالية، السلامة، خلاصة الفائدة–الخطر، المراجع.
    - id: s7
