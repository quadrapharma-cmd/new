        en: >-
          2.3.S Drug substance (per API: general information, manufacture, characterisation, control, reference standards, container,
          stability)
        ar: 2.3.S المادة الفعالة
      kind: list
      source: apis
    - id: p
      title:
        en: >-
          2.3.P Drug product (description and composition, development, manufacture, excipients, control, reference standards, container,
          stability)
        ar: 2.3.P المستحضر
      kind: list
      source: composition
    - id: tables
      title:
        en: QOS-PD summary tables
        ar: جداول QOS-PD
      kind: table
      columns:
        - Table
        - Content
        - Cross-reference to Module 3
      source: specs
    - id: a_r
      title:
        en: 2.3.A appendices and 2.3.R regional information
        ar: 2.3.A و2.3.R
      kind: para
  example:
    en: >-
      Quality Overall Summary following Module 3 section by section (2.3.S, 2.3.P, 2.3.A, 2.3.R) with cross-references; the WHO QOS-PD
      tables are the model; one QOS per ASMF with a dated front page.
    ar: >-
      ملخص الجودة الشامل متتبعًا Module 3 قسمًا قسمًا (2.3.S، 2.3.P، 2.3.A، 2.3.R) مع الإحالات؛ جداول WHO QOS-PD هي النموذج؛ QOS واحد لكل
      ASMF بصفحة غلاف مؤرَّخة.
  note:
    en: The program builds the structure and the tables from the product data; the narrative is reviewed by the company.
    ar: البرنامج يبني الهيكل والجداول من بيانات المنتج؛ السرد تراجعه الشركة.
