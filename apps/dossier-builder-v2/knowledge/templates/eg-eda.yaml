- id: M1-09
  kind: leaflet
  draft: full
  lang: both
  inputs:
    - leaflet
    - registration_licence
    - analysis_conformity
  sections:
    - id: smpc
      title:
        en: SmPC sections 1–10
        ar: أقسام الـ SmPC 1–10
      kind: list
      hint:
        en: >-
          Name; qualitative and quantitative composition; pharmaceutical form; clinical particulars 4.1–4.9; pharmacological properties
          5.1–5.3; pharmaceutical particulars 6.1–6.6; MAH; MA number; dates. Text from the reference SmPC adapted to this product
          (strengths, excipients, pack, MAH); warnings per EDA pharmacology guidelines.
        ar: >-
          الاسم؛ التركيب النوعي والكمي؛ الشكل الصيدلي؛ البيانات السريرية 4.1–4.9؛ الخواص الدوائية 5.1–5.3؛ البيانات الصيدلية 6.1–6.6؛ مالك
          الترخيص؛ رقم الترخيص؛ التواريخ. النص من الـ SmPC المرجعي مع تعديله لهذا المستحضر (التراكيز، السواغات، العبوة، المالك)؛ التحذيرات
          حسب إرشادات الفارماكولوجي بالهيئة.
    - id: pil
      title:
        en: PIL sections 1–6 (EN + AR)
        ar: النشرة الداخلية 1–6 (عربي + إنجليزي)
      kind: list
      hint:
        en: >-
          What X is and what it is used for; before you take; how to take; possible side effects; how to store; contents of the pack and
          other information. Arabic by an authorised medical translation (company review required).
        ar: >-
          ما هو X وفيم يُستخدم؛ قبل الاستخدام؛ طريقة الاستخدام؛ الآثار الجانبية؛ التخزين؛ محتويات العبوة ومعلومات أخرى. العربية بترجمة طبية
          معتمدة (مراجعة الشركة مطلوبة).
    - id: alignment
      title:
        en: Alignment with the reference
        ar: المطابقة مع المرجع
      kind: table
      columns:
        - Section
        - Reference text (version/date)
        - Proposed text
        - Difference and reason
  example:
    en: >-
      Proposed SmPC and PIL in English and Arabic as Word files, in the standard section order, aligned with the latest reference SmPC/PIL;
      a PDF copy goes in the eCTD and the Word files in the working documents.
    ar: >-
      الـ SmPC والنشرة المقترحتان عربي وإنجليزي Word، بترتيب الأقسام القياسي، مطابقتان لآخر نشرة مرجعية؛ نسخة PDF في الـ eCTD وملفات Word في
      مستندات العمل.
- id: M1-10
  kind: declaration
  draft: generator
  lang: both
  letterhead: true
  generator: translation
  inputs:
    - leaflet
  example:
    en: >-
      On company letterhead: date, addressed to EDA, subject with trade name / form / strength, the statement itself, product
      identification, signature of the authorised person with title, company stamp.
    ar: >-
      على ورق الشركة: التاريخ، موجَّه لهيئة الدواء، الموضوع بالاسم التجاري / الشكل / التركيز، نص الإقرار، بيانات المستحضر، توقيع المفوَّض
      ووظيفته، ختم الشركة.
- id: M1-11
  kind: artwork
  draft: partial
  lang: both
  inputs:
    - leaflet
    - registration_licence
    - pricing_certificate
  sections:
    - id: outer
      title:
        en: Outer pack mandatory texts
        ar: نصوص العبوة الخارجية الإلزامية
      kind: list
      hint:
        en: >-
          Trade name, strength, form, actives with quantities, pack size, route, storage, batch/expiry fields, registration number,
          manufacturer and licence holder, price field, warnings (Rx, keep out of reach of children), Arabic texts.
        ar: >-
          الاسم التجاري، التركيز، الشكل، المواد الفعالة بكمياتها، حجم العبوة، طريقة الاستخدام، التخزين، خانات التشغيلة والصلاحية، رقم
          التسجيل، المصنّع ومالك الترخيص، خانة السعر، التحذيرات، النصوص العربية.
    - id: inner
      title:
        en: Inner / blister texts
        ar: نصوص العبوة الداخلية / الشريط
      kind: list
    - id: check
      title:
        en: Check against Annex I data
        ar: مطابقة بيانات Annex I
      kind: table
      columns:
        - Text on artwork
        - Annex I / licence value
        - Match
      source: product
  example:
    en: >-
      Coloured, stamped outer and inner artwork (editable PDF preferred) carrying the mandatory texts; the compendial monograph when
      applicable; an image of the original pack for imported / under-licence products.
    ar: >-
      تصميم ملون مختوم للعبوة الخارجية والداخلية (PDF قابل للتعديل) يحمل النصوص الإلزامية؛ المونوجراف الدستوري عند الانطباق؛ صورة العبوة
      الأصلية للمستورد / تحت الترخيص.
