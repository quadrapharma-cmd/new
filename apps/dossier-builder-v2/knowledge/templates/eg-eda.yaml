- id: M1-24
  kind: contract
  draft: partial
  lang: en
  inputs:
    - manufacturing_contract
    - toll_card
    - commercial_register
  sections:
    - id: parties
      title:
        en: Parties
        ar: الأطراف
      kind: table
      columns:
        - Party
        - Role
        - Address
        - Licence / register no.
      source: manufacturers
    - id: scope
      title:
        en: Scope and products
        ar: النطاق والمستحضرات
      kind: para
    - id: duties
      title:
        en: Responsibilities (GMP, QC release, complaints, recalls, documentation, audits, changes)
        ar: المسؤوليات (GMP، الإفراج، الشكاوى، الاسترجاع، التوثيق، التفتيش، التغييرات)
      kind: list
    - id: term
      title:
        en: Term, termination, confidentiality, governing law
        ar: المدة والإنهاء والسرية والقانون
      kind: para
    - id: signature
      title:
        en: Signature block
        ar: التوقيع والختم
      kind: fields
      hint:
        en: Authorised signatory name and title, company name, stamp; printed on company letterhead, signed, stamped, dated, then scanned.
        ar: اسم المفوَّض بالتوقيع ووظيفته، اسم الشركة، الختم؛ يُطبع على ورق الشركة ويُوقَّع ويُختم ويُؤرَّخ ثم يُمسح.
      fields:
        - key: signatory
          label:
            en: Signatory
            ar: المفوَّض بالتوقيع
        - key: signatory_title
          label:
            en: Title
            ar: الوظيفة
        - key: company
          label:
            en: Company
            ar: الشركة
  example:
    en: >-
      Original agreement (manufacturing / storage / packaging / agency) authenticated or legalised as the requirement states (bank, EDA
      legal affairs, chamber + embassy for imported).
    ar: >-
      العقد الأصلي (تصنيع / تخزين / تعبئة / توكيل) موثَّق أو مصدَّق كما ينص المتطلب (بنك، الشؤون القانونية بالهيئة، الغرفة + السفارة
      للمستورد).
  note:
    en: An unsigned draft for negotiation only; the signed agreement must be authenticated again.
    ar: مسودة غير موقَّعة للتفاوض فقط؛ العقد الموقَّع لازم يتوثَّق من جديد.
