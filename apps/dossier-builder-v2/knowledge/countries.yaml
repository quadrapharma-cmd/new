    authority: EMA and the national competent authorities (EU/EEA)
    formats:
      ctd: 'no'
      ectd32: 'yes'
      ectd40: optional
      nees: 'no'
      actd: 'no'
    module1: EU Module 1 v3.1.1
    criteria: EU eCTD validation criteria v8.2 (June 2025)
    note: >-
      eCTD is mandatory for all regulatory submissions in all procedure types; a dossier handled before as paper or NeeS moves to eCTD at
      its next submission. eCTD 4.0 is optional for new centralised applications (EMA roadmap).
    evidence: official
    note_source: docs/ctd/sources/ectd/EU_Harmonised_Technical_Guidance_eCTD_v6.0.1.pdf (p. 6, 9); EU_M1_Specification_v3.1.1_2025.pdf
    cite:
      - src: eu-htg-v601
        at: p. 6, 9
      - src: eu-m1-spec-v311
  - id: country/US
    kind: country
    code: US
    authority: FDA (CDER, CBER)
    formats:
      ctd: 'no'
      ectd32: 'yes'
      ectd40: optional
      nees: 'no'
      actd: 'no'
    module1: US Module 1 (eCTD Backbone Files Specification for Module 1 v2.6, us-regional DTD 3.3)
    criteria: FDA Specifications for eCTD Validation Criteria
    note: >-
      Study tagging files are required for the studies of Modules 4 and 5. eCTD 4.0 accepted for new applications (FDA eCTD v4.0 page); no
      mandatory date for it.
    evidence: official
    note_source: fda.gov — eCTD Submission Standards for eCTD v3.2.2 and Regional M1 (read 13/11/2026); ICH STF specification v2.6.1 p. 3
    cite:
      - src: fda-ectd-submission-standards
      - src: ich-ectd-stf-v261
        at: p. 3
