    authority: GCC / SFDA and the Gulf authorities
    formats:
      ctd: 'yes'
      ectd32: 'yes'
      ectd40: 'no'
      nees: 'yes'
      actd: 'no'
    module1: GCC Module 1 Specifications v1.5 (SFDA, November 2015), DTD gc-regional 1.1
    criteria: none published with the specification — the program checks its DTD and structure
    note: >-
      The program writes the GCC eCTD (gc-regional.xml, one envelope per state with its agency, the folders and names of the specification's
      Appendix 2), the CTD folders and a NeeS. A newer SFDA specification (2.x, 2025) is reported by secondary sources; the one read here is
      v1.5.
    evidence: official
    note_source: docs/ctd/sources/ectd/SFDA_GCC_Module1_Specifications_v1.5_2015.pdf (Appendices 1, 2, 5, 6)
    cite:
