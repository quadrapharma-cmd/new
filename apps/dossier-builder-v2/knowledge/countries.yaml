# What each country or region takes (formats, Module 1, validation criteria).
# Ported from the old program (rulepacks/countries.yaml); edit here from now on.
reviewed: '2026-11-13'
countries:
  - id: country/EG
    kind: country
    code: EG
    authority: EDA (Egyptian Drug Authority)
    formats:
      ctd: 'yes'
      ectd32: planned
      ectd40: planned
      nees: 'no'
      actd: 'no'
    module1: CTD per NP.CAPP.065 v5 (in force); EG eCTD Module 1 specification draft v1.0 (2026)
    criteria: none published — the program's provisional EG profile
    note: >-
      The draft eCTD technical guidance makes eCTD mandatory for all submissions, through the EDA portal, with a baseline when a product
      moves from paper or a non-eCTD submission. No date in the drafts; the CTD One Submission is what is filed today. NP.CAPP.065 v6 (draft
      2026) renumbers Module 1 as the eCTD does (docs/ctd/NP065-v6-REVIEW.md).
    evidence: official-draft
    note_source: docs/ctd/sources/EDA_eCTD-technical-guidance_DRAFT_v1_2026.pdf (l. 165–166, 241–243, 597); EDA_NP.CAPP.065_v5_2025
    cite:
      - src: eda-ectd-technical-guidance-draft-v1
        at: lines 165–166, 241–243, 597
      - src: eda-np-capp-065-v5
