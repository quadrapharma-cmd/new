        quote: a) Minor change in the manufacturing process of the active substance
      - src: eda-variation-tool
        at: Human, ID 8
    guideline:
      section: 3.2.1.2
      heading: Changes in the manufacturing process of the active substance
      item: a) Minor change in the manufacturing process of the active substance
      pac: PAC-A
      classes:
        - item: a) Minor change in the manufacturing process of the active substance
          pac: PAC-A
        - item: >-
            b) Substantial change to the manufacturing process of the active substance which may have a significant impact on the quality,
            safety or efficacy of the medicinal product
          pac: PAC-II
        - item: c) Minor change to the restricted part of an Active Substance Master File
          pac: PAC-B
        - item: d) Deletion of a manufacturing process
          pac: PAC-A
    check:
      verdict: split
      note:
        en: >-
          EDA's tool gives one class (PAC-A) for what the guideline splits into 4 items with their own classes; the class depends on the
          case.
        ar: أداة الهيئة بتدي فئة واحدة (PAC-A) لحاجة الإرشاد بيقسمها 4 بنود، كل بند بفئته؛ الفئة على حسب الحالة.
  - id: EG-EDA/var/H-09
    kind: variation
    authority: EG-EDA
    set: eg-eda-variations
    title:
      en: Change in batch size of active substance.
      ar: null
    group: Drug Substance
    type: Batch size
    pac: PAC-A
    conditions:
      - >-
        Any changes to the manufacturing methods are only those necessitated by scale-up or downscaling, e.g. use of different-sized
        equipment.
      - Test results of at least two batches according to the specifications should be available for the proposed batch size.
      - The change does not adversely affect the reproducibility of the process.
      - The change should not be the result of unexpected events arising during manufacture or because of stability concerns.
      - The specifications of the active substance remain the same.
    requirements: []
    cite:
      - src: eda-gl-capp-026-v6
        at: §3.2.1.3 a)
        quote: a) An increase to the originally approved batch size
      - src: eda-variation-tool
        at: Human, ID 9
    guideline:
      section: 3.2.1.3
      heading: >-
        Change in batch size (including batch size ranges) of active substance or intermediate used in the manufacturing process of the
        active substance
      item: a) An increase to the originally approved batch size
      pac: PAC-A
    check:
      verdict: agrees
  - id: EG-EDA/var/H-10
    kind: variation
    authority: EG-EDA
    set: eg-eda-variations
    title:
      en: Change to in-process tests or limits applied during the manufacture of an active substance
      ar: null
    group: Drug Substance
    type: Manufacturing process
    pac: PAC-A
    conditions:
      - >-
        The change does not result from unexpected events arising during manufacture, e.g. new unqualified impurity; change in total
        impurity limits
      - Any change should be within the range of currently approved limits.
      - The test procedure remains the same, or changes in the test procedure are minor.
      - >-
        The specification parameter does not concern a critical parameter for example any of the following: assay, impurities (unless a
        particular solvent is definitely not used in the manufacture of the active substance), any critical physical characteristics, e.g.
        particle size, bulk or tapped density, identity test, water, any request for changing the frequency of testing (In case of deletion
        of any in-process tests).
    requirements: []
    cite:
      - src: eda-gl-capp-026-v6
        at: §3.2.1.4 a)
        quote: a) Minor change of in-process control limits
      - src: eda-variation-tool
        at: Human, ID 10
    guideline:
      section: 3.2.1.4
      heading: Change to in-process tests or limits applied during the manufacture of the active substance
      item: a) Minor change of in-process control limits
      pac: PAC-A
      classes:
        - item: a) Minor change of in-process control limits
          pac: PAC-A
        - item: b) Addition of new in-process control and limits with its corresponding analytical procedure
          pac: PAC-A
        - item: c) Deletion of a non-significant or obsolete in- process control
          pac: PAC-A
        - item: >-
            d) Widening of the approved in-process control limits, which may have a significant effect on the overall quality of the active
            substance
          pac: PAC-II
        - item: e) Deletion of an in-process test which may have a significant effect on the overall quality of the active substance
          pac: PAC-II
        - item: f) Replacement of an in-process control with its corresponding analytical procedure
          pac: PAC-B
    check:
      verdict: split
      note:
        en: >-
          EDA's tool gives one class (PAC-A) for what the guideline splits into 6 items with their own classes; the class depends on the
          case.
        ar: أداة الهيئة بتدي فئة واحدة (PAC-A) لحاجة الإرشاد بيقسمها 6 بنود، كل بند بفئته؛ الفئة على حسب الحالة.
