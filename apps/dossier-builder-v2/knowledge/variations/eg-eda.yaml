  - id: EG-EDA/var/H-03
    kind: variation
    authority: EG-EDA
    set: eg-eda-variations
    title:
      en: Deletion of manufacturing sites for an active substance.
      ar: null
    group: Drug Substance
    type: Administrative
    pac: PAC-A
    conditions:
      - >-
        There should at least remain one site/manufacturer, as previously authorized, performing the same function as the one(s) concerned
        by the deletion.
    requirements: []
    cite:
      - src: eda-gl-capp-026-v6
        at: §3.1.4 a)
        quote: >-
          Deletion of manufacturing sites for an active substance, intermediate or finished product, packaging site, manufacturer
          responsible for batch release, site where batch control takes place, or storage site of finished product · a) Active Substances
      - src: eda-variation-tool
        at: Human, ID 3
    guideline:
      section: 3.1.4
      heading: >-
        Deletion of manufacturing sites for an active substance, intermediate or finished product, packaging site, manufacturer responsible
        for batch release, site where batch control takes place, or storage site of finished product
      item: a) Active Substances
      pac: PAC-A
    check:
      verdict: agrees
  - id: EG-EDA/var/H-04
    kind: variation
    authority: EG-EDA
    set: eg-eda-variations
    title:
      en: >-
        Introduction of a new manufacturer for Starting material/reagent/intermediate used in the manufacturing process of the active
        substance.
      ar: null
    group: Drug Substance
    type: Manufacturing site
    pac: PAC-N
    conditions:
      - No adverse change in qualitative and quantitative impurity profile or in physico-chemical properties
      - The specifications of the active substance are unchanged.
      - The particle size specification of the active substance and the corresponding analytical method remain the same.
    requirements: []
    cite:
      - src: eda-gl-capp-026-v6
        at: §3.2.1.1 A)
        quote: >-
          A) Starting material/reagent/intermediate used in the manufacturing process of the active substance. 1- Addition or Replacement of
          a new manufacturer.
      - src: eda-variation-tool
        at: Human, ID 4
    guideline:
      section: 3.2.1.1
      heading: Change in the manufacturer
      item: >-
        A) Starting material/reagent/intermediate used in the manufacturing process of the active substance. 1- Addition or Replacement of a
        new manufacturer.
      pac: PAC-N
    pac_tool: PAC-A
    check:
      verdict: differs
      note:
        en: >-
          EDA's variation tool says PAC-A; the guideline GL.CAPP.026 v6 (in force from 1/1/2026) says PAC-N. The guideline is the rule —
          confirm with EDA before filing.
        ar: >-
          أداة الهيئة للتغييرات بتقول PAC-A، والإرشاد GL.CAPP.026 الإصدار 6 (ساري من 1/1/2026) بيقول PAC-N. الإرشاد هو المرجع — اتأكد مع
          الهيئة قبل التقديم.
  - id: EG-EDA/var/H-05
    kind: variation
    authority: EG-EDA
    set: eg-eda-variations
    title:
      en: Introduction of a new manufacturer for Active Substance.
      ar: null
    group: Drug Substance
    type: Manufacturing site
    pac: PAC-II
    conditions: []
    requirements:
      - Amendment of the relevant section(s) of the dossier concerning the change for the prequalified quality products
      - Analysis of the first production batch of Finished Pharmaceutical product manufactured from the API manufacturer at CADC labs.
      - >-
        Results of stability testing generated with a minimum of 6 months Accelerated testing, and to be released to the market by Central
        Administration of Operation (Inspection Department) after evaluating the results of a minimum of 3 months of the first production
        batch of Finished Pharmaceutical product manufactured with the new API manufacturer.
      - >-
        Comparative in-vitro dissolution study at most suitable medium on first production batch of Finished Pharmaceutical product
        manufactured from the new API manufacturer against the innovator product. (Or may be changed to 3 different PH media in addition to
        the most suitable medium or Bioequivalence study according to category of API & its BCs Class).
    cite:
      - src: eda-gl-capp-026-v6
        at: §3.2.1.1 B)
        quote: B) The Active Substance. 1- Addition or Replacement of a new manufacturer.
      - src: eda-variation-tool
        at: Human, ID 5
    guideline:
      section: 3.2.1.1
      heading: Change in the manufacturer
      item: B) The Active Substance. 1- Addition or Replacement of a new manufacturer.
      pac: PAC-II
    check:
      verdict: agrees
