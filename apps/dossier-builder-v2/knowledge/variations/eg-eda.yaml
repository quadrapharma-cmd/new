    title:
      en: Changes in the manufacturing process of an active substance.
      ar: null
    group: Drug Substance
    type: Manufacturing process
    pac: PAC-A
    conditions:
      - No adverse change in qualitative and quantitative impurity profile or in physico-chemical properties.
      - The specifications of the active substance are unchanged.
    requirements: []
    cite:
      - src: eda-gl-capp-026-v6
