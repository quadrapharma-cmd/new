# EDA human variations — classes, conditions, requirements
# Ported from the old program (rulepacks/eda.variations.gl026.v6); edit here from now on.
class_order:
  - PAC-N
  - PAC-A
  - PAC-B
  - PAC-II
ectd_submission_type:
  PAC-N: var-pac-n
  PAC-A: var-pac-a
  PAC-B: var-pac-b
  PAC-II: var-pac-ii
grouping_rule:
  en: A group of variations is classified by its highest class.
  ar: مجموعة التغييرات بتتصنف بأعلى فئة فيها.
  cite:
    - src: eda-gl-capp-026-v6
variations:
  - id: EG-EDA/var/H-01
    kind: variation
    authority: EG-EDA
    set: eg-eda-variations
    title:
      en: Change in the name and/or address of Manufacturer of the active substance (API).
      ar: null
    group: Drug Substance
    type: Administrative
    pac: PAC-N
    conditions:
      - The manufacturing site and all manufacturing operations must remain the same.
    requirements: []
    cite:
      - src: eda-gl-capp-026-v6
        at: §3.1.3 a)
        quote: a) Manufacturer of the active substance (API)
      - src: eda-variation-tool
        at: Human, ID 1
    guideline:
      section: 3.1.3
      heading: Change in the name and/or address
      item: a) Manufacturer of the active substance (API)
      pac: PAC-N
    check:
      verdict: agrees
