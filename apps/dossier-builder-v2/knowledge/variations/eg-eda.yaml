  - id: EG-EDA/var/H-05
    kind: variation
    authority: EG-EDA
    set: eg-eda-variations
    title:
      en: Introduction of a new manufacturer for Active Substance.
      ar: null
    group: Drug Substance
    type: Manufacturing site
    pac: PAC-II
    conditions: []
    requirements:
      - Amendment of the relevant section(s) of the dossier concerning the change for the prequalified quality products
      - Analysis of the first production batch of Finished Pharmaceutical product manufactured from the API manufacturer at CADC labs.
      - >-
        Results of stability testing generated with a minimum of 6 months Accelerated testing, and to be released to the market by Central
        Administration of Operation (Inspection Department) after evaluating the results of a minimum of 3 months of the first production
        batch of Finished Pharmaceutical product manufactured with the new API manufacturer.
      - >-
        Comparative in-vitro dissolution study at most suitable medium on first production batch of Finished Pharmaceutical product
        manufactured from the new API manufacturer against the innovator product. (Or may be changed to 3 different PH media in addition to
        the most suitable medium or Bioequivalence study according to category of API & its BCs Class).
    cite:
      - src: eda-variation-tool
        at: row 5
      - src: eda-gl-capp-026-v6
