    title:
      en: A change in specification of active ingredient from Pharmacopeia to in-house( Tighten of Specification).
      ar: null
    group: Drug Substance
    type: Specification
    pac: PAC-N
    conditions:
      - >-
        The change does not result from unexpected events arising during manufacture, e.g. new unqualified impurity; change in total
        impurity limits.
      - Any change should be within the range of currently approved limits.
      - The test procedure remains the same, or changes in the test procedure are minor.
      - >-
        For any material, the change does not concern a genotoxic impurity. If it involves the final active substance, other than for
        residual solvents which must be in line with ICH limits, any new impurity control should be in line with the Ph. Eur. or National
        Pharmacopoeia.
    requirements: []
    cite:
      - src: eda-variation-tool
        at: Human, ID 18
    check:
      verdict: tool-only
      note:
        en: >-
          The guideline (GL.CAPP.026 v6) has no item for moving an active substance specification from a pharmacopoeia to an in-house one;
          the class is the tool's until EDA confirms it.
        ar: >-
          الإرشاد (GL.CAPP.026 v6) مفيهوش بند لتحويل مواصفة المادة الفعالة من الدستور لمواصفة داخلية؛ الفئة هنا من الأداة لحد ما الهيئة
          تأكدها.
