# What the review of 14/11/2026 found and what was done (Part 1c). Written by hand; the numbers come from the generated
# citations.json (tools/verify-sources.mjs) and from the records themselves.
reviewed: '2026-11-14'
findings:
  - id: cadc-v3
    kind: newer-version
    title:
      en: GL.CADC.002 version 3 is in force (issued 18/10/2026, in force from 20/10/2026)
      ar: الإصدار 3 من GL.CADC.002 بقى ساري (صادر 18/10/2026، وساري من 20/10/2026)
    text:
      en: >-
        The old knowledge held version 2 as in force and version 3 as a draft. The 48 citations of the CADC review questions now cite
        version 3: 11 moved to its new section numbers (6.5 → 5.6, 6.6 → 5.7) and 5 questions changed with the text (the dissolution study
        for new products, impurities in Annex III, the sterility test specification in Annex IV, the regulatory folder in Annex VI).
      ar: >-
        المعرفة القديمة كانت شايلة الإصدار 2 على إنه الساري والإصدار 3 مسودة. الـ 48 استشهاد بتوع أسئلة مراجعة CADC بقوا على الإصدار 3: 11 اتنقلوا
        لأرقام البنود الجديدة (6.5 ← 5.6، و6.6 ← 5.7)، و5 أسئلة اتغيرت مع النص (دراسة الذوبان للمستحضرات الجديدة، والشوائب في الملحق III،
        ومواصفة اختبار العقامة في الملحق IV، والملف الإداري في الملحق VI).
    records: [EG-EDA/CD-65-03, EG-EDA/IN-DISS-01, EG-EDA/CD-A3-04, EG-EDA/CD-A4-02, EG-EDA/CD-A6-01]
    sources: [eda-gl-cadc-002-v3, eda-gl-cadc-002-v2]
  - id: variation-classes
    kind: correction
    title:
      en: 15 variation classes in EDA's tool differ from the guideline GL.CAPP.026 v6
      ar: 15 فئة تغيير في أداة الهيئة مختلفة عن الإرشاد GL.CAPP.026 الإصدار 6
    text:
      en: >-
        Each of the 90 variations was matched to its own item in the guideline and the class printed after that item was read: 67 agree,
        15 differ, 6 are one entry in the tool for several items of the guideline, and 2 have no item in the guideline. The class the
        program uses is now the guideline's; the tool's class is kept beside it. Confirm the 15 with EDA before filing.
      ar: >-
        كل تغيير من الـ 90 اتطابق على بنده في الإرشاد، واتقرت الفئة المطبوعة بعد البند: 67 زي الإرشاد، و15 مختلفين، و6 الأداة بتجمع فيهم
        أكتر من بند، و2 مالهمش بند في الإرشاد. الفئة اللي البرنامج بيستخدمها بقت فئة الإرشاد، وفئة الأداة محفوظة جنبها. اتأكد من الـ 15
        مع الهيئة قبل التقديم.
    records: [EG-EDA/var/H-04, EG-EDA/var/H-12, EG-EDA/var/H-19, EG-EDA/var/H-21, EG-EDA/var/H-22, EG-EDA/var/H-23, EG-EDA/var/H-24,
              EG-EDA/var/H-26, EG-EDA/var/H-27, EG-EDA/var/H-58, EG-EDA/var/H-69, EG-EDA/var/H-77, EG-EDA/var/H-81, EG-EDA/var/H-82,
              EG-EDA/var/H-90]
    sources: [eda-gl-capp-026-v6, eda-variation-tool]
  - id: variation-rows
    kind: correction
    title:
      en: The variation tool's rows were cited ambiguously
      ar: صفوف أداة التغييرات كانت متسجلة بشكل ممكن يتفهم غلط
    text:
      en: The table holds three sections (human, herbal, veterinary), each numbered from 1; «row N» now reads «Human, ID N», and each row's wording was matched.
      ar: الجدول فيه 3 أقسام (بشري وعشبي وبيطري) وكل قسم مترقم من 1؛ «صف N» بقت «Human، ID N»، واتطابقت صياغة كل صف.
    sources: [eda-variation-tool]
  - id: eg-drafts
    kind: correction
    title:
      en: 20 citations named the wrong EDA eCTD draft
      ar: 20 استشهاد كانوا منسوبين لمسودة eCTD غلط
    text:
      en: Sections such as §3.2.4.1 and §3.6 are in the EDA eCTD Technical Guidance draft, not in the EG Module 1 eCTD Specification draft.
      ar: بنود زي §3.2.4.1 و§3.6 موجودة في مسودة الإرشاد الفني للـ eCTD، مش في مسودة مواصفة الموديول الأول.
    sources: [eda-ectd-technical-guidance-draft-v1, eda-eg-m1-ectd-spec-draft-v1]
  - id: fda-forms
    kind: correction
    title:
      en: FDA has no headings 1.1.1 to 1.1.6
      ar: هيئة الغذاء والدواء الأمريكية مالهاش بنود 1.1.1 لحد 1.1.6
    text:
      en: FDA files every form under heading 1.1 Forms with the attribute form-type (1571, 356h, 3397, 2252, 2253, 2567); the six records now say so.
      ar: FDA بتحط كل النماذج تحت البند 1.1 Forms مع خاصية form-type (1571 و356h و3397 و2252 و2253 و2567)؛ السجلات الست اتصلحت.
    records: [US-FDA/US-1.1.1, US-FDA/US-1.1.2, US-FDA/US-1.1.3, US-FDA/US-1.1.4, US-FDA/US-1.1.5, US-FDA/US-1.1.6]
    sources: [fda-comprehensive-toc-v233]
  - id: ich-m2
    kind: correction
    title:
      en: ICH M4Q was cited for parts of Module 2 it does not cover
      ar: ICH M4Q كان متسجل مصدر لأجزاء من الموديول 2 مش بيغطيها
    text:
      en: The table of contents, introduction, non-clinical and clinical overviews and summaries now cite ICH M4(R4) with M4S or M4E.
      ar: الفهرس والمقدمة والملخصات غير الإكلينيكية والإكلينيكية بقت مستندة على ICH M4(R4) مع M4S أو M4E.
    records: [ICH/M2-TOC, ICH/M2-INTRO, ICH/M2-NCO, ICH/M2-CO, ICH/M2-NCS, ICH/M2-CS]
    sources: [ich-m4q-r1, ich-m4-r4]
  - id: regional-3-2-r
    kind: correction
    title:
      en: The regional Module 1 specifications do not define 3.2.R
      ar: مواصفات الموديول الأول الإقليمية مابتعرّفش 3.2.R
    text:
      en: The eCTD placement of the EU and GCC 3.2.R documents now cites the ICH eCTD specification, where the node is defined.
      ar: مكان مستندات 3.2.R للاتحاد الأوروبي والخليج في الـ eCTD بقى مستند على مواصفة ICH للـ eCTD، اللي فيها البند ده.
    sources: [ich-ectd-v322, eu-m1-spec-v311, gcc-m1-spec-v15]
  - id: quotes
    kind: correction
    title:
      en: 18 «quotes» were summaries, not the source's words
      ar: 18 «اقتباس» كانوا ملخصات، مش كلام المصدر
    text:
      en: They are now kept as summaries. Eight were replaced by the source's exact words (the WHO screening checklist, NP.CAPP.065 p.13, the BE guideline's history).
      ar: بقوا متسجلين كملخصات. وتمانية منهم اتبدلوا بكلام المصدر بالنص (قائمة فحص منظمة الصحة، وNP.CAPP.065 ص 13، وتاريخ إرشاد التكافؤ الحيوي).
  - id: import-approval
    kind: correction
    title:
      en: Import approval validity, checked on the 2026 edition of GL.PPMA.004
      ar: صلاحية الموافقة الاستيرادية، اتراجعت على إصدار 2026 من GL.PPMA.004
    text:
      en: >-
        One year from issue, and the next applied for at least four months before expiry (p.5, read from the page image because the PDF's
        Arabic text cannot be read by machine). The old note «6 months for unregistered products from a reference country, p.22–23» is not in
        the 2026 edition and was removed.
      ar: >-
        سنة من تاريخ الإصدار، والتالية بيتقدم عليها قبل الانتهاء بأربع شهور على الأقل (ص 5، اتقرت من صورة الصفحة لأن النص العربي في الملف مش
        مقروء آلياً). الملاحظة القديمة «6 شهور للمستحضرات غير المسجلة من دولة مرجعية، ص 22–23» مش موجودة في إصدار 2026 واتشالت.
    records: [EG-EDA/doc/import_approval]
    sources: [eda-gl-ppma-004-v5]
  - id: eda-website
    kind: online-check
    title:
      en: Every EDA source checked against EDA's website
      ar: كل مصادر هيئة الدواء اتراجعت على موقع الهيئة
    text:
      en: >-
        12 are current (the same file, or the same version in another language). GL.CADC.002 was replaced by version 3. Four are now kept in
        the project (GL.CAP.Care.032, GL.PPMA.004, NP.CAPP.093, NP.CAPP.109). Nine EDA guidelines the old program did not hold were added
        (nitrosamines, good review practice, reliance, mock-up design, naming, type II variations, reference countries, variation time
        frames, adoption of the ICH quality guidelines); the nitrosamine and reliance questions now cite EDA's own guidelines first.
      ar: >-
        12 مصدر زي ما هم (نفس الملف، أو نفس الإصدار بلغة تانية). GL.CADC.002 اتبدل بالإصدار 3. أربع مصادر بقوا محفوظين في المشروع
        (GL.CAP.Care.032 وGL.PPMA.004 وNP.CAPP.093 وNP.CAPP.109). واتضافت 9 إرشادات للهيئة ماكانتش عند البرنامج القديم (النيتروزامين،
        والممارسة الجيدة للمراجعة، والاعتماد على الهيئات المرجعية، وتصميم العبوات، والأسماء، وتغييرات النوع الثاني، والدول المرجعية، والمدد
        الزمنية للتغييرات، واعتماد إرشادات الجودة الصادرة عن ICH)؛ وأسئلة النيتروزامين والاعتماد بقت بتستند على إرشادات الهيئة الأول.
  - id: not-online
    kind: open
    title:
      en: Not yet checked online — ICH, EMA, FDA, WHO and GCC sources
      ar: لسه مااتراجعتش أونلاين — مصادر ICH وEMA وFDA ومنظمة الصحة والخليج
    text:
      en: >-
        Their text was checked where a copy is kept, but whether a newer version exists needs their websites, and this session's network does
        not reach some of them (the ICH content service, the EMA eSubmission site, the SFDA site). 64 sources have no copy in the project.
      ar: >-
        نصهم اتراجع لما يكون عندنا نسخة، لكن معرفة إذا كان فيه إصدار أحدث محتاجة مواقعهم، وشبكة الجلسة دي مش واصلة لبعضهم (خدمة محتوى
        ICH، وموقع EMA للتقديم الإلكتروني، وموقع هيئة الغذاء والدواء السعودية). و64 مصدر مالهمش نسخة في المشروع.
  - id: gaps
    kind: open
    title:
      en: Gaps found, not filled yet
      ar: نواقص اتلاقت ولسه مااتملتش
    text:
      en: >-
        EDA's variation tool also lists 58 herbal and 52 veterinary variations the knowledge does not hold; the guideline has about 58 human
        variation items the tool does not list; the variations have no Arabic titles; the EDA mock-up, naming and good-review-practice
        guidelines are registered but not yet tied to questions.
      ar: >-
        أداة الهيئة فيها كمان 58 تغيير عشبي و52 بيطري مش موجودين في المعرفة؛ والإرشاد فيه حوالي 58 بند تغيير بشري مش موجودين في الأداة؛
        والتغييرات مالهاش عناوين بالعربي؛ وإرشادات الهيئة لتصميم العبوات والأسماء والممارسة الجيدة للمراجعة اتسجلت لكن لسه مااترتبطتش بأسئلة.
