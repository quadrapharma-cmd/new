<title>مكتب eBOX</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* layout: one column on a phone with a tab bar at the bottom; from 980px the dossiers and Claude side by side */
:root {
  --bg: #f3f6f5; --card: #ffffff; --ink: #18231f; --soft: #5b6a64; --line: #dbe3df; --chip: #e7eeeb;
  --accent: #0f6b5c; --accent-ink: #ffffff; --accent-soft: #d8ebe6;
  --ok: #1d7a4a; --warn: #9a5b00; --bad: #b3261e; --run: #1f5fa8;
  --font: "IBM Plex Sans Arabic", "Geeza Pro", "Noto Naskh Arabic", "Segoe UI", Tahoma, sans-serif;
  --r: 14px; color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1513; --card: #18201d; --ink: #e5ece9; --soft: #9db0a9; --line: #2a3531; --chip: #222c29;
  --accent: #3fb59d; --accent-ink: #0b1210; --accent-soft: #1d332d;
  --ok: #5cc98d; --warn: #e0a64a; --bad: #f2867f; --run: #7db3f0; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f1513; --card: #18201d; --ink: #e5ece9; --soft: #9db0a9; --line: #2a3531; --chip: #222c29;
  --accent: #3fb59d; --accent-ink: #0b1210; --accent-soft: #1d332d;
  --ok: #5cc98d; --warn: #e0a64a; --bad: #f2867f; --run: #7db3f0; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { direction: rtl; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.65; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--accent); }
button, input, textarea { font: inherit; color: inherit; }
svg.i { width: 20px; height: 20px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.app { min-height: 100%; display: flex; flex-direction: column; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--accent); color: var(--accent-ink);
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top-in { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.mark { width: 36px; height: 36px; border-radius: 10px; background: var(--accent-ink); color: var(--accent); display: grid; place-items: center;
  font-weight: 700; font-size: 11px; letter-spacing: .02em; direction: ltr; }
.top h1 { margin: 0; font-size: 18px; font-weight: 700; line-height: 1.2; }
.top p { margin: 0; font-size: 12.5px; opacity: .85; }
.top .grow { flex: 1; min-width: 0; }
.conn { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 4px 10px; border-radius: 999px;
  background: color-mix(in srgb, var(--accent-ink) 16%, transparent); white-space: nowrap; }
.conn .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .6; }
.conn.ok .dot { opacity: 1; }
nav.tabs { display: flex; gap: 6px; max-width: 1180px; margin: 0 auto; width: 100%;
  padding-block: 10px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
nav.tabs button { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); color: var(--soft);
  padding: 8px 14px; border-radius: 999px; cursor: pointer; font-weight: 500; }
nav.tabs button[aria-current="page"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
nav.tabs .badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 12px;
  display: inline-grid; place-items: center; }
main { flex: 1; width: 100%; max-width: 1180px; margin: 0 auto;
  padding-block: 14px 96px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-content: start; align-items: start; }
@media (min-width: 980px) {
  main { grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); padding-block: 16px 24px; align-items: start; }
  #view-chat { position: sticky; top: 80px; }
  nav.tabs button[data-tab="chat"] { display: none; }
  body.tab-chat #view-chat, #view-chat { display: flex !important; }
}
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); min-width: 0; }
.panel > h2, .sec-h { margin: 0; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.pad { padding: 16px; }
.stack { display: grid; gap: 12px; align-content: start; }
.muted { color: var(--soft); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.row > .grow { flex: 1; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--card);
  border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 600; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn:disabled { opacity: .55; cursor: default; }
.btn:focus-visible, nav.tabs button:focus-visible, .card:focus-visible, input:focus-visible, textarea:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 2px; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 10px; border-radius: 999px;
  background: var(--chip); color: var(--soft); white-space: nowrap; }
.pill.running { background: color-mix(in srgb, var(--run) 16%, transparent); color: var(--run); }
.pill.needs { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.pill.finished { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.pill.failed, .pill.stopped { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
/* dossiers */
.cards { display: grid; gap: 12px; }
.card { display: grid; gap: 10px; padding: 14px 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  cursor: pointer; text-align: start; width: 100%; }
.card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.card h3 { margin: 0; font-size: 16px; font-weight: 700; overflow-wrap: anywhere; }
.rail { display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 4px; }
.rail span { height: 6px; border-radius: 3px; background: var(--chip); }
.rail span.done { background: var(--ok); }
.rail span.running { background: var(--run); animation: pulse 1.6s ease-in-out infinite; }
.rail span.failed { background: var(--bad); }
.rail span.needs { background: var(--warn); }
.rail span.skipped { background: color-mix(in srgb, var(--soft) 45%, transparent); }
@keyframes pulse { 50% { opacity: .45; } }
@media (prefers-reduced-motion: reduce) { .rail span.running, .stage.running .ic { animation: none; } }
.example { font-size: 12px; color: var(--warn); font-weight: 600; }
.empty { display: grid; gap: 10px; justify-items: start; padding: 22px 18px; border: 1px dashed var(--line); border-radius: var(--r); background: var(--card); }
.empty h3 { margin: 0; font-size: 16px; }
/* detail */
.back { border: 0; background: none; color: var(--accent); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; padding: 4px 0; font-weight: 600; }
.stages { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.stage { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.stage:last-child { border-bottom: 0; }
.stage .ic { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--chip); color: var(--soft); }
.stage.done .ic { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.stage.running .ic { background: color-mix(in srgb, var(--run) 15%, transparent); color: var(--run); animation: pulse 1.6s ease-in-out infinite; }
.stage.failed .ic { background: color-mix(in srgb, var(--bad) 14%, transparent); color: var(--bad); }
.stage.needs .ic { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.stage .nm { font-weight: 600; font-size: 14px; }
.stage .note { font-size: 12.5px; color: var(--soft); overflow-wrap: anywhere; }
.stage .st { font-size: 12px; color: var(--soft); white-space: nowrap; }
.nums { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; }
.num { background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.num b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
.num span { font-size: 12.5px; color: var(--soft); }
.needs-list, .results { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.needs-list li { padding: 10px 12px; border-radius: 12px; background: color-mix(in srgb, var(--warn) 10%, var(--card)); border: 1px solid color-mix(in srgb, var(--warn) 30%, var(--line)); }
.results li { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; }
.results li .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.log { margin: 0; padding: 10px 12px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; max-height: 220px; overflow: auto;
  font-size: 12.5px; line-height: 1.7; white-space: pre-wrap; overflow-wrap: anywhere; }
/* form */
label.f { display: grid; gap: 6px; font-weight: 600; font-size: 14px; }
label.f .hint { font-weight: 400; font-size: 12.5px; color: var(--soft); }
input[type=text], input[type=url], textarea, select { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; }
input[type=url] { direction: ltr; text-align: left; }
textarea { min-height: 84px; resize: vertical; }
.files-in { display: grid; gap: 6px; }
.file-row { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 6px 10px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.file-row .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.msg-line { font-size: 13.5px; }
.msg-line.ok { color: var(--ok); }
.msg-line.bad { color: var(--bad); }
/* chat */
#view-chat { display: flex; flex-direction: column; min-height: 420px; max-height: calc(100vh - 120px); }
.chat-h { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.chat-list { flex: 1; overflow: auto; padding: 14px 16px; display: grid; gap: 10px; align-content: start; }
.bubble { max-width: 88%; padding: 10px 12px; border-radius: 14px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14.5px; }
.bubble.you { justify-self: start; background: var(--accent); color: var(--accent-ink); border-end-start-radius: 4px; }
.bubble.claude { justify-self: end; background: var(--bg); border: 1px solid var(--line); border-end-end-radius: 4px; }
.bubble .meta { display: block; font-size: 11.5px; opacity: .75; margin-top: 4px; }
.bubble .meta button { border: 0; background: none; color: inherit; text-decoration: underline; cursor: pointer; padding: 0; font-size: 11.5px; }
.composer { display: flex; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); align-items: flex-end; }
.composer textarea { min-height: 44px; max-height: 140px; }
@media (max-width: 979px) {
  nav.tabs { position: fixed; inset: auto 0 0 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line); justify-content: space-around;
    padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px)); }
  nav.tabs button { flex: 1; justify-content: center; flex-direction: column; gap: 2px; border: 0; background: none; font-size: 12px; padding: 4px; border-radius: 10px; }
  nav.tabs button[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
  #view-chat { min-height: calc(100vh - 190px); max-height: none; }
}
</style>

  <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>

  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></symbol>
  <symbol id="i-scan" viewBox="0 0 24 24"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2M7 12h10"/></symbol>

<div class="app" dir="rtl" lang="ar">
  <header class="top">
    <div class="top-in">
      <div class="mark" aria-hidden="true">eBOX</div>
      <div class="grow"><h1>مكتب eBOX</h1><p>إعداد ملفات التسجيل مع Claude</p></div>
      <span class="conn" id="conn"><span class="dot"></span><span id="conn-t">Claude</span></span>
    </div>
  </header>
  <nav class="tabs" aria-label="الأقسام">
    <button type="button" data-tab="files" aria-current="page"><svg class="i"><use href="#i-folder"/></svg><span>الملفات</span></button>
    <button type="button" data-tab="new"><svg class="i"><use href="#i-plus"/></svg><span>ملف جديد</span></button>
    <button type="button" data-tab="chat"><svg class="i"><use href="#i-chat"/></svg><span>Claude</span><span class="badge" id="unread" hidden>0</span></button>
  </nav>
  <main>
    <section id="view-files" class="stack" aria-live="polite"></section>
    <section id="view-new" class="panel pad stack" hidden>
      <h2><svg class="i"><use href="#i-plus"/></svg>ملف جديد</h2>
      <form id="new-form" class="stack" novalidate>
        <label class="f">اسم الملف
          <span class="hint">للعرض في هذا المكتب، مثل اسم المستحضر.</span>
          <input type="text" id="nf-name" maxlength="80" autocomplete="off" placeholder="مثال: ملف تسجيل المستحضر">
        </label>
        <label class="f">الدولة التي يُقدَّم إليها الملف
          <span class="hint">يُبنى لمصر دائمًا بصيغها الثلاث؛ وإذا اخترت دولة أخرى تُضاف مخرجاتها بموديول 1 الخاص بها.</span>
          <select id="nf-country">
            <option value="EG" selected>مصر — هيئة الدواء المصرية</option>
            <option value="SA">المملكة العربية السعودية — دول الخليج</option>
            <option value="AE">الإمارات العربية المتحدة — دول الخليج</option>
            <option value="KW">الكويت — دول الخليج</option>
            <option value="BH">البحرين — دول الخليج</option>
            <option value="OM">عُمان — دول الخليج</option>
            <option value="QA">قطر — دول الخليج</option>
            <option value="DE">ألمانيا — الاتحاد الأوروبي</option>
            <option value="FR">فرنسا — الاتحاد الأوروبي</option>
            <option value="IT">إيطاليا — الاتحاد الأوروبي</option>
            <option value="ES">إسبانيا — الاتحاد الأوروبي</option>
            <option value="NL">هولندا — الاتحاد الأوروبي</option>
            <option value="US">الولايات المتحدة الأمريكية — FDA</option>
            <option value="JO">الأردن</option>
            <option value="IQ">العراق</option>
            <option value="LB">لبنان</option>
            <option value="XX">دولة أخرى (موديول 1 العام)</option>
          </select>
        </label>
        <label class="f">رابط مجلد الملف الوارد على Google Drive
          <span class="hint">افتح المجلد في Drive، ثم «مشاركة» ← «نسخ الرابط». فيه الملف المجمّع وملفات Word.</span>
          <input type="url" id="nf-drive" inputmode="url" autocomplete="off" placeholder="https://drive.google.com/drive/folders/…">
        </label>
        <p class="msg-line" id="nf-drive-state" hidden></p>
        <div class="f stack" id="nf-files-box">
          <label class="f" for="nf-files">ملفات إضافية (اختياري)
            <span class="hint">PDF أو صور، حتى 20 ميجابايت للملف الواحد. ملفات Word والملفات الأكبر تُوضع في مجلد Drive.</span>
          </label>
          <input type="file" id="nf-files" multiple accept="application/pdf,image/png,image/jpeg">
          <div class="files-in" id="nf-list"></div>
        </div>
        <label class="f">ملاحظات لـ Claude (اختياري)
          <textarea id="nf-notes" maxlength="2000" placeholder="مثال: المتقدّم هو الوكيل المصري، والتسويق محلي."></textarea>
        </label>
        <div class="row">
          <button class="btn primary" type="submit" id="nf-go"><svg class="i"><use href="#i-play"/></svg>ابدأ</button>
          <span class="msg-line" id="nf-msg" role="status"></span>
        </div>
      </form>
    </section>
    <section id="view-chat" class="panel" hidden>
      <div class="chat-h"><h2 class="sec-h"><svg class="i"><use href="#i-chat"/></svg>Claude</h2>
        <p class="muted small" style="margin:4px 0 0">لكل ملف جلسة عمل خاصة به: ما تكتبه عن ملف يصل إلى جلسته، وما سواه إلى جلسة جديدة، ويظهر الرد هنا.</p></div>
      <div class="chat-list" id="chat-list" aria-live="polite"></div>
      <form class="composer" id="chat-form">
        <textarea id="chat-in" rows="1" maxlength="4000" placeholder="اكتب لـ Claude…" aria-label="رسالتك إلى Claude"></textarea>
        <button class="btn primary" type="submit" id="chat-go" aria-label="إرسال"><svg class="i"><use href="#i-send"/></svg></button>
      </form>
    </section>
  </main>
</div>

<script>
(() => {
  // ------------------------------------------------------------------ the program's own words (formal Arabic)
  const SESSION = 'session_01LcrRaPNd7k7FvK6ziA9n4b';           // the Claude session where the program and its tools run
  const LINK = 'Claude Code Remote';                               // the claude.ai connector that carries a message to it
  // The connector itself unreachable from this view: no other route will do better.
  const NO_LINK = new Set(['server_not_connected', 'blocked_by_policy', 'not_granted', 'capability_disabled']);
  const STAGES = [
    ['read', 'قراءة الملفات الواردة صفحةً صفحة', 'i-read'], ['repeats', 'الكتل المكررة', 'i-copy'],

  // ------------------------------------------------------------------ talking with Claude
  // A request goes to the dossier's own work session when it has one; else the desk's scheduled task starts a new session
  // for it (config/desk.trigger_id); the session this desk was made in is the last resort.
  async function tell(text, to = {}) {
    if (!S.mcp) { S.linkState = 'none'; paintConn(); return false; }
    const routes = [];
    if (/^session_[A-Za-z0-9]+$/.test(to.session || '')) {
      routes.push(['send_message', Object.assign({ session_id: to.session, message: text }, to.now ? { priority: 'now' } : {})]);
    }
    if (/^trig_[A-Za-z0-9]+$/.test(S.config.trigger_id || '')) routes.push(['fire_trigger', { trigger_id: S.config.trigger_id, text }]);
    routes.push(['send_message', { session_id: SESSION, message: text }]);

    for (const [tool, input] of routes) {
      try { await S.mcp.callTool(LINK, tool, input, { cache: false }); S.linkState = 'ok'; paintConn(); return true; }
      catch (err) { last = err; if (err && NO_LINK.has(err.code)) break; }

    paintConn(); return false;
  }

    await addMessage('you', kind + ': ' + (d.name || ''), sent, full, d.id);

    db.collection('dossiers').orderBy('created', 'desc').limit(200).onSnapshot((snap) => {
      if (!snap.metadata.fromCache) clearTimeout(timer);
      S.loading = false; S.dossiers = snap.docs.map((x) => ({ id: x.id, ...x.data() })); renderFiles();
    }, () => { clearTimeout(timer); S.loading = false; renderFiles(); });
    db.collection('messages').orderBy('at', 'asc').limit(400).onSnapshot((snap) => {
      S.messages = snap.docs.map((x) => ({ id: x.id, ...x.data() })); if (S.tab === 'chat' || wide()) markSeen(); renderChat();
    }, () => {});
  })();
})();
</script>
