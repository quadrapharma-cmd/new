<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dossier Builder — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/ds.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:16px}
.login{width:min(420px,100%);padding:28px 26px;display:flex;flex-direction:column;gap:14px}
.login .logo{padding:0 0 6px}
.login h1{font-size:20px}
.login label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600}
.login .err{color:var(--bad);font-size:13px;min-height:1.2em}
.login .foot{font-size:12px;color:var(--faint);display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
</style></head><body>
<form id="f" class="card glow login">
  <div class="logo"><span class="tile">DB</span><span><span class="name">منشئ ملفات التسجيل · Dossier Builder</span><span class="tag">EDA · CTD / eCTD</span></span></div>
  <div><h1>سجّل الدخول · Sign in</h1><p class="sub small">مساحة عمل الشركة — كل إجراء بيتسجل باسم صاحبه. · Company workspace — every action is recorded under its author.</p></div>
  <label>اسم المستخدم · Username<input name="username" autocomplete="username" required dir="ltr" autofocus></label>
  <label>كلمة السر · Password<input name="password" type="password" autocomplete="current-password" required dir="ltr"></label>
  <div class="err" id="e" role="alert"></div>
  <button class="btn pri lg">دخول · Sign in</button>
  <div class="foot"><span class="led">HTTPS · signed session</span><span class="code">NP.CAPP.065 v5 · eCTD 3.2.2 / 4.0</span></div>
</form>
<script>
try{ document.documentElement.dataset.theme = localStorage.getItem('db.theme') || 'dark'; }catch(e){ document.documentElement.dataset.theme='dark'; }
document.getElementById('f').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);
 const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:fd.get('username'),password:fd.get('password')})});
 if(r.ok){location.href='/';return;} const j=await r.json().catch(()=>({}));const d=j.detail||{};document.getElementById('e').textContent=(d.ar||'')+(d.en?' · '+d.en:'');};
</script></body></html>
