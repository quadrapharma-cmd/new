<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dossier Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#EEF2F5; --line:#DCE2E8; --ink:#0F1B2A; --muted:#5B6B7C;
  --brand:#0E7C86; --brand-ink:#FFFFFF; --brand-soft:#E3F3F4; --accent:#1E3A8A;
  --ok:#15803D; --ok-soft:#E5F4EA; --warn:#B45309; --warn-soft:#FBF0E1; --bad:#C62828; --bad-soft:#FBE7E7;
  --wait:#6D28D9; --wait-soft:#F0EAFC; --na:#8A97A6; --na-soft:#EEF1F4; --rec:#1E40AF; --rec-soft:#E6EEFB;
  --f-ui:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px; --shadow:0 1px 2px rgba(15,27,42,.06),0 4px 14px rgba(15,27,42,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141C; --surface:#131C26; --surface-2:#18232F; --line:#253343; --ink:#E6EDF3; --muted:#93A3B5;
  --brand:#2BB3BD; --brand-ink:#04161A; --brand-soft:#0F2F33; --accent:#8FA8FF;
  --ok:#4ADE80; --ok-soft:#10261A; --warn:#F5A64A; --warn-soft:#2B1F0E; --bad:#F87171; --bad-soft:#2C1414;
  --wait:#B49AF7; --wait-soft:#211A36; --na:#7C8B9C; --na-soft:#1B2531; --rec:#93B4FF; --rec-soft:#13213D;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141C; --surface:#131C26; --surface-2:#18232F; --line:#253343; --ink:#E6EDF3; --muted:#93A3B5;
  --brand:#2BB3BD; --brand-ink:#04161A; --brand-soft:#0F2F33; --accent:#8FA8FF;
  --ok:#4ADE80; --ok-soft:#10261A; --warn:#F5A64A; --warn-soft:#2B1F0E; --bad:#F87171; --bad-soft:#2C1414;
  --wait:#B49AF7; --wait-soft:#211A36; --na:#7C8B9C; --na-soft:#1B2531; --rec:#93B4FF; --rec-soft:#13213D;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5}
html[lang="ar"] body{font-family:var(--f-ar)}
button,input,select{font:inherit;color:inherit}
a{color:var(--brand)}
a.btn{text-decoration:none;color:inherit}
a.btn.pri{color:var(--brand-ink)}
.f .seg{align-self:flex-start;flex-wrap:wrap}
.steps .n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:color-mix(in srgb,currentColor 18%,transparent);font-size:11px;margin-inline-end:6px}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-inline-end:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;font-weight:700}
.logo b{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-ink);font-family:var(--f-mono);font-size:12px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand)}
.nav a[aria-disabled="true"]{opacity:.45;pointer-events:none}
.nav .grp{font-size:11px;color:var(--na);padding:12px 10px 4px;text-transform:uppercase;letter-spacing:.08em}
html[lang="ar"] .nav .grp{letter-spacing:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.top .crumb{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;min-height:36px}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:3px 9px;min-height:30px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.content{padding:20px 16px 48px;max-width:1440px;width:100%;display:flex;flex-direction:column;gap:18px}
h1{font-size:22px;margin:0} h2{font-size:16px;margin:0} h3{font-size:14px;margin:0}
.sub{color:var(--muted);margin:2px 0 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-inline-start:3px solid var(--line)}
.kpi .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi.ok{border-inline-start-color:var(--ok)} .kpi.bad{border-inline-start-color:var(--bad)} .kpi.warn{border-inline-start-color:var(--warn)} .kpi.ns{border-inline-start-color:var(--na)} .kpi.br{border-inline-start-color:var(--brand)}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.alert.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.alert.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 30%,transparent)}
.alert p{margin:0;flex:1;min-width:0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2);position:sticky;top:0}
tr.grp td{background:var(--surface-2);font-weight:600;font-size:12.5px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-bad{background:var(--bad-soft);color:var(--bad)}
.c-wait{background:var(--wait-soft);color:var(--wait)} .c-na{background:var(--na-soft);color:var(--na)} .c-rec{background:var(--rec-soft);color:var(--rec)}
.code{font-family:var(--f-mono);font-size:12px;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:12.5px}
.api{display:inline-block;margin-top:2px;font-size:12px;color:var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;color:var(--muted);min-height:34px}
.seg button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
input[type=text],input[type=email],select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-height:38px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.f span{font-weight:600}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;gap:6px;align-items:center;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.steps span{padding:4px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-size:12.5px}
.steps span.on{background:var(--brand);color:var(--brand-ink)}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(480px,100%);background:var(--surface);border-inline-start:1px solid var(--line);box-shadow:var(--shadow);z-index:20;display:flex;flex-direction:column;transform:translateX(0)}
.drawer[hidden]{display:none}
.drawer header{display:flex;gap:8px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.drawer header h2{flex:1;min-width:0}
.drawer .body{padding:16px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.35);z-index:15}
.scrim[hidden]{display:none}
.finding{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.finding.block{border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.toast{position:fixed;bottom:16px;inset-inline-start:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:30;max-width:min(560px,calc(100% - 32px))}
html[dir="rtl"] .toast{transform:translateX(50%)}
.toast[hidden]{display:none}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.dl{display:flex;gap:8px;flex-wrap:wrap}
.pub{display:grid;grid-template-columns:minmax(220px,300px) minmax(0,1fr) minmax(240px,320px);gap:12px;min-height:560px}
.pub .card{display:flex;flex-direction:column;min-height:0;max-height:calc(100vh - 210px)}
.pub .card>h3{padding:12px 14px;border-bottom:1px solid var(--line)}
.pub .scroll{overflow:auto;min-height:0}
.tree details{border-bottom:1px solid var(--line)}
.tree summary{padding:8px 14px;cursor:pointer;font-weight:600;font-size:12.5px;color:var(--muted)}
.node{display:flex;gap:8px;align-items:flex-start;padding:6px 14px 6px 22px;cursor:pointer;font-size:13px;border-inline-start:3px solid transparent}
html[dir=rtl] .node{padding:6px 22px 6px 14px}
.node:hover{background:var(--surface-2)} .node.sel{background:var(--brand-soft);border-inline-start-color:var(--brand)}
.node.drop{outline:2px dashed var(--brand);outline-offset:-2px}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--na)}
.d-waiting{background:var(--wait)} .d-auto{background:var(--ok)} .d-conforming{background:var(--ok)} .d-needs_attention{background:var(--warn)} .d-non_conforming{background:var(--bad)} .d-received{background:var(--rec)}
.leaf{cursor:pointer} .leaf.sel td{background:var(--brand-soft)}
.op{font-family:var(--f-mono);font-size:11.5px;padding:1px 6px;border-radius:4px;background:var(--ok-soft);color:var(--ok)}
.props{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 10px;padding:14px;font-size:13px}
.props dt{color:var(--muted)} .props dd{margin:0;min-width:0;overflow-wrap:anywhere}
.modeswitch{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.modeswitch a{padding:6px 12px;text-decoration:none;color:var(--muted)} .modeswitch a.on{background:var(--brand);color:var(--brand-ink)}
@media (max-width:1100px){.pub{grid-template-columns:minmax(0,1fr)} .pub .card{max-height:none}}
.gform{display:flex;flex-direction:column;gap:10px}
.gform .miss input,.gform .miss textarea,.gform .miss select{border-color:var(--bad);background:var(--bad-soft)}
textarea{width:100%;min-height:90px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font:inherit;color:inherit}
.rows table td{padding:4px} .rows input,.rows select{min-height:32px;padding:4px 6px}
.drawer.wide{width:min(760px,100%)}
.mobnav{display:none}
@media (max-width:860px){
  .two{grid-template-columns:minmax(0,1fr)!important}
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .mobnav{display:flex}
  .hide-m{display:none}
  th,td{padding:8px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Main">
    <div class="logo"><b>DB</b><span data-t="appName"></span></div>
    <nav class="nav" id="nav">
      <a href="#/" data-r="home"><span data-t="navDossiers"></span></a>
      <a href="#/variations" data-r="variations"><span data-t="navVars"></span></a>

      <a href="#" data-r="publisher" id="navPublisher" aria-disabled="true"><span data-t="navPublisher"></span></a>
      <a href="#" data-r="export" id="navExport" aria-disabled="true"><span data-t="navExport"></span></a>

    <div style="margin-top:auto" class="small muted" data-t="localNote"></div>

  <main class="main">
    <div class="top">
      <select class="mobnav btn" id="mobnav" aria-label="Navigate" style="width:auto"></select>
      <div class="crumb" id="crumb"></div>
      <div class="seg" role="group" aria-label="Language"><button id="lang-ar" lang="ar">عربي</button><button id="lang-en" lang="en">EN</button></div>
      <button class="btn ghost" id="theme" aria-label="Theme"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
    </div>
    <div class="content" id="view" tabindex="-1"></div>
  </main>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog"><header><h2 id="dTitle"></h2><button class="btn ghost" id="dClose" aria-label="Close">✕</button></header><div class="body" id="dBody"></div></aside>
<div class="toast" id="toast" role="status" hidden></div>
<input type="file" id="picker" accept="application/pdf,.pdf" hidden>

const S = {lang: localGet('db.lang') || 'ar', dossier: null, board: null, filter: 'todo', module: 0, wiz: null};
function localGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function localSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
const $ = (s,el=document)=>el.querySelector(s);
const t = k => (T[k] ? T[k][S.lang] : k);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const bdi = s => `<bdi>${esc(s)}</bdi>`;

async function api(path, opt={}){
  opt.headers = Object.assign({'X-DB':'1'}, opt.headers||{});
  const r = await fetch('/api' + path, opt);
  if(r.status===401){ location.href='/login'; throw new Error('auth'); }
  const ct = r.headers.get('content-type') || '';
  const body = ct.includes('json') ? await r.json() : null;
  if(!r.ok){ const d = body && body.detail || {}; const e = new Error(d[S.lang] || d.en || r.statusText); e.detail = d; e.status = r.status; throw e; }
  return body;
}
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>el.hidden=true, 3800); }
function setLang(l){ S.lang=l; localSet('db.lang',l); document.documentElement.lang=l; document.documentElement.dir = l==='ar'?'rtl':'ltr';
  $('#lang-ar').classList.toggle('on',l==='ar'); $('#lang-en').classList.toggle('on',l==='en');
  document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t)); route(); }
$('#lang-ar').onclick=()=>setLang('ar'); $('#lang-en').onclick=()=>setLang('en');
$('#theme').onclick=()=>{ const r=document.documentElement; const cur=r.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  r.dataset.theme = cur==='dark'?'light':'dark'; localSet('db.theme', r.dataset.theme); };
if(localGet('db.theme')) document.documentElement.dataset.theme = localGet('db.theme');

const STATUS_CHIP = {auto:'c-ok',waiting:'c-wait',not_started:'c-na',received:'c-rec',conforming:'c-ok',needs_attention:'c-warn',non_conforming:'c-bad',not_applicable:'c-na'};
const LEVEL = {R:'required',O:'optional',NR:'notreq',NA:'na'};
const chip = st => `<span class="chip ${STATUS_CHIP[st]||'c-na'}"><i></i>${esc(t(st))}</span>`;

function nav(r){
  const id = S.dossier && S.dossier.id;
  [['navBoard','board'],['navData','data'],['navPublisher','publisher'],['navExport','export'],['navAudit','audit']].forEach(([n,k])=>{const a=$('#'+n); a.href= id?`#/d/${id}/${k}`:'#'; a.setAttribute('aria-disabled', id?'false':'true');});
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.r===r));
  const m=$('#mobnav'); m.innerHTML = `<option value="#/">${esc(t('navDossiers'))}</option>` + (id?['board','data','publisher','export','audit'].map(k=>`<option value="#/d/${id}/${k}" ${k===r?'selected':''}>${esc(t('nav'+k[0].toUpperCase()+k.slice(1)))}</option>`).join(''):'');
  m.onchange=()=>location.hash=m.value;
  $('#crumb').innerHTML = S.dossier ? bdi(S.dossier.name) : esc(t('appName'));
}
async function route(){
  const h = location.hash.replace(/^#/,'') || '/';
  const m = h.match(/^\/d\/([^/]+)\/(board|data|publisher|export|audit)$/);
  const v = $('#view');
  try{
    if(h==='/new'){ S.dossier=null; nav('home'); return wizard(); }
    if(h==='/variations'){ nav('variations'); return varsView(); }
    if(!m){ S.dossier=null; nav('home'); return home(); }
    if(!S.dossier || S.dossier.id!==m[1]) S.dossier = await api(`/dossiers/${m[1]}`);
    nav(m[2]);
    if(m[2]==='board') return board();
    if(m[2]==='export') return exportView();
    if(m[2]==='publisher') return publisherView();
    if(m[2]==='data') return dataView();
    return auditView();
  }catch(e){ v.innerHTML = `<div class="alert bad"><p><b>${esc(t('err'))}:</b> ${esc(e.message)}</p></div>`; }
}
window.addEventListener('hashchange', route);

/* ---------------- home */
async function home(){
  const list = await api('/dossiers');
  $('#view').innerHTML = `<div class="head"><div><h1>${esc(t('dossiers'))}</h1><p class="sub">${esc(t('dossiersSub'))}</p></div>
    <a class="btn pri" href="#/new" id="btnNew">＋ ${esc(t('newDossier'))}</a></div>
    <div class="card">${list.length?`<div class="tablewrap"><table><thead><tr><th>${esc(t('name'))}</th><th class="hide-m">${esc(t('created'))}</th><th></th></tr></thead><tbody>
    ${list.map(d=>`<tr><td>${bdi(d.name)}</td><td class="hide-m code">${new Date(d.created*1000).toLocaleString(S.lang==='ar'?'ar-EG':'en-GB')}</td>
    <td style="text-align:end"><a class="btn sm" href="#/d/${d.id}/board">${esc(t('open'))}</a></td></tr>`).join('')}</tbody></table></div>`
    :`<div class="empty">${esc(t('none'))}</div>`}</div>`;
}

   <div class="steps">${steps.map((s,i)=>`<span class="${i===w.step?'on':''}"><span class="n">${i+1}</span>${esc(t(s))}</span>`).join('')}</div>

   <div class="toolbar"><a class="btn" href="#/" id="wizCancel">${esc(t('cancel'))}</a><span style="flex:1"></span>
   ${w.step?`<button class="btn" id="wizBack">${esc(t('back'))}</button>`:''}
   ${w.step<3?`<button class="btn pri" id="wizNext">${esc(t('next'))}</button>`:`<button class="btn pri" id="wizCreate">${esc(t('create'))}</button>`}</div>`;

  v.querySelectorAll('[data-flag]').forEach(c=>c.onchange=()=>d[c.dataset.flag]=c.checked);
  v.querySelectorAll('[data-api]').forEach(i=>i.oninput=i.onchange=()=>d.apis[+i.dataset.api][i.dataset.f]=i.value);
  v.querySelectorAll('[data-rmapi]').forEach(b=>b.onclick=()=>{d.apis.splice(+b.dataset.rmapi,1); wizard();});
  if($('#addApi')) $('#addApi').onclick=()=>{d.apis.push({name:'',manufacturer:'',option:'FULL'}); wizard();};
  $('#wizCancel').onclick=()=>{S.wiz=null;};
  if($('#wizBack')) $('#wizBack').onclick=()=>{w.step--; wizard();};
  if($('#wizNext')) $('#wizNext').onclick=()=>{w.step++; wizard();};
  if($('#wizCreate')) $('#wizCreate').onclick=async()=>{
    const profile={dossier_kind:d.dossier_kind,origin:d.origin,licence:d.licence,activity:d.activity,route:'one_submission',leaflet:d.leaflet,
      admin_route:d.admin_route,local_action:!!d.local_action,aqueous_solution:!!d.aqueous_solution,bcs_waiver:!!d.bcs_waiver,
      dosage_specifics:d.specifics,pharmacopoeial:d.pharmacopoeial,store_separate_from_factory:d.store,biological_origin_materials:d.bio,novel_excipient:d.novel,
      apis:d.apis.filter(a=>a.name&&a.manufacturer)};
    try{
      const r = await api('/dossiers',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({name:d.name||d.trade||'Dossier',profile,
        product:{name:d.trade||d.name,dosageform:d.form,manufacturer:d.man,indication:d.ind||null},
        envelope:{tracking:d.tracking,applicant:d.applicant,invented_name:d.trade||d.name,inn:d.inn.split(',').map(s=>s.trim()).filter(Boolean),portal_id:d.portal,description:'Initial MAA'}})});
      S.wiz=null; location.hash=`#/d/${r.id}/board`;
    }catch(e){
      const probs = e.detail && e.detail.problems;
      $('#wizErr').innerHTML=`<div class="alert bad"><p>${probs?probs.map(p=>esc(p[S.lang])).join('<br>'):esc(e.message)}</p></div>`;

}

/* ---------------- board */
async function board(){
  await loadGens();
  S.board = await api(`/dossiers/${S.dossier.id}/board`);
  renderBoard();
}
function renderBoard(){
  const b=S.board, c=b.counts, slots=b.slots;
  const req = slots.filter(s=>s.level==='R'); const ready = req.filter(s=>['conforming','needs_attention'].includes(s.status)).length;
  const pct = req.length? Math.round(100*ready/req.length):0;
  const f=S.filter, m=S.module;
  const show = s => (m===0||s.module===m) && (f==='all' ? true : f==='todo' ? (s.level!=='NR'&&s.level!=='NA'&&s.status!=='conforming') :
     f==='problems' ? ['non_conforming','needs_attention'].includes(s.status) : (s.level==='NR'||s.level==='NA'));
  let rows='', lastGroup='';
  slots.filter(show).forEach(s=>{
    const grp = `M${s.module}`;
    if(grp!==lastGroup){ rows+=`<tr class="grp"><td colspan="5">${esc(t('module'))} ${s.module}</td></tr>`; lastGroup=grp; }
    const api = s.item? `<span class="api">${bdi(s.item.name)} · ${bdi(s.item.manufacturer)} · <span class="code">${esc(s.item.option)}</span></span>`:'';
    const files = s.documents.map(d=>`<div class="small"><span class="muted">${esc(t('version'))} ${d.version}</span> · ${bdi(d.filename)}${d.findings.length?` <span class="chip ${d.check_status==='non_conforming'?'c-bad':'c-warn'}">${d.findings.length}</span>`:''}</div>`).join('');
    const can = s.level==='R'||s.level==='O';
    rows+=`<tr><td><span class="code">${esc(s.ctd)}</span></td><td>${esc(s.title[S.lang])}<br>${api}</td>
      <td class="hide-m"><span class="chip ${s.level==='R'?'c-rec':'c-na'}">${esc(t(LEVEL[s.level]))}</span></td><td>${chip(s.status)}</td>
      <td>${files}<div class="toolbar" style="margin-top:4px">${can?`<button class="btn sm" data-up="${esc(s.slot_id)}">⤒ ${esc(t('upload'))}</button>`:''}
      <button class="btn sm ghost" data-why="${esc(s.slot_id)}">${esc(t('why'))}</button></div></td></tr>`;
  });
  $('#view').innerHTML=`<div class="head"><div><h1>${esc(t('board'))}</h1><p class="sub">${esc(t('boardSub'))}</p></div>
    <div class="toolbar"><button class="btn" id="bulkBtn">⤒ ${esc(t('bulk'))}</button><span class="modeswitch"><a class="on" href="#/d/${S.dossier.id}/board">${esc(t('guided'))}</a><a href="#/d/${S.dossier.id}/publisher">${esc(t('navPublisher'))}</a></span>
    <a class="btn pri" href="#/d/${S.dossier.id}/export">${esc(t('navExport'))} ${S.lang==='ar'?'←':'→'}</a></div></div>
    <div class="kpis">
      <div class="card kpi br"><span class="n">${pct}%</span><span class="l">${esc(t('progress'))} (${ready}/${req.length})</span></div>
      <div class="card kpi ns"><span class="n">${c.not_started||0}</span><span class="l">${esc(t('not_started'))}</span></div>
      <div class="card kpi ok"><span class="n">${c.conforming||0}</span><span class="l">${esc(t('conforming'))}</span></div>
      <div class="card kpi warn"><span class="n">${c.needs_attention||0}</span><span class="l">${esc(t('needs_attention'))}</span></div>
      <div class="card kpi bad"><span class="n">${c.non_conforming||0}</span><span class="l">${esc(t('non_conforming'))}</span></div></div>
    <div class="toolbar"><div class="seg" role="group">${['todo','problems','all','hidden'].map(k=>`<button data-f="${k}" class="${f===k?'on':''}">${esc(t(k))}</button>`).join('')}</div>
      <div class="seg" role="group">${[0,1,2,3,4,5].map(k=>`<button data-m="${k}" class="${m===k?'on':''}">${k?'M'+k:esc(t('all'))}</button>`).join('')}</div></div>
    <div class="card"><div class="tablewrap"><table><thead><tr><th>${esc(t('colSec'))}</th><th>${esc(t('colDoc'))}</th><th class="hide-m">${esc(t('colLevel'))}</th><th>${esc(t('colStatus'))}</th><th>${esc(t('colFiles'))}</th></tr></thead>
    <tbody>${rows||`<tr><td colspan="5" class="empty">—</td></tr>`}</tbody></table></div></div>
    ${b.unassigned.length?`<div class="card pad"><h2>${esc(t('unassigned'))}</h2><p class="sub">${esc(t('unassignedSub'))}</p>${b.unassigned.map(d=>`<div class="small">${bdi(d.filename)} <span class="code">${esc(d.meta.previous_slot||'')}</span></div>`).join('')}</div>`:''}`;
  const v=$('#view');
  v.querySelectorAll('[data-f]').forEach(x=>x.onclick=()=>{S.filter=x.dataset.f; renderBoard();});
  v.querySelectorAll('[data-m]').forEach(x=>x.onclick=()=>{S.module=+x.dataset.m; renderBoard();});
  v.querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>startUpload(x.dataset.up));
  v.querySelectorAll('[data-why]').forEach(x=>x.onclick=()=>openWhy(x.dataset.why));
  $('#bulkBtn').onclick=()=>{ const p=$('#picker'); p.multiple=true; p.value=''; p.onchange=()=>{ p.multiple=false; bulk([...p.files]); }; p.click(); };
  v.ondragover=e=>{ if(e.dataTransfer && [...e.dataTransfer.types].includes('Files')) e.preventDefault(); };
  v.ondrop=e=>{ if(e.dataTransfer && e.dataTransfer.files.length){ e.preventDefault(); bulk([...e.dataTransfer.files]); } };
}
async function bulk(files){
  if(!files.length) return;
  const fd=new FormData(); files.forEach(f=>fd.append('files',f));
  const res = await api(`/dossiers/${S.dossier.id}/classify`,{method:'POST',body:fd});
  const act = S.board.slots.filter(s=>s.level==='R'||s.level==='O');
  const opt = s => `${esc(s.ctd)} ${esc(s.title[S.lang]).slice(0,70)}${s.item?' · '+esc(s.item.manufacturer):''}`;
  openDrawer(t('bulk'), `<p class="small muted">${esc(t('bulkSub'))}</p><div class="tablewrap"><table><thead><tr><th>${esc(t('pFile'))}</th><th>${esc(t('colSec'))}</th></tr></thead><tbody>
    ${res.map((r,i)=>{ const best=r.suggestions[0]; return `<tr><td>${bdi(r.filename)}${best?`<div class="small muted">${esc(best.why.join(' · '))}</div>`:''}</td>
      <td><select data-bulk="${i}"><option value="">${esc(t('noSuggest'))}</option>
      ${r.suggestions.map(x=>`<option value="${esc(x.slot_id)}" ${best&&x.slot_id===best.slot_id?'selected':''}>★ ${opt(slotById(x.slot_id))}</option>`).join('')}
      <option disabled>────────</option>${act.map(s=>`<option value="${esc(s.slot_id)}">${opt(s)}</option>`).join('')}</select></td></tr>`; }).join('')}
    </tbody></table></div><div class="toolbar"><button class="btn pri" id="bulkGo">${esc(t('confirmAll'))}</button></div>`);
  $('#drawer').classList.add('wide');
  $('#bulkGo').onclick=async()=>{
    let n=0; const skipped=[];
    for(const sel of document.querySelectorAll('[data-bulk]')){
      const slotId=sel.value, f=files[+sel.dataset.bulk]; if(!slotId) continue;
      if(needsMeta(slotById(slotId))){ skipped.push(f.name); continue; }
      const fd=new FormData(); fd.append('file',f); fd.append('meta','{}');
      try{ await api(`/dossiers/${S.dossier.id}/slots/${encodeURIComponent(slotId)}/documents`,{method:'POST',body:fd}); n++; }catch(e){ toast(e.message); }
    }
    closeDrawer(); toast(`${n} ${t('added')}${skipped.length?' · '+skipped.join(', ')+': '+t('needsDetails'):''}`); await board();
  };
}
function slotById(id){ return S.board.slots.find(s=>s.slot_id===id); }
function needsMeta(s){ return s.req_id==='M1-09' ? 'pi' : (s.module===5 ? 'study' : null); }
function startUpload(slotId){
  const s=slotById(slotId), kind=needsMeta(s);
  if(!kind) return pick(slotId, {});
  openDrawer(s.title[S.lang], `<p class="muted">${esc(t('extra'))}</p>${kind==='pi'?
    `<label class="f"><span>${esc(t('piType'))}</span><select id="mType"><option value="spc">SmPC</option><option value="pl">PIL / Leaflet</option><option value="outer">Outer label</option><option value="interpack">Inner label</option></select></label>
     <label class="f"><span>${esc(t('piLang'))}</span><select id="mLang"><option value="en">English</option><option value="ar">العربية</option></select></label>`:
    `<label class="f"><span>${esc(t('study'))}</span><input type="text" id="mStudy" placeholder="EXM-BE-01 — Bioequivalence of …"></label>
     <label class="f"><span>${esc(t('docType'))}</span><select id="mDocType"><option value="ich_document_type_2">legacy clinical study report</option><option value="ich_document_type_4">study report body</option><option value="ich_document_type_3">synopsis</option><option value="ich_document_type_5">protocol or amendment</option></select></label>`}
    <button class="btn pri" id="mGo">${esc(t('choose'))}</button>`);
  $('#mGo').onclick=()=>{ const meta = kind==='pi'?{pi_type:$('#mType').value,lang:$('#mLang').value}:{study:$('#mStudy').value,doc_type:$('#mDocType').value};
    if(kind==='study' && !meta.study){ $('#mStudy').focus(); return; } closeDrawer(); pick(slotId, meta); };
}
function pick(slotId, meta, replaces){
  const sl=slotById(slotId);
  if(replaces===undefined && !meta.signed_for && sl && sl.documents.length){
    openDrawer(sl.title[S.lang], `<p>${esc(t('replaceQ'))}</p>${sl.documents.map(d=>`<button class="btn pri" data-rp="${d.id}" style="margin:4px 0">${esc(t('replaceIt'))}: ${esc(t('version'))} ${d.version} · ${bdi(d.filename)}</button>`).join('')}
      <button class="btn" id="rpAdd">${esc(t('addAnother'))}</button>`);
    $('#dBody').querySelectorAll('[data-rp]').forEach(b=>b.onclick=()=>{ closeDrawer(); pick(slotId, meta, b.dataset.rp); });
    $('#rpAdd').onclick=()=>{ closeDrawer(); pick(slotId, meta, null); };
    return;
  }
  const p=$('#picker'); p.value='';
  p.onchange=async()=>{ if(!p.files[0]) return; const fd=new FormData(); fd.append('file',p.files[0]); fd.append('meta',JSON.stringify(meta)); if(replaces) fd.append('replaces', replaces);
    toast(t('uploading'));
    try{ const doc = await api(`/dossiers/${S.dossier.id}/slots/${encodeURIComponent(slotId)}/documents`,{method:'POST',body:fd});
      toast(t('uploaded')+' '+t(doc.check_status)); if(location.hash.endsWith('/publisher')){ S.sel=slotId; await publisherView(); } else await board(); if(doc.findings.length) openWhy(slotId); }
    catch(e){ toast(e.message); } };
  p.click();
}
function openWhy(slotId){
  const s=slotById(slotId);
  const locked = ['third_party_certificate','eda_document','executed_record','signed_scan'].includes(s.doc_class);
  const reasons = s.reasons.map(r=>`<div class="finding"><div>${esc(r[S.lang]||r.en)}</div><div class="code small muted">${esc(r.source||'')}</div></div>`).join('');
  const docs = s.documents.map(d=>`<div class="finding ${d.check_status==='non_conforming'?'block':''}">
     <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b><span class="muted">${esc(t('version'))} ${d.version}</span> · ${bdi(d.filename)}</b> ${chip(d.check_status)}</div>
     ${d.findings.length? d.findings.map(f=>`<div class="small">● ${esc(f[S.lang])} <span class="code muted">${esc(f.rule)}</span><br><span class="muted">${esc(t('act_'+f.action))}</span></div>`).join('') : (d.meta&&d.meta.external?'':`<div class="small muted">${esc(t('noFind'))}</div>`)}
     ${['third_party_certificate','eda_document'].includes(s.doc_class)||(d.meta&&d.meta.valid_until)?`<div class="toolbar"><label class="small" style="display:flex;gap:6px;align-items:center">${esc(t('validUntil'))} <input type="date" data-vu="${d.id}" value="${esc((d.meta&&d.meta.valid_until)||'')}"></label><button class="btn sm" data-vusave="${d.id}">${esc(t('saveDate'))}</button></div>`:''}
     ${d.meta&&d.meta.draft_unsigned?`<div class="alert"><p class="small"><b>${esc(t('unsignedDraft'))}</b> — ${esc(t('signHint'))}</p></div>`:''}
     ${d.meta&&d.meta.external?`<div class="alert"><p class="small"><b>${esc(t('extRef'))}</b> — ${esc(t('extHint'))}${d.meta.note?`<br>${bdi(d.meta.note)}`:''}</p></div>`:''}
     <div class="toolbar">${d.meta&&d.meta.external?`<a class="btn sm" target="_blank" rel="noopener noreferrer" href="${esc(/^https:\/\//.test(d.meta.url)?d.meta.url:'#')}">↗ ${esc(t('extOpen'))}</a><button class="btn sm pri" data-extup="${d.id}">⤒ ${esc(t('extUpload'))}</button>`:`<a class="btn sm" target="_blank" rel="noopener" href="/api/dossiers/${S.dossier.id}/documents/${d.id}/file">${esc(t('view'))}</a>`}
     ${d.findings.some(f=>f.action==='auto_fix')?`<button class="btn sm pri" data-fix="${d.id}">✦ ${esc(t('autofix'))}</button>`:''}
     ${d.meta&&d.meta.draft_unsigned?`<button class="btn sm pri" data-signed="${d.id}">⤒ ${esc(t('uploadSigned'))}</button>`:''}
     <button class="btn sm" data-wd="${d.id}">${esc(t('withdraw'))}</button></div></div>`).join('');
  openDrawer(s.title[S.lang], `<div class="toolbar"><span class="code">${esc(s.ctd)}</span>${s.ectd&&s.ectd.length?`<span class="code muted">eCTD ${esc(s.ectd.join(', '))}</span>`:''}${chip(s.status)}</div>
    ${locked?`<div class="alert"><p class="small">${esc(t('lockedNote'))}</p></div>`:''}
    <h3>${esc(t('reasons'))}</h3>${reasons}
    ${s.acceptance?`<h3>${esc(t('acceptT'))}</h3><div class="finding">${s.acceptance.split(/;\s+|\.\s+(?=[A-Z])/).filter(x=>x.trim()).map(x=>`<label class="small" style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox"><span dir="auto">${esc(x.trim().replace(/\.$/,''))}</span></label>`).join('')}</div>`:''}
    ${s.how||s.produced_by?`<div class="small">${s.produced_by?`<b>${esc(t('byT'))}:</b> ${bdi(s.produced_by)}`:''}${s.how?`<br><b>${esc(t('howT'))}:</b> <span dir="auto">${esc(s.how)}</span>`:''}</div>`:''}
    ${s.sources&&s.sources.length?`<div class="small muted"><b>${esc(t('sourcesT'))}:</b> <span class="code">${esc(s.sources.join(' · '))}</span>${s.provenance?` · ${esc(t('prov_'+s.provenance.replace(/-/g,'_')))}`:''}</div>`:''}${s.flags.length?`<div class="small muted code">${esc(s.flags.join(' · '))}</div>`:''}
    ${s.cross&&s.cross.length?`<h3>${esc(t('crossT'))}</h3>${s.cross.map(f=>`<div class="finding ${f.severity==='block'?'block':''}"><div>${esc(f[S.lang])} <span class="code muted">${esc(f.id)}</span></div><div class="small muted">${esc(f.source)}</div></div>`).join('')}`:''}
    ${s.documents.length?`<h3>${esc(t('docs'))}</h3>${docs}`:''}
    ${s.request?`<div class="alert"><p class="small"><b>${esc(t('reqOpen'))}</b> ${bdi(s.request.issuer)} · ${esc(t('due'))} ${new Date(s.request.due*1000).toLocaleDateString(S.lang==='ar'?'ar-EG':'en-GB')}${s.request.overdue?` · <b style="color:var(--bad)">${esc(t('overdue'))}</b>`:''}
      · <a href="/api/dossiers/${S.dossier.id}/requests/${s.request.id}/letter" target="_blank" rel="noopener">${esc(t('letter'))}</a></p></div>`:''}
    ${(s.level==='R'||s.level==='O')&&!['generated','company_letter'].includes(s.doc_class)&&(s.documents.some(d=>d.check_status==='non_conforming')||s.cross.length||!s.documents.length||s.documents.every(d=>d.meta&&d.meta.external))&&!s.request?

    try{ await api(`/dossiers/${S.dossier.id}/documents/${b.dataset.vusave}/validity`,{method:'PUT',headers:{'content-type':'application/json'},body:JSON.stringify({valid_until:v})});

function renderPublisher(){

  if(S.sel && !act.find(s=>s.slot_id===S.sel)) S.sel=null;

     <dt>${esc(t('pVer'))}</dt><dd>${leaf.version}</dd>
     <dt>${esc(t('pFile'))}</dt><dd>${bdi(leaf.filename)}</dd>
     <dt>${esc(t('pClass'))}</dt><dd class="code">${esc(leaf.doc_class)}</dd>
     <dt>${esc(t('pHash'))}</dt><dd class="code" style="white-space:normal">${esc(leaf.sha256.slice(0,16))}…</dd></dl>
     <div class="toolbar" style="padding:0 14px 14px">${leaf.external?`<a class="btn sm" target="_blank" rel="noopener noreferrer" href="${esc(/^https:\/\//.test(leaf.external)?leaf.external:'#')}">↗ ${esc(t('extOpen'))}</a>`:`<a class="btn sm" target="_blank" rel="noopener" href="/api/dossiers/${id}/documents/${leaf.doc_id}/file">${esc(t('view'))}</a>`}<button class="btn sm" data-why="${esc(leaf.slot_id)}">${esc(t('why'))}</button></div>`;
  $('#view').innerHTML = `<div class="head"><div><h1>${esc(t('publisher'))}</h1><p class="sub">${esc(t('pubSub'))}</p></div>
    <div class="toolbar"><span class="modeswitch"><a href="#/d/${id}/board">${esc(t('guided'))}</a><a class="on" href="#/d/${id}/publisher">${esc(t('navPublisher'))}</a></span>
    <div class="seg" role="group" aria-label="Output">${[['ctd','CTD'],['ectd32','eCTD 3.2.2'],['ectd40','eCTD 4.0']].map(([k,l])=>`<button data-out="${k}" class="${S.out===k?'on':''}">${l}</button>`).join('')}</div>
    <a class="btn pri" href="#/d/${id}/export">${esc(t('navExport'))}</a></div></div>

    n.ondragover=e=>{e.preventDefault(); n.classList.add('drop');};
    n.ondragleave=()=>n.classList.remove('drop');

  v.querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>startUpload(x.dataset.up));
  v.querySelectorAll('[data-why]').forEach(x=>x.onclick=()=>openWhy(x.dataset.why));
}
async function dropFiles(slotId, list){
  const s = slotById(slotId);
  if(!s || !(s.level==='R'||s.level==='O') || !list.length) return;
  if(needsMeta(s)) return startUpload(slotId);
  for(const f of list){ const fd=new FormData(); fd.append('file',f); fd.append('meta','{}');
    try{ await api(`/dossiers/${S.dossier.id}/slots/${encodeURIComponent(slotId)}/documents`,{method:'POST',body:fd}); toast(t('uploaded')); }
    catch(e){ toast(e.message); } }
  S.sel=slotId; publisherView();
}

/* ---------------- generators (schema-driven forms) */
S.gens = null;
async function loadGens(){ if(!S.gens) S.gens = await api('/generators'); return S.gens; }
function genFor(s){ if(!S.gens) return null; for(const [k,v] of Object.entries(S.gens)) if(v.req && v.req===s.req_id) return k; return null; }
async function genForm(kind, s, missing){
  await loadGens();
  const sch = S.gens[kind];
  const data = genForm.data && genForm.kind===kind && genForm.slot===s.slot_id ? genForm.data
             : await api(`/dossiers/${S.dossier.id}/generate/${kind}/prefill?slot_id=${encodeURIComponent(s.slot_id)}`);
  genForm.kind=kind; genForm.slot=s.slot_id; genForm.data=data;
  const miss = new Set(missing||[]);
  const lab = f => esc(f[S.lang]||f.en) + (f.required===false?` <span class="muted">(${esc(t('optional'))})</span>`:'');
  const input = (f, v, path) => f.type==='textarea' ? `<textarea dir="auto" data-p="${path}">${esc(v??'')}</textarea>`
     : f.type==='choice' ? `<select data-p="${path}"><option value=""></option>${f.choices.map(c=>`<option ${v===c?'selected':''}>${esc(c)}</option>`).join('')}</select>`
     : `<input type="text" dir="auto" inputmode="${f.type==='number'?'decimal':'text'}" data-p="${path}" value="${esc(v??'')}">`;
  const html = sch.fields.map(f=>{
    if(f.type!=='list') return `<label class="f ${miss.has(f.key)?'miss':''}"><span>${lab(f)}</span>${input(f, data[f.key], f.key)}</label>`;
    const rows = (data[f.key] && data[f.key].length) ? data[f.key] : (data[f.key]=[{}]);
    return `<div class="f ${[...miss].some(m=>m===f.key||m.startsWith(f.key+'['))?'miss':''}"><span class="small" style="font-weight:600;color:var(--muted)">${lab(f)}</span>
      <div class="rows tablewrap"><table><thead><tr>${f.item.map(i=>`<th>${lab(i)}</th>`).join('')}<th></th></tr></thead><tbody>
      ${rows.map((r,ri)=>`<tr>${f.item.map(i=>`<td class="${miss.has(`${f.key}[${ri}].${i.key}`)?'miss':''}">${input(i, r[i.key], `${f.key}.${ri}.${i.key}`)}</td>`).join('')}
        <td><button class="btn sm ghost" data-rm="${f.key}.${ri}" aria-label="${esc(t('remove'))}">✕</button></td></tr>`).join('')}</tbody></table></div>
      <div><button class="btn sm" data-add="${f.key}">＋ ${esc(t('addRow'))}</button></div></div>`;
  }).join('');
  openDrawer(sch.title[S.lang], `<p class="small muted">${esc(t('genSub'))}</p>${miss.size?`<div class="alert bad"><p class="small">${esc(t('fillMissing'))}</p></div>`:''}
    <div class="gform">${html}</div><div class="toolbar"><button class="btn pri" id="genGo">✦ ${esc(t('generate'))}</button></div>`);
  $('#drawer').classList.add('wide');
  const body=$('#dBody');
  const sync=()=>body.querySelectorAll('[data-p]').forEach(el=>{ const parts=el.dataset.p.split('.'); let v=el.value.trim();
      const fdef = parts.length===1? sch.fields.find(f=>f.key===parts[0]) : sch.fields.find(f=>f.key===parts[0]).item.find(i=>i.key===parts[2]);
      if(fdef && fdef.type==='number' && v!=='' && !isNaN(+v.replace(',','.'))) v=+v.replace(',','.');
      if(parts.length===1) data[parts[0]] = v===''?undefined:v; else { data[parts[0]][+parts[1]][parts[2]] = v===''?undefined:v; } });
  body.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{ sync(); data[b.dataset.add].push({}); genForm(kind, s, missing); });
  body.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ sync(); const [k,i]=b.dataset.rm.split('.'); data[k].splice(+i,1); genForm(kind, s, missing); });
  $('#genGo').onclick=async()=>{
    sync();
    for(const f of sch.fields) if(f.type==='list') data[f.key] = (data[f.key]||[]).filter(r=>Object.values(r).some(v=>v!==undefined&&v!==''));
    $('#genGo').disabled=true; $('#genGo').textContent=t('generating');
    try{ await api(`/dossiers/${S.dossier.id}/generate/${kind}`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({data, slot_id:s.slot_id})});
      genForm.data=null; $('#drawer').classList.remove('wide'); closeDrawer(); toast(t('genDone'));
      if(location.hash.endsWith('/publisher')){ S.sel=s.slot_id; await publisherView(); } else await board(); }
    catch(e){ if(e.detail && e.detail.request_data) return genForm(kind, s, e.detail.request_data); toast(e.message); $('#genGo').disabled=false; $('#genGo').textContent=t('generate'); }
  };
}

  $('#crossBox').innerHTML = `<div class="card pad"><h2>${esc(t('crossT'))}</h2>${cross.length? cross.map(f=>`<div class="finding ${f.severity==='block'?'block':''}" style="margin-top:8px">
     <div>${f.severity==='block'?'●':'○'} ${esc(f[S.lang])} <span class="code muted">${esc(f.id)}</span></div><div class="small muted">${esc(f.source)} · ${esc(t('act_'+f.action)||'')}</div></div>`).join('')
     : `<p class="small muted">✓ ${esc(t('crossNone'))}</p>`}</div>`;
}


/* ---------------- variations (P3) */
S.vsel = new Set(); S.vq = '';
async function varsView(){
  const r = await api(`/variations?q=${encodeURIComponent(S.vq)}`);
  const plan = S.vsel.size ? await api('/variations/plan',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify([...S.vsel])}) : null;
  S.lastPlan = plan;
  const pacChip = p => `<span class="chip ${p==='PAC-II'?'c-bad':p==='PAC-B'?'c-warn':p==='PAC-A'?'c-rec':'c-ok'}"><bdi>${esc(p)}</bdi></span>`;
  $('#view').innerHTML = `<div class="head"><div><h1>${esc(t('navVars'))}</h1><p class="sub">${esc(t('varsSub'))}</p>${t('enOnly')?`<p class="small muted">${esc(t('enOnly'))}</p>`:''}</div></div>
   <div class="two" style="display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px">
    <div class="card"><div class="pad"><input type="text" dir="auto" id="vq" placeholder="${esc(t('searchVar'))}" value="${esc(S.vq)}"></div>
     <div class="tablewrap" style="max-height:calc(100vh - 260px);overflow:auto"><table><tbody>
     ${r.items.map(v=>`<tr><td style="width:28px"><input type="checkbox" data-v="${v.id}" ${S.vsel.has(v.id)?'checked':''} aria-label="${esc(v.id)}"></td>
       <td><div dir="ltr" style="text-align:start">${esc(v.request)}</div><div class="small muted"><bdi>${esc(v.group)} · ${esc(v.type)}</bdi></div></td><td>${pacChip(v.pac)}</td></tr>`).join('')}
     </tbody></table></div></div>
    <div class="card pad" style="display:flex;flex-direction:column;gap:12px"><h2>${esc(t('plan'))}</h2>
     ${!plan?`<p class="muted">${esc(t('pickVars'))}</p>`:`<div class="kpis"><div class="card kpi br"><span class="n"><bdi>${esc(plan.class)}</bdi></span><span class="l">${esc(t('cls'))}</span></div>
       <div class="card kpi"><span class="n code" style="font-size:18px">${esc(plan.submission_type)}</span><span class="l">${esc(t('subType'))}</span></div>
       <div class="card kpi"><span class="n code" style="font-size:18px">${esc(plan.mode)}</span><span class="l">${esc(t('mode'))}</span></div></div>
       <p class="small muted" dir="ltr" style="text-align:start">${esc(plan.rule.en)} — ${esc(plan.rule.source)}</p>
       ${plan.items.map(i=>`<div class="finding"><div dir="ltr" style="text-align:start"><b>${esc(i.id)}</b> ${esc(i.request)} ${pacChip(i.pac)}</div>
         ${i.conditions.length?`<div class="small"><b>${esc(t('conditions'))}</b><ol dir="ltr" style="text-align:start;margin:4px 0">${i.conditions.map(c=>`<li>${esc(c)}</li>`).join('')}</ol></div>`:''}
         <div class="small"><b>${esc(t('requirements'))}</b>${i.requirements.length?`<ol dir="ltr" style="text-align:start;margin:4px 0">${i.requirements.map(c=>`<li>${esc(c)}</li>`).join('')}</ol>`:` <span class="muted">${esc(t('noReq'))}</span>`}</div>
         <div class="code small muted">${esc(i.source.doc)} #${i.source.row}</div></div>`).join('')}`}
    </div></div>`;
  const q=$('#vq'); let h; q.oninput=()=>{ clearTimeout(h); h=setTimeout(()=>{ S.vq=q.value; varsView().then(()=>{ const n=$('#vq'); n.focus(); n.setSelectionRange(n.value.length,n.value.length); }); },250); };
  document.querySelectorAll('[data-v]').forEach(c=>c.onchange=()=>{ c.checked?S.vsel.add(c.dataset.v):S.vsel.delete(c.dataset.v); varsView(); });
}

/* ---------------- export */
async function exportView(){
  const [g, hist] = await Promise.all([api(`/dossiers/${S.dossier.id}/gate`), api(`/dossiers/${S.dossier.id}/submissions`)]);
  const follow = hist.ectd32.length || hist.ectd40.length;
  const pl = S.lastPlan;
  const n32 = hist.ectd32.length ? String(+hist.ectd32[hist.ectd32.length-1].seq + 1).padStart(4,'0') : '0000';
  const n40 = hist.ectd40.length ? +hist.ectd40[hist.ectd40.length-1].seq + 1 : 1;
  const list=(k,arr)=>arr.length?`<div><b>${esc(t(k))} (${arr.length})</b><div class="small code" style="white-space:normal">${arr.map(esc).join(' · ')}</div></div>`:'';
  $('#view').innerHTML=`<div class="head"><div><h1>${esc(t('export'))}</h1><p class="sub">${esc(t('exportSub'))}</p></div></div>
   ${g.ok?`<div class="alert ok"><p>✓ ${esc(t('gateOk'))}</p></div>`:`<div class="alert bad"><p>${esc(t('gateBad'))}</p></div><div class="card pad" style="display:flex;flex-direction:column;gap:8px">${list('missingReq',g.missing_required)}${list('nonconf',g.non_conforming)}${list('unsignedL',g.unsigned||[])}${list('extL',g.external_only||[])}${(g.cross_blocking||[]).length?`<div><b>${esc(t('crossT'))} (${g.cross_blocking.length})</b>${g.cross_blocking.map(f=>`<div class="small">● ${esc(f[S.lang])}</div>`).join('')}</div>`:''}
     <div><a class="btn sm" href="#/d/${S.dossier.id}/board">${esc(t('navBoard'))}</a></div></div>`}
   <div class="card pad" style="display:flex;flex-direction:column;gap:10px">
     ${[['ctd',t('outCtd')],['ectd32',`eCTD 3.2.2 — ${t('seqDone')} ${n32}`],['ectd40',`eCTD 4.0 — ${t('seqDone')} ${n40}`]].map(([k,l])=>`<label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" data-out="${k}" checked> <span>${esc(l)}</span></label>`).join('')}
     ${follow?`<div class="card pad" style="box-shadow:none;display:flex;flex-direction:column;gap:10px"><h2>${esc(t('nextSeq'))}</h2>
       <p class="small muted">${esc(t('onlyChanges'))}${pl?' '+esc(t('fromPlan')):''}</p><div class="form">
       <label class="f"><span>${esc(t('subType'))}</span><select id="sqType">${['var-pac-n','var-pac-a','var-pac-b','var-pac-ii','renewal','5yr','pacstab','paccadc','withdrawal','none'].map(o=>`<option ${pl&&pl.submission_type===o?'selected':''}>${o}</option>`).join('')}</select></label>
       <label class="f"><span>${esc(t('unit'))}</span><select id="sqUnit">${['initial','response','validation-response','additional-info','corrigendum','reformat'].map(o=>`<option>${o}</option>`).join('')}</select></label>
       <label class="f"><span>${esc(t('mode'))}</span><select id="sqMode">${['single','grouping','parallel-single','parallel-grouping'].map(o=>`<option ${pl&&pl.mode===o?'selected':''}>${o}</option>`).join('')}</select></label>
       <label class="f"><span>${esc(t('trackNo'))}</span><input type="text" dir="auto" id="sqTrack" placeholder="P-VAR-PAC-B-0001"></label>
       <label class="f"><span>${esc(t('descr'))}</span><input type="text" dir="auto" id="sqDesc" value="${esc(pl?pl.items.map(i=>i.request).join('; ').slice(0,200):'')}"></label></div></div>
     <div class="card pad" style="box-shadow:none"><h2>${esc(t('history'))}</h2><div class="tablewrap"><table><thead><tr><th>eCTD</th><th>${esc(t('seqDone'))}</th><th>${esc(t('subType'))}</th><th>${esc(t('unit'))}</th><th>${esc(t('descr'))}</th></tr></thead><tbody>
       ${[['3.2.2',hist.ectd32],['4.0',hist.ectd40]].flatMap(([k,a])=>a.map(h=>`<tr><td>${k}</td><td class="code">${esc(h.seq)}</td><td class="code">${esc(h.envelope.type)}</td><td>${esc(h.envelope.unit)}</td><td>${bdi(h.envelope.description||'')}</td></tr>`)).join('')}</tbody></table></div></div>`:''}
     <label class="alert" style="cursor:pointer"><input type="checkbox" id="ack"> <p class="small">${esc(t('ack'))}</p></label>
     <div><button class="btn pri" id="go" ${g.ok?'':'disabled'}>${esc(t('doExport'))}</button></div></div><div id="res"></div>`;
  $('#go').onclick=async()=>{ const outs=[...document.querySelectorAll('[data-out]:checked')].map(c=>c.dataset.out);
    $('#go').disabled=true; $('#go').textContent=t('exporting');
    try{ const r=await api(`/dossiers/${S.dossier.id}/export`,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({outputs:outs,acknowledge_provisional:$('#ack').checked,
        submission: follow? {type:$('#sqType').value, unit:$('#sqUnit').value, mode:$('#sqMode').value, tracking:$('#sqTrack').value.trim()||null, description:$('#sqDesc').value.trim()||null} : null})});
      const val = Object.entries(r.validation||{}).map(([k,v])=>`<div class="alert ${v.ok?'ok':'bad'}"><p><b>${esc(k)}</b> — ${esc(v.label)}<br><span class="small">${esc(t('vPass'))} ${v.counts.pass} · ${esc(t('vFail'))} ${v.counts.fail} · ${esc(t('vWarn'))} ${v.counts.warning} · ${esc(t('vNotRun'))} ${v.counts.not_run}</span></p></div>`).join('');
      const sq = Object.entries(r.sequences||{}).map(([k,v])=>`<div class="small"><b>${k==='ectd32'?'eCTD 3.2.2':'eCTD 4.0'}</b> · ${esc(t('seqDone'))} <span class="code">${esc(v.sequence)}</span> · ${esc(t('opsL'))}: ${v.operations.new} / ${v.operations.replace} / ${v.operations.delete}</div>`).join('');
      $('#res').innerHTML=`<div class="card pad" style="display:flex;flex-direction:column;gap:10px"><h2>${esc(t('downloads'))}</h2>${sq}<div class="dl">${Object.entries(r.downloads).map(([k,u])=>`<a class="btn" href="${esc(u)}" download>⤓ ${esc(k)}.zip</a>`).join('')}
        ${r.report?`<a class="btn" href="${esc(r.report)}" target="_blank" rel="noopener">${esc(t('vReport'))}</a>`:''}</div>${val}<p class="small muted">${esc(r.label)}</p></div>`;
    }catch(e){ $('#res').innerHTML=`<div class="alert bad"><p>${esc(e.message)}</p></div>`; }
    finally{ $('#go').disabled=false; $('#go').textContent=t('doExport'); } };
}

/* ---------------- audit */
async function auditView(){
  const a = await api(`/dossiers/${S.dossier.id}/audit`);
  $('#view').innerHTML=`<div class="head"><div><h1>${esc(t('audit'))}</h1><p class="sub">${esc(t('auditSub'))}</p></div></div>
   <div class="card"><div class="tablewrap"><table><thead><tr><th>${esc(t('when'))}</th><th>${esc(t('event'))}</th><th>${esc(t('detail'))}</th></tr></thead><tbody>
   ${a.slice().reverse().map(x=>`<tr><td class="code">${new Date(x.ts*1000).toLocaleString(S.lang==='ar'?'ar-EG':'en-GB')}</td><td class="code">${esc(x.event)}</td>
     <td class="small"><span class="code" style="white-space:normal">${esc(JSON.stringify(x.detail))}</span>
     ${x.event==='document.withdrawn'?` <button class="btn sm" data-rs="${esc(x.detail.doc)}">${esc(t('restore'))}</button>`:''}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('#view').querySelectorAll('[data-rs]').forEach(b=>b.onclick=async()=>{ await api(`/dossiers/${S.dossier.id}/documents/${b.dataset.rs}/restore`,{method:'POST'}); auditView(); });
}
setLang(S.lang);
</script>
</body>
