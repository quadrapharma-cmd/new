<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dossier Builder — منشئ ملفات التسجيل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/ds.css">
<style>
.jbar{display:flex;gap:6px;overflow-x:auto;padding:6px 8px;align-items:center;scrollbar-width:thin}
.jbar a{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--muted);text-decoration:none;white-space:nowrap;font-size:12.5px;flex:none}
.jbar a .k{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface-3);font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.jbar a.done{color:var(--ok)} .jbar a.done .k{background:var(--ok-soft);color:var(--ok)}
.jbar a.now{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 45%,transparent);background:var(--brand-soft);font-weight:650} .jbar a.now .k{background:var(--brand);color:var(--brand-ink)}
.jbar a.bad{color:var(--bad)} .jbar a.bad .k{background:var(--bad-soft);color:var(--bad)}
.jbar a.warn{color:var(--warn)} .jbar a.warn .k{background:var(--warn-soft);color:var(--warn)}
.jbar .arrow{color:var(--faint);flex:none}
.wiz{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px;align-items:start}
@media (max-width:1000px){.wiz{grid-template-columns:minmax(0,1fr)}}
.wiz>*{min-width:0}
.pv .n{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums;color:var(--brand)}
.pv .mods{display:flex;flex-direction:column;gap:6px}
.pv .mod{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12.5px}
.pv .mod .code{color:var(--muted)}
.reqlist details{border-top:1px solid var(--line)} .reqlist summary{padding:9px 0;cursor:pointer;font-weight:650;font-size:13px;display:flex;gap:8px;align-items:center}
.reqlist .r{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 0;font-size:12.5px;border-top:1px dashed var(--line)}
.statline{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)} .statline b{color:var(--ink)}
.outcard{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.outcard .code{font-size:11.5px}
/* Regulatory Reviewer (review desk · workspace · letter) — page layer on top of ds.css. Layout: app shell (rail + top + view); the desk reads top-down
   (verdict strip → departments → clock → KPIs); the workspace is three panes (tree · questions · evidence). */
.sim{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted);border:1px dashed var(--line-2);border-radius:999px;padding:2px 10px;font-family:var(--f-mono)}
.sim::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--wait)}
.vstrip{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;padding:18px 22px;border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(135deg,color-mix(in srgb,var(--v-color,var(--warn)) 14%,var(--surface)),var(--surface) 70%);box-shadow:var(--shadow)}
.vstrip .vlabel{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono)}
html[lang="ar"] .vstrip .vlabel{letter-spacing:0;text-transform:none}
.vstrip h1{font-size:22px;color:var(--v-color,var(--warn))}
.vstrip .why{color:var(--ink-2);margin-top:4px;max-width:70ch}
.vstrip .ring{--size:84px} .vstrip .ring b{font-size:17px}
.vstrip .acts{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.depts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.dept{display:flex;flex-direction:column;gap:10px;padding:14px 16px;text-align:start;cursor:pointer;color:inherit;font:inherit;transition:transform .15s,border-color .15s}
.dept:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.dept .dh{display:flex;align-items:center;gap:10px}
.dept .dh h3{flex:1;min-width:0;font-size:14px}
.dept .dh .ic-tile{width:32px;height:32px;border-radius:9px}
.dept .sub{font-size:12px;margin:0}
.sevs{display:flex;gap:6px;flex-wrap:wrap}
.sev{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--muted);font-family:var(--f-mono)}
.sev::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--na)}
.sev.critical::before{background:var(--bad)} .sev.major::before{background:var(--warn)} .sev.minor::before{background:var(--info)} .sev.na::before{background:var(--wait)}
.sev b{color:var(--ink)}
.dept .prog{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)} .dept .prog .meter{flex:1}
.clock{display:flex;flex-wrap:wrap;gap:8px 0;padding:4px 2px}
.clock .st{flex:1 1 128px;position:relative;padding:12px 14px 12px 0;display:flex;flex-direction:column;gap:5px;min-width:0}
.clock .st .k{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-2);font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.clock .st::after{content:"";position:absolute;top:26px;inset-inline-start:34px;inset-inline-end:-2px;height:1px;background:var(--line-2)}
.clock .st:last-child::after{display:none}
.clock .st b{font-size:13px} .clock .st .wd{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.clock .st.now .k{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);box-shadow:0 0 0 4px var(--brand-soft)}
.clock .st.stop .k{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn)}
.clock .st.stop b{color:var(--warn)}
.clock .st.end .k{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ok)}
.runbox{display:flex;flex-direction:column;gap:10px}
.runbox .rstep{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13px}
.runbox .rstep .k{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-3);font-size:11px;font-family:var(--f-mono);color:var(--muted)}
.runbox .rstep.done .k{background:var(--ok-soft);color:var(--ok)} .runbox .rstep.now .k{background:var(--brand);color:var(--brand-ink)}
.runbox .rstep .res{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.ws{display:grid;grid-template-columns:270px minmax(0,1fr) 330px;gap:14px;align-items:start}
.ws>.card{min-height:200px}
.ws .tree{max-height:calc(100vh - 230px);overflow:auto}
.ws .tree summary .dot{margin-top:0}
.qlist{display:flex;flex-direction:column;gap:12px}
.qcard{border:1px solid var(--line);border-radius:12px;background:var(--surface-2);padding:12px 14px;display:flex;flex-direction:column;gap:9px;border-inline-start:3px solid var(--line-2)}
.qcard.deficient.critical{border-inline-start-color:var(--bad)} .qcard.deficient.major{border-inline-start-color:var(--warn)} .qcard.deficient.minor{border-inline-start-color:var(--info)}
.qcard.adequate{border-inline-start-color:var(--ok)} .qcard.not_assessable{border-inline-start-color:var(--wait)}
.qcard .qh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qcard .qh .code{color:var(--muted)}
.qcard .q{font-weight:600;font-size:14px}
.qcard .ev{display:flex;flex-direction:column;gap:6px}
.evi{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start;padding:7px 10px;border-radius:9px;background:var(--surface);border:1px solid var(--line);cursor:pointer;text-align:start;font:inherit;color:inherit}
.evi:hover,.evi.on{border-color:color-mix(in srgb,var(--brand) 50%,var(--line))}
.evi .m{font-size:11.5px;color:var(--muted);font-family:var(--f-mono);direction:ltr;text-align:start;display:flex;gap:8px;flex-wrap:wrap}
.evi .x{font-size:12.5px;color:var(--ink-2);line-height:1.5}
.evi .x mark{background:color-mix(in srgb,var(--warn) 30%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.evi.data .m{color:var(--accent)}
.fnd{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:9px;background:var(--surface);border:1px solid var(--line)}
.fnd .en{direction:ltr;text-align:start;font-size:13px;line-height:1.5}
.fnd .ar{direction:rtl;text-align:start;font-size:13px;color:var(--ink-2);font-family:var(--f-ar)}
.fnd .src{font-size:11.5px;color:var(--muted);font-family:var(--f-mono);direction:ltr;text-align:start}
.qcard .qa{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ai{border:1px dashed color-mix(in srgb,var(--accent) 55%,transparent);background:var(--accent-soft);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ai .aih{display:flex;gap:8px;align-items:center;color:var(--accent);font-weight:650;font-size:12.5px}
.ai .conf{margin-inline-start:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
.viewer{display:flex;flex-direction:column;gap:10px;position:sticky;top:calc(var(--top-h) + 14px)}
.viewer .vh{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:12.5px}
.viewer .vh .code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.page{margin:0 14px 14px;background:#fff;color:#1a2230;border-radius:6px;box-shadow:0 1px 0 rgba(0,0,0,.2),0 10px 30px rgba(0,0,0,.35);padding:22px 20px;font-family:"IBM Plex Sans",Georgia,serif;font-size:11.5px;line-height:1.6;direction:ltr;text-align:left;min-height:300px;position:relative;overflow:hidden}
:root[data-theme="light"] .page{box-shadow:0 1px 2px rgba(15,27,42,.12),0 8px 22px rgba(15,27,42,.12);border:1px solid #d7dee7}
.page .ph{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#6b7686;display:flex;justify-content:space-between;border-bottom:1px solid #e3e8ee;padding-bottom:6px;margin-bottom:10px}
.page h4{margin:0 0 6px;font-size:12.5px;color:#0f1b2a}
.page p{margin:0 0 7px}
.page mark{background:#ffe08a;color:#1a2230;padding:0 2px;border-radius:2px;box-shadow:0 0 0 2px #ffe08a}
.page .skel{height:7px;background:#e6ebf1;border-radius:3px;margin:6px 0}
.page .skel.s{width:60%} .page .skel.m{width:85%}
.page .pn{position:absolute;bottom:8px;right:12px;font-size:9px;color:#8a96a6}
.letter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:28px 32px;direction:ltr;text-align:left;font-size:13.5px;line-height:1.6;max-width:900px;box-shadow:var(--shadow)}
.letter .lh{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px;flex-wrap:wrap}
.letter .lh .ref{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}
.letter h2{font-size:16px;margin:0 0 4px}
.letter .meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:12px 0;font-size:13px}
.letter .meta dt{color:var(--muted)} .letter .meta dd{margin:0}
.letter h3{font-size:13px;margin:16px 0 8px;color:var(--brand);text-transform:uppercase;letter-spacing:.06em;font-family:var(--f-mono)}
.letter ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:10px}
.letter li{padding-left:4px}
.letter li .ar{direction:rtl;text-align:right;color:var(--ink-2);font-family:var(--f-ar);margin-top:3px}
.letter li .lm{display:flex;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:11.5px;font-family:var(--f-mono);color:var(--muted)}
.letter .sign{margin-top:22px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.letter .stamp{display:inline-block;border:2px solid var(--wait);color:var(--wait);border-radius:8px;padding:4px 10px;font-family:var(--f-mono);font-size:11px;transform:rotate(-3deg);letter-spacing:.08em}
.sevtag{font-family:var(--f-mono);font-size:11px;border-radius:5px;padding:0 7px;line-height:20px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sevtag.critical{background:var(--bad-soft);color:var(--bad)} .sevtag.major{background:var(--warn-soft);color:var(--warn)} .sevtag.minor{background:var(--info-soft);color:var(--info)} .sevtag.note{background:var(--na-soft);color:var(--muted)}
.otag{font-family:var(--f-mono);font-size:11px;border:1px solid var(--line-2);border-radius:5px;padding:0 6px;line-height:20px;color:var(--muted)}
.otag.ai{border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent)}
.otag.human{border-color:color-mix(in srgb,var(--brand) 55%,transparent);color:var(--brand)}
.vbars{display:flex;flex-direction:column;gap:10px}
.vbar{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:12px;align-items:center;font-size:13px}
.vbar .meter{height:8px}
.vbar .n{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.impact{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.impact:last-child{border-bottom:0}
.impact .d{font-size:12.5px;color:var(--muted)}
.impact .delta{font-family:var(--f-mono);font-size:12px;color:var(--ok);white-space:nowrap}
.tl{display:flex;flex-direction:column;gap:0}
.tl .ti{display:grid;grid-template-columns:120px 18px minmax(0,1fr);gap:0 12px;align-items:start;position:relative;padding-bottom:14px}
.tl .ti::before{content:"";position:absolute;inset-inline-start:128px;top:16px;bottom:0;width:2px;background:var(--line)}
.tl .ti:last-child::before{display:none}
.tl .ti .dt{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px;direction:ltr;text-align:end}
.tl .ti .pt{width:12px;height:12px;border-radius:50%;background:var(--surface-3);border:2px solid var(--line-2);margin:3px 3px 0}
.tl .ti.now .pt{background:var(--brand);border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.tl .ti.stop .pt{background:var(--warn-soft);border-color:var(--warn)}
.tl .ti.end .pt{background:var(--ok-soft);border-color:var(--ok)}
.tl .ti b{font-size:13px} .tl .ti span{display:block;font-size:12px;color:var(--muted)}
.rtable td .st-open{color:var(--warn)} .rtable td .st-answered{color:var(--info)} .rtable td .st-accepted{color:var(--ok)} .rtable td .st-not_accepted{color:var(--bad)}
.due{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.due.late{color:var(--bad)} .due.soon{color:var(--warn)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.stepper{display:flex;gap:8px;flex-wrap:wrap}
.stepper .s{display:inline-flex;gap:7px;align-items:center;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:12.5px;color:var(--muted)}
.stepper .s.done{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)} .stepper .s.now{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 45%,transparent);background:var(--brand-soft);font-weight:650}
.gate{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:16px 18px;border-radius:12px;border:1px solid var(--line)}
.gate.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)} .gate.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.gate h3{font-size:15px} .gate p{color:var(--ink-2);font-size:13px}
.tiny-note{font-size:11.5px;color:var(--faint)}
.seg.wrapseg{flex-wrap:wrap}
@media (max-width:1180px){.ws{grid-template-columns:250px minmax(0,1fr)} .ws .viewer{grid-column:1/-1;position:static}}
@media (max-width:900px){.ws{grid-template-columns:1fr} .ws .tree{max-height:260px} .vstrip{grid-template-columns:1fr} .vstrip .acts{flex-direction:row;flex-wrap:wrap} .vbar{grid-template-columns:110px minmax(0,1fr) auto} .letter{padding:18px 16px} .tl .ti{grid-template-columns:86px 18px minmax(0,1fr)} .tl .ti::before{inset-inline-start:94px}}

.rolebar{margin:10px 20px 0}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--accent) 22%,transparent)}100%{background:transparent}}.flash,.flash>td{animation:flash 2.2s ease}
.cmp-removed{color:var(--bad);text-decoration:line-through}.cmp-added{color:var(--ok)}
ul.cond{margin:6px 0 0;padding-inline-start:18px;display:grid;gap:3px}ul.cond li.src{list-style:none;margin-inline-start:-18px;color:var(--muted)}details.cond>summary{cursor:pointer;color:var(--accent)}
.doccards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}.doccard{border:1px solid var(--line)}.doccard.ok{border-color:var(--ok)}.doccard.bad{border-color:var(--bad)}
.docline{margin-top:4px;padding:4px 6px;border-radius:6px;background:var(--surface-2)}
.docprev{background:#fff;color:#111;border:1px solid var(--line);border-radius:6px;padding:22px 26px;margin:8px 0;font:14px/1.6 Arial,"Noto Naskh Arabic",sans-serif;box-shadow:var(--shadow-sm)}
.docprev h2{margin:4px 0 2px;font-size:18px;color:#111}.docprev h3{margin:14px 0 4px;font-size:14px;color:#222;border-bottom:1px solid #ddd;padding-bottom:2px}
.docprev .dp-meta{font-size:11px;color:#666;font-family:var(--f-mono)}.docprev .dp-lh{border:1px dashed #bbb;color:#888;text-align:center;padding:8px;font-size:12px;margin-bottom:10px}
.docprev .dp-p{margin:4px 0;min-height:1.4em}.docprev .ex,.docprev .ex td,.docprev .ex li,.docprev td.ex{color:#8a8a8a;font-style:italic}
.docprev [contenteditable]:focus{outline:2px solid var(--brand);background:#fffbe6;color:#111;font-style:normal}
.docprev table{border-collapse:collapse;width:100%;font-size:12.5px;margin:4px 0;color:inherit}.docprev th,.docprev td{border:1px solid #cfcfcf;padding:4px 6px;text-align:start;vertical-align:top;background:#fff;color:inherit}.docprev th{background:#f3f4f6;font-weight:600;color:#222}
.docprev .dp-f th{width:34%}.docprev .dp-hint{font-size:11px;color:#9a9a9a;margin-top:2px}.docprev .dp-sign{margin-top:18px;border-top:1px solid #999;padding-top:6px;font-size:12px;color:#555;width:70%}
.docprev .dp-gaps{margin-top:12px;background:#fff4e5;border:1px solid #f0c48a;color:#7a4a00;padding:6px 8px;border-radius:4px;font-size:12px}.docprev .dp-legend{font-size:11px;color:#999;margin-top:8px}
.docprev .dp-add{margin:4px 0;color:#444;border-color:#ccc;background:#fafafa}.docprev.mock .dp-must{margin:4px 18px;padding:0}.docprev.mock .dp-must li{margin:2px 0;list-style:none}
.docprev .dp-stamp{float:inline-end;border:2px solid #b42318;color:#b42318;border-radius:50%;padding:14px 10px;font-size:11px;transform:rotate(-8deg);opacity:.75;max-width:120px;text-align:center}
body[data-role="viewer"] .btn.pri{opacity:.55}
body[data-role="editor"] .admin-only,body[data-role="viewer"] .admin-only{display:none}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Main">
    <a class="logo" href="#/"><span class="tile">DB</span><span><span class="name" data-t="appName"></span><span class="tag">EDA · CTD / eCTD</span></span></a>
    <nav class="nav" id="nav"></nav>
    <div class="foot"><span class="led" data-t="localNote"></span><span class="code" id="verTag"></span></div>
  </aside>
  <main class="main">
    <div class="top">
      <select class="mobnav btn" id="mobnav" aria-label="Navigate"></select>
      <div class="crumb" id="crumb"></div>

const NAV_BASE = [['home','#/','home','navHome'],['dossiers','#/dossiers','layers','navDossiers'],['variations','#/variations','branch','navVars'],['package','#/package','shield','navPkg'],['suite','/suite/','folder','navSuite']];

function nav(r){
  S.navR = r;
  const id = S.dossier && S.dossier.id;
  const au = S.dossier && S.dossier.authority, eg = !au || au.egypt, dnav = DNAV.filter(([k])=>eg||k!=='review');      // the review desk reads Egypt's assessor rules
  DNAV.forEach(([k])=>{ const a=$('#nav'+k[0].toUpperCase()+k.slice(1)); a.href = id?`#/d/${id}/${k}`:'#'; a.setAttribute('aria-disabled', id?'false':'true'); a.hidden = !eg && k==='review'; });
  $$('#nav a').forEach(a=>a.classList.toggle('on', a.dataset.r===r));
  if(S.caps) $('#verTag').textContent = `v${S.caps.version} · ${(S.dossier&&S.dossier.pack)||S.caps.pack.id}`;          // the rules in use: the open dossier's own
  const m=$('#mobnav');
  m.innerHTML = navItems().map(([k,h,_,tk])=>`<option value="${h}" ${k===r?'selected':''}>${esc(t(tk))}</option>`).join('')
    + (id? dnav.map(([k,_,tk])=>`<option value="#/d/${id}/${k}" ${k===r?'selected':''}>— ${esc(t(tk))}</option>`).join('') : '');
  m.onchange=()=>{ if(m.value.startsWith('#')) location.hash=m.value; else location.href=m.value; };
  const sec = DNAV.find(x=>x[0]===r);
  $('#crumb').innerHTML = S.dossier ? `${bdi(S.dossier.name)}${au&&!eg?` <span class="tag" id="crumbAu" title="${esc(L(au.name))}">${icon('globe',11)} ${esc(au.country_name?L(au.country_name):au.id)}</span>`:''}${sec?`<span class="sep">/</span><span class="muted">${esc(t(sec[2]))}</span>`:''}` : esc(t('appName'));
}
async function route(){
  const tok = ++S.rt;
  const h = location.hash.replace(/^#/,'') || '/';
  const m = h.match(/^\/d\/([^/]+)\/(guide|prepare|board|data|publisher|checks|search|export|audit|review)(?:\/([a-z]+))?$/);
  asstFab(m?m[1]:null);
  try{
    if(h==='/new'){ S.dossier=null; nav('dossiers'); return wizard(); }
    if(h==='/variations'){ S.dossier=null; nav('variations'); return varsView(tok); }
    if(h==='/package'){ S.dossier=null; nav('package'); return packageView(tok); }
    if(h==='/dossiers'){ S.dossier=null; nav('dossiers'); return dossiersView(tok); }
    if(h==='/users'){ S.dossier=null; nav('users'); return usersView(tok); }
    if(!m){ S.dossier=null; nav('home'); return home(tok); }
    if(!S.dossier || S.dossier.id!==m[1]) S.dossier = await api(`/dossiers/${m[1]}`);
    if(tok!==S.rt) return;
    nav(m[2]);
    if(m[2]==='guide') return guideView(tok);
    if(m[2]==='board') return board(tok);
    if(m[2]==='export') return exportView(tok);
    if(m[2]==='publisher') return publisherView(tok);
    if(m[2]==='data') return dataView(tok);
    if(m[2]==='checks') return checksView(tok);
    if(m[2]==='search') return searchView(tok);
    if(m[2]==='prepare') return prepareView(tok);
    if(m[2]==='review') return reviewView(tok, m[3]||'desk');
    return auditView(tok);
  }catch(e){ if(tok===S.rt) $('#view').innerHTML = `<div class="alert bad">${icon('alert')}<p><b>${esc(t('err'))}:</b> ${esc(e.message)}</p></div>`; }
}

const isAdmin = () => !S.me || !S.me.auth || S.me.role==='admin';
const ROLE_CHIP = {admin:'c-ok', editor:'c-rec', viewer:'c-wait', disabled:'c-bad'};
function pwForm(ids, withOld){ return `<div class="form">${withOld?`<label class="f"><span>${esc(t('curPw'))}</span><input type="password" id="${ids}Old" dir="ltr" autocomplete="current-password"></label>`:''}
  <label class="f"><span>${esc(t('newPw'))}</span><input type="password" id="${ids}New" dir="ltr" autocomplete="new-password"></label>
  <label class="f"><span>${esc(t('password2'))}</span><input type="password" id="${ids}New2" dir="ltr" autocomplete="new-password"></label></div><p class="small muted">${esc(t('pwRule'))}</p>`; }
function pwCheck(ids){ const p=$(`#${ids}New`).value; if(p.length<10){ toast(t('pwRule')); $(`#${ids}New`).focus(); return null; }
  if(p!==$(`#${ids}New2`).value){ toast(t('pwMismatch')); $(`#${ids}New2`).focus(); return null; } return p; }
async function changeMyPw(ids){ const p=pwCheck(ids); if(!p) return false;
  try{ await api('/me/password',{method:'POST',json:{old:$(`#${ids}Old`).value,new:p}}); toast(t('pwChanged')); return true; }catch(e){ toast(e.message); return false; } }
function pwDrawer(){ openDrawer(t('myPw'), `${pwForm('pw',true)}<div class="acts"><button class="btn pri" id="pwGo">${icon('key',14)} ${esc(t('resetPw'))}</button></div>`);
  $('#pwGo').onclick=async()=>{ if(await changeMyPw('pw')) closeDrawer(); }; }
async function refreshMe(){ const [m,a]=await Promise.all([api('/me'), api('/auth')]); S.me=m; S.auth=a; paintMe(); paintNav(); if(S.navR) nav(S.navR); }
/* backups (updates list, item 28): for whoever runs the workspace — an administrator, or anyone while sign-in is off */
const backupCard=()=>`<section class="card pad stack gap-s" id="bkCard" style="max-width:820px"><div class="row gap-s" style="flex-wrap:wrap"><b>${esc(t('bkT'))}</b><span class="grow"></span><button class="btn sm pri" id="bkMake">${icon('download',14)} ${esc(t('bkMake'))}</button></div>
  <p class="small muted" id="bkSub"></p><div id="bkList" class="small muted">…</div><div id="bkOut"></div></section>`;
async function wireBackups(){ const box=$('#bkList'); if(!box) return; let r;
  try{ r=await api('/backups'); }catch(e){ box.textContent=e.message; return; }
  if(!$('#bkList')) return;
  $('#bkSub').textContent=t(r.auto?'bkSubAuto':'bkSubManual').replace('{h}', r.every_hours).replace('{k}', r.keep);
  box.innerHTML = r.items.length ? `<div class="tablewrap"><table id="bkTable"><thead><tr><th>${esc(t('bkName'))}</th><th class="hide-m">${esc(t('bkSize'))}</th><th></th></tr></thead><tbody>${r.items.map(b=>`<tr><td><span class="code small" dir="ltr">${esc(b.name)}</span><div class="small muted">${tsL(b.made)}</div></td><td class="hide-m code small">${(b.size/1048576).toFixed(1)} MB</td>
    <td class="end"><div class="row gap-s" style="justify-content:flex-end"><button class="btn sm" data-drill="${esc(b.name)}">${icon('check',14)} ${esc(t('bkDrill'))}</button><a class="btn sm ghost" href="/api/backups/${encodeURIComponent(b.name)}" download="${esc(b.name)}">${icon('download',14)} ${esc(t('bkGet'))}</a></div></td></tr>`).join('')}</tbody></table></div>` : esc(t('bkNone'));
  $$('[data-drill]').forEach(b=>b.onclick=async()=>{ b.disabled=true; $('#bkOut').innerHTML=`<p class="small muted">${esc(t('bkDrilling'))}</p>`;
    try{ const d=await api(`/backups/${encodeURIComponent(b.dataset.drill)}/drill`,{method:'POST'});
      $('#bkOut').innerHTML = d.ok ? `<div class="alert ok">${icon('check')}<p>${esc(t('bkOk').replace('{n}', d.documents))}</p></div>`
        : `<div class="alert bad">${icon('alert')}<p>${esc(t('bkBad'))}: ${esc([d.integrity!=='ok'?t('bkDb')+' ('+d.integrity+')':'', d.missing.length?t('bkMissing')+' '+d.missing.length:'', d.altered.length?t('bkAltered')+' '+d.altered.length:'', d.audit_ok?'':t('bkAudit')].filter(Boolean).join(' · '))}</p></div>`; }
    catch(e){ $('#bkOut').innerHTML=`<div class="alert bad">${icon('alert')}<p>${esc(e.message)}</p></div>`; } finally{ b.disabled=false; } });
  const mk=$('#bkMake'); if(mk) mk.onclick=async()=>{ mk.disabled=true; try{ const n=await api('/backups',{method:'POST'}); toast(t('bkMade').replace('{n}', n.name)); await wireBackups(); }catch(e){ toast(e.message); } finally{ mk.disabled=false; } }; }

/* the program's qualification (updates list, item 33): IQ and OQ run here, the PQ protocol to run on a product of the company */
const qualCard=()=>`<section class="card pad stack gap-s" id="qCard" style="max-width:820px"><div class="row gap-s" style="flex-wrap:wrap"><b>${esc(t('qT'))}</b><span class="grow"></span><button class="btn sm" id="qRun">${icon('shield',14)} ${esc(t('qRun'))}</button></div>
  <p class="small muted">${esc(t('qSub'))}</p><div id="qOut"></div></section>`;
function wireQual(){ const b=$('#qRun'); if(!b) return; b.onclick=async()=>{ b.disabled=true; $('#qOut').innerHTML=`<p class="small muted">${esc(t('qBusy'))}</p>`;
  try{ const r=await api('/qualification',{method:'POST'}); const bad=[...r.iq,...r.oq].filter(x=>x.result==='fail');
    $('#qOut').innerHTML=`<div class="row gap-s small" style="flex-wrap:wrap"><span class="chip ${r.summary.iq.fail?'c-bad':'c-ok'}"><i></i>IQ ${r.summary.iq.pass}/${r.summary.iq.pass+r.summary.iq.fail}</span><span class="chip ${r.summary.oq.fail?'c-bad':'c-ok'}"><i></i>OQ ${r.summary.oq.pass}/${r.summary.oq.pass+r.summary.oq.fail}</span>
      <a class="btn sm pri" href="/api/qualification/${encodeURIComponent(r.docx)}" download="${esc(r.docx)}">${icon('download',14)} ${esc(t('qGet'))}</a></div>
      ${bad.length?`<div class="alert bad">${icon('alert')}<div>${bad.map(x=>`<div class="small"><b class="code">${esc(x.id)}</b> ${esc(x.requirement)} — ${esc(x.actual)}</div>`).join('')}</div></div>`:`<div class="alert ok">${icon('check')}<p class="small">${esc(t('qOk'))}</p></div>`}`; }
  catch(e){ $('#qOut').innerHTML=`<div class="alert bad">${icon('alert')}<p>${esc(e.message)}</p></div>`; } finally{ b.disabled=false; } }; }

async function usersView(tok){
  const [a, me] = await Promise.all([api('/auth'), api('/me')]); S.auth=a; S.me=me; paintMe(); paintNav(); nav('users');   // the screen depends on who is asking: never on a stale or not-yet-loaded /me
  const head=`<div class="head"><div class="title"><h1>${esc(t('users'))}</h1><p class="sub">${esc(t('usersSub'))}</p></div></div>`;
  const legend=`<section class="card pad stack gap-s"><b>${esc(t('rolesT'))}</b><div class="grid2">${['admin','editor','viewer','disabled'].map(r=>`<div class="row gap-s" style="align-items:flex-start"><span class="chip ${ROLE_CHIP[r]}"><i></i>${esc(t('role_'+r))}</span><span class="small muted">${esc(t('roleD_'+r))}</span></div>`).join('')}</div></section>`;
  const myPw=cls=>`<section class="card pad stack gap-s" style="max-width:520px"><b>${esc(t('myPw'))}</b>${pwForm('mp',true)}<div class="acts"><button class="btn ${cls}" id="mpGo">${icon('key',14)} ${esc(t('resetPw'))}</button></div></section>`;
  const wireMyPw=()=>{ const b=$('#mpGo'); if(b) b.onclick=async()=>{ if(await changeMyPw('mp')) $('#mpOld').value=$('#mpNew').value=$('#mpNew2').value=''; }; };
  if(!a.enabled){
    if(!a.switchable){ if(show(tok, head+`<div class="alert info">${icon('info')}<p>${esc(t('usersNoSwitch'))}</p></div>`+backupCard()+qualCard())){ wireBackups(); wireQual(); } return; }
    const first=!a.users;
    if(!show(tok, head+`<section class="card pad stack gap-s" style="max-width:620px"><div class="alert info">${icon('lock')}<p>${esc(t(first?'usersOffFirst':'usersOffAgain'))}</p></div>
      <div class="form"><label class="f"><span>${esc(t('username'))}</span><input id="enUser" dir="ltr" autocomplete="username"></label>
      <label class="f"><span>${esc(t('password'))}</span><input id="enPw" type="password" dir="ltr" autocomplete="${first?'new-password':'current-password'}"></label>
      ${first?`<label class="f"><span>${esc(t('password2'))}</span><input id="enPw2" type="password" dir="ltr" autocomplete="new-password"></label>`:''}</div>
      ${first?`<p class="small muted">${esc(t('pwRule'))}</p>`:''}
      <div class="acts"><button class="btn pri" id="enGo">${icon('lock')} ${esc(t('enableLogin'))}</button></div></section>${backupCard()}${qualCard()}${legend}`)) return;
    wireBackups(); wireQual();
    $('#enGo').onclick=async()=>{ const u=$('#enUser').value.trim(), p=$('#enPw').value; if(!u){ $('#enUser').focus(); return; }
      if(first){ if(p.length<10){ toast(t('pwRule')); $('#enPw').focus(); return; } if(p!==$('#enPw2').value){ toast(t('pwMismatch')); $('#enPw2').focus(); return; } }
      try{ await api('/auth/enable',{method:'POST',json:{username:u,password:p}}); await refreshMe(); toast(t('loginEnabled')); route(); }catch(e){ toast(e.message); } };
    return;
  }
  if(me.role!=='admin'){ if(show(tok, head+myPw('pri')+legend)) wireMyPw(); return; }
  const list = await api('/users');
  const roleSel=u=>`<select data-role-of="${esc(u.username)}" ${u.username===me.user?'disabled':''}>${['admin','editor','viewer','disabled'].map(r=>`<option value="${r}" ${r===u.role?'selected':''}>${esc(t('role_'+r))}</option>`).join('')}</select>`;
  const rows=list.map(u=>`<tr data-user="${esc(u.username)}"><td><b dir="ltr">${esc(u.username)}</b>${u.username===me.user?` <span class="tag">${esc(t('you'))}</span>`:''}</td><td>${roleSel(u)}</td><td class="hide-m code small">${tsL(u.created)}</td><td class="code small">${u.last_login?tsL(u.last_login):esc(t('never'))}</td>
    <td class="end"><div class="row gap-s" style="justify-content:flex-end"><button class="btn sm" data-reset="${esc(u.username)}">${icon('key',14)} ${esc(t('resetPw'))}</button>${u.username===me.user?'':`<button class="btn sm" data-del="${esc(u.username)}">${icon('x',14)} ${esc(t('delUser'))}</button>`}</div></td></tr>`).join('');
  const html=head+`<section class="card"><div class="hd"><h2>${esc(t('navUsers'))} <span class="tag">${list.length}</span></h2>${a.can_disable?`<button class="btn sm" id="authOff">${icon('lock',14)} ${esc(t('disableLogin'))}</button>`:`<span class="small muted">${esc(t('loginForced'))}</span>`}</div>
    <div class="tablewrap"><table id="usersTable"><thead><tr><th>${esc(t('username'))}</th><th>${esc(t('role'))}</th><th class="hide-m">${esc(t('created'))}</th><th>${esc(t('lastLogin'))}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="pad stack gap-s" style="border-top:1px solid var(--line)"><b>${esc(t('addUser'))}</b><div class="form"><label class="f"><span>${esc(t('username'))}</span><input id="nuUser" dir="ltr" autocomplete="off"></label>
      <label class="f"><span>${esc(t('password'))}</span><input id="nuPw" type="password" dir="ltr" autocomplete="new-password"></label>
      <label class="f"><span>${esc(t('role'))}</span><select id="nuRole">${['editor','viewer','admin'].map(r=>`<option value="${r}">${esc(t('role_'+r))}</option>`).join('')}</select></label></div>
      <div class="row gap-s"><button class="btn pri sm" id="nuAdd">${icon('plus',14)} ${esc(t('addUser'))}</button><span class="small muted">${esc(t('pwRule'))}</span></div></div></section>
    ${myPw('sm')}${backupCard()}${qualCard()}${legend}`;
  if(!show(tok, html)) return;
  wireMyPw(); wireBackups(); wireQual();
  $$('[data-role-of]').forEach(s=>s.onchange=async()=>{ try{ await api(`/users/${encodeURIComponent(s.dataset.roleOf)}`,{method:'PUT',json:{role:s.value}}); toast(t('roleSaved')); }catch(e){ toast(e.message); route(); } });
  $$('[data-reset]').forEach(b=>b.onclick=()=>{ const u=b.dataset.reset; openDrawer(`${t('resetPw')} · ${u}`, `${pwForm('rp',false)}<div class="acts"><button class="btn pri" id="rpGo">${icon('key',14)} ${esc(t('resetPw'))}</button></div>`);
    $('#rpGo').onclick=async()=>{ const p=pwCheck('rp'); if(!p) return; try{ await api(`/users/${encodeURIComponent(u)}`,{method:'PUT',json:{password:p}}); closeDrawer(); toast(t('pwSet')); }catch(e){ toast(e.message); } }; });
  $$('[data-del]').forEach(b=>b.onclick=()=>{ const u=b.dataset.del; openDrawer(`${t('delUser')} · ${u}`, `<div class="alert bad">${icon('alert')}<p>${esc(t('delUserQ'))}</p></div><div class="acts"><button class="btn pri" id="delGo">${icon('x',14)} ${esc(t('delUser'))}</button></div>`);
    $('#delGo').onclick=async()=>{ try{ await api(`/users/${encodeURIComponent(u)}`,{method:'DELETE'}); closeDrawer(); toast(t('userRemoved')); route(); }catch(e){ toast(e.message); } }; });
  $('#nuAdd').onclick=async()=>{ const u=$('#nuUser').value.trim(), p=$('#nuPw').value; if(!u){ $('#nuUser').focus(); return; } if(p.length<10){ toast(t('pwRule')); $('#nuPw').focus(); return; }
    try{ await api('/users',{method:'POST',json:{username:u,password:p,role:$('#nuRole').value}}); toast(t('userAdded')); route(); }catch(e){ toast(e.message); } };
  const off=$('#authOff'); if(off) off.onclick=()=>{ openDrawer(t('disableLogin'), `<div class="alert info">${icon('lock')}<p>${esc(t('disableNote'))}</p></div><div class="acts"><button class="btn pri" id="offGo">${icon('lock',14)} ${esc(t('disableLogin'))}</button></div>`);
    $('#offGo').onclick=async()=>{ try{ await api('/auth/disable',{method:'POST'}); closeDrawer(); await refreshMe(); toast(t('loginDisabled')); route(); }catch(e){ toast(e.message); } }; };
}

/* ---------------- Assistant («المساعد»): Claude inside the program, one conversation per dossier */
const ASST_TOOLS={get_dossier:{ar:'قرأ بيانات الملف',en:'read the dossier'},get_board:{ar:'فحص اللوحة',en:'looked at the board'},get_slot:{ar:'فحص بند',en:'looked at an item'},get_data:{ar:'قرأ البيانات',en:'read the data'},
  put_data:{ar:'كتب بيانات',en:'wrote data'},set_profile:{ar:'عدّل الملف التعريفي',en:'changed the profile'},read_document:{ar:'قرأ مستند',en:'read a document'},save_reading:{ar:'حفظ خلاصة',en:'saved a digest'},get_readings:{ar:'راجع الخلاصات',en:'checked digests'},
  classify_unassigned:{ar:'صنّف الملفات',en:'classified files'},place_document:{ar:'حط مستند في مكانه',en:'placed a document'},generate_document:{ar:'ولّد مستند',en:'generated a document'},get_gate:{ar:'فحص بوابة التصدير',en:'checked the export gate'},
  run_review:{ar:'شغّل المراجعة',en:'ran the review'},get_findings:{ar:'قرأ النتائج',en:'read findings'},get_finding:{ar:'قرأ نتيجة',en:'read a finding'},act_on_finding:{ar:'قيّم نتيجة',en:'assessed a finding'},add_response:{ar:'كتب رد',en:'drafted a response'},
  reassess_finding:{ar:'أعاد التقييم',en:'re-assessed'},make_review_letter:{ar:'أصدر خطاب',en:'made a letter'},request_reissue:{ar:'طلب إعادة إصدار',en:'requested re-issue'},get_audit:{ar:'قرأ السجل',en:'read the log'},
  export_dossier:{ar:'تصدير الملف',en:'export the dossier'},sign_review:{ar:'توقيع المراجعة',en:'sign the review'},withdraw_document:{ar:'سحب مستند',en:'withdraw a document'}};
const ASST_APPROVAL=['export_dossier','sign_review','withdraw_document'];
const asstTool=n=>L(ASST_TOOLS[n]||{ar:n,en:n});
S.asst={did:null,timer:null,state:null,gear:false};
function asstFab(did){ let b=$('#asstFab'); if(!did){ if(b) b.remove(); S.asst.did=null; return; } S.asst.did=did;
  if(!b){ b=document.createElement('button'); b.id='asstFab'; b.className='asst-fab'; b.type='button'; b.innerHTML=`${icon('sparkles')} <span>${esc(t('asst'))}</span>`; b.onclick=()=>asstOpen(); document.body.appendChild(b); } }
async function asstOpen(){ const did=S.asst.did||(S.dossier&&S.dossier.id); if(!did) return; S.asst.did=did; S.asst.gear=false;
  openDrawer(t('asst'), `<div id="asstBody" class="stack gap-s"><div class="small muted">…</div></div>`, true); await asstRefresh(true); }
async function asstRefresh(first){ const did=S.asst.did; clearTimeout(S.asst.timer); if(!did||!$('#asstBody')||$('#drawer').hidden) return;
  let st; try{ st=await api(`/dossiers/${did}/assistant`); }catch(e){ if($('#asstBody')) $('#asstBody').innerHTML=`<div class="alert bad">${icon('alert')}<p>${esc(e.message)}</p></div>`; return; }
  if(S.asst.did!==did||!$('#asstBody')) return; S.asst.state=st; asstPaint(st, first);
  const active=st.run&&['running','waiting_approval'].includes(st.run.status); if(active) S.asst.timer=setTimeout(()=>asstRefresh(false), 1200); }
function asstSettingsForm(set){ return `<div class="card pad stack gap-s" id="asstSetBox"><b>${esc(t('asstKeyT'))}</b><p class="small muted">${esc(t('asstKeyHint'))}</p>
  <div class="form">${set.source==='env'?`<p class="small muted">${esc(t('asstKeyEnv'))}</p>`:`<label class="f"><span>${esc(t('asstKey'))}</span><input type="password" id="asstKey" placeholder="${esc(set.key_hint||'sk-ant-…')}" autocomplete="off" dir="ltr"></label>`}
   <label class="f"><span>${esc(t('asstModel'))}</span><select id="asstModel">${(set.models||[]).map(m=>`<option ${m===set.model?'selected':''}>${m}</option>`).join('')}</select></label>
   <label class="f"><span>${esc(t('asstEffort'))}</span><select id="asstEffort">${(set.efforts||[]).map(m=>`<option ${m===set.effort?'selected':''}>${m}</option>`).join('')}</select></label>
   <label class="f"><span>${esc(t('asstBudget'))}</span><input type="number" id="asstBudget" value="${set.budget_tokens||120000}" min="20000" step="10000" dir="ltr"></label></div>
  <div class="row gap-s"><button class="btn pri sm" id="asstSave">${icon('check',14)} ${esc(t('asstSave'))}</button><span class="small muted" id="asstSetMsg"></span></div></div>`; }
function asstPaint(st, first){ const body=$('#asstBody'); if(!body) return; const set=st.settings||{}, run=st.run; const active=run&&['running','waiting_approval'].includes(run.status);
  if(first||!$('#asstMsgs')){ body.innerHTML=`<div id="asstStatus"></div><div id="asstSettings"></div><div id="asstMsgs" class="amsg"></div><div id="asstApprovals" class="stack gap-s"></div><div id="asstComposer"></div>`; asstComposer(); }
  const u=st.usage||{}, cost=u.cost_usd?` · $${(+u.cost_usd).toFixed(2)}`:'';
  $('#asstStatus').innerHTML = set.browser ? `<div class="alert info">${icon('info')}<p class="small">${esc(t('asstBrowser'))}</p></div>`
    : !set.configured ? `<div class="alert">${icon('alert')}<p class="small">${esc(t('asstNotConf'))}</p></div>`
    : `<div class="row gap-s small muted"><span class="chip c-ok"><i></i>${esc(set.model)} · ${esc(set.effort)}</span><span>${esc(t('asstUsage'))}: ${(u.input_tokens||0)+(u.cache_read_input_tokens||0)} / ${u.output_tokens||0}${cost}</span>${st.readings?`<span>· ${st.readings} ${esc(t('asstReadings'))}</span>`:''}<span class="grow"></span><button class="btn sm ghost admin-only" id="asstGear" title="${esc(t('asstKeyT'))}">⚙</button></div>`;
  const gear=$('#asstGear'); if(gear) gear.onclick=()=>{ S.asst.gear=!S.asst.gear; asstPaint(S.asst.state,false); };
  $('#asstSettings').innerHTML = (!set.browser && isAdmin() && (!set.configured || S.asst.gear)) ? asstSettingsForm(set) : '';
  const save=$('#asstSave'); if(save) save.onclick=async()=>{ const k=$('#asstKey'); const body={model:$('#asstModel').value, effort:$('#asstEffort').value, budget_tokens:parseInt($('#asstBudget').value,10)||120000}; if(k&&k.value.trim()) body.api_key=k.value.trim();
    save.disabled=true; try{ await api('/assistant/settings',{method:'PUT',json:body}); const r=await api('/assistant/settings/test',{method:'POST'}); $('#asstSetMsg').textContent=`${t('asstKeyOk')} · ${r.model}`; S.asst.gear=false; S.caps=null; setTimeout(()=>asstRefresh(false), 600); }
    catch(e){ $('#asstSetMsg').textContent=e.message; } finally{ save.disabled=false; } };
  const M=$('#asstMsgs'); const atBottom=M.scrollHeight-M.scrollTop-M.clientHeight<80; const msgs=st.messages||[];
  M.innerHTML = msgs.length ? msgs.map(m=> m.kind==='user' ? `<div class="am user">${esc(m.text).replace(/\n/g,'<br>')}</div>`
    : m.kind==='assistant' ? `<div class="am asst">${m.text?`<div class="txt">${esc(m.text).replace(/\n/g,'<br>')}</div>`:''}${m.tools&&m.tools.length?`<div class="tools">${m.tools.map(tl=>`<span class="chip ${ASST_APPROVAL.includes(tl.name)?'c-warn':'c-na'}" title="${esc(JSON.stringify(tl.args))}"><i></i>${esc(asstTool(tl.name))}</span>`).join('')}</div>`:''}</div>`
    : `<details class="am res"><summary class="small muted">${m.items.length} ${esc(t('asstResults'))}${m.items.some(i=>i.error)?' · ⚠':''}</summary>${m.items.map(i=>`<div class="small ${i.error?'bad':''}"><span class="code wrap">${esc(i.summary)}</span></div>`).join('')}</details>`).join('')
    : `<div class="small muted" style="padding:10px">${esc(t('asstEmpty'))}</div>`;
  if(run&&run.status==='running') M.insertAdjacentHTML('beforeend', `<div class="am asst live"><span class="dot"></span> ${run.partial?esc(run.partial).replace(/\n/g,'<br>'):esc(t('asstWorking'))}</div>`);
  if(run&&run.status==='error') M.insertAdjacentHTML('beforeend', `<div class="alert bad">${icon('alert')}<p class="small">${esc(t('asstErr'))}: <span class="code">${esc(run.error||'')}</span></p></div>`);
  if(atBottom||first) M.scrollTop=M.scrollHeight;
  $('#asstApprovals').innerHTML=(st.approvals||[]).map(a=>`<div class="alert" data-apc="${a.id}"><div class="grow"><b>${esc(t('asstApprovalT'))}</b><div class="small" style="margin:4px 0"><span class="chip c-warn"><i></i>${esc(asstTool(a.tool))}</span>${a.args&&a.args.rationale?` ${esc(a.args.rationale)}`:''}</div>
     <div class="code small wrap">${esc(JSON.stringify(a.args))}</div><div class="row gap-s" style="margin-top:8px"><button class="btn sm pri" data-apv="${a.id}" data-dec="approve">${icon('check',14)} ${esc(t('asstApprove'))}</button><button class="btn sm" data-apv="${a.id}" data-dec="deny">${esc(t('asstDeny'))}</button></div></div></div>`).join('');

const SPECIFICS=['coated','capsule_hard','pellets','premix','powder_inj_with_solvent','sterile','modified_release','inhalation'];

     «not placed yet» box (a file without text is left out: refused at the gate); one run at a time per draft (a second tab waits and finds nothing left); the draft goes only at the end */
  const run=()=>wizFinishRun(w0, did);
  if(navigator.locks&&w0.draftId) return navigator.locks.request(`db.wiz.${w0.draftId}`, run);
  return run();
}
async function wizFinishRun(w0, did){
  const d=w0.d, draftId=w0.draftId;
  if(draftId){ try{ const r=await api(`/intake/drafts/${draftId}`); if((r.state||{}).dataWritten) w0.dataWritten=true; }   // the draft as it is now: another tab may have gone further
    catch(e){ if(e&&e.status===404){ if(store.get(WIZ_KEY)===draftId) store.set(WIZ_KEY,''); return; } } }                    // gone: another tab finished everything
  const all=await wizFiles(w0), fill=w0.intakeFill;
  const refused=all.filter(f=>((w0.docs||{})[f.name]||{}).status==='mismatch').map(f=>f.name);
  const placeOpts={texts:w0.texts||{}, kinds:w0.kinds||{}, stage:refused, noText:Object.keys(w0.docs||{}).filter(n=>w0.docs[n].status==='notext')};
  if(fill&&!w0.dataWritten){ try{ const data={apis:(d.apis||[]).filter(a=>a.name).map(a=>({name:a.name,manufacturer:a.manufacturer||'',option:a.option||'FULL',strength:a.strength||'',country:a.country||''})),
      composition:(fill.composition||[]).map(c=>({name:c.name,amount:c.amount||'',standard:c.standard||'',function:c.role==='active'?'active':(c.role||''),equivalent:c.equivalent||''})),
      batches:(fill.batches||[]).map(b=>({no:b.no,kind:b.kind||'fpp',api:b.api||'',size:b.size||'',date:b.date||'',site:b.site||'',expiry:b.expiry||'',conformity:b.conformity||''})),
      specs:{product:(fill.specs||[]).map(s=>({test:s.test,limit:s.limit||'',method:s.method||''}))}, results:{}, registration:fill.registration||{}, product:{name_ar:(fill.product||{}).name_ar||''}};
      for(const r0 of (fill.results||[])){ if(r0.batch&&r0.test){ (data.results[r0.batch]=data.results[r0.batch]||{})[r0.test]=r0.value; } }
      await api(`/dossiers/${did}/data`,{method:'PUT',json:data}); w0.dataWritten=true; await wizWrite(w0); }catch(e){ console.warn('intake data', e); } }   // written once: a resumed run never overwrites what was edited on the board
  const have=new Set(); try{ const b=await api(`/dossiers/${did}/board`); b.slots.forEach(s=>s.documents.forEach(x=>have.add(x.filename))); (b.unassigned||[]).forEach(x=>have.add(x.filename)); }catch(e){}
  const todo=all.filter(f=>!have.has(f.name));                                     // a resumed placement never adds a file twice
  if(todo.length){ S.dossier=await api(`/dossiers/${did}`); S.board=null; await placeFiles(did, todo, placeOpts); route(); }
  const lost=placeOpts.lost||[], notMoved=(w0.missing||[]).length+lost.length;
  if(notMoved){ toast(L({ar:`${notMoved} مستند ما اتنقلش من المسودة للملف: المسودة لسه محفوظة، افتح الصفحة تاني وهنكمّل`,en:`${notMoved} document(s) could not be moved from the draft into the dossier: the draft is kept, open the page again and it goes on`})+(lost.length?` (${lost[0]})`:''), 15000); return; }   // never delete a draft that still holds a file the dossier did not get
  if(store.get(WIZ_KEY)===draftId) store.set(WIZ_KEY,''); if(draftId) api(`/intake/drafts/${draftId}`,{method:'DELETE'}).catch(()=>{});          // the draft goes only once everything is in the dossier
}

    const w=await wizRestore(true); if(!w) return; if(location.hash==='#/new') location.hash=`#/d/${did}/board`; toast(t('wizResume')); await wizFinish(w, did); }

const STRENGTH_RX=/(\d+(?:[.,]\d+)?\s*(?:mg|g|mcg|µg|iu|i\.u\.|ml|%|units?|ملجم|مجم|جم|مل|وحدة)(?:\s*\([^)]*\))?(?:\s*\/\s*\d*\s*(?:g|ml|mg|جم|مل))?)/i;

/* ---------------- journey model (guide + strip) */
const isActive = s => s.level==='R' || s.level==='O';
const isReady = s => s.status==='conforming' || s.status==='auto';
function journey(b, data, hist){
  const slots=b.slots, R=s=>s.level==='R';
  const cross=b.cross||[], xb=cross.filter(f=>f.severity==='block');
  const missing=slots.filter(s=>R(s)&&(s.status==='not_started'||(s.status==='waiting'&&!s.documents.length)));
  const blocking=slots.filter(s=>s.status==='non_conforming'||(s.status==='waiting'&&s.documents.length));
  const unsigned=slots.filter(s=>(s.unsigned||[]).length), external=slots.filter(s=>(s.external||[]).length);
  const waiting=slots.filter(s=>s.status==='waiting'), attn=slots.filter(s=>s.status==='needs_attention');
  const gateOk=!missing.length&&!blocking.length&&!xb.length&&!unsigned.length&&!external.length;
  const d=data||{}; const nB=(d.batches||[]).length, nS=((d.specs||{}).product||[]).length, nA=(d.apis||[]).filter(a=>a.address_gmp||a.cep_no||a.spec_standard).length;
  const dataStarted = nB||nS||nA;
  const docStage=(list)=>{ const req=list.filter(R), done=req.filter(isReady).length, started=list.some(s=>s.documents.length);
    const state = list.some(s=>s.status==='non_conforming') ? 'bad' : (req.length && done===req.length) ? 'done' : started ? 'now' : 'todo';
    return {done,total:req.length,state,todo:list.filter(s=>!isReady(s))}; };
  const m1=docStage(slots.filter(s=>isActive(s)&&s.module===1)), m25=docStage(slots.filter(s=>isActive(s)&&s.module>1));
  const nProblems = blocking.length + xb.length + unsigned.length + external.length;
  const anyDocs = slots.some(s=>s.documents.length);
  const checks = {state: nProblems ? 'bad' : (attn.length||waiting.length) ? 'warn' : anyDocs ? 'done' : 'todo', nonconf:blocking, attn, waiting, unsigned, external, cross, xb};
  const nExp = hist ? (hist.ectd32.length + hist.ectd40.length) : 0;
  const stages = [
    {key:'profile', state:'done', to:'guide'},
    {key:'data', state: xb.length?'bad': dataStarted ? ((nB>=2&&nS)?'done':'now') : 'todo', to:'data', nB, nS, nA},
    {key:'m1', ...m1, to:'board'}, {key:'m25', ...m25, to:'board'},
    {key:'checks', ...checks, to:'checks'},
    {key:'export', state: nExp ? 'done' : gateOk ? 'now' : 'todo', to:'export', gateOk, nExp},
  ];
  const cur = stages.find(s=>s.state!=='done') || stages[stages.length-1];
  stages.forEach(s=>{ if(s===cur && s.state==='todo') s.state='now'; });
  return {stages, cur, gateOk, missing, blocking, unsigned, external, xb, waiting, dataStarted};
}
function nextAction(J, b){
  const slots=b.slots, R=s=>s.level==='R', firstNS = pred => slots.find(s=>R(s)&&s.status==='not_started'&&pred(s));
  const title = s => L(s.title) + (s.item?` · ${s.item.manufacturer}`:'');
  if(!J.dataStarted) return {k:'na_doFirst', d:'na_doFirstD', act:{go:'data'}};
  let s;
  if((s=firstNS(x=>genFor(x)))) return {k:'na_gen', d:'na_genD', what:title(s), act:{gen:genFor(s), slot:s.slot_id}};
  if((s=firstNS(x=>!LOCKED.includes(x.doc_class)))) return {k:'na_up', d:'na_upD', what:title(s), act:{up:s.slot_id}};
  if((s=firstNS(()=>true))) return {k:'na_up', d:'na_upThird', what:title(s), act:{up:s.slot_id, why:s.slot_id}};
  if((s=slots.find(x=>x.documents.some(d=>d.check_status==='non_conforming'&&d.findings.some(f=>f.action==='auto_fix'))))) return {k:'na_fix', d:'na_fixD', what:title(s), act:{why:s.slot_id}};
  if((s=J.blocking.find(x=>x.status==='non_conforming'))) return {k:'na_review', d:'na_reviewD', what:title(s), act:{why:s.slot_id}};
  if((s=J.unsigned[0])) return {k:'na_sign', d:'na_signD', what:title(s), act:{why:s.slot_id}};
  if((s=J.external[0])) return {k:'na_ext', d:'na_extD', what:title(s), act:{why:s.slot_id}};
  if(J.xb.length) return {k:'na_cross', d:'na_crossD', what:J.xb[0][S.lang], act:{go:'data'}};
  if((s=J.waiting[0])) return {k:'na_wait', d:'na_waitD', what:title(s), act:{why:s.slot_id}};
  return {k:'na_export', d:'na_exportD', act:{go:'export'}};
}

async function bulk(files){
  files=(await withArchives(files)).filter(f=>DS.isDoc(f.name));          // a compressed file gives the documents inside it
  if(!files.length) return;
  const res=[];                                                      // one file at a time: a big selection never becomes one giant request
  for(const [i,f] of files.entries()){ if(files.length>1) toast(`${t('reading')} ${i+1}/${files.length} · ${f.name}`);
    const fd=new FormData(); fd.append('files',f);
    try{ res.push(...await api(`/dossiers/${S.dossier.id}/classify`,{method:'POST',body:fd})); }catch(e){ toast(`${f.name}: ${e.message}`); return; } }
  const act = S.board.slots.filter(s=>s.level==='R'||s.level==='O');
  const opt = s => `${esc(s.ctd)} ${esc(L(s.title)).slice(0,70)}${itemLabel(s)}`;
  openDrawer(t('bulk'), `<p class="small muted">${esc(t('bulkSub'))}</p><div class="tablewrap"><table><thead><tr><th>${esc(t('pFile'))}</th><th>${esc(t('colSec'))}</th></tr></thead><tbody>
    ${res.map((r,i)=>{ const best=r.suggestions[0]; return `<tr><td>${bdi(r.filename)}${best?`<div class="small muted">${esc(whyText(best.why))}</div>`:''}</td>
      <td><select data-bulk="${i}"><option value="">${esc(t('noSuggest'))}</option>
      ${r.suggestions.map(x=>`<option value="${esc(x.slot_id)}" ${best&&x.slot_id===best.slot_id?'selected':''}>★ ${opt(slotById(x.slot_id))}</option>`).join('')}
      <option disabled>────────</option>${act.map(s=>`<option value="${esc(s.slot_id)}">${opt(s)}</option>`).join('')}</select></td></tr>`; }).join('')}
    </tbody></table></div><div class="row"><button class="btn pri" id="bulkGo">${icon('check')} ${esc(t('confirmAll'))}</button></div>`, true);
  $('#bulkGo').onclick=async()=>{
    let n=0; const skipped=[];
    for(const sel of $$('[data-bulk]')){
      const slotId=sel.value, f=files[+sel.dataset.bulk]; if(!slotId) continue;
      if(needsMeta(slotById(slotId))){ skipped.push(f.name); continue; }
      const fd=new FormData(); fd.append('file',f); fd.append('meta','{}');
      try{ await api(`/dossiers/${S.dossier.id}/slots/${encodeURIComponent(slotId)}/documents`,{method:'POST',body:fd}); n++; }catch(e){ upErr(e); }
    }
    closeDrawer(); toast(`${n} ${t('added')}${skipped.length?' · '+skipped.join(', ')+': '+t('needsDetails'):''}`); await refreshCurrent();
  };
}

async function refreshCurrent(selSlot){
  const h=location.hash;
  if(h.endsWith('/publisher')){ if(selSlot) S.sel=selSlot; await publisherView(); }
  else if(h.endsWith('/guide')) await guideView();
  else if(h.endsWith('/checks')) await checksView();
  else await board();
}

const dpPick = v => v==null ? '' : (typeof v==='object' && !Array.isArray(v) && ('en' in v || 'ar' in v)) ? (v[S.lang]||v.en||v.ar||'') : v;
function dpPara(x, val, ex){ const text=String(dpPick(val)||''); const isEx=!text.trim(); return `<p class="dp-p ${isEx?'ex':''}" contenteditable="true">${esc(isEx?String(dpPick(ex)||'…'):text)}</p>`; }
function dpList(x, val, ex){ let items=Array.isArray(val)?val:(val&&typeof val==='object')?(val[S.lang]||val.en||[]):(typeof val==='string'&&val.trim()?[val]:[]);
  const isEx=!items.length; if(isEx) items=(ex&&(ex[S.lang]||ex.en))||['…']; return `<ul class="dp-l ${isEx?'ex':''}">${items.map(i=>`<li contenteditable="true">${esc(String(i))}</li>`).join('')}</ul>`; }

function dpFields(x, val, ex){ const v=(val&&typeof val==='object'&&!Array.isArray(val))?val:{}; return `<table class="dp-f">${(x.fields||[]).map(f=>{ const has=v[f.key]&&v[f.key]!=='[…]';

function renderDoc(s, v, answers){

  const secs=(e.sections||[]).map(x=>{ const val=sec[x.id]; const body=x.kind==='table'?dpTable(x,val,ex[x.id]):x.kind==='fields'?dpFields(x,val,ex[x.id]):x.kind==='list'?dpList(x,val,ex[x.id]):dpPara(x,val,ex[x.id]);

function collectDoc(box, v){
  const sections={};
  box.querySelectorAll('.dp-sec').forEach(sec=>{ const id=sec.dataset.sec, kind=sec.dataset.kind;
    if(kind==='table'){ const tb=sec.querySelector('table'); if(tb&&!tb.classList.contains('ex')){ const rows=[...tb.querySelectorAll('tbody tr')].map(tr=>[...tr.children].map(td=>td.textContent.trim())).filter(r=>r.some(c=>c&&c!=='…')); if(rows.length) sections[id]={rows}; } }
    else if(kind==='fields'){ const o={}; sec.querySelectorAll('td[data-key]').forEach(td=>{ if(!td.classList.contains('ex')&&td.textContent.trim()) o[td.dataset.key]=td.textContent.trim(); }); if(Object.keys(o).length) sections[id]=o; }
    else if(kind==='list'){ const ul=sec.querySelector('ul'); if(ul&&!ul.classList.contains('ex')){ const items=[...ul.children].map(li=>li.textContent.trim()).filter(Boolean); if(items.length) sections[id]=items; } }
    else { const p=sec.querySelector('.dp-p'); if(p&&!p.classList.contains('ex')&&p.textContent.trim()) sections[id]=p.textContent.trim(); } });
  const st=S.tplState[v.slot_id]||{}, a=st.answers||{};
  return {sections, gaps:a.gaps||[], sources:a.sources||{}, notes:a.notes||''};
}
function wireDoc(box, s, v){
  box.addEventListener('input', ev=>{ const el=ev.target; const ex=el.closest('.ex'); if(ex) ex.classList.remove('ex'); const tb=el.closest('table'); if(tb) tb.classList.remove('ex'); });
  box.querySelectorAll('.dp-add').forEach(b=>b.onclick=()=>{ const tb=b.previousElementSibling; const n=tb.querySelectorAll('th').length; if(tb.classList.contains('ex')){ tb.querySelector('tbody').innerHTML=''; tb.classList.remove('ex'); }
    const tr=document.createElement('tr'); tr.innerHTML=Array.from({length:n},()=>'<td contenteditable="true"></td>').join(''); tb.querySelector('tbody').appendChild(tr); tr.firstChild.focus(); });
}
/* why claude.ai's model gave no answer, in words (the codes are the page runtime's) */
function aiWhy(code){
  const w={not_granted:{ar:'Claude ما اتسمحلوش في الصفحة دي (افتح الصفحة من جديد واسمح لما يسألك).',en:'Claude was not allowed in this page (open the page again and allow it when asked).'},
    rate_limited:{ar:'وصلت لحد استخدام Claude دلوقتي — جرّب بعد شوية.',en:'Claude\'s usage limit was reached — try again in a while.'},
    invalid_json:{ar:'رد Claude ما طلعش بالشكل المطلوب — دوس «اعمله لي» تاني.',en:'Claude\'s answer did not come in the expected shape — press «Make it for me» again.'},
    prompt_too_large:{ar:'المستندات أطول من اللي Claude يقراه في مرة واحدة.',en:'The documents are longer than Claude reads at once.'},
    session_expired:{ar:'سجّل الدخول في claude.ai تاني.',en:'Sign in to claude.ai again.'},
    refused:{ar:'Claude رفض الطلب ده.',en:'Claude declined this request.'},
    empty_completion:{ar:'Claude ما كتبش حاجة — جرّب تاني.',en:'Claude wrote nothing — try again.'},
    upstream_error:{ar:'الاتصال بـ Claude اتقطع — جرّب تاني.',en:'The connection to Claude dropped — try again.'}};
  const off=['sampling_disabled','not_declared','capability_disabled','capability_removed','unavailable'];
  return L(w[code]||(off.includes(code)?{ar:'Claude مش متاح في العرض ده.',en:'Claude is not available in this view.'}:{ar:`Claude ما كمّلش (${code||'error'}).`,en:`Claude did not finish (${code||'error'}).`}));
}
async function fetchAnswers(v, hooks){
  const mode=await aiMode(); let note='', code='';
  if(mode==='browser' && v.prompt){ try{ const a=await window.DBAI.ask(v.prompt, hooks&&{onText:hooks.onText, signal:hooks.signal}); if(a&&typeof a==='object') return {answers:a, how:'answers', note, code}; code='invalid_json'; }
    catch(e){ code=(e&&e.code)||'error'; note=(e&&(e.code||e.message))||'error'; if(code==='cancelled') throw e; } }
  const r=await api(`/dossiers/${S.dossier.id}/slots/${encodeURIComponent(v.slot_id)}/fill`,{method:'POST',json:{ai:true}});
  return {answers:r.answers, how:r.how, note, code, mode};
}

    <div class="small muted" style="margin-top:6px">${esc(t(mode==='browser'?'tplAiBrowser':mode==='server'?'tplAiServer':'tplAiNone'))}${v.documents&&v.documents.length?` · ${esc(t('draftDocs'))}: ${v.documents.map(d=>esc(d.filename)).join('، ')}`:''}</div>
    <div id="dpStat" class="small" role="status" hidden style="margin-top:6px;line-height:1.7"></div>
    ${inputs?`<div class="row gap-s small" style="margin-top:6px;flex-wrap:wrap"><b>${esc(t('tplInputs'))}:</b> ${inputs}</div>`:''}`;
  wireDoc(box.querySelector('#dpWrap'), s, v);

  const fill=box.querySelector('#dpFill'); if(fill) fill.onclick=async()=>{ fill.disabled=true; toast(t('drafting'));

      const gaps=`${(r.answers.gaps||[]).length} ${t('gapsN')}`;

async function draftAll(){
  /* «Draft them all»: every item the program drafts and that has no document yet, one after the other; the person can stop it */
  const todo=(S.board&&S.board.slots||[]).filter(s=>draftable(s)&&!genFor(s)&&s.status==='not_started');
  if(!todo.length){ toast(t('draftAllNone')); return; }
  const mode=await aiMode();
  if(!await DS.confirmBox(t('draftAll'), `<p>${esc(t('draftAllQ').replace('{n}', todo.length))}</p><p class="small muted">${esc(t(mode&&mode!=='none'?'draftAllModel':'draftAllData'))}</p>`, t('draftAllGo'), {cancel:t('cancel')})) return;
  const run=S.draftRun={stop:false, done:0, failed:[]};
  const box=document.createElement('div'); box.className='card pad row gap-s'; box.id='draftAllBox'; box.style.margin='10px 0';
  const head=$('#view .head'); if(head) head.after(box);
  const paint=(s)=>{ if(!box.isConnected) return; box.innerHTML=`<span class="ic-tile accent">${icon('sparkles',16)}</span><div class="grow"><b>${esc(t('draftAllNow').replace('{i}', run.done+run.failed.length+1).replace('{n}', todo.length))}</b><div class="small muted">${s?`${esc(s.ctd)} · ${esc(L(s.title))}`:''}</div>${meter(100*(run.done+run.failed.length)/todo.length)}</div><button class="btn sm" id="draftAllStop">${esc(t('stop'))}</button>`;
    const st=$('#draftAllStop'); if(st) st.onclick=()=>{ run.stop=true; st.disabled=true; }; };
  for(const s of todo){
    if(run.stop) break;
    paint(s);
    try{ const v=await api(`/dossiers/${S.dossier.id}/slots/${encodeURIComponent(s.slot_id)}/template`);
      const f=await fetchAnswers(v);
      await api(`/dossiers/${S.dossier.id}/slots/${encodeURIComponent(s.slot_id)}/draft`,{method:'POST',json:{answers:f.answers, lang:S.lang}});
      run.done++; }
    catch(e){ run.failed.push(`${s.ctd}: ${e.message}`); }
  }
  S.draftRun=null; S.board=null; await route();
  toast(t('draftAllEnd').replace('{d}', run.done).replace('{f}', run.failed.length));
  if(run.failed.length) console.warn('draft all', run.failed);
}

async function genForm(kind, s, missing){
  await loadGens();

             : await api(`/dossiers/${S.dossier.id}/generate/${kind}/prefill?slot_id=${encodeURIComponent(s.slot_id)}`);
  genForm.kind=kind; genForm.slot=s.slot_id; genForm.data=data;
  const miss = new Set(missing||[]);
  const lab = f => esc(f[S.lang]||f.en) + (f.required===false?` <span class="muted">(${esc(t('optional'))})</span>`:'');
  const input = (f, v, path) => f.type==='textarea' ? `<textarea dir="auto" data-p="${path}">${esc(v??'')}</textarea>`
     : f.type==='choice' ? `<select data-p="${path}"><option value=""></option>${f.choices.map(c=>`<option ${v===c?'selected':''}>${esc(c)}</option>`).join('')}</select>`
     : `<input type="text" dir="auto" inputmode="${f.type==='number'?'decimal':'text'}" data-p="${path}" value="${esc(v??'')}" title="${esc(v??'')}">`;
  const html = sch.fields.map(f=>{
    if(f.type!=='list') return `<label class="f ${miss.has(f.key)?'miss':''}"><span>${lab(f)}</span>${input(f, data[f.key], f.key)}</label>`;
    const rows = (data[f.key] && data[f.key].length) ? data[f.key] : (data[f.key]=[{}]);
    return `<div class="f ${[...miss].some(m=>m===f.key||m.startsWith(f.key+'['))?'miss':''}"><span>${lab(f)}</span>
      <div class="rows tablewrap"><table><thead><tr>${f.item.map(i=>`<th>${lab(i)}</th>`).join('')}<th></th></tr></thead><tbody>
      ${rows.map((r,ri)=>`<tr>${f.item.map(i=>`<td class="${miss.has(`${f.key}[${ri}].${i.key}`)?'miss':''}">${input(i, r[i.key], `${f.key}.${ri}.${i.key}`)}</td>`).join('')}
        <td><button class="btn sm ghost" data-rm="${f.key}.${ri}" aria-label="${esc(t('remove'))}">✕</button></td></tr>`).join('')}</tbody></table></div>
      <div><button class="btn sm" data-add="${f.key}">${icon('plus',14)} ${esc(t('addRow'))}</button></div></div>`;
  }).join('');
  openDrawer(L(sch.title), `<p class="small muted">${esc(t('genSub'))}</p>${miss.size?`<div class="alert bad">${icon('alert')}<p class="small">${esc(t('fillMissing'))}</p></div>`:''}
    <div class="gform">${html}</div><div class="row"><button class="btn pri" id="genGo">${icon('sparkles')} ${esc(t('generate'))}</button></div>`, true);
  const body=$('#dBody');
  const sync=()=>$$('[data-p]', body).forEach(el=>{ const parts=el.dataset.p.split('.'); let v=el.value.trim();
      const fdef = parts.length===1? sch.fields.find(f=>f.key===parts[0]) : sch.fields.find(f=>f.key===parts[0]).item.find(i=>i.key===parts[2]);
      if(fdef && fdef.type==='number' && v!=='' && !isNaN(+v.replace(',','.'))) v=+v.replace(',','.');
      if(parts.length===1) data[parts[0]] = v===''?undefined:v; else { data[parts[0]][+parts[1]][parts[2]] = v===''?undefined:v; } });
  $$('[data-add]', body).forEach(b=>b.onclick=()=>{ sync(); data[b.dataset.add].push({}); genForm(kind, s, missing); });
  $$('[data-rm]', body).forEach(b=>b.onclick=()=>{ sync(); const [k,i]=b.dataset.rm.split('.'); data[k].splice(+i,1); genForm(kind, s, missing); });
  $('#genGo').onclick=async()=>{
    sync();
    for(const f of sch.fields) if(f.type==='list') data[f.key] = (data[f.key]||[]).filter(r=>Object.values(r).some(v=>v!==undefined&&v!==''));
    $('#genGo').disabled=true; $('#genGo').textContent=t('generating');

  };
}

async function dropFiles(slotId, list){
