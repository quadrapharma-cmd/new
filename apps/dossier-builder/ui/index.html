  return `${rHead(rt('responses'), `<span class="badge">${esc(L({ar:'المهلة', en:'deadline'}))} ${run.clock.clock_stop_months} ${esc(L({ar:'شهور من الخطاب', en:'months from the letter'}))}</span>`)}
  <div class="kpis"><div class="card kpi warn"><span class="n">${c.open}</span><span class="l">${esc(rt('open'))}</span></div><div class="card kpi info"><span class="n">${c.answered}</span><span class="l">${esc(rt('answered'))}</span></div><div class="card kpi ok"><span class="n">${c.accepted}</span><span class="l">${esc(rt('accepted'))}</span></div><div class="card kpi bad"><span class="n">${c.not_accepted}</span><span class="l">${esc(rt('not_accepted'))}</span></div></div>
  <section class="card rtable"><div class="tbl"><table><thead><tr><th>#</th><th>${esc(L({ar:'الإدارة · البند', en:'Department · section'}))}</th><th></th><th>${esc(rt('status'))}</th><th>${esc(L({ar:'الرد', en:'Response'}))}</th><th></th></tr></thead><tbody>${rows||`<tr><td colspan="6" class="muted">${esc(L({ar:'لا استفسارات مفتوحة', en:'No open queries'}))}</td></tr>`}</tbody></table></div></section>
  <p class="tiny-note">${esc(L({ar:'ارفع النسخ الجديدة في خاناتها من لوحة المتطلبات أو عدّل البيانات، ثم «أعد التقييم»: السؤال يتشغّل تاني على النسخة الجديدة ويتقفل لو بقى كافياً.', en:'Upload the new versions to their slots from the requirements board or edit the data, then «Re-assess»: the question re-runs on the new version and closes when adequate.'}))}</p>`;
}
function rVerdict(){
  const run = S.review.run, dv = run.dept_verdicts, c = run.counts, ck = run.clock;
  const color = run.verdict==='ready'?'var(--ok)':run.verdict==='ready_with_risks'?'var(--warn)':'var(--bad)';
  const impacts = rFind().filter(rOpen).sort((a,b)=>RSEV.indexOf(a.severity)-RSEV.indexOf(b.severity)).slice(0,8).map(f=>`<div class="impact">${rSevTag(f.severity)}<div><b>${esc(f.question_id)}</b> · ${esc(rDeptName(f.dept))} · <span class="code">${esc(f.ctd)}</span><div class="d">${esc(L(f.payload.action&&f.payload.action.type!=='none'?{ar:`${f.payload.action.type.replace('_',' ')} → ${f.payload.action.target||''}`, en:`${f.payload.action.type.replace('_',' ')} → ${f.payload.action.target||''}`}:f.payload.title))}</div></div><span class="delta">${esc(rt(dv[f.dept].verdict))}</span></div>`).join('');
  let cur = new Date(); const tl=[]; const push=(cls,label,sub)=>tl.push({cls,label,sub,d:new Date(cur)}); const addD=(n)=>{cur=new Date(cur.getTime()+n*864e5);}; const addW=(w)=>addD(Math.round((typeof w==='number'?w:60)*7/5));
  push('now',{ar:'التقديم المفترض (اليوم)',en:'Assumed submission (today)'},{ar:'الوحدة 1 كاملة + soft copy',en:'Complete Module 1 + soft copy'});
  ck.stages.forEach((s,i)=>{ addW(s.wds); push(i===ck.stages.length-1?'end':'', s.label, {ar:`${s.wds} ${rt('wds')}`, en:`${s.wds} WDs`}); if(i===1 && ck.expected_rounds){ addD(ck.clock_stop_months*30); push('stop',{ar:`جولة استيفاء (${ck.expected_rounds} إدارة)`,en:`Deficiency round (${ck.expected_rounds} departments)`},{ar:`حتى ${ck.clock_stop_months} شهور — Clock stop`,en:`Up to ${ck.clock_stop_months} months — clock stop`}); } });
  const readiness = c.total ? Math.round(100*c.adequate/c.total) : 0;
  const signed = run.signed || {};
  return `${rHead(rt('verdict'), `<button class="btn" id="runBtn">${icon('zap',16)} ${esc(rt('rerun'))}</button>`)}
  <section class="vstrip" style="--v-color:${color}">${ring(readiness,'lg')}<div><div class="vlabel">${esc(rt('readiness'))}</div><h1>${esc(rt(run.verdict))}</h1><p class="why">${esc(L(run.why||{}))}</p></div>
    <div class="acts"><div class="row gap-s"><input type="text" id="signName" placeholder="${esc(rt('yourName'))}" value="${esc(S.me&&S.me.user||'')}" style="max-width:160px"></div><button class="btn sm" data-rsign="assessor">${icon('pen',14)} ${esc(rt('signAssessor'))}${signed.assessor?` ✓ ${esc(signed.assessor.by)}`:''}</button><button class="btn sm" data-rsign="peer">${icon('users',14)} ${esc(rt('signPeer'))}${signed.peer?` ✓ ${esc(signed.peer.by)}`:''}</button></div></section>
  <div class="grid2"><section class="card"><div class="hd pad" style="padding-bottom:0"><h3>${esc(rt('impact'))}</h3></div><div>${impacts||`<div class="empty">${icon('check',30)}<div>${esc(L({ar:'لا ملاحظات مفتوحة', en:'No open findings'}))}</div></div>`}</div></section>
    <section class="card"><div class="hd pad" style="padding-bottom:0"><h3>${esc(rt('depts'))}</h3></div><div class="pad vbars">${rDepts().filter(d=>dv[d.id]).map(d=>{ const x=dv[d.id]; const p=x.total?Math.round(100*(x.total-x.not_assessable-(x.counts.critical+x.counts.major+x.counts.minor))/x.total):0; return `<div class="vbar"><span>${esc(L(d))}</span>${meter(p, x.verdict==='approve'?'ok':x.verdict==='reject'?'bad':x.verdict==='clock_stop'?'warn':'')}<span class="n">${x.counts.critical+x.counts.major+x.counts.minor} ${esc(rt('openQ'))}</span></div>`; }).join('')}</div></section></div>
  <div class="grid2"><section class="card"><div class="hd pad" style="padding-bottom:0"><h3>${esc(rt('timeline'))}</h3><span class="small muted">${esc(L(ck.label))}</span></div><div class="pad tl">${tl.map(x=>`<div class="ti ${x.cls}"><span class="dt">${esc(fmtDate(x.d.toISOString().slice(0,10), S.lang))}</span><span class="pt"></span><div><b>${esc(L(x.label))}</b><span>${esc(L(x.sub))}</span></div></div>`).join('')}</div><p class="tiny-note pad" style="padding-top:0">${esc(L({ar:'أيام العمل تتحول لتقويم تقريبي (5 أيام عمل = 7 أيام). الجدول المنشور لا يشمل جولات الاستيفاء.', en:'Working days are converted approximately (5 WDs = 7 calendar days). The published table excludes deficiency rounds.'}))}</p></section>
    <section class="card"><div class="hd pad" style="padding-bottom:0"><h3>${esc(rt('history'))}</h3></div><div class="tbl" id="rhist"><table><thead><tr><th>${esc(L({ar:'الجولة', en:'Run'}))}</th><th>${esc(L({ar:'التاريخ', en:'Date'}))}</th><th>${esc(rt('openQ'))}</th><th>${esc(rt('verdict'))}</th><th>${esc(rt('strict'))}</th></tr></thead><tbody><tr><td colspan="5" class="muted small">…</td></tr></tbody></table></div></section></div>`;
}
function rSettings(){
  const p = S.rpack, s = RSTATE.rset, depts = rDepts();
  return `${rHead(rt('settings'))}
  <div class="grid2"><section class="card pad stack">
    <div class="f"><label>${esc(rt('strict'))}</label><div class="choice">${Object.entries(p.strictness).map(([k,v])=>`<button data-rstrict="${k}" class="${s.strictness===k?'on':''}"><b>${esc(L(v))}</b><span>${esc(v.layers.map(l=>L(p.layers[l])).join(' + '))}</span></button>`).join('')}</div></div>
    <div class="f"><label>${esc(rt('track'))}</label><select id="rtrack"><option value="">${esc(L({ar:'تلقائي حسب المنتج', en:'Automatic from the product'}))}</option>${Object.entries(p.tracks).map(([k,v])=>`<option value="${k}" ${s.track===k?'selected':''}>${esc(L(v))}</option>`).join('')}</select></div>
    <div class="f"><label>${esc(rt('deptsOn'))}</label><div class="picks">${depts.map(d=>`<label><input type="checkbox" data-rdep="${d.id}" ${!s.departments||s.departments.includes(d.id)?'checked':''}> ${esc(L(d))} <span class="muted small">— ${esc(L(d.body))}</span></label>`).join('')}</div></div>
    <label class="opt"><input type="checkbox" id="rrel" ${s.reliance?'checked':''}><span><b>${esc(rt('reliance'))}</b><span>${esc(L({ar:'يضيف أسئلة الاعتماد (تقرير الجهة المرجعية غير المحجوب، التطابق) ويختصر التقييم الفني الكامل.', en:'Adds the reliance questions (unredacted reference assessment report, sameness) and abbreviates the full technical assessment.'}))}</span></span></label>
    <label class="opt"><input type="checkbox" id="rai" ${s.ai?'checked':''}><span><b>${esc(rt('aiOn'))}</b><span>${esc(L({ar:'يقرأ النصوص وصور الصفحات ويقترح الحكم؛ لا يدخل الخطاب قبل التأكيد. في نسخة المتصفح عبر claude.ai؛ على الخادم بمفتاح.', en:'Reads the text and page images and suggests verdicts; nothing enters the letter before confirmation. In the browser edition via claude.ai; on a server with a key.'}))}</span></span></label>
    <div class="row"><button class="btn primary" id="runBtn">${icon('zap',16)} ${esc(rt('runWith'))}</button></div></section>
  <section class="stack"><div class="card pad stack gap-s"><h3>${esc(rt('pack'))} · ${esc(p.id)} ${esc(p.version)} <span class="tag warn">${esc(p.status||'')}</span></h3>
      <div class="kpis"><div class="card kpi br"><span class="n">${p.counts.total}</span><span class="l">${esc(L({ar:'سؤال', en:'questions'}))}</span></div><div class="card kpi info"><span class="n">${p.counts.by_layer.intl||0}</span><span class="l">${esc(rt('layer_intl'))}</span></div><div class="card kpi warn"><span class="n">${p.counts.provisional}</span><span class="l">${esc(rt('provisional'))}</span></div><div class="card kpi ${p.lint.length?'bad':'ok'}"><span class="n">${p.lint.length}</span><span class="l">lint</span></div></div>
      <dl class="props" style="padding:0">${p.sources.map(x=>`<dt class="code">${esc(x.code)}</dt><dd>${esc(x.title)}</dd>`).join('')}</dl>
      ${p.unread.length?`<div class="alert">${icon('alert',18)}<p class="small">${esc(L({ar:'غير مقروء بعد (الأسئلة المتعلقة معلَّمة «مؤقت»):', en:'Not yet read (related questions are marked provisional):'}))} ${p.unread.map(u=>esc(u.code)).join(' · ')}</p></div>`:''}
      <p class="small muted">${esc(L({ar:'سلم الخطورة من الأداة — الهيئة لا تنشر سلماً رسمياً لتعليقاتها.', en:'The severity scale is the tool’s own — EDA publishes no formal scale for its comments.'}))}</p></div></section></div>`;
}
async function rAct(fid, body){ const r = await api(`/dossiers/${S.dossier.id}/review/${S.review.run.id}/findings/${fid}`, {method:'POST', json: body}); S.review.run = r.run; const i = S.review.findings.findIndex(f=>f.id===fid); if(i>=0) S.review.findings[i] = r.finding; return r; }
async function rAskAI(ids, dept, sec){
  const id = S.dossier.id, rid = S.review.run.id;
  const q = ids ? `ids=${encodeURIComponent(ids.join(','))}` : `dept=${encodeURIComponent(dept)}&ctd=${encodeURIComponent(sec)}`;
  const p = await api(`/dossiers/${id}/review/${rid}/ai?${q}`);
  toast(rt('aiReading'));
  if(window.DBAI && await window.DBAI.available()){
    const answers = await window.DBAI.extract(p.prompt, [], [], 'review');          // the documents' own text is in the prompt: no page images
    const r = await api(`/dossiers/${id}/review/${rid}/ai`, {method:'POST', json:{answers}}); S.review.run = r.run; await rLoad(); toast(rt('aiDone')); return;
  }
  try{ const r = await api(`/dossiers/${id}/review/${rid}/ai/server?${q}`, {method:'POST'}); S.review.run = r.run; await rLoad(); toast(rt('aiDone')); }
  catch(e){ if(e.status===501) toast(rt('aiNone')); else toast(e.message); }
}
function rBind(){
  const root = $('#view'), id = S.dossier.id, rid = S.review.run.id;
  const rb = $('#runBtn'); if(rb) rb.onclick = rRun;
  root.querySelectorAll('[data-rdept]').forEach(b=>b.onclick=()=>{ RSTATE.dept=b.dataset.rdept; RSTATE.sec=''; location.hash=`#/d/${id}/review/assess`; });
  root.querySelectorAll('[data-rf]').forEach(b=>b.onclick=()=>{ RSTATE.filter=b.dataset.rf; route(); });
  root.querySelectorAll('.node[data-rd]').forEach(n=>n.onclick=()=>{ RSTATE.dept=n.dataset.rd; RSTATE.sec=n.dataset.rsec; route(); });
  root.querySelectorAll('[data-rev]').forEach(b=>b.onclick=()=>{ const [f,i]=b.dataset.rev.split(':'); RSTATE.ev={id:f, i:i.startsWith('ai')?i:+i}; const v=$('#rviewer'); if(v){ v.innerHTML=rViewer(); root.querySelectorAll('.evi').forEach(x=>x.classList.toggle('on', x.dataset.rev===b.dataset.rev)); v.scrollIntoView({block:'nearest', behavior:'smooth'}); } });
  root.querySelectorAll('[data-ract]').forEach(b=>b.onclick=async()=>{ try{ await rAct(b.dataset.rid, {action:b.dataset.ract, by:S.me&&S.me.user||'reviewer'}); toast(b.dataset.ract==='confirm'?L({ar:'اتأكدت ودخلت الخطاب', en:'Confirmed and added to the letter'}):L({ar:'تم التجاهل', en:'Dismissed'})); route(); }catch(e){ toast(e.message); } });
  root.querySelectorAll('[data-rai]').forEach(b=>b.onclick=()=>rAskAI([b.dataset.rai]).then(route).catch(e=>toast(e.message)));
  const as = $('#askSec'); if(as) as.onclick=()=>rAskAI(null, RSTATE.dept, RSTATE.sec).then(route).catch(e=>toast(e.message));
  root.querySelectorAll('[data-rovr]').forEach(b=>b.onclick=()=>rOverride(b.dataset.rovr, 'override'));
  root.querySelectorAll('[data-rwd]').forEach(b=>b.onclick=()=>rOverride(b.dataset.rwd, 'withdraw'));
  root.querySelectorAll('[data-rld]').forEach(b=>b.onclick=()=>{ RSTATE.letterDept=b.dataset.rld; route(); });
  root.querySelectorAll('[data-rgen]').forEach(b=>b.onclick=async()=>{ try{ b.disabled=true; await api(`/dossiers/${id}/review/${rid}/${b.dataset.rgen}/${RSTATE.letterDept}`, {method:'POST'}); await rLoad(); toast(rt('generated')); route(); }catch(e){ toast(e.message); b.disabled=false; } });
  root.querySelectorAll('[data-rresp]').forEach(b=>b.onclick=()=>rRespond(b.dataset.rresp));
  root.querySelectorAll('[data-rre]').forEach(b=>b.onclick=async()=>{ try{ const r = await api(`/dossiers/${id}/review/${rid}/findings/${b.dataset.rre}/reassess`, {method:'POST'}); await rLoad(); toast(`${r.finding.question_id}: ${rt(r.finding.verdict)} · ${rt(r.finding.status)}`); route(); }catch(e){ toast(e.message); } });
  root.querySelectorAll('[data-rsign]').forEach(b=>b.onclick=async()=>{ const by=($('#signName')||{}).value||''; if(!by.trim()){ toast(rt('yourName')); return; } try{ await api(`/dossiers/${id}/review/${rid}/sign`, {method:'POST', json:{role:b.dataset.rsign, by:by.trim()}}); await rLoad(); toast(`${rt('signedBy')} ${by}`); route(); }catch(e){ toast(e.message); } });
  root.querySelectorAll('[data-rstrict]').forEach(b=>b.onclick=()=>{ RSTATE.rset.strictness=b.dataset.rstrict; route(); });
  const tr = $('#rtrack'); if(tr) tr.onchange=()=>{ RSTATE.rset.track = tr.value || null; };
  root.querySelectorAll('[data-rdep]').forEach(c=>c.onchange=()=>{ RSTATE.rset.departments = [...root.querySelectorAll('[data-rdep]')].filter(x=>x.checked).map(x=>x.dataset.rdep); });
  const rel = $('#rrel'); if(rel) rel.onchange=()=>{ RSTATE.rset.reliance = rel.checked; };
  const rai = $('#rai'); if(rai) rai.onchange=()=>{ RSTATE.rset.ai = rai.checked; };
  const rp = $('#rejPrev'); if(rp) rp.onclick=()=>{ const items = rByDept('screening').filter(f=>f.verdict==='deficient' && rOpen(f)); openDrawer(rt('rejectPreview'), `<div class="letter" style="padding:20px 22px;max-width:none"><div class="lh"><div><h2>Screening outcome: In-completed</h2><div class="small muted">Administration of Human Pharmaceuticals Regulatory Affairs (simulated)</div></div><span class="stamp">SIMULATION</span></div><p>Re: ${esc(S.dossier.name)}</p><p>The registration dossier was screened against the published Module 1 checklist (NP.CAPP.065 v5). The following items are missing or not acceptable; the full dossier should be resubmitted as a new submission within the period stated in the submission procedures:</p><ol>${items.map(f=>`<li><b>${esc(f.ctd)}</b> — ${esc(f.payload.deficiency.en)}<div class="ar">${esc(f.payload.deficiency.ar)}</div></li>`).join('')}</ol></div>`, true); };
  const h = $('#rhist'); if(h) api(`/dossiers/${id}/review`).then(r=>{ h.querySelector('tbody').innerHTML = r.runs.map(x=>`<tr><td class="code">${esc(x.id)}</td><td class="code">${esc(new Date(x.created*1000).toISOString().slice(0,10))}</td><td class="num">${x.counts.open}</td><td><span class="chip ${x.verdict==='ready'?'c-ok':x.verdict==='ready_with_risks'?'c-warn':'c-bad'}"><i></i>${esc(rt(x.verdict))}</span></td><td class="small">${esc(x.options.strictness||'')}</td></tr>`).join(''); }).catch(()=>{});
}
function rOverride(fid, action){
  const f = rFind().find(x=>x.id===fid); if(!f) return;
  openDrawer(`${rt(action)} · ${f.question_id}`, `<div class="stack">${action==='override'?`<div class="f"><label>${esc(rt('verdict'))}</label><select id="ovV">${['adequate','deficient','not_assessable'].map(v=>`<option value="${v}" ${f.verdict===v?'selected':''}>${esc(rt(v))}</option>`).join('')}</select></div>`:''}
    <div class="f"><label>${esc(rt('reason'))}</label><textarea id="ovR" rows="3"></textarea></div><div class="row"><button class="btn primary" id="ovSave">${esc(rt('save'))}</button><button class="btn ghost" id="ovCancel">${esc(rt('cancel'))}</button></div></div>`);
  $('#ovCancel').onclick = closeDrawer;
  $('#ovSave').onclick = async()=>{ const reason=$('#ovR').value.trim(); if(!reason){ $('#ovR').focus(); return; } try{ await rAct(fid, {action, verdict: action==='override'?$('#ovV').value:undefined, reason, by:S.me&&S.me.user||'reviewer'}); closeDrawer(); toast(L({ar:'اتسجل في سجل التدقيق', en:'Recorded in the audit log'})); route(); }catch(e){ toast(e.message); } };
}
function rRespond(fid){
  const f = rFind().find(x=>x.id===fid); if(!f) return; const last=(f.responses||[]).slice(-1)[0];
  openDrawer(`${rt('respond')} · ${f.question_id}`, `<div class="stack"><div class="fnd"><div class="en">${esc(f.payload.deficiency.en)}</div><div class="ar">${esc(f.payload.deficiency.ar)}</div></div>
    <div class="f"><label>${esc(rt('respText'))}</label><textarea id="rsT" rows="4">${esc(last?last.text:'')}</textarea></div><p class="small muted">${esc(rt('respDocs'))}</p>
    <div class="row"><button class="btn primary" id="rsSave">${esc(rt('save'))}</button><button class="btn ghost" id="rsCancel">${esc(rt('cancel'))}</button></div></div>`);
  $('#rsCancel').onclick = closeDrawer;
  $('#rsSave').onclick = async()=>{ const text=$('#rsT').value.trim(); if(!text){ $('#rsT').focus(); return; } try{ await api(`/dossiers/${S.dossier.id}/review/${S.review.run.id}/findings/${fid}/responses`, {method:'POST', json:{text, by:S.me&&S.me.user||'reviewer'}}); await rLoad(); closeDrawer(); toast(L({ar:'تم حفظ الرد — اضغط «أعد التقييم» بعد رفع النسخة الجديدة', en:'Response saved — press «Re-assess» after uploading the new version'})); route(); }catch(e){ toast(e.message); } };
}


setLang(S.lang);
wizResume();
</script>
</body>
