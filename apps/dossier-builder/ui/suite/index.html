<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ملف المنتجات — Regulatory Suite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#EEF2F5; --line:#DCE2E8; --ink:#0F1B2A; --muted:#5B6B7C;
  --brand:#0E7C86; --brand-ink:#FFFFFF; --brand-soft:#E3F3F4;
  --ok:#15803D; --ok-soft:#E5F4EA; --warn:#B45309; --warn-soft:#FBF0E1; --bad:#C62828; --bad-soft:#FBE7E7;
  --info:#1E40AF; --info-soft:#E6EEFB; --na:#8A97A6; --na-soft:#EEF1F4; --wait:#6D28D9; --wait-soft:#F0EAFC;
  --f-ui:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,"Segoe UI",Tahoma,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px; --shadow:0 1px 2px rgba(15,27,42,.06),0 4px 14px rgba(15,27,42,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141C; --surface:#131C26; --surface-2:#18232F; --line:#253343; --ink:#E6EDF3; --muted:#93A3B5;
  --brand:#2BB3BD; --brand-ink:#04161A; --brand-soft:#0F2F33;
  --ok:#4ADE80; --ok-soft:#10261A; --warn:#F5A64A; --warn-soft:#2B1F0E; --bad:#F87171; --bad-soft:#2C1414;
  --info:#93B4FF; --info-soft:#13213D; --na:#7C8B9C; --na-soft:#1B2531; --wait:#B49AF7; --wait-soft:#211A36;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141C; --surface:#131C26; --surface-2:#18232F; --line:#253343; --ink:#E6EDF3; --muted:#93A3B5;
  --brand:#2BB3BD; --brand-ink:#04161A; --brand-soft:#0F2F33;
  --ok:#4ADE80; --ok-soft:#10261A; --warn:#F5A64A; --warn-soft:#2B1F0E; --bad:#F87171; --bad-soft:#2C1414;
  --info:#93B4FF; --info-soft:#13213D; --na:#7C8B9C; --na-soft:#1B2531; --wait:#B49AF7; --wait-soft:#211A36;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.55}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-inline-end:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;font-weight:700}
.logo b{display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--brand);color:var(--brand-ink);font-family:var(--f-mono);font-size:12px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand)}
.nav .cnt{margin-inline-start:auto;font-size:11.5px;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:0 7px;font-weight:600}
.nav .grp{font-size:11.5px;color:var(--na);padding:14px 10px 4px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--muted);padding:8px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:10px 20px;flex-wrap:wrap}
.top .crumb{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer}
.seg button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.view{padding:20px;display:flex;flex-direction:column;gap:18px;max-width:1280px;width:100%}
.head{display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
h1{font-size:22px;margin:0;text-wrap:balance} h2{font-size:16px;margin:0} h3{font-size:14px;margin:0}
.sub{color:var(--muted);margin:2px 0 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;min-height:36px;text-decoration:none;color:inherit}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.sm{padding:3px 9px;min-height:30px;font-size:12.5px}
.btn.link{border:0;background:none;color:var(--brand);padding:0;min-height:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.pad{padding:16px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:2px;border-inline-start:4px solid var(--line)}
.kpi .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:13px}
.kpi.bad{border-inline-start-color:var(--bad)} .kpi.bad .n{color:var(--bad)}
.kpi.warn{border-inline-start-color:var(--warn)} .kpi.warn .n{color:var(--warn)}
.kpi.info{border-inline-start-color:var(--info)} .kpi.info .n{color:var(--info)}
.kpi.wait{border-inline-start-color:var(--wait)} .kpi.wait .n{color:var(--wait)}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
@media (max-width:1000px){.grid2{grid-template-columns:1fr}}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.s-expired,.s-missing{background:var(--bad-soft);color:var(--bad)}
.s-expiring{background:var(--warn-soft);color:var(--warn)}
.s-needs_date{background:var(--wait-soft);color:var(--wait)}
.s-renewal{background:var(--info-soft);color:var(--info)}
.s-valid{background:var(--ok-soft);color:var(--ok)}
.s-no_expiry{background:var(--na-soft);color:var(--muted)}
.prov{font-size:11.5px;border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--muted);white-space:nowrap}
.prov.ASSUMPTION{border-color:var(--warn);color:var(--warn)}
.issue{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 16px;border-bottom:1px solid var(--line)}
.issue:last-child{border-bottom:0}
.issue .txt{display:flex;flex-direction:column;gap:4px;min-width:0}
.issue .src{font-size:12px;color:var(--muted)}
.pchips{display:flex;gap:6px;flex-wrap:wrap}
.pchip{font-size:12px;background:var(--surface-2);border-radius:6px;padding:0 7px;text-decoration:none;color:var(--ink)}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:9px 12px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12.5px;background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num{font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;min-width:90px}
.bar i{display:block;height:100%;background:var(--brand)}
.ring{--v:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--v)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring b{width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:14px;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs a{padding:8px 12px;text-decoration:none;color:var(--muted);border-bottom:2px solid transparent;font-weight:500}
.tabs a.on{color:var(--brand);border-bottom-color:var(--brand)}
.role{display:flex;flex-direction:column;gap:0}
.role h3{padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.need{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.need:last-child{border-bottom:0}
.need .meta{font-size:12.5px;color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f>span{font-size:12.5px;color:var(--muted);font-weight:600}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;min-height:38px;width:100%}
.f input[type=checkbox],.picks input{width:auto;min-height:0;padding:0;flex:none}
td .toolbar{flex-wrap:nowrap}
.f .hint{font-size:12px;color:var(--muted)}
.picks{display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.picks label{display:flex;gap:8px;align-items:center}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(560px,100vw);background:var(--surface);border-inline-start:1px solid var(--line);z-index:30;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.12)}
.drawer header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.drawer header h2{flex:1}
.drawer .body{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px}
.scrim{position:fixed;inset:0;background:rgba(10,20,30,.35);z-index:25}
.empty{padding:28px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.toast{position:fixed;bottom:18px;inset-inline-start:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;max-width:90vw}
[dir="rtl"] .toast{transform:translateX(50%)}
.alert{border-radius:8px;padding:10px 14px;background:var(--warn-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.alert.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.muted{color:var(--muted)} .small{font-size:12.5px}
.code{font-family:var(--f-mono);font-size:12.5px;direction:ltr;unicode-bidi:isolate}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{min-width:220px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--surface)}
@media (max-width:820px){
  .app{grid-template-columns:1fr} .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;padding:8px}
  .rail .logo,.rail .foot,.nav .grp{display:none} .nav{display:flex;flex-wrap:wrap;gap:4px}
  .view{padding:14px} .issue{grid-template-columns:auto minmax(0,1fr)} .issue .act{grid-column:2}
  .need{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

      <a href="#/docs" data-nav="docs"><span data-t="navDocs"></span></a>

</div>
<div class="scrim" id="scrim" hidden></div>

</aside>
<div class="toast" id="toast" hidden role="status"></div>

const tn=x=>S.lang==='ar'?x.type_ar:x.type_en;
const basis=b=>{ if(!b) return ''; if(b==='printed') return S.lang==='ar'?'التاريخ المكتوب على المستند':'date printed on the document';
  const m=b.match(/^(issued|reg_date)\+(\d+)$/); if(!m) return b;
  return S.lang==='ar'?`${m[1]==='issued'?'تاريخ الإصدار':'تاريخ التسجيل'} + ${m[2]} شهر`:`${m[1]==='issued'?'issue date':'registration date'} + ${m[2]} months`; };
async function api(path,opt={}){
  opt.headers=Object.assign({'X-DB':'1'},opt.headers||{});
  if(opt.json!==undefined){ opt.body=JSON.stringify(opt.json); opt.headers['content-type']='application/json'; delete opt.json; }
  const r=await fetch('/api/suite'+path,opt);
  if(r.status===401){ location.href='/login'; throw new Error('auth'); }
  const b=(r.headers.get('content-type')||'').includes('json')?await r.json():null;
  if(!r.ok){ const d=b&&b.detail||{}; throw new Error(d[S.lang]||d.en||r.statusText); }
  return b;
}
function toast(m){ const e=$('#toast'); e.textContent=m; e.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>e.hidden=true,3500); }
function drawer(title,html){ $('#dTitle').textContent=title; $('#dBody').innerHTML=html; $('#drawer').hidden=false; $('#scrim').hidden=false; setTimeout(()=>{const f=$('#dBody').querySelector('input,select'); if(f) f.focus();},30); }
function closeDrawer(){ $('#drawer').hidden=true; $('#scrim').hidden=true; }
$('#dClose').onclick=closeDrawer; $('#scrim').onclick=closeDrawer; document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDrawer(); });
function setLang(l){ S.lang=l; try{localStorage.setItem('rs.lang',l);}catch(e){} document.documentElement.lang=l; document.documentElement.dir=l==='ar'?'rtl':'ltr';
  $('#l-ar').classList.toggle('on',l==='ar'); $('#l-en').classList.toggle('on',l==='en'); document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t)); route(); }
$('#l-ar').onclick=()=>setLang('ar'); $('#l-en').onclick=()=>setLang('en');
$('#theme').onclick=()=>{ const r=document.documentElement; const cur=r.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); r.dataset.theme=cur==='dark'?'light':'dark'; };
async function types(){ if(!S.types) S.types=await api('/types'); return S.types; }
function nav(k,crumb){ document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===k)); $('#crumb').textContent=crumb||''; }

async function route(){
  const h=location.hash.replace(/^#/,'')||'/'; const v=$('#view');
  try{
    await types();
    let m;
    if(h==='/') return await home();
    if(h==='/products') return await productsView();
    if((m=h.match(/^\/p\/([^/]+)(?:\/(need|parties|docs|data))?$/))) return await productView(m[1],m[2]||'need');
    if(h==='/docs') return await docsView();
    if(h==='/parties') return await partiesView();
    if(h==='/rules') return await rulesView();
    return await home();
  }catch(e){ v.innerHTML=`<div class="alert bad"><b>${esc(t('err'))}:</b> ${esc(e.message)}</div>`; }
}
window.addEventListener('hashchange',route);

function issueRow(i,k){

      :`<button class="btn sm" data-replace="${i.doc_id}" data-type="${i.doc_type}">${esc(t('replace'))}</button>`)

function bindIssueActions(root=document){
  root.querySelectorAll('[data-reg]').forEach(b=>b.onclick=()=>{ const x=JSON.parse(b.dataset.reg); docForm({doc_type:x.doc_type,parties:x.party?[x.party]:[],products:x.party&&scopeOf(x.doc_type)==='party'?[]:x.products}); });
  root.querySelectorAll('[data-replace]').forEach(b=>b.onclick=async()=>{ const d=await api('/documents?state=current').then(a=>a.find(x=>x.id===b.dataset.replace));
    docForm({doc_type:d.doc_type,parties:d.parties.map(x=>x[0]),products:d.products.map(x=>x[0]),issuer:d.issuer,replaces:d.id,title:d.title}); });

  $('#df-type').onchange=showRule; showRule();
  $('#dfSave').onclick=async()=>{
    const meta={doc_type:$('#df-type').value,title:$('#df-title').value||null,number:$('#df-number').value||null,issuer:$('#df-issuer').value||null,
      issued:$('#df-issued').value||null,valid_until:$('#df-valid').value||null,url:$('#df-url').value||null,notes:$('#df-notes').value||null,replaces:pre.replaces||null,
      products:[...document.querySelectorAll('[data-pp]:checked')].map(x=>x.dataset.pp),parties:[...document.querySelectorAll('[data-pq]:checked')].map(x=>x.dataset.pq)};
    const fd=new FormData(); fd.append('meta',JSON.stringify(meta)); const file=$('#df-file').files[0]; if(file) fd.append('file',file);
    try{ await api('/documents',{method:'POST',body:fd}); closeDrawer(); toast(t('saved')); route(); }catch(e){ toast(e.message); } };
}
async function editDates(id){
  const d=(await api('/documents')).find(x=>x.id===id);
  drawer(d.title,`<div class="small muted">${esc(tn(d))} · ${prov(d.rule_provenance)} · ${esc(d.rule_source)}</div>
   <div class="form"><label class="f"><span>${esc(t('number'))}</span><input id="ed-number" value="${esc(d.number||'')}"></label>
    <label class="f"><span>${esc(t('issuer'))}</span><input id="ed-issuer" dir="auto" value="${esc(d.issuer||'')}"></label>
    <label class="f"><span>${esc(t('issued'))}</span><input type="date" id="ed-issued" value="${esc(d.issued||'')}"></label>
    <label class="f"><span>${esc(t('validUntil'))}</span><input type="date" id="ed-valid" value="${esc(d.valid_until||'')}"></label></div>
   <label class="f"><span>${esc(t('notes'))}</span><textarea id="ed-notes" rows="3" dir="auto">${esc(d.notes||'')}</textarea></label>
   <div class="toolbar"><button class="btn pri" id="edSave">${esc(t('save'))}</button><button class="btn" id="edWd">${esc(t('withdraw'))}</button></div>`);
  $('#edSave').onclick=async()=>{ try{ await api('/documents/'+id,{method:'PUT',json:{number:$('#ed-number').value,issuer:$('#ed-issuer').value,issued:$('#ed-issued').value||null,valid_until:$('#ed-valid').value||null,notes:$('#ed-notes').value}}); closeDrawer(); toast(t('saved')); route(); }catch(e){ toast(e.message); } };
  $('#edWd').onclick=async()=>{ await api(`/documents/${id}/withdraw`,{method:'POST'}); closeDrawer(); route(); };
}

/* ---------- parties */
async function partiesView(){
  nav('parties',t('navParties'));
  const ps=await api('/parties');
  $('#view').innerHTML=`<div class="head"><div><h1>${esc(t('navParties'))}</h1></div><button class="btn pri" id="npy">＋ ${esc(t('addParty'))}</button></div>
   <div class="card"><div class="tbl"><table><thead><tr><th>${esc(t('name'))}</th><th>${esc(t('partyKind'))}</th><th>${esc(t('usedBy'))}</th><th>${esc(t('docs'))}</th></tr></thead><tbody>
   ${ps.map(p=>`<tr><td>${bdi(p.name)}<div class="small muted" dir="auto">${esc([p.country,p.address].filter(Boolean).join(' — '))}</div></td><td>${esc(t('k_'+p.kind))}</td>
     <td><div class="pchips">${p.products.map(x=>`<a class="pchip" href="#/p/${x.product_id}">${bdi(x.product)} · ${esc(t('r_'+x.role))}${x.api_name?` (${bdi(x.api_name)})`:''}</a>`).join('')}</div></td>
     <td>${p.documents.map(d=>`<div class="small">${chip(d.validity)} ${esc(tn(d))}${d.end?` · ${fmt(d.end)}`:''}</div>`).join('')||'—'}</td></tr>`).join('')}</tbody></table></div></div>`;
  $('#npy').onclick=()=>partyForm();
}
function partyForm(){
  drawer(t('addParty'),`<div class="form"><label class="f"><span>${esc(t('name'))}</span><input id="pa-name" dir="auto"></label>
   <label class="f"><span>${esc(t('partyKind'))}</span><select id="pa-kind">${S.types.party_kinds.map(k=>`<option value="${k}">${esc(t('k_'+k))}</option>`).join('')}</select></label>
   <label class="f"><span>${esc(t('country'))}</span><input id="pa-country" dir="auto"></label></div>
   <label class="f"><span>${esc(t('address'))}</span><textarea id="pa-address" rows="2" dir="auto"></textarea></label>
   <div class="toolbar"><button class="btn pri" id="paSave">${esc(t('save'))}</button></div>`);
  $('#paSave').onclick=async()=>{ try{ await api('/parties',{method:'POST',json:{name:$('#pa-name').value,kind:$('#pa-kind').value,country:$('#pa-country').value||null,address:$('#pa-address').value||null}}); closeDrawer(); toast(t('saved')); route(); }catch(e){ toast(e.message); } };
}

  const r=S.types;
  $('#view').innerHTML=`<div class="head"><div><h1>${esc(t('navRules'))}</h1><p class="sub">${esc(t('assumptionNote'))}</p></div></div>
   <div class="card"><div class="tbl"><table><thead><tr><th>${esc(t('docType'))}</th><th>${esc(t('validityRule'))}</th><th>${esc(t('warnBefore'))}</th><th>${esc(t('source'))}</th></tr></thead><tbody>
   ${r.types.map(x=>`<tr><td><b>${esc(S.lang==='ar'?x.ar:x.en)}</b><div class="small muted">${esc(S.lang==='ar'?x.en:x.ar)}</div></td>
     <td>${x.validity_months?`${x.validity_months} ${esc(t('months'))}`:`<span class="muted">${esc(t('noTerm'))}</span>`}</td><td class="num">${x.warn_days||90} ${esc(t('days'))}</td>
     <td class="small">${prov(x.provenance)}<div dir="ltr" style="text-align:start">${esc(x.source)}</div></td></tr>`).join('')}</tbody></table></div></div>`;
}
