<body>

  <div class="body" id="dBody"></div>
</aside>
<div class="toast" id="toast" hidden role="status"></div>

 k_products:{ar:'منتجات',en:'Products'}, k_expired:{ar:'منتهي',en:'Expired'}, k_missing:{ar:'ناقص',en:'Missing'}, k_needs_date:{ar:'محتاج تاريخ',en:'Needs a date'},

 docType:{ar:'نوع المستند',en:'Document type'}, title:{ar:'العنوان',en:'Title'}, number:{ar:'الرقم',en:'Number'}, issuer:{ar:'الجهة المصدِرة',en:'Issued by'},

 p_ASSUMPTION:{ar:'افتراض — محتاج تأكيدك',en:'Assumption — confirm'}, p_EG_DRAFT:{ar:'مسودة الهيئة',en:'EDA draft'},

 k_company:{ar:'شركة',en:'Company'}, k_manufacturer:{ar:'مصنع',en:'Manufacturer'}, k_supplier:{ar:'مورد',en:'Supplier'}, k_lab:{ar:'معمل',en:'Lab'}, k_authority:{ar:'جهة رقابية',en:'Authority'}, k_other:{ar:'أخرى',en:'Other'},
 linkParty:{ar:'اربط طرف بالمنتج',en:'Link a party'}, roleL:{ar:'الدور',en:'Role'}, apiName:{ar:'المادة الفعالة',en:'Active substance'}, unlink:{ar:'فك الربط',en:'Unlink'},

};
const t=k=>(T[k]&&T[k][S.lang])||k;
const api=(path,opt={},root='/api/suite')=>DS.api(path,opt,root);
const fmt=d=>fmtDate(d,S.lang);
const chip=s=>`<span class="chip s-${s}">${esc(t('s_'+s))}</span>`;
const prov=p=>p?`<span class="prov ${esc(p)}">${esc(t('p_'+p.replace(/-/g,'_')))}</span>`:'';
const tn=x=>S.lang==='ar'?x.type_ar:x.type_en;
const basis=b=>{ if(!b) return ''; if(b==='printed') return S.lang==='ar'?'التاريخ المكتوب على المستند':'date printed on the document';
  const m=b.match(/^(issued|reg_date)\+(\d+)$/); if(!m) return b;
  return S.lang==='ar'?`${m[1]==='issued'?'تاريخ الإصدار':'تاريخ التسجيل'} + ${m[2]} شهر`:`${m[1]==='issued'?'issue date':'registration date'} + ${m[2]} months`; };
function drawer(title,html){ openDrawer(title, html); }
const NAV=[['home','#/','grid','navHome'],['products','#/products','pill','navProducts'],['docs','#/docs','file','navDocs'],['parties','#/parties','building','navParties']];
const REF=[['rules','#/rules','book','navRules'],['activity','#/activity','history','navActivity'],['users','#/users','users','navUsers']];
$('#nav').innerHTML = NAV.map(([r,h,i,k])=>`<a href="${h}" data-nav="${r}">${icon(i)}<span data-t="${k}"></span>${r==='home'?'<span class="cnt" id="navCnt" hidden></span>':''}</a>`).join('')
  + `<div class="grp" data-t="navRef"></div>` + REF.map(([r,h,i,k])=>`<a href="${h}" data-nav="${r}" ${r==='users'?'id="navUsers" hidden':''}>${icon(i)}<span data-t="${k}"></span></a>`).join('')
  + `<div class="grp"></div><a href="/" data-nav="dossiers">${icon('layers')}<span data-t="navDossiers"></span></a>`;
DS.wireChrome(); DS.theme.init(); $('#theme').onclick=DS.theme.toggle;
function setLang(l){ S.lang=l; store.set('db.lang',l); document.documentElement.lang=l; document.documentElement.dir=l==='ar'?'rtl':'ltr';
  $('#l-ar').classList.toggle('on',l==='ar'); $('#l-en').classList.toggle('on',l==='en'); $$('[data-t]').forEach(e=>e.textContent=t(e.dataset.t)); if(S.me) paintMe(); route(); }
$('#l-ar').onclick=()=>setLang('ar'); $('#l-en').onclick=()=>setLang('en');
async function types(){ if(!S.types) S.types=await api('/types'); return S.types; }
function nav(k,crumb){ $$('[data-nav]').forEach(a=>a.classList.toggle('on',a.dataset.nav===k)); $('#crumb').textContent=crumb||'';
  const m=$('#mobnav'); m.innerHTML=[...NAV,...REF.filter(x=>x[0]!=='users'||!$('#navUsers').hidden)].map(([r,h,_,tk])=>`<option value="${h}" ${r===k?'selected':''}>${esc(t(tk))}</option>`).join('')+`<option value="/">${esc(t('navDossiers'))}</option>`;
  m.onchange=()=>{ if(m.value.startsWith('#')) location.hash=m.value; else location.href=m.value; }; }

async function route(){
  const h=location.hash.replace(/^#/,'')||'/'; const v=$('#view');
  try{
    await types();
    let m;
    if(h==='/') return await home();
    if(h==='/products') return await productsView();
    if((m=h.match(/^\/p\/([^/]+)(?:\/(need|parties|docs|data))?$/))) return await productView(m[1],m[2]||'need');
    if(h==='/docs') return await docsView();
    if(h==='/parties') return await partiesView();
    if(h==='/rules') return await rulesView();
    if(h==='/activity') return await activityView();
    if(h==='/users') return await usersView();
    return await home();
  }catch(e){ v.innerHTML=`<div class="alert bad">${icon('alert')}<p><b>${esc(t('err'))}:</b> ${esc(e.message)}</p></div>`; }
}
window.addEventListener('hashchange',route);

/* ---------- dashboard */
async function home(){
  nav('home',t('navHome'));
  const d=await api('/dashboard'); const c=d.counts;
  const urgent=c.expired+c.missing; const cnt=$('#navCnt'); cnt.hidden=!urgent; cnt.textContent=urgent;
  const kpi=(k,cls)=>`<div class="card kpi ${cls}"><span class="n">${c[k]}</span><span class="l">${esc(t('k_'+k))}</span></div>`;
  $('#view').innerHTML=`<div class="head"><div class="title"><div class="eyebrow">${fmt(d.today)}</div><h1>${esc(t('navHome'))}</h1><p class="sub">${esc(t('homeSub'))}</p></div>
     <div class="row"><button class="btn" data-newdoc>${icon('plus')} ${esc(t('addDoc'))}</button><a class="btn pri" href="#/products" data-newprod>${icon('plus')} ${esc(t('newProduct'))}</a><a class="btn soft" href="/">${icon('layers')} ${esc(t('buildDossier'))}</a></div></div>
   <div class="kpis">${kpi('products','br')}${kpi('expired','bad')}${kpi('missing','bad')}${kpi('needs_date','wait')}${kpi('expiring','warn')}${kpi('renewal','info')}</div>
   <div class="grid2">
    <section class="card"><div class="hd"><span class="ic-tile ${urgent?'bad':'ok'}">${icon(urgent?'bell':'check',16)}</span><div class="grow"><h2>${esc(t('todo'))}</h2><p class="sub small">${esc(t('todoSub'))}</p></div></div>
      <div id="issues">${d.issues.length?d.issues.map(issueRow).join(''):`<div class="empty">${icon('check',36)}<div>${esc(t('allClear'))}</div></div>`}</div></section>
    <section class="card"><div class="hd"><span class="ic-tile">${icon('pill',16)}</span><h2>${esc(t('products'))}</h2></div>
      ${d.products.length?`<div class="tbl"><table><thead><tr><th>${esc(t('name'))}</th><th>${esc(t('readiness'))}</th><th>${esc(t('renewalDue'))}</th></tr></thead><tbody>
      ${d.products.map(p=>`<tr><td><a href="#/p/${p.id}"><b>${bdi(p.name)}</b></a>${p.name_ar?`<div class="small muted">${bdi(p.name_ar)}</div>`:''}</td>
        <td><div class="row" style="min-width:150px">${meter(p.readiness, p.readiness===100?'ok':'')}<span class="small code">${p.readiness}%</span></div>
          <div class="small row gap-s" style="margin-top:4px">${['expired','missing','needs_date','expiring'].filter(k=>p.counts[k]).map(k=>`<span class="chip s-${k}">${p.counts[k]} ${esc(t('s_'+k))}</span>`).join('')}</div></td>
        <td class="small">${p.renewal?fmt(p.renewal.due):'—'}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">${icon('pill',36)}<div>${esc(t('noProducts'))}</div><a class="btn pri" href="#/products">${icon('plus')} ${esc(t('newProduct'))}</a></div>`}
    </section></div>`;
  bindIssueActions(); $('[data-newdoc]').onclick=()=>docForm({});
}
function issueRow(i){
  const act = i.doc_id ? (i.severity==='needs_date'?`<button class="btn sm" data-editdoc="${i.doc_id}">${esc(t('setDate'))}</button>`
      :`<button class="btn sm" data-replace="${i.doc_id}" data-type="${i.doc_type}">${esc(t('replace'))}</button>`)
    : (i.severity==='renewal'?'':`<button class="btn sm pri" data-reg='${esc(JSON.stringify({doc_type:i.doc_type,party:i.party_id,products:i.products.map(p=>p.id)}))}'>${esc(t('register'))}</button>`);
  return `<div class="issue">${chip(i.severity)}<div class="txt"><div dir="auto">${esc(i[S.lang])}</div>
    <div class="pchips"><span class="small muted">${esc(t('affects'))}:</span>${i.products.map(p=>`<a class="pchip" href="#/p/${p.id}">${bdi(p.name)}</a>`).join('')}</div>
    <div class="src">${esc(t('source'))}: ${esc(i.source)}</div></div><div class="act">${act}</div></div>`;
}
function bindIssueActions(root=document){
  root.querySelectorAll('[data-reg]').forEach(b=>b.onclick=()=>{ const x=JSON.parse(b.dataset.reg); docForm({doc_type:x.doc_type,parties:x.party?[x.party]:[],products:x.party&&scopeOf(x.doc_type)==='party'?[]:x.products}); });
  root.querySelectorAll('[data-replace]').forEach(b=>b.onclick=async()=>{ const d=await api('/documents?state=current').then(a=>a.find(x=>x.id===b.dataset.replace));
    docForm({doc_type:d.doc_type,parties:d.parties.map(x=>x[0]),products:d.products.map(x=>x[0]),issuer:d.issuer,replaces:d.id,title:d.title}); });
  root.querySelectorAll('[data-editdoc]').forEach(b=>b.onclick=()=>editDates(b.dataset.editdoc));
}
const scopeOf=ty=>(S.types.types.find(x=>x.id===ty)||{}).scope;

/* ---------- products */
async function productsView(){
  nav('products',t('navProducts'));
  const ps=await api('/products');
  $('#view').innerHTML=`<div class="head"><div class="title"><h1>${esc(t('navProducts'))}</h1></div><button class="btn pri" id="np">${icon('plus')} ${esc(t('newProduct'))}</button></div>
   <div class="card">${ps.length?`<div class="tbl"><table><thead><tr><th>${esc(t('name'))}</th><th>${esc(t('form'))}</th><th>${esc(t('regNo'))}</th><th>${esc(t('licence'))}</th><th>${esc(t('readiness'))}</th><th>${esc(t('renewalDue'))}</th></tr></thead><tbody>
   ${ps.map(p=>`<tr><td><a href="#/p/${p.id}"><b>${bdi(p.name)}</b></a>${p.name_ar?`<div class="small muted">${bdi(p.name_ar)}</div>`:''}</td><td>${bdi(p.dosage_form||'—')}</td><td class="code">${esc(p.reg_no||'—')}</td><td>${esc(p.licence_type||'—')}</td>
     <td><div class="row" style="min-width:150px">${meter(p.readiness, p.readiness===100?'ok':'')}<span class="small code">${p.readiness}%</span></div></td><td class="small">${p.renewal?fmt(p.renewal.due):'—'}</td></tr>`).join('')}
   </tbody></table></div>`:`<div class="empty">${icon('pill',36)}<div>${esc(t('noProducts'))}</div></div>`}</div>`;
  $('#np').onclick=()=>productForm();
}
function productForm(p={}){
  const f=(k,l,type='text')=>`<label class="f"><span>${esc(t(l))}</span><input type="${type}" dir="auto" id="pf-${k}" value="${esc(k==='packs'?(p.packs||[]).join(', '):p[k]||'')}"></label>`;
  drawer(p.id?p.name:t('newProduct'),`<div class="form">${f('name','name')}${f('name_ar','nameAr')}${f('dosage_form','form')}
    <label class="f"><span>${esc(t('route'))}</span><select id="pf-admin_route">${['','oral','topical','parenteral','ophthalmic','inhalation','other'].map(o=>`<option ${p.admin_route===o?'selected':''}>${o}</option>`).join('')}</select></label>
    ${f('strength','strength')}${f('reg_no','regNo')}${f('reg_date','regDate','date')}
    <label class="f"><span>${esc(t('licence'))}</span><select id="pf-licence_type">${['','own','toll','f_toll','under_licence','imported','imported_bulk'].map(o=>`<option ${p.licence_type===o?'selected':''}>${o}</option>`).join('')}</select></label>

function docTable(docs){
  if(!docs.length) return `<div class="card"><div class="empty">${icon('file',36)}<div>${esc(t('noDocs'))}</div></div></div>`;
  return `<div class="card"><div class="tbl"><table><thead><tr><th>${esc(t('docType'))}</th><th>${esc(t('title'))}</th><th>${esc(t('issuer'))}</th><th>${esc(t('ends'))}</th><th>${esc(t('affects'))}</th><th></th></tr></thead><tbody>
   ${docs.map(d=>`<tr data-row="${esc((d.title+' '+(d.number||'')+' '+(d.issuer||'')+' '+d.type_ar+' '+d.type_en).toLowerCase())}" data-st="${d.validity}">
     <td>${esc(tn(d))}<div style="margin-top:3px">${chip(d.validity)}</div></td><td dir="auto">${esc(d.title)}${d.number?`<div class="code small">${esc(d.number)}</div>`:''}${d.parties.length?`<div class="small muted">${d.parties.map(x=>bdi(x[1])).join(' · ')}</div>`:''}</td>
     <td dir="auto">${esc(d.issuer||'—')}</td><td class="small">${d.end?fmt(d.end)+`<div class="muted">${esc(basis(d.validity_basis))}</div>`:'—'}</td>
     <td><div class="pchips">${d.affected.map(a=>`<a class="pchip" href="#/p/${a[0]}">${bdi(a[1])}</a>`).join('')}</div></td>
     <td><div class="row gap-s nowrap">${d.sha256?`<a class="btn sm" target="_blank" rel="noopener" href="/api/suite/documents/${d.id}/file">${esc(t('open'))}</a>`:d.url?`<a class="btn sm" target="_blank" rel="noopener noreferrer" href="${esc(d.url)}">${esc(t('open'))} ${icon('external',12)}</a>`:''}
       <button class="btn sm ghost" data-editdoc="${d.id}" aria-label="edit">${icon('pen',14)}</button><button class="btn sm" data-replace="${d.id}" data-type="${d.doc_type}">${esc(t('replace'))}</button></div></td></tr>`).join('')}
   </tbody></table></div></div>`;
}

  $('#view').innerHTML=`<div class="head"><div class="title"><h1>${esc(t('navUsers'))}</h1><p class="sub">${esc(t('roleHelp'))}</p></div></div>
   <div class="card"><div class="tbl"><table><thead><tr><th>${esc(t('username'))}</th><th>${esc(t('roleL'))}</th><th></th></tr></thead><tbody>
   ${us.map(u=>`<tr><td>${bdi(u.username)}</td><td><select data-role="${esc(u.username)}" aria-label="role" style="width:auto">${roles.map(r=>`<option value="${r}" ${u.role===r?'selected':''}>${esc(t('role_'+r))}</option>`).join('')}</select></td>
     <td><button class="btn sm" data-reset="${esc(u.username)}">${icon('key',14)} ${esc(t('resetPw'))}</button></td></tr>`).join('')}</tbody></table></div></div>
   <div class="card pad"><h3>${esc(t('addUser'))}</h3><div class="form" style="margin-top:10px">
     <label class="f"><span>${esc(t('username'))}</span><input id="nu-name" autocomplete="off"></label>
     <label class="f"><span>${esc(t('password'))}</span><input id="nu-pw" type="password" autocomplete="new-password"></label>
     <label class="f"><span>${esc(t('roleL'))}</span><select id="nu-role">${roles.slice(0,3).map(r=>`<option value="${r}" ${r==='editor'?'selected':''}>${esc(t('role_'+r))}</option>`).join('')}</select></label></div>
     <div class="row" style="margin-top:10px"><button class="btn pri" id="nuGo">${icon('plus')} ${esc(t('addUser'))}</button></div></div>`;
  $$('[data-role]').forEach(s=>s.onchange=async()=>{ try{ await api('/users/'+encodeURIComponent(s.dataset.role),{method:'PUT',json:{role:s.value}},'/api'); toast(t('saved')); }catch(e){ toast(e.message); route(); } });
  $$('[data-reset]').forEach(b=>b.onclick=()=>{ drawer(t('resetPw')+' — '+b.dataset.reset,`<label class="f"><span>${esc(t('newPw'))}</span><input type="password" id="rp" autocomplete="new-password"></label>
    <div class="row"><button class="btn pri" id="rpGo">${esc(t('save'))}</button></div>`);
    $('#rpGo').onclick=async()=>{ try{ await api('/users/'+encodeURIComponent(b.dataset.reset),{method:'PUT',json:{password:$('#rp').value}},'/api'); closeDrawer(); toast(t('saved')); }catch(e){ toast(e.message); } }; });
  $('#nuGo').onclick=async()=>{ try{ await api('/users',{method:'POST',json:{username:$('#nu-name').value,password:$('#nu-pw').value,role:$('#nu-role').value}},'/api'); toast(t('saved')); route(); }catch(e){ toast(e.message); } };
}
whoami().then(()=>setLang(S.lang));
</script>
</body>
</html>
