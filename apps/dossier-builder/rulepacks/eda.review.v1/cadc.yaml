  question: {en: "Does the specification of the non-sterile product state TAMC, TYMC and specified microorganisms by route per Annex IV Table 1 (non-aqueous oral 10^3/10^2 cfu, E. coli absent; aqueous oral 10^2/10^1, E. coli absent; cutaneous, nasal, oromucosal and auricular 10^2/10^1, S. aureus and P. aeruginosa absent; vaginal also C. albicans absent; inhalation also bile-tolerant Gram-negatives absent; rectal 10^3/10^2), interpreted as maximum counts of 20, 200 and 2000, with method, neutraliser and reference stated and B. cepacia where USP requires it?", ar: "هل تحدد مواصفات المستحضر غير المعقم العد الكلي للهوائيات والعد الكلي للخمائر والفطريات والكائنات المحددة حسب طريق الإعطاء وفق الجدول 1 من الملحق الرابع (الفموية غير المائية 10^3/10^2 وحدة مكوّنة للمستعمرات مع غياب الإشريكية القولونية؛ والفموية المائية 10^2/10^1 مع غيابها؛ والجلدية والأنفية والفموية المخاطية والأذنية 10^2/10^1 مع غياب المكورات العنقودية الذهبية والزائفة الزنجارية؛ والمهبلية مع غياب المبيضة البيضاء أيضاً؛ والاستنشاقية مع غياب سالبات الجرام المتحملة للصفراء أيضاً؛ والشرجية 10^3/10^2)، مفسَّرة كحد أقصى 20 و200 و2000، مع بيان الطريقة والمعادل الكيميائي والمرجع واختبار B. cepacia حيث يشترطه USP؟"}
