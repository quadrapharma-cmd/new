- id: CD-A1-04
  dept: cadc
  layer: eda
  ctd: "3.2.P.5.1"
  title: {en: "Tablet friability, hardness and subdivision", ar: "هشاشة الأقراص وصلابتها وتجزئتها"}
  question: {en: "For tablets, does the specification include friability (USP <1216> / Ph. Eur. 2.9.7) and breaking force for uncoated tablets unless controlled in-process, and for scored tablets the subdivision test per Ph. Eur. 0478 (NMT 1 individual mass outside 85–115 % of the average and none outside 75–125 %), or else is the package marked 'Indivisible' with a justification?", ar: "بالنسبة للأقراص، هل تتضمن المواصفات اختبار الهشاشة (USP <1216> / Ph. Eur. 2.9.7) وقوة الكسر للأقراص غير المغلفة ما لم تُضبط كرقابة أثناء التشغيل، وللأقراص المحززة اختبار التجزئة وفق Ph. Eur. 0478 (لا تخرج أكثر من كتلة فردية واحدة عن 85–115 % من المتوسط ولا تخرج أي منها عن 75–125 %)، وإلا فهل كُتبت عبارة «غير قابل للتجزئة» على العبوة مع تبرير؟"}
  applies: "admin_route == 'oral' and 'capsule_hard' not in dosage_specifics and 'oral_solution' not in dosage_specifics and 'suspension' not in dosage_specifics"
  severity: major
  evidence:
    slots: [P-09]
    keywords: ["friability", "hardness", "breaking force", "subdivision", "indivisible", "score"]
    data: [specs.product]
  auto: {kind: text}
  deficiency: {en: "The applicant should include friability and breaking force (uncoated tablets) and, for scored tablets, the subdivision test with the Ph. Eur. 0478 limits (NMT 1 unit outside 85–115 %, none outside 75–125 %) in the specification, or justify their omission and mark the package 'Indivisible'.", ar: "يجب على مقدم الطلب إدراج اختباري الهشاشة وقوة الكسر (للأقراص غير المغلفة)، وللأقراص المحززة اختبار التجزئة بحدود Ph. Eur. 0478 (لا تخرج أكثر من وحدة واحدة عن 85–115 % ولا تخرج أي منها عن 75–125 %) في المواصفات، أو تبرير إغفالها وكتابة عبارة «غير قابل للتجزئة» على العبوة."}
  action: {type: edit_data, target: "specs.product"}
  source: {code: "GL.CADC.002 v02/2024", section: "Annex I, table 14 (tablets), items 5–7", quote: "NMT 1 individual mass is outside the limits of 85- 115 % of the average mass."}
