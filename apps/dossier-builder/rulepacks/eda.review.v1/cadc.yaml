  question: {en: "Does the API certificate of analysis follow the pharmacopoeia named in the composition, and for an in-house API, are the supplier's specifications compliant with or tighter than the pharmacopoeial monograph, or, where no monograph exists, are impurities controlled per ICH Q3A with chiral identity where relevant?", ar: "هل تتبع شهادة تحليل المادة الفعالة دستور الأدوية المذكور في التركيب؟ وبالنسبة للمادة الفعالة غير الدستورية، هل مواصفات المورد مطابقة لدراسة دستور الأدوية أو أشد منها، أو عند عدم وجود دراسة دستورية هل تُضبط الشوائب وفق ICH Q3A مع اختبار هوية الكيرالية عند الاقتضاء؟"}
