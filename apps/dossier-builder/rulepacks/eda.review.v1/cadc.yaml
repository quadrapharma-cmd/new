  auto: {kind: none}
  deficiency: {en: "The applicant should set the assay limits in terms of the active moiety at 90–110 % of label claim for the API and 80–120 % for the preservative, justify the antioxidant limit scientifically, and justify any wider limit by the specific monograph or the approved stability specifications.", ar: "يجب على مقدم الطلب تحديد حدود المقايسة بدلالة الجزء الفعال عند 90–110 % من الكمية المعلنة للمادة الفعالة و80–120 % للمادة الحافظة، وتبرير حد مضاد الأكسدة علمياً، وتبرير أي حد أوسع بالدراسة الدستورية الخاصة أو مواصفات الثبات المعتمدة."}
  action: {type: edit_data, target: "specs.product"}
  source: {code: "GL.CADC.002 v02/2024", section: "Annex III §2.1.4", quote: "General acceptance limit for the API is 90-110% of the Labeled claim."}
