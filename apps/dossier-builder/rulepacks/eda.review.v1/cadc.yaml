    data: [specs.product]
  auto: {kind: text}
  deficiency: {en: "The applicant should include the bacterial endotoxins test in the specification with the pharmacopoeial limit or the calculated limit (BEL = K/M), the detailed method including inhibition/enhancement testing and the reference edition; a rabbit test is accepted only with a complete justification of LAL incompatibility.", ar: "يجب على مقدم الطلب إدراج اختبار الذيفانات الداخلية البكتيرية في المواصفات بالحد الدستوري أو الحد المحسوب (BEL = K/M)، مع الطريقة المفصلة شاملة اختبار التثبيط/التعزيز وإصدار المرجع؛ ولا يُقبل اختبار الأرانب إلا بتبرير كامل لعدم التوافق مع تقنية LAL."}
