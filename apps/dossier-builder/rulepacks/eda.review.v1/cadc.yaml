- id: CD-A5-01
  dept: cadc
  layer: eda
  ctd: "3.2.P.5.3"
  title: {en: "Validation specificity, range, LOD and LOQ", ar: "النوعية والمدى وحدا الكشف والتقدير في التثبت"}
  question: {en: "For each non-pharmacopoeial method (or a pharmacopoeial method used outside its scope), does the full validation per ICH Q2(R2) show specificity (resolution NLT 1.5, blank interference NMT 1 %, placebo interference NMT 2 %, forced degradation with resolution ≥ 2 and peak purity), a range from at least five standard solutions covering 80–120 % for assay, 70–130 % for content uniformity and reporting level to 120 % for impurities with R² ≥ 0.995 (≥ 0.99 for impurities), and LOD and LOQ at S/N ≥ 3 and ≥ 10?", ar: "لكل طريقة غير دستورية (أو طريقة دستورية مستخدمة خارج نطاقها)، هل يُظهر التثبت الكامل وفق ICH Q2(R2) النوعية (درجة فصل لا تقل عن 1.5، وتداخل الشاهد لا يتجاوز 1 %، وتداخل الغفل لا يتجاوز 2 %، والتحلل القسري بدرجة فصل ≥ 2 ونقاء القمة)، ومدى من خمسة محاليل قياسية على الأقل يغطي 80–120 % للمقايسة و70–130 % لتجانس المحتوى ومن مستوى الإبلاغ إلى 120 % للشوائب بمعامل تحديد R² ≥ 0.995 (≥ 0.99 للشوائب)، وحدي الكشف والتقدير عند نسبة إشارة إلى ضوضاء ≥ 3 و≥ 10؟"}
  applies: "true"
  severity: major
  evidence:
    slots: [P-10]
    keywords: ["specificity", "linearity", "correlation coefficient", "LOQ", "LOD", "range"]
    data: []
  auto: {kind: text}
  deficiency: {en: "The applicant should submit a full validation study of the in-house analytical method according to ICH Q2(R2) covering specificity (including forced degradation), range/linearity with at least five concentrations and R² ≥ 0.995 (≥ 0.99 for impurities), LOD (S/N ≥ 3) and LOQ (S/N ≥ 10) against the acceptance criteria of Annex V Table 1.", ar: "يجب على مقدم الطلب تقديم دراسة تثبت كاملة لطريقة التحليل الداخلية وفق ICH Q2(R2) تشمل النوعية (بما فيها التحلل القسري)، والمدى/الخطية بخمسة تراكيز على الأقل وR² ≥ 0.995 (≥ 0.99 للشوائب)، وحد الكشف (إشارة/ضوضاء ≥ 3) وحد التقدير (≥ 10) مقابل معايير القبول في الجدول 1 من الملحق الخامس."}
  action: {type: upload, target: "P-10"}
  source: {code: "GL.CADC.002 v02/2024", section: "Annex V Table 1 (with Annex III §2.3.1)", quote: "Minimum five standard solutions covering: o 80-120% (assay) o 70-130% (content uniformity) o Reporting level - 120% of specifications (impurities)"}
  anchor: {code: "ICH Q2(R2)", section: ""}
- id: CD-A5-02
  dept: cadc
  layer: eda
  ctd: "3.2.P.5.3"
  title: {en: "Validation precision, accuracy, system suitability", ar: "الدقة والصحة وملاءمة النظام في التثبت"}
  question: {en: "Does the validation report show repeatability from nine determinations (three concentrations in triplicate) or six at 100 % with RSD ≤ 3 % for the drug product (impurities: RSD ≤ 30 % below 0.1 %, ≤ 20 % at 0.1–0.2 %, ≤ 10 % at 0.2–0.5 %, ≤ 5 % at 0.5–5 %), intermediate precision across days, analysts and equipment with RSD ≤ 3 %, accuracy from matrix spiked at three levels (n = 9) within 95–105 % (impurities 70–130 % ≤ 0.2 %, 80–120 % at 0.2–0.5 %, 90–110 % at 0.5–5 %), and system suitability (n = 5 RSD NMT 2 %, resolution ≥ 2, tailing ≤ 2, plates ≥ 2000, k ≥ 2) with robustness available on request?", ar: "هل يُظهر تقرير التثبت التكرارية من تسعة تقديرات (ثلاثة تراكيز بثلاث مكررات) أو ستة عند 100 % بانحراف معياري نسبي ≤ 3 % للمستحضر (وللشوائب: ≤ 30 % دون 0.1 %، و≤ 20 % عند 0.1–0.2 %، و≤ 10 % عند 0.2–0.5 %، و≤ 5 % عند 0.5–5 %)، والدقة الوسيطة عبر الأيام والمحللين والأجهزة بانحراف ≤ 3 %، والصحة بإضافة معلومة إلى المصفوفة عند ثلاثة مستويات (ن = 9) ضمن 95–105 % (وللشوائب 70–130 % عند ≤ 0.2 %، و80–120 % عند 0.2–0.5 %، و90–110 % عند 0.5–5 %)، وملاءمة النظام (ن = 5 بانحراف لا يتجاوز 2 %، ودرجة فصل ≥ 2، وعامل تذيل ≤ 2، وعدد صفائح نظرية ≥ 2000، وعامل سعة ≥ 2) مع إتاحة المتانة عند الطلب؟"}
  applies: "true"
  severity: major
  evidence:
    slots: [P-10]
    keywords: ["repeatability", "intermediate precision", "accuracy", "recovery", "system suitability", "RSD"]
    data: []
  auto: {kind: text}
  deficiency: {en: "The applicant should complete the validation with repeatability and intermediate precision (RSD ≤ 3 % for the drug product), accuracy at three levels in the matrix (n = 9, 95–105 %) and system suitability (RSD NMT 2 %, resolution ≥ 2, tailing ≤ 2, plates ≥ 2000) according to Annex V Table 1, and make the robustness data available.", ar: "يجب على مقدم الطلب استكمال التثبت بالتكرارية والدقة الوسيطة (انحراف معياري نسبي ≤ 3 % للمستحضر)، والصحة عند ثلاثة مستويات في المصفوفة (ن = 9، 95–105 %)، وملاءمة النظام (انحراف لا يتجاوز 2 %، ودرجة فصل ≥ 2، وعامل تذيل ≤ 2، وصفائح ≥ 2000) وفق الجدول 1 من الملحق الخامس، وإتاحة بيانات المتانة."}
  action: {type: upload, target: "P-10"}
  source: {code: "GL.CADC.002 v02/2024", section: "Annex V Table 1, Accuracy and System suitability", quote: "Matrix spiked at 3 levels covering linearity range (nine determinations) (i.e., three concentrations and three replicates of each concentration) (n=9) 95-105.0% drug product"}
  anchor: {code: "ICH Q2(R2)", section: ""}
- id: CD-A5-03
  dept: cadc
  layer: eda
  ctd: "3.2.P.5.3"
  title: {en: "Dissolution method validation criteria", ar: "معايير التثبت من طريقة الانحلال"}
  question: {en: "Does the dissolution method validation meet Annex V Table 2: interference of placebo and of other actives/degradants not exceeding 2 % and of the medium 1 %, a range of at least five concentrations with R² ≥ 0.98 and a non-significant intercept (immediate release: Q − 45 % of the lowest strength to 130 % of the highest), repeatability RSD < 2 %, intermediate precision with two analysts on two days differing by not more than an absolute 10 % below 85 % dissolved and 5 % at or above it, and recovery of 95–105 %?", ar: "هل يستوفي التثبت من طريقة الانحلال الجدول 2 من الملحق الخامس: تداخل الغفل والمواد الفعالة الأخرى/نواتج التحلل لا يتجاوز 2 % والوسط 1 %، ومدى من خمسة تراكيز على الأقل بمعامل تحديد R² ≥ 0.98 وتقاطع غير ذي دلالة (للتحرر الفوري: من Q − 45 % من أدنى تركيز إلى 130 % من أعلاه)، وتكرارية بانحراف معياري نسبي < 2 %، ودقة وسيطة بمحللَين في يومين لا يتجاوز فرقها 10 % مطلقة دون انحلال 85 % و5 % عنده أو فوقه، واسترداد 95–105 %؟"}
  applies: "admin_route in ('oral','rectal','vaginal') and 'oral_solution' not in dosage_specifics and not aqueous_solution"
  severity: major
  evidence:
    slots: [P-10]
    keywords: ["dissolution method validation", "validation of the dissolution", "dissolution medium", "filter", "recovery"]
    data: []
  auto: {kind: text}
  deficiency: {en: "The applicant should submit a validation of the dissolution method meeting Annex V Table 2 (specificity ≤ 2 %/1 %, five-point range with R² ≥ 0.98, repeatability RSD < 2 %, intermediate precision within 10 %/5 %, recovery 95–105 %).", ar: "يجب على مقدم الطلب تقديم تثبت من طريقة الانحلال يستوفي الجدول 2 من الملحق الخامس (نوعية ≤ 2 %/1 %، ومدى بخمس نقاط وR² ≥ 0.98، وتكرارية بانحراف < 2 %، ودقة وسيطة ضمن 10 %/5 %، واسترداد 95–105 %)."}
  action: {type: upload, target: "P-10"}
  source: {code: "GL.CADC.002 v02/2024", section: "Annex V Table 2", quote: "The difference in the mean value for dissolution results between any two conditions does not exceed an absolute 10% at time points with <85% dissolved"}
