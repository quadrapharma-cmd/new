  question: {en: "For parenteral and ophthalmic solutions, does the specification include particulate matter per USP <788> (injections and extra-ocular) or USP <789> (intra-ocular), osmolality per USP <785>, and for parenterals container–closure integrity (USP <1207.2>/<1207.3>)?", ar: "بالنسبة للمحاليل الحقنية والعينية، هل تتضمن المواصفات اختبار الجسيمات الدقيقة وفق USP <788> (للحقن وخارج العين) أو USP <789> (داخل العين)، والأسمولالية وفق USP <785>، وللحقن سلامة إغلاق العبوة (USP <1207.2>/<1207.3>)؟"}
