  action: {type: edit_data, target: "specs.product"}
  source: {code: "GL.CADC.002 v02/2024", section: "Annex I, table 10 (solutions), items 6, 11 and 12", quote: "Particulate Matter In Injections for Extra-ocular solutions for injections and for parenteral solutions"}
- id: CD-A1-07
  dept: cadc
  layer: eda
  ctd: "3.2.P.5.1"
  title: {en: "Fill, deliverable volume and container content", ar: "الملء والحجم القابل للتسليم ومحتوى العبوة"}
  question: {en: "Does the specification include the fill test appropriate to the dosage form: deliverable volume USP <698> for oral liquids, container content USP <697> for parenterals, and minimum fill USP <755> for topical, nasal, ophthalmic, otic, rectal, vaginal and inhalation preparations and aerosols?", ar: "هل تتضمن المواصفات اختبار الملء المناسب للشكل الصيدلي: الحجم القابل للتسليم USP <698> للسوائل الفموية، ومحتوى العبوة USP <697> للحقن، والحد الأدنى للملء USP <755> للمستحضرات الموضعية والأنفية والعينية والأذنية والشرجية والمهبلية والاستنشاقية والإيروسولات؟"}
  applies: "aqueous_solution or 'oral_solution' in dosage_specifics or 'suspension' in dosage_specifics or 'topical' in dosage_specifics or admin_route in ('parenteral','ophthalmic','nasal','inhalation')"
  severity: major
  evidence:
    slots: [P-09]
    keywords: ["deliverable volume", "minimum fill", "container content", "extractable volume", "net fill", "fill weight"]
    data: [specs.product]
  auto: {kind: text}
  deficiency: {en: "The applicant should add the applicable fill test (deliverable volume USP <698>, container content for injections USP <697> or minimum fill USP <755>) with its acceptance criterion to the finished product specification.", ar: "يجب على مقدم الطلب إضافة اختبار الملء المنطبق (الحجم القابل للتسليم USP <698>، أو محتوى العبوة للحقن USP <697>، أو الحد الأدنى للملء USP <755>) بمعيار قبوله إلى مواصفات المستحضر النهائي."}
  action: {type: edit_data, target: "specs.product"}
  source: {code: "GL.CADC.002 v02/2024", section: "Annex I, table 3 (creams, gels, ointments), item 2 Minimum fill", quote: "In case of single unit containers where the test for content uniformity is applied, the test for minimum fill is not required."}
- id: CD-A1-08
  dept: cadc
  layer: eda
  ctd: "3.2.P.5.1"
  title: {en: "pH and viscosity of liquids and semisolids", ar: "الرقم الهيدروجيني واللزوجة للسوائل وشبه الصلبة"}
