# EDA CADC "Guidelines for File Assessment for Pharmaceutical Products for Human Use"
# GL.CADC.002 v02/2024 (effective 01/06/2024) - assessor questions, dept cadc, layer eda
- id: CD-65-01
  dept: cadc
  layer: eda
  ctd: "3.2.P.5.1"
  title: {en: "Latest pharmacopoeia edition referenced", ar: "الاستناد إلى أحدث إصدار من دستور الأدوية"}
  question: {en: "Wherever a pharmacopoeia (USP, BP, Ph. Eur.) is cited in the specification, methods or composition, is the most recent edition the one referred to?", ar: "حيثما يُستشهد بدستور أدوية (USP أو BP أو Ph. Eur.) في المواصفات أو طرق التحليل أو التركيب، هل الإصدار المشار إليه هو أحدث إصدار؟"}
  applies: "true"
  severity: major
  evidence:
    slots: [P-09, M1-36]
    keywords: ["current edition", "latest edition", "USP", "Ph. Eur.", "BP"]
    data: []
  auto: {kind: none}
  deficiency: {en: "The applicant should update every pharmacopoeial reference in the specifications and analytical procedures to the most recent edition of the pharmacopoeia.", ar: "يجب على مقدم الطلب تحديث كل إشارة إلى دستور الأدوية في المواصفات وطرق التحليل إلى أحدث إصدار من دستور الأدوية المعني."}
  action: {type: edit_data, target: "specs.product"}
  source: {code: "GL.CADC.002 v02/2024", section: "§6.5.2", quote: "Whenever a pharmacopeia is used as a reference, this shall always refer to the most recent version thereof."}
- id: CD-65-02
  dept: cadc
  layer: eda
  ctd: "3.2.P.5.6"
  title: {en: "Monograph tests included or waiver justified", ar: "إدراج اختبارات الدستور أو تبرير إسقاطها"}
  question: {en: "Where the finished product is pharmacopoeial or has a pharmacopoeial monograph, does the specification adhere to all monograph tests and acceptance criteria, and is every monograph test not listed in this guideline either added or its waiver justified?", ar: "إذا كان المستحضر النهائي دستورياً أو له دراسة (مونوغراف) في دستور أدوية، فهل تلتزم المواصفات بجميع اختبارات الدراسة ومعايير قبولها، وهل أُضيف كل اختبار تنص عليه الدراسة ولا يرد في هذا الدليل أو قُدّم تبرير لإسقاطه؟"}
  applies: "true"
  severity: major
  evidence:
    slots: [P-09, P-13]
    keywords: ["monograph", "justif", "waive", "not applicable"]
    data: []
  auto: {kind: none}
  deficiency: {en: "The applicant should add the tests prescribed in the finished product monograph that are missing from the specification, or provide a scientific justification for waiving each of them.", ar: "يجب على مقدم الطلب إضافة الاختبارات المنصوص عليها في دراسة المستحضر النهائي بدستور الأدوية والمفقودة من المواصفات، أو تقديم تبرير علمي لإسقاط كل منها."}
  action: {type: generate, target: "P-13"}
  source: {code: "GL.CADC.002 v02/2024", section: "§6.5.3 and §6.5.7", quote: "if the monograph specifies certain tests that are not stated in this guideline, the manufacturer/MAH should add those tests, or otherwise justify waiving those tests."}
- id: CD-65-03
  dept: cadc
  layer: eda
  ctd: "3.2.P.2.2"
  title: {en: "Dissolution study submitted", ar: "تقديم دراسة الانحلال"}
  question: {en: "Has a complete dissolution study with scientific justification been submitted for a new drug product, or a complete comparative dissolution study in different media in other cases?", ar: "هل قُدّمت دراسة انحلال كاملة مع تبرير علمي للمستحضر الدوائي الجديد، أو دراسة انحلال مقارنة كاملة في أوساط مختلفة في الحالات الأخرى؟"}
  applies: "'oral_solution' not in dosage_specifics and not aqueous_solution"
  severity: major
  evidence:
    slots: [P-02]
    keywords: ["dissolution profile", "comparative dissolution", "f2", "dissolution study", "similarity"]
    data: []
  auto: {kind: text}
  deficiency: {en: "The applicant should submit a complete dissolution study with scientific justification (new drug product) or a complete comparative dissolution study in different media against the reference product.", ar: "يجب على مقدم الطلب تقديم دراسة انحلال كاملة مع تبرير علمي (للمستحضر الجديد) أو دراسة انحلال مقارنة كاملة في أوساط مختلفة مقابل المستحضر المرجعي."}
  action: {type: upload, target: "P-02"}
  source: {code: "GL.CADC.002 v02/2024", section: "§6.5.4 and §6.5.5", quote: "For new pharmaceutical drug products, a complete dissolution study with scientific justification should be submitted."}
- id: CD-65-04
  dept: cadc
  layer: eda
  ctd: "3.2.P.5.1"
  title: {en: "Reference-country approved specifications", ar: "المواصفات المعتمدة من الدولة المرجعية"}
  question: {en: "For an imported product approved in a reference country of the Technical Committee for Drug Control list, are the submitted specifications those previously approved by the reference country's NRA?", ar: "بالنسبة للمستحضر المستورد المعتمد في دولة مرجعية مدرجة في قائمة اللجنة الفنية لمراقبة الأدوية، هل المواصفات المقدمة هي المواصفات المعتمدة سابقاً من السلطة التنظيمية الوطنية للدولة المرجعية؟"}
  applies: "origin == 'imported'"
  severity: major
  evidence:
    slots: [P-09, P-13]
    keywords: ["approved", "reference country", "EMA", "FDA", "MHRA", "marketing authori"]
    data: []
  auto: {kind: none}
  deficiency: {en: "The applicant should submit the finished product specifications as approved by the reference country's national regulatory authority, with evidence of that approval.", ar: "يجب على مقدم الطلب تقديم مواصفات المستحضر النهائي كما اعتمدتها السلطة التنظيمية الوطنية للدولة المرجعية، مع ما يثبت ذلك الاعتماد."}
  action: {type: upload, target: "P-09"}
  source: {code: "GL.CADC.002 v02/2024", section: "§6.5.6.1", quote: "The products are assessed and analyzed according to their specifications that have been previously approved by the reference country‘s NRA."}
- id: CD-65-05
  dept: cadc
  layer: eda
  ctd: "3.2.P.5.1"
  title: {en: "Shelf-life specifications provided", ar: "تقديم مواصفات نهاية الصلاحية"}
  question: {en: "Are shelf-life (end of shelf-life) specifications provided, since CADC assesses and analyses the product against shelf-life specifications, with release specifications set out separately where they differ?", ar: "هل قُدّمت مواصفات نهاية الصلاحية، علماً بأن الإدارة المركزية للرقابة الدوائية تقيّم المستحضر وتحلله وفق مواصفات نهاية الصلاحية، مع عرض مواصفات الإفراج في مجموعة منفصلة حيثما اختلفت؟"}
  applies: "true"
  severity: major
  evidence:
    slots: [P-09]
    keywords: ["shelf-life", "shelf life", "end of shelf", "release and shelf", "check limit"]
    data: [specs.product]
  auto: {kind: text}
  deficiency: {en: "The applicant should provide the shelf-life specifications of the finished product, clearly distinguished from the release specifications, as the product is assessed and analysed against shelf-life specifications.", ar: "يجب على مقدم الطلب تقديم مواصفات نهاية الصلاحية للمستحضر النهائي مميزة بوضوح عن مواصفات الإفراج، إذ يُقيَّم المستحضر ويُحلَّل وفق مواصفات نهاية الصلاحية."}
  action: {type: edit_data, target: "specs.product"}
  source: {code: "GL.CADC.002 v02/2024", section: "§6.5.8", quote: "The products are assessed and analyzed according to shelf-life specifications."}
- id: CD-66-01
  dept: cadc
  layer: eda
  ctd: "3.2.P.1"
  title: {en: "Composition pharmacopoeial references match licence", ar: "مطابقة المراجع الدستورية في التركيب للترخيص"}
  question: {en: "Does the pharmacopoeial reference stated for each ingredient in the composition (BP, USP, etc.) comply with the registration licence, and does each pharmacopoeial API comply with the latest version of the specified pharmacopoeia?", ar: "هل يتطابق المرجع الدستوري المذكور لكل مكوّن في التركيب (BP أو USP وغيرهما) مع ترخيص التسجيل، وهل تلتزم كل مادة فعالة دستورية بأحدث إصدار من دستور الأدوية المحدد؟"}
  applies: "true"
  severity: major
  evidence:
    slots: [P-01, M1-31]
    keywords: ["BP", "USP", "Ph. Eur.", "Ph.Eur", "in-house"]
    data: [composition, apis]
  auto: {kind: none}
  deficiency: {en: "The applicant should align the pharmacopoeial reference of each ingredient in the product composition with the registration licence and state the latest version of the pharmacopoeia for each pharmacopoeial API.", ar: "يجب على مقدم الطلب مطابقة المرجع الدستوري لكل مكوّن في تركيب المستحضر مع ترخيص التسجيل، وبيان أحدث إصدار من دستور الأدوية لكل مادة فعالة دستورية."}
  action: {type: edit_data, target: "composition"}
  source: {code: "GL.CADC.002 v02/2024", section: "§6.6.1.1 and §6.6.1.3", quote: "The reference specified in the product composition (BP, USP etc.) must comply with the registration license."}
- id: CD-66-02
  dept: cadc
  layer: eda
  ctd: "3.2.P.1"
  title: {en: "Excipient functions stated", ar: "بيان وظيفة كل مادة غير فعالة"}
  question: {en: "Is the function of every inactive ingredient in the composition stated according to the Handbook of Pharmaceutical Excipients or another reliable reference?", ar: "هل وُضحت وظيفة كل مادة غير فعالة في التركيب وفقاً لكتيب السواغات الصيدلانية (Handbook of Pharmaceutical Excipients) أو مرجع آخر موثوق؟"}
  applies: "true"
  severity: minor
  evidence:
    slots: [P-01]
    keywords: ["function", "Handbook of Pharmaceutical Excipients", "lubricant", "disintegrant", "binder", "diluent"]
    data: [composition]
  auto: {kind: text}
  deficiency: {en: "The applicant should state the function of each inactive ingredient in the composition according to the Handbook of Pharmaceutical Excipients or another reliable reference.", ar: "يجب على مقدم الطلب بيان وظيفة كل مادة غير فعالة في التركيب وفقاً لكتيب السواغات الصيدلانية أو مرجع آخر موثوق."}
  action: {type: edit_data, target: "composition"}
  source: {code: "GL.CADC.002 v02/2024", section: "§6.6.1.2", quote: "The function of inactive materials in product should be clarified according to Handbook of Pharmaceutical Excipients or any other reliable reference."}
- id: CD-66-03
  dept: cadc
  layer: eda
  ctd: "3.2.P.1"
  title: {en: "Calculation sheet for salt and IU potency", ar: "ورقة حساب مكافئ الملح والفاعلية بالوحدات الدولية"}
  question: {en: "Where the active is a salt, is a separate calculation sheet for the salt-to-base equivalency provided, and where potency is expressed in international units, is the amount marked with (*) and footnoted that the quantity used depends on the potency of the raw material?", ar: "إذا كانت المادة الفعالة ملحاً، فهل قُدّمت ورقة حساب منفصلة لمكافئ الملح إلى القاعدة؟ وإذا كانت الفاعلية تُحسب بالوحدات الدولية، فهل وُضعت علامة (*) على الكمية مع حاشية أسفل الجدول توضح أن الكمية المستخدمة تعتمد على فاعلية المادة الخام؟"}
  applies: "true"
  severity: major
  evidence:
    slots: [M1-32, P-01]
    keywords: ["equivalent to", "salt", "base", "potency", "international unit", "IU"]
    data: [composition]
  auto: {kind: none}
  deficiency: {en: "The applicant should submit a separate calculation sheet for the equivalency of the salt to the base and, for actives expressed in international units, mark the amount with (*) and add the potency footnote below the composition table.", ar: "يجب على مقدم الطلب تقديم ورقة حساب منفصلة لمكافئ الملح إلى القاعدة، وبالنسبة للمواد الفعالة المعبر عنها بالوحدات الدولية وضع علامة (*) على الكمية وإضافة حاشية الفاعلية أسفل جدول التركيب."}
  action: {type: upload, target: "M1-32"}
  source: {code: "GL.CADC.002 v02/2024", section: "§6.6.2.1 and §6.6.2.2", quote: "There should be a separate calculation sheet to calculate equivalency of salt to the base."}
- id: CD-66-04
  dept: cadc
  layer: eda
  ctd: "CADC-DOCS"
  title: {en: "Registration form package and manufacturer", ar: "وصف العبوة واسم المصنّع في نموذج التسجيل"}
  question: {en: "Does the registration form give a full description of the package that is concordant with the attached samples, and does it state the name of the manufacturer?", ar: "هل يتضمن نموذج التسجيل وصفاً كاملاً للعبوة متطابقاً مع العينات المرفقة، وهل يذكر اسم المصنّع؟"}
  applies: "true"
  severity: minor
  evidence:
    slots: [P-15, M1-11]
    keywords: ["carton", "blister", "bottle", "vial", "manufactured by", "manufacturer"]
    data: [packs]
  auto: {kind: none}
  deficiency: {en: "The applicant should complete the registration form with a full description of the package concordant with the submitted samples and state the name of the manufacturer.", ar: "يجب على مقدم الطلب استكمال نموذج التسجيل بوصف كامل للعبوة متطابق مع العينات المقدمة، وبيان اسم المصنّع."}
  action: {type: edit_data, target: "packs"}
  source: {code: "GL.CADC.002 v02/2024", section: "§6.6.3.1 and §6.6.3.2", quote: "A full description of the package , concordant with the attached samples , should be stated."}
- id: CD-66-05
  dept: cadc
  layer: eda
  ctd: "3.2.P.5.1"
  title: {en: "Active in specification matches licence", ar: "مطابقة المادة الفعالة في المواصفات للترخيص"}
  question: {en: "Do the finished product specification and the production certificate of analysis state the active material exactly as stated in the registration licence and the product composition (same form, salt and strength)?", ar: "هل تذكر مواصفات المستحضر النهائي وشهادة تحليل الإنتاج المادة الفعالة تماماً كما وردت في ترخيص التسجيل وتركيب المستحضر (الصورة نفسها والملح نفسه والتركيز نفسه)؟"}
  applies: "true"
  severity: major
  evidence:
    slots: [P-09, P-11]
    keywords: ["assay", "content", "label claim", "labelled amount"]
    data: [composition, specs.product, apis]
  auto: {kind: none}
  deficiency: {en: "The applicant should correct the finished product specification and certificate of analysis so that the active material is stated as in the registration licence and the product composition.", ar: "يجب على مقدم الطلب تصحيح مواصفات المستحضر النهائي وشهادة التحليل بحيث تُذكر المادة الفعالة كما وردت في ترخيص التسجيل وتركيب المستحضر."}
  action: {type: edit_data, target: "specs.product"}
  source: {code: "GL.CADC.002 v02/2024", section: "§6.6.4", quote: "The finished product specification and certificate of analysis of production should contain the active material as stated in registration license and product composition."}
- id: CD-66-06
  dept: cadc
  layer: eda
  ctd: "3.2.P.5.2"
