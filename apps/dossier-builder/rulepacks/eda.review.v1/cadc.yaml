  question: {en: "Where an analytical method has been updated from the registered one, are the full detailed method, the complete validation or verification protocol and report, the complete validation or verification charts, and the receipt of the method-change fee all submitted?", ar: "في حال تحديث طريقة التحليل عن الطريقة المسجلة، هل قُدّمت الطريقة الكاملة المفصلة، وبروتوكول وتقرير التحقق أو التثبت الكاملان، والرسوم البيانية الكاملة للتحقق أو التثبت، وإيصال سداد رسوم تغيير الطريقة؟"}
  applies: "true"
  severity: major
  evidence:
    slots: [P-10]
    keywords: ["validation report", "verification report", "protocol", "chromatogram", "receipt"]
    data: []
  auto: {kind: none}
  deficiency: {en: "For the updated analytical method the applicant should submit the full detailed method, the complete validation or verification protocol and report with the charts, and the receipt of payment of the method-change fee.", ar: "يجب على مقدم الطلب، بالنسبة لطريقة التحليل المحدّثة، تقديم الطريقة الكاملة المفصلة، وبروتوكول وتقرير التحقق أو التثبت الكاملين مع الرسوم البيانية، وإيصال سداد رسوم تغيير الطريقة."}
  action: {type: upload, target: "P-10"}
  source: {code: "GL.CADC.002 v02/2024", section: "§6.6.5", quote: "In case of using updated method, the following shall be submitted"}
- id: CD-A1-01
  dept: cadc
  layer: eda
  ctd: "3.2.P.5.1"
  title: {en: "Uniformity of mass per Ph. Eur. 2.9.5", ar: "تجانس الكتلة وفق Ph. Eur. 2.9.5"}
  question: {en: "For solid dosage units (tablets, capsules, suppositories, single-dose powders and granules), does the specification include uniformity of mass per Ph. Eur. 2.9.5 (not more than 2 individual masses deviate from the average by more than the percentage deviation and none by more than twice it), unless uniformity of content is prescribed for all actives?", ar: "بالنسبة لوحدات الجرعة الصلبة (الأقراص والكبسولات والتحاميل والمساحيق والحبيبات أحادية الجرعة)، هل تتضمن المواصفات اختبار تجانس الكتلة وفق Ph. Eur. 2.9.5 (لا تنحرف أكثر من كتلتين فرديتين عن المتوسط بأكثر من نسبة الانحراف المقررة ولا تنحرف أي منها بأكثر من ضعفها)، ما لم يكن تجانس المحتوى مقرراً لجميع المواد الفعالة؟"}
  applies: "admin_route in ('oral','rectal','vaginal') and 'oral_solution' not in dosage_specifics and 'suspension' not in dosage_specifics"
  severity: major
  evidence:
    slots: [P-09]
    keywords: ["uniformity of mass", "mass uniformity", "average mass", "2.9.5", "uniformity of dosage units", "weight variation"]
    data: [specs.product]
  auto: {kind: text}
  deficiency: {en: "The applicant should include the uniformity of mass test (Ph. Eur. 2.9.5) with its acceptance criteria in the finished product specification, or demonstrate that uniformity of content is prescribed and authorised for all active substances.", ar: "يجب على مقدم الطلب إدراج اختبار تجانس الكتلة (Ph. Eur. 2.9.5) بمعايير قبوله في مواصفات المستحضر النهائي، أو إثبات أن اختبار تجانس المحتوى مقرر ومعتمد لجميع المواد الفعالة."}
  action: {type: edit_data, target: "specs.product"}
  source: {code: "GL.CADC.002 v02/2024", section: "Annex I, tables 2, 7, 9, 12 and 14", quote: "Not more than 2 of the individual masses deviate from the average mass (actual) by more than the percentage deviation."}
- id: CD-A1-02
  dept: cadc
  layer: eda
  ctd: "3.2.P.5.1"
  title: {en: "Disintegration test and Q6A substitution", ar: "اختبار التفتت وإحلاله محل الانحلال"}
  question: {en: "Does the specification include disintegration per USP <701> / Ph. Eur. 2.9.1 for immediate-release, orally lyophilised and delayed-release tablets and for capsules (not for extended-release tablets), and where disintegration replaces dissolution for a locally acting API, is a justification per ICH Q6A submitted together with the dissolution method performed?", ar: "هل تتضمن المواصفات اختبار التفتت وفق USP <701> / Ph. Eur. 2.9.1 للأقراص فورية التحرر والأقراص المجففة بالتجميد فموياً والأقراص متأخرة التحرر وللكبسولات (وليس للأقراص ممتدة التحرر)؟ وفي حال إحلال التفتت محل الانحلال لمادة فعالة موضعية التأثير، هل قُدّم تبرير وفق ICH Q6A مع طريقة الانحلال التي أُجريت؟"}
  applies: "admin_route == 'oral' and 'oral_solution' not in dosage_specifics and 'suspension' not in dosage_specifics and 'modified_release' not in dosage_specifics"
  severity: major
  evidence:
    slots: [P-09, P-13]
    keywords: ["disintegration", "701", "2.9.1"]
    data: [specs.product]
  auto: {kind: text}
  deficiency: {en: "The applicant should include the disintegration test (USP <701> / Ph. Eur. 2.9.1) in the specification or, where disintegration is proposed instead of dissolution, submit a justification according to ICH Q6A together with the dissolution method performed.", ar: "يجب على مقدم الطلب إدراج اختبار التفتت (USP <701> / Ph. Eur. 2.9.1) في المواصفات، أو في حال اقتراح التفتت بدلاً من الانحلال تقديم تبرير وفق ICH Q6A مع طريقة الانحلال التي أُجريت."}
  action: {type: edit_data, target: "specs.product"}
  source: {code: "GL.CADC.002 v02/2024", section: "Annex I, table 2 (capsules) and table 14 (tablets)", quote: "Disintegration could substitute dissolution as a performance test if a justification submitted by the manufacturer that it obeys the ICH Q6A guidelines."}
  anchor: {code: "ICH Q6A", section: ""}
- id: CD-A1-03
  dept: cadc
  layer: eda
  ctd: "3.2.P.5.1"
  title: {en: "Dissolution method source and parameters", ar: "مصدر طريقة الانحلال ومعاييرها"}
  question: {en: "Is the dissolution method taken from the USP/BP monograph, the FDA dissolution methods database (with a comparative profile in the most suitable media) or developed in-house per Annex II, and does the specification state all parameters: filter type, medium composition and pH, volume, apparatus, rpm, temperature, sinkers, sampling time and Q, with USP <711> / Ph. Eur. 2.9.3 acceptance stages?", ar: "هل طريقة الانحلال مأخوذة من دراسة USP/BP أو من قاعدة بيانات طرق الانحلال لدى FDA (مع منحنى مقارن في أنسب الأوساط) أو مطوَّرة داخلياً وفق الملحق الثاني، وهل تذكر المواصفات جميع المعايير: نوع المرشح، وتركيب الوسط ورقمه الهيدروجيني، والحجم، والجهاز، وسرعة الدوران، ودرجة الحرارة، والمثقلات، وزمن السحب، وقيمة Q، مع مراحل القبول وفق USP <711> / Ph. Eur. 2.9.3؟"}
  applies: "admin_route in ('oral','rectal','vaginal') and 'oral_solution' not in dosage_specifics and not aqueous_solution"
