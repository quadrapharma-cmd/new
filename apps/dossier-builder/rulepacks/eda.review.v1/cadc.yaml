  deficiency: {en: "The applicant should state the source of the dissolution method and all its parameters (filter type, medium composition and pH, volume, apparatus, rpm, temperature, sinkers, sampling time and Q) with the USP <711> acceptance criteria in the specification.", ar: "يجب على مقدم الطلب بيان مصدر طريقة الانحلال وجميع معاييرها (نوع المرشح، وتركيب الوسط ورقمه الهيدروجيني، والحجم، والجهاز، وسرعة الدوران، ودرجة الحرارة، والمثقلات، وزمن السحب، وقيمة Q) مع معايير القبول وفق USP <711> في المواصفات."}
