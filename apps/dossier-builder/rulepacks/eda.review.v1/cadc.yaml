  auto: {kind: text}
  deficiency: {en: "The applicant should include the microbiological quality tests (TAMC, TYMC and specified microorganisms) with the acceptance criteria of Annex IV Table 1 for the route of administration, stating the method, any neutraliser and the pharmacopoeial reference.", ar: "يجب على مقدم الطلب إدراج اختبارات الجودة الميكروبيولوجية (العد الكلي للهوائيات، والعد الكلي للخمائر والفطريات، والكائنات المحددة) بمعايير القبول الواردة في الجدول 1 من الملحق الرابع لطريق الإعطاء، مع بيان الطريقة وأي معادل كيميائي والمرجع الدستوري."}
