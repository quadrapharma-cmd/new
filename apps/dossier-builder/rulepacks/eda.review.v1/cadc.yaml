  deficiency: {en: "The applicant should submit a verification of each compendial procedure (USP <1226> / OMCL) under the actual conditions of use covering specificity and reporting threshold for impurities, and specificity, accuracy, repeatability and three-point linearity for the assay.", ar: "يجب على مقدم الطلب تقديم تحقق من كل طريقة دستورية (USP <1226> / OMCL) في ظروف الاستخدام الفعلية يشمل النوعية وعتبة الإبلاغ للشوائب، والنوعية والصحة والتكرارية والخطية بثلاث نقاط للمقايسة."}
  action: {type: upload, target: "P-10"}
  source: {code: "GL.CADC.002 v02/2024", section: "Annex V §2 (with Annex III §2.3.3)", quote: "The verification process for compendial test procedures is the assessment of whether the procedure can be used for its intended purpose, under the actual conditions"}
