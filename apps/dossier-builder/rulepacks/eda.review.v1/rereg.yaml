  question: {en: "Does 3.2.P.1 describe the dosage form and list all components with their amount per unit (including overages), function and quality reference (compendial monograph or manufacturer's specification), the reconstitution diluent, and the container closure of the product and diluent?", ar: "هل يصف القسم 3.2.P.1 الشكل الصيدلي ويذكر جميع المكونات مع كميتها لكل وحدة (بما في ذلك الزيادات) ووظيفتها ومرجعها النوعي (دراسة دستورية أو مواصفات المصنع)، ومخفف إعادة التكوين، والعبوة والغلق للمنتج والمخفف؟"}
