# Assessor questions extracted from EDA GL.CAPP.039 v1/2025 "Egyptian Guidelines on Quality Module for Human
# Pharmaceuticals for products submitted for Re-registration" (Technical Affairs for Human Pharmaceuticals).
- id: RR-01
  dept: quality
  layer: eda
  ctd: "3.2.S"
  title: {en: "API submission option declared", ar: "بيان خيار تقديم ملف المادة الفعالة"}
  question: {en: "Does the applicant clearly indicate at the beginning of the API section, for each API manufacturer, which option is used (Option 1 API prequalification confirmation, Option 2 CEP, Option 3 APIMF/DMF, Option 4 full details in the dossier)?", ar: "هل يوضح مقدم الطلب في بداية قسم المادة الفعالة، لكل مصنع للمادة الفعالة، الخيار المستخدم (الخيار 1 تأكيد التأهيل المسبق، الخيار 2 شهادة الملاءمة CEP، الخيار 3 الملف الرئيسي APIMF/DMF، الخيار 4 التفاصيل الكاملة في ملف المنتج)؟"}
  applies: "activity == 're_registration'"
  severity: major
  evidence:
    slots: [S-08, S-10]
    keywords: ["Option", "CEP", "APIMF", "DMF", "prequalification"]
    data: []
  auto: {kind: none}
  deficiency: {en: "The applicant should state at the beginning of section 3.2.S, for each API manufacturer, the option by which the API information is submitted (prequalification confirmation, CEP, APIMF/DMF or full details).", ar: "يجب على مقدم الطلب أن يبين في بداية القسم 3.2.S، لكل مصنع للمادة الفعالة، الخيار الذي تُقدم به معلومات المادة الفعالة (تأكيد التأهيل المسبق، أو CEP، أو APIMF/DMF، أو التفاصيل الكاملة)."}
  action: {type: edit_data, target: "composition"}
  source: {code: "GL.CAPP.039 v1/2025", section: "5.1.2, 3.2 Body of Data, Options for S-part submission", quote: "The applicant should clearly indicate at the beginning of the API section how the information on the API for each API manufacturer is being submitted"}
- id: RR-02
  dept: quality
  layer: eda
  ctd: "3.2.S"
  title: {en: "CEP copy, access and commitment", ar: "نسخة CEP وإقرار الإتاحة والتعهد"}
  question: {en: "For the CEP option, is a complete copy of the CEP with its annexes provided, with the declaration of access from the CEP holder to the applicant/FPP manufacturer and a written commitment to inform EDA of changes or withdrawal of the CEP (acknowledging that withdrawal requires full 3.2.S data)?", ar: "في حالة خيار CEP، هل قُدمت نسخة كاملة من شهادة الملاءمة مع ملاحقها، مع إقرار الإتاحة من حامل الشهادة لمقدم الطلب/مصنع المنتج النهائي، وتعهد كتابي بإبلاغ الهيئة بأي تغييرات أو سحب للشهادة (مع الإقرار بأن سحبها يستلزم بيانات 3.2.S كاملة)؟"}
  applies: "activity == 're_registration' and 'CEP' in api_options"
  severity: major
  evidence:
    slots: [S-08]
    keywords: ["CEP", "Certificate of Suitability", "declaration of access", "commitment"]
    data: []
  auto: {kind: text}
  deficiency: {en: "The applicant should provide a complete copy of the CEP including annexes, the duly completed declaration of access, and a written commitment to inform EDA in the event of changes or withdrawal of the CEP.", ar: "يجب على مقدم الطلب تقديم نسخة كاملة من شهادة CEP مع ملاحقها، وإقرار الإتاحة المستوفى، وتعهداً كتابياً بإبلاغ الهيئة في حالة حدوث تغييرات أو سحب الشهادة."}
  action: {type: upload, target: "S-08"}
  source: {code: "GL.CAPP.039 v1/2025", section: "In case of Option 2: Certificate of Suitability (CEP)", quote: "a written commitment should be included that the applicant will inform EDA in the event of changes, or if the CEP is withdrawn"}
- id: RR-03
  dept: quality
  layer: eda
  ctd: "3.2.S.4.1"
  title: {en: "CEP: additional controls and batches", ar: "CEP: الضوابط الإضافية ودفعات التحليل"}
  question: {en: "With a CEP, do the FPP manufacturer's API specifications include all CEP/Ph.Eur. tests plus additional tests not controlled by the CEP (e.g. polymorphs, particle size distribution) with their methods and validation, and are batch analysis results from two batches of at least pilot scale provided?", ar: "مع شهادة CEP، هل تتضمن مواصفات المادة الفعالة لدى مصنع المنتج النهائي جميع اختبارات الشهادة ودستور الأدوية الأوروبي إضافة إلى الاختبارات غير المشمولة بالشهادة (مثل الأشكال البلورية وتوزيع حجم الجسيمات) مع طرقها والتحقق منها، وهل قُدمت نتائج تحليل تشغيلتين على الأقل بحجم تجريبي على الأقل؟"}
  applies: "activity == 're_registration' and 'CEP' in api_options"
  severity: major
  evidence:
    slots: [S-08, S-10]
    keywords: ["polymorph", "particle size", "batch", "specification"]
    data: []
  auto: {kind: text}
  deficiency: {en: "The applicant should provide the FPP manufacturer's API specification including the CEP and Ph.Eur. tests and any additional tests (polymorphs, particle size distribution) with analytical procedures and validation, and batch analyses from two batches of at least pilot scale.", ar: "يجب على مقدم الطلب تقديم مواصفات المادة الفعالة لدى مصنع المنتج النهائي متضمنة اختبارات CEP ودستور الأدوية الأوروبي وأي اختبارات إضافية (الأشكال البلورية وتوزيع حجم الجسيمات) مع الإجراءات التحليلية والتحقق منها، ونتائج تحليل تشغيلتين على الأقل بحجم تجريبي على الأقل."}
  action: {type: upload, target: "S-08"}
  source: {code: "GL.CAPP.039 v1/2025", section: "Option 2 CEP: 3.2.S.4.1 Specification; 3.2.S.4.4 Batch analysis", quote: "any additional tests and acceptance criteria that are not controlled in the CEP and Ph.Eur. monograph, such as polymorphs and/or particle size distribution"}
- id: RR-04
  dept: quality
  layer: eda
  ctd: "3.2.S.2"
  title: {en: "API manufacture described or justified", ar: "وصف تصنيع المادة الفعالة أو تبريره"}
  question: {en: "Does 3.2.S.2 give the name, address and responsibility of each API manufacturer and a brief description of the manufacturing process, process controls, materials, critical steps and intermediates, or a justification where such data are not available (e.g. well-established or old molecule)?", ar: "هل يقدم القسم 3.2.S.2 اسم وعنوان ومسؤولية كل مصنع للمادة الفعالة ووصفاً موجزاً لعملية التصنيع وضوابطها والمواد والخطوات الحرجة والمركبات الوسيطة، أو تبريراً عند عدم توفر هذه البيانات (مثل الجزيئات الراسخة أو القديمة)؟"}
  applies: "activity == 're_registration' and not ('CEP' in api_options)"
  severity: major
  evidence:
    slots: [S-08]
    keywords: ["manufacturing process", "process controls", "critical steps", "intermediate"]
    data: []
  auto: {kind: none}
  deficiency: {en: "The applicant should provide brief information on the API manufacturing process and process controls (3.2.S.2.1 to 3.2.S.2.6) or submit a justification where data are not available for a well-established or old molecule.", ar: "يجب على مقدم الطلب تقديم معلومات موجزة عن عملية تصنيع المادة الفعالة وضوابطها (3.2.S.2.1 إلى 3.2.S.2.6) أو تقديم تبرير عند عدم توفر البيانات لجزيء راسخ أو قديم."}
  action: {type: upload, target: "S-08"}
  source: {code: "GL.CAPP.039 v1/2025", section: "3.2.S.2 Manufacture (3.2.S.2.2)", quote: "Brief Information should be provided to adequately describe the manufacturing process and process controls of the drug substance."}
- id: RR-05
  dept: quality
  layer: eda
  ctd: "3.2.S.4.2"
  title: {en: "API analytical procedures and validation", ar: "الإجراءات التحليلية للمادة الفعالة والتحقق منها"}
  question: {en: "Are the API analytical procedures and their validation with experimental data provided in 3.2.S.4.2/3.2.S.4.3, or, for a pharmacopoeial API, is reference to the monograph made (acceptable), with the specification justified in 3.2.S.4.5?", ar: "هل قُدمت الإجراءات التحليلية للمادة الفعالة والتحقق منها ببيانات تجريبية في القسمين 3.2.S.4.2 و3.2.S.4.3، أو في حالة المادة الفعالة الدستورية تمت الإحالة إلى الدراسة الدستورية (وهو مقبول)، مع تبرير المواصفات في القسم 3.2.S.4.5؟"}
  applies: "activity == 're_registration'"
  severity: major
  evidence:
    slots: [S-09]
    keywords: ["monograph", "validation", "analytical procedure", "specificity"]
    data: []
  auto: {kind: text}
  deficiency: {en: "The applicant should provide the API analytical procedures and validation data, or reference the pharmacopoeial monograph where the API is pharmacopoeial, and justify the API specification.", ar: "يجب على مقدم الطلب تقديم الإجراءات التحليلية للمادة الفعالة وبيانات التحقق منها، أو الإحالة إلى الدراسة الدستورية إذا كانت المادة الفعالة دستورية، وتبرير مواصفات المادة الفعالة."}
  action: {type: upload, target: "S-09"}
  source: {code: "GL.CAPP.039 v1/2025", section: "3.2.S.4.2 Analytical Procedures; 3.2.S.4.3; 3.2.S.4.5", quote: "If API is pharmacopeial, Reference to monograph is acceptable."}
  anchor: {code: "ICH Q2(R2)", section: ""}
- id: RR-06
  dept: quality
  layer: eda
  ctd: "3.2.S.4.4"
  title: {en: "Recent API batch analyses", ar: "تحاليل تشغيلات حديثة للمادة الفعالة"}
  question: {en: "Does 3.2.S.4.4 describe the API batches (batch number, type, manufacturing date and production site) and give the results of recent batch analyses?", ar: "هل يصف القسم 3.2.S.4.4 تشغيلات المادة الفعالة (رقم التشغيلة ونوعها وتاريخ التصنيع وموقع الإنتاج) ويقدم نتائج تحاليل تشغيلات حديثة؟"}
  applies: "activity == 're_registration'"
  severity: major
  evidence:
    slots: [S-10]
    keywords: ["batch", "manufacturing date", "site", "result"]
    data: []
  auto: {kind: text}
  deficiency: {en: "The applicant should provide a description of the API batches (batch number, type, manufacturing date and production site) and the results of recent batch analyses.", ar: "يجب على مقدم الطلب تقديم وصف لتشغيلات المادة الفعالة (رقم التشغيلة ونوعها وتاريخ التصنيع وموقع الإنتاج) ونتائج تحاليل تشغيلات حديثة."}
  action: {type: upload, target: "S-10"}
  source: {code: "GL.CAPP.039 v1/2025", section: "3.2.S.4.4 Batch Analyses", quote: "Description of batches (batch number, type, manufacturing date & production site) and results of recent batch analyses should be provided."}
- id: RR-07
  dept: quality
  layer: eda
  ctd: "3.2.S.7"
  title: {en: "API stability summary, commitment and data", ar: "ملخص ثبات المادة الفعالة والتعهد والبيانات"}
  question: {en: "Does 3.2.S.7 provide the stability summary and conclusions (studies, protocols, storage conditions and retest date), the post-approval protocol and commitment (or a justification for an old molecule) and recent stability data in tabular, graphical or narrative form, unless the CEP specifies an equal or longer retest period under the same or harsher conditions?", ar: "هل يقدم القسم 3.2.S.7 ملخص الثبات والاستنتاجات (الدراسات والبروتوكولات وظروف التخزين وتاريخ إعادة الاختبار)، وبروتوكول وتعهد الثبات بعد الموافقة (أو تبريراً لجزيء قديم)، وبيانات ثبات حديثة بشكل جدولي أو بياني أو سردي، ما لم تحدد شهادة CEP فترة إعادة اختبار مساوية أو أطول في ظروف مماثلة أو أشد؟"}
  applies: "activity == 're_registration'"
  severity: major
  evidence:
    slots: [S-14]
    keywords: ["retest", "re-test", "stability", "storage condition"]
    data: []
  auto: {kind: slot}
  deficiency: {en: "The applicant should provide the API stability summary and conclusions, the post-approval stability protocol and commitment (or justification), and the results of recent stability studies, unless the CEP exception for the retest period and storage conditions applies.", ar: "يجب على مقدم الطلب تقديم ملخص ثبات المادة الفعالة واستنتاجاته، وبروتوكول وتعهد الثبات بعد الموافقة (أو التبرير)، ونتائج دراسات الثبات الحديثة، ما لم ينطبق استثناء شهادة CEP الخاص بفترة إعادة الاختبار وظروف التخزين."}
  action: {type: upload, target: "S-14"}
  source: {code: "GL.CAPP.039 v1/2025", section: "3.2.S.7 Stability (3.2.S.7.1-3.2.S.7.3); Option 2 CEP exception", quote: "Results of the recent stability studies should be presented in an appropriate format such as tabular, graphical, or narrative."}
  anchor: {code: "ICH Q1A", section: ""}
- id: RR-08
