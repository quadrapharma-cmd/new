  question: {en: "For a sterile API, are data on the sterilization process of the API, including validation data, included in the dossier (also when the API is covered by a CEP)?", ar: "بالنسبة للمادة الفعالة المعقمة، هل أُدرجت في الملف بيانات عملية تعقيم المادة الفعالة بما فيها بيانات التحقق من صلاحيتها (حتى عندما تكون المادة مشمولة بشهادة CEP)؟"}
  applies: "activity == 're_registration' and 'sterile' in dosage_specifics"
