  action: {type: upload, target: "S-09"}
  source: {code: "GL.CAPP.039 v1/2025", section: "Option 2 CEP, 3.2.S.7 Stability (sterile APIs); 3.2.S.2.5", quote: "In the case of sterile APIs, data on the sterilization process of the API, including validation data, should be included in the dossier."}
- id: RR-09
  dept: quality
  layer: eda
  ctd: "3.2.P.1"
