  evidence: {slots: [M1-24], keywords: ["responsib", "agreement", "contract"]}
  auto: {kind: text}
  deficiency: {en: "The contract-manufacturing (or storage/testing) agreement should define the responsibilities of each party.", ar: "يجب أن تحدد اتفاقية التصنيع (أو التخزين/الاختبار) لدى الغير مسؤوليات كل طرف."}
  action: {type: upload, target: M1-24}
