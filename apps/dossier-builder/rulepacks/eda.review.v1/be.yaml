# Assessor questions extracted from EDA GL.CAPP.024 v4/2026 "Egyptian Guideline for Conducting Bioequivalence
# Studies for Marketing Authorization of Generic Products" (Evaluation Unit of BA/BE studies).
- id: BE-01
  dept: be
  layer: eda
  ctd: "5.3.1.2"
  title: {en: "Exemption of aqueous solutions justified", ar: "تبرير إعفاء المحاليل المائية"}
  question: {en: "Where exemption from equivalence studies is claimed for an aqueous solution (parenteral, oral, otic/ophthalmic/nasal, topical or nebulizer), has the applicant shown that the product contains the same APIs in the same molar concentration and the same or similar excipients in comparable concentrations as the reference product, with any excipient difference justified for its effect on absorption, disposition or GI transit?", ar: "عند طلب الإعفاء من دراسات التكافؤ لمحلول مائي (حقني أو فموي أو أذني/عيني/أنفي أو موضعي أو للاستنشاق بالرذاذ)، هل أثبت مقدم الطلب أن المستحضر يحتوي على نفس المواد الفعالة بنفس التركيز المولي ونفس السواغات أو سواغات مماثلة بتركيزات مقارنة للمستحضر المرجعي، مع تبرير أي اختلاف في السواغات من حيث تأثيره على الامتصاص أو التوزع أو العبور المعدي المعوي؟"}
  applies: "aqueous_solution"
  severity: critical
  evidence:
    slots: [M5-04, P-01]
    keywords: ["excipient", "same molar", "reference", "exempt", "waiver"]
    data: [composition]
  auto: {kind: none}
  deficiency: {en: "The applicant should demonstrate that the product contains the same APIs in the same molar concentration and the same or similar excipients in comparable concentrations as the reference listed product, and justify that any excipient difference does not affect safety or efficacy.", ar: "يجب على مقدم الطلب إثبات أن المستحضر يحتوي على نفس المواد الفعالة بنفس التركيز المولي ونفس السواغات أو سواغات مماثلة بتركيزات مقارنة للمستحضر المرجعي، وتبرير أن أي اختلاف في السواغات لا يؤثر على السلامة أو الفعالية."}
  action: {type: upload, target: "M5-04"}
  source: {code: "GL.CAPP.024 v4/2026", section: "2.2 Pharmaceutical products exempted from equivalence studies; 3.9; 3.10", quote: "The generic product should contain the same APIs in the same molar concentration"}
- id: BE-02
  dept: be
  layer: eda
  ctd: "5.3.1.2"
  title: {en: "Signed protocol and ethics approval", ar: "البروتوكول الموقع وموافقة لجنة الأخلاقيات"}
  question: {en: "Is the study protocol signed and dated by the investigator and sponsor, approved by an IRB/ethics committee before the study, and submitted together with the study report, with any protocol change signed and included in the final report?", ar: "هل بروتوكول الدراسة موقع ومؤرخ من الباحث والجهة الراعية، ومعتمد من مجلس المراجعة المؤسسي/لجنة الأخلاقيات قبل الدراسة، ومقدم مع تقرير الدراسة، مع توقيع أي تعديل في البروتوكول وإدراجه في التقرير النهائي؟"}
  applies: "true"
  severity: major
  evidence:
    slots: [M5-04]
    keywords: ["protocol", "ethics committee", "IRB", "signed"]
    data: []
  auto: {kind: text}
  deficiency: {en: "The applicant should submit the signed and dated study protocol with the IRB/ethics committee approval together with the study report, including any signed protocol amendments.", ar: "يجب على مقدم الطلب تقديم بروتوكول الدراسة الموقع والمؤرخ مع موافقة مجلس المراجعة المؤسسي/لجنة الأخلاقيات إلى جانب تقرير الدراسة، متضمناً أي تعديلات موقعة على البروتوكول."}
  action: {type: upload, target: "M5-04"}
  source: {code: "GL.CAPP.024 v4/2026", section: "2.5 Study protocol", quote: "A signed and dated study protocol together with the study report should be presented to the authority in order to obtain the marketing authorization"}
- id: BE-03
  dept: be
  layer: eda
  ctd: "5.3.1.2"
  title: {en: "Study design justified", ar: "تبرير تصميم الدراسة"}
  question: {en: "Is the study design justified: a two-formulation, two-period, two-sequence crossover in healthy subjects as default (or the published product-specific guidance), with a replicated design (e.g. four-period TRTR-RTRT using the same lots) where reference-scaling is intended, and a parallel design only where justified?", ar: "هل تصميم الدراسة مبرر: تصميم متقاطع بمستحضرين وفترتين وتسلسلين في متطوعين أصحاء كتصميم افتراضي (أو وفق الإرشادات المنشورة الخاصة بالمنتج)، مع تصميم مكرر (مثل أربع فترات TRTR-RTRT بنفس التشغيلات) عند اعتزام استخدام التوسيع المرجعي، وتصميم متوازٍ فقط عند وجود مبرر؟"}
  applies: "true"
  severity: major
  evidence:
    slots: [M5-04]
    keywords: ["crossover", "cross-over", "two-period", "replicate", "parallel"]
    data: [be]
  auto: {kind: text}
  deficiency: {en: "The applicant should justify the study design against the published guidance; in the absence of product-specific guidance the default is a two-way crossover design, and a replicated crossover design (same lots of test and reference) is needed when reference-scaled bioequivalence is applied.", ar: "يجب على مقدم الطلب تبرير تصميم الدراسة وفق الإرشادات المنشورة؛ وفي غياب إرشادات خاصة بالمنتج يكون التصميم الافتراضي تصميماً متقاطعاً ثنائي الاتجاه، ويلزم تصميم متقاطع مكرر (بنفس تشغيلات المستحضر المختبر والمرجعي) عند تطبيق التكافؤ الحيوي الموسع مرجعياً."}
  action: {type: upload, target: "M5-04"}
  source: {code: "GL.CAPP.024 v4/2026", section: "2.7.1 Types of Experimental Design", quote: "in case of no guidance for API the default design is two -way cross over design"}
- id: BE-04
  dept: be
  layer: eda
  ctd: "5.3.1.2"
  title: {en: "Adequate washout period", ar: "كفاية فترة الغسيل"}
  question: {en: "Is the washout period the same for all subjects, more than five terminal half-lives of the API (extended for active metabolites) and at least seven days, with pre-dose samples in period two assayed and shown to be below 5% of Cmax?", ar: "هل فترة الغسيل واحدة لجميع المتطوعين وتزيد عن خمسة أضعاف نصف العمر النهائي للمادة الفعالة (وتُمدد للمستقلبات الفعالة) ولا تقل عن سبعة أيام، مع تحليل عينات ما قبل الجرعة في الفترة الثانية وإثبات أنها أقل من 5% من Cmax؟"}
  applies: "true"
  severity: major
  evidence:
    slots: [M5-04]
    keywords: ["wash-out", "washout", "half-life", "pre-dose", "predose"]
    data: [be]
  auto: {kind: text}
  deficiency: {en: "The applicant should justify the washout period (more than five terminal half-lives, the same for all subjects and at least seven days) and report the period-two pre-dose concentrations, which should be below 5% of Cmax.", ar: "يجب على مقدم الطلب تبرير فترة الغسيل (أكثر من خمسة أضعاف نصف العمر النهائي، وموحدة لجميع المتطوعين، ولا تقل عن سبعة أيام) وتقديم تركيزات ما قبل الجرعة في الفترة الثانية، والتي يجب أن تكون أقل من 5% من Cmax."}
  action: {type: upload, target: "M5-04"}
  source: {code: "GL.CAPP.024 v4/2026", section: "2.7.2 Single dose studies", quote: "The minimum wash-out period should be at least seven days."}
- id: BE-05
  dept: be
  layer: eda
  ctd: "5.3.1.2"
  title: {en: "Modified release: fasting and fed studies", ar: "الإطلاق المعدل: دراستا الصيام والتغذية"}
  question: {en: "For a modified-release product, were single-dose crossover studies on the highest strength conducted under both fasting and fed conditions with the same design, a pharmaceutically equivalent modified-release reference, and the omission of either study justified; if two separate two-way studies were run, were they submitted as two files with the bioanalytical/in vitro part once?", ar: "بالنسبة لمستحضر الإطلاق المعدل، هل أُجريت دراسات متقاطعة بجرعة وحيدة على أعلى تركيز في حالتي الصيام والتغذية بنفس التصميم، مع مستحضر مرجعي معدل الإطلاق مكافئ صيدلانياً، وتبرير إغفال أي من الدراستين؛ وإذا أُجريت دراستان منفصلتان ثنائيتا الاتجاه، هل قُدمتا كملفين مع جزء التحليل الحيوي/المختبري مرة واحدة؟"}
  applies: "'modified_release' in dosage_specifics"
  severity: critical
  evidence:
    slots: [M5-04]
    keywords: ["fed", "fasting", "high-fat", "high fat", "modified release"]
    data: [be]
  auto: {kind: text}
  deficiency: {en: "The applicant should submit bioequivalence studies for the modified-release product under both fasting and fed conditions (same design, highest strength, pharmaceutically equivalent modified-release reference) or scientifically justify the omission of either study.", ar: "يجب على مقدم الطلب تقديم دراستي تكافؤ حيوي لمستحضر الإطلاق المعدل في حالتي الصيام والتغذية (بنفس التصميم وعلى أعلى تركيز ومع مرجع معدل الإطلاق مكافئ صيدلانياً) أو تبرير إغفال أي منهما تبريراً علمياً."}
  action: {type: upload, target: "M5-04"}
  source: {code: "GL.CAPP.024 v4/2026", section: "2.7.6 Studies involving modified-release products; 3.12; Section 6 First, rule 3", quote: "a pharmacokinetic bioequivalence study under fed conditions is generally required, in addition to the study under fasting state"}
- id: BE-06
  dept: be
  layer: eda
  ctd: "5.3.1.2"
  title: {en: "Subject selection criteria", ar: "معايير اختيار المتطوعين"}
  question: {en: "Does the protocol state clear inclusion/exclusion criteria with healthy subjects aged 18-55 years, weight in the normal range (BMI preferably 18.5-30 kg/m2), preferably non-smokers, screened by laboratory tests, medical history and examination, excluding pregnant or lactating women and subjects with relevant GI, convulsive, depressive or hepatic disorders?", ar: "هل يحدد البروتوكول معايير إدراج واستبعاد واضحة لمتطوعين أصحاء تتراوح أعمارهم بين 18 و55 عاماً، بوزن ضمن المدى الطبيعي (مؤشر كتلة الجسم يفضل بين 18.5 و30 كجم/م2)، ويفضل غير المدخنين، تم فحصهم بالاختبارات المعملية والتاريخ المرضي والفحص السريري، مع استبعاد الحوامل والمرضعات ومن لديهم اضطرابات معدية معوية أو تشنجية أو اكتئابية أو كبدية ذات صلة؟"}
  applies: "true"
  severity: major
  evidence:
    slots: [M5-04]
    keywords: ["inclusion", "exclusion", "BMI", "Body Mass Index", "healthy"]
    data: [be]
  auto: {kind: text}
  deficiency: {en: "The applicant should provide the inclusion and exclusion criteria and demographic data showing healthy subjects aged 18-55 years with weight in the normal range (BMI preferably 18.5-30 kg/m2), screened by laboratory tests, medical history and physical examination.", ar: "يجب على مقدم الطلب تقديم معايير الإدراج والاستبعاد والبيانات الديموغرافية التي تبين متطوعين أصحاء بعمر 18-55 عاماً ووزن ضمن المدى الطبيعي (مؤشر كتلة الجسم يفضل 18.5-30 كجم/م2) تم فحصهم بالاختبارات المعملية والتاريخ المرضي والفحص السريري."}
  action: {type: upload, target: "M5-04"}
  source: {code: "GL.CAPP.024 v4/2026", section: "2.8.1 Selection of subjects", quote: "subjects should be between the ages of 18 and 55 years, and their weight should be within the normal range"}
- id: BE-07
  dept: be
  layer: eda
  ctd: "5.3.1.2"
  title: {en: "Sample size calculation and minimum 24", ar: "حساب حجم العينة والحد الأدنى 24"}
  question: {en: "Is the number of subjects justified by a sample-size calculation in the protocol (error CV from pilot/previous/published data, 5% significance, desired power, expected deviation from the comparator and the 80-125% limits), with a minimum of 24 subjects recruited or a justification otherwise?", ar: "هل عدد المتطوعين مبرر بحساب حجم العينة في البروتوكول (معامل التباين من دراسة تجريبية أو سابقة أو بيانات منشورة، ومستوى معنوية 5%، والقوة الإحصائية المطلوبة، والانحراف المتوقع عن المستحضر المقارن، وحدود 80-125%)، مع تجنيد 24 متطوعاً على الأقل أو تقديم مبرر لخلاف ذلك؟"}
  applies: "true"
  severity: major
  evidence:
    slots: [M5-04]
    keywords: ["sample size", "sample-size", "statistical power", "coefficient of variation"]
    data: [be]
  auto: {kind: text}
  deficiency: {en: "The applicant should provide the sample-size calculation from the protocol and justify the number of subjects; a minimum of 24 subjects is required unless otherwise justified.", ar: "يجب على مقدم الطلب تقديم حساب حجم العينة من البروتوكول وتبرير عدد المتطوعين؛ ويلزم 24 متطوعاً على الأقل ما لم يُقدم مبرر لخلاف ذلك."}
  action: {type: upload, target: "M5-04"}
  source: {code: "GL.CAPP.024 v4/2026", section: "2.8.3 Number of subjects", quote: "A minimum of 24 subjects is required (If otherwise, it should be justified)."}
- id: BE-08
  dept: be
  layer: eda
  ctd: "5.3.1.2"
  title: {en: "Drop-outs, withdrawals and add-on", ar: "المنسحبون والمستبعدون والدراسة الإضافية"}
  question: {en: "Are all drop-outs and withdrawals reported with their reasons, were drop-outs not replaced (unless replacement or an add-on design using not less than half the initial number was pre-specified in the protocol), and were all treated subjects, not only spare subjects, planned for inclusion in the analysis?", ar: "هل أُبلغ عن جميع حالات الانسحاب والاستبعاد مع أسبابها، ولم يُستبدل المنسحبون (ما لم يكن الاستبدال أو تصميم الدراسة الإضافية بما لا يقل عن نصف العدد الأولي محدداً مسبقاً في البروتوكول)، وهل خُطط لإدراج جميع المتطوعين المعالجين في التحليل وليس المتطوعين الاحتياطيين فقط؟"}
  applies: "true"
  severity: major
  evidence:
    slots: [M5-04]
    keywords: ["drop-out", "dropout", "withdraw", "add-on"]
    data: [be]
  auto: {kind: text}
  deficiency: {en: "The applicant should report all drop-outs and withdrawals with reasons (Table 13/14), confirm that drop-outs were not replaced unless pre-specified, and that any add-on study used not less than half the number of subjects of the initial study under the same protocol and batches.", ar: "يجب على مقدم الطلب الإبلاغ عن جميع حالات الانسحاب والاستبعاد مع أسبابها (الجدولان 13 و14)، وتأكيد عدم استبدال المنسحبين ما لم يكن ذلك محدداً مسبقاً، وأن أي دراسة إضافية استخدمت ما لا يقل عن نصف عدد متطوعي الدراسة الأولية بنفس البروتوكول والتشغيلات."}
  action: {type: upload, target: "M5-04"}
  source: {code: "GL.CAPP.024 v4/2026", section: "2.8.4 Drop-outs and withdrawals", quote: "Reasons for withdrawal (e.g. adverse drug reaction or personal reasons) must be reported."}
- id: BE-09
  dept: be
  layer: eda
  ctd: "5.3.1.2"
  title: {en: "Pre-specified exclusion of subject data", ar: "استبعاد بيانات المتطوعين المحدد مسبقاً"}
  question: {en: "Were decisions to exclude a subject made before bioanalysis on pre-defined rules (e.g. vomiting at or before 2 times median Tmax for IR products, pre-dose concentration above 5% of Cmax, reference AUC below 5% of the geometric mean), with excluded samples still assayed and listed and no exclusion for statistical or PK reasons alone?", ar: "هل اتُخذت قرارات استبعاد المتطوعين قبل التحليل الحيوي وفق قواعد محددة مسبقاً (مثل القيء عند أو قبل ضعف وسيط Tmax لمستحضرات الإطلاق الفوري، أو تركيز ما قبل الجرعة أعلى من 5% من Cmax، أو AUC للمرجع أقل من 5% من المتوسط الهندسي)، مع تحليل عينات المستبعدين وإدراجها وعدم الاستبعاد لأسباب إحصائية أو حركية دوائية فقط؟"}
  applies: "true"
  severity: major
  evidence:
    slots: [M5-04]
    keywords: ["vomit", "emesis", "exclu", "pre-dose", "outlier"]
    data: [be]
  auto: {kind: none}
  deficiency: {en: "The applicant should document that every exclusion of a subject was decided before bioanalysis according to protocol rules, list the assayed results of excluded subjects, and remove any exclusion based solely on statistical or pharmacokinetic grounds.", ar: "يجب على مقدم الطلب توثيق أن كل استبعاد لمتطوع تقرر قبل التحليل الحيوي وفق قواعد البروتوكول، وإدراج نتائج تحليل عينات المستبعدين، وإلغاء أي استبعاد قائم على أسس إحصائية أو حركية دوائية فقط."}
  action: {type: upload, target: "M5-04"}
  source: {code: "GL.CAPP.024 v4/2026", section: "2.8.5 Reasons for exclusion", quote: "the decision to exclude a subject from the statistical analysis must be made before bioanalysis."}
- id: BE-10
  dept: be
  layer: eda
  ctd: "5.3.1.2"
  title: {en: "Two-stage sequential design conditions", ar: "شروط التصميم التتابعي ذي المرحلتين"}
  question: {en: "Where a two-stage design was used, was it pre-specified in the protocol with the adjusted significance levels for the interim and final analyses (overall type I error kept at 5%), a stage term in the ANOVA, no more than two stages, a washout between stages not exceeding two weeks, and no use with replicate or multi-arm designs?", ar: "عند استخدام تصميم ذي مرحلتين، هل حُدد مسبقاً في البروتوكول مع مستويات المعنوية المعدلة للتحليل المرحلي والنهائي (مع الحفاظ على خطأ النوع الأول الكلي عند 5%)، وإدراج حد المرحلة في نموذج ANOVA، وعدم تجاوز مرحلتين، وفترة غسيل بين المرحلتين لا تتجاوز أسبوعين، وعدم استخدامه مع التصاميم المكررة أو متعددة الأذرع؟"}
  applies: "true"
