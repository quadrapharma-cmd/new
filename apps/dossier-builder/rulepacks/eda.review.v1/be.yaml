  source: {code: "GL.CAPP.024 v4/2026", section: "2.9 Two-stage sequential design; Section 6 First, rule (6)", quote: "The plan to use a two -stage sequential approach must be pre -specified in the protocol along with the adjusted significance levels"}
- id: BE-11
  dept: be
  layer: eda
  ctd: "5.3.1.2"
  title: {en: "Fasting or fed condition and meal", ar: "حالة الصيام أو التغذية ووجبة الدراسة"}
  question: {en: "Is the choice of fasting and/or fed study justified from the comparator labelling and product risk (both for high-risk products), and for a fed study is the meal composition and caloric breakdown reported (high-fat about 50% of calories and 900-1000 kcal where required) with dosing 30 minutes after the start of the meal unless the SmPC states otherwise?", ar: "هل اختيار دراسة الصيام و/أو التغذية مبرر وفق نشرة المستحضر المقارن ومخاطر المنتج (كلتاهما للمنتجات عالية الخطورة)، وفي دراسة التغذية هل أُبلغ عن تركيب الوجبة وتوزيعها الحراري (عالية الدهون نحو 50% من السعرات و900-1000 سعر حراري عند الاقتضاء) مع إعطاء الجرعة بعد 30 دقيقة من بدء الوجبة ما لم ينص ملخص خصائص المنتج على خلاف ذلك؟"}
  applies: "true"
  severity: major
  evidence:
    slots: [M5-04]
    keywords: ["fasting", "fed", "kcal", "meal", "high-fat"]
    data: [be]
  auto: {kind: text}
  deficiency: {en: "The applicant should provide the rationale for the fasting/fed condition(s) and, for a fed study, the composition and caloric breakdown of the meal (Table 17), which for high-risk products should be a high-fat (about 50% of calories), high-calorie (about 900-1000 kcal) meal.", ar: "يجب على مقدم الطلب تقديم مبررات اختيار حالة الصيام/التغذية، وفي دراسة التغذية تركيب الوجبة وتوزيعها الحراري (الجدول 17)، والتي يجب أن تكون للمنتجات عالية الخطورة وجبة عالية الدهون (نحو 50% من السعرات) وعالية السعرات (نحو 900-1000 سعر حراري)."}
  action: {type: upload, target: "M5-04"}
  source: {code: "GL.CAPP.024 v4/2026", section: "2.10 Fasting or/and fed conditions; Table 17", quote: "The meal should be a high-fat (approximately 50% of total caloric content of the meal) and high-calorie (approximately 900 to 1000 kcal) meal"}
- id: BE-12
  dept: be
  layer: eda
