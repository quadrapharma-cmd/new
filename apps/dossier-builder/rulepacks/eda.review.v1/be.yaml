  title: {en: "Fixed-dose combination: all actives", ar: "التوليفة ثابتة الجرعة: جميع المواد الفعالة"}
  question: {en: "For a fixed-dose combination, was the generic compared with the pharmaceutically equivalent reference FDC (or justified free combination), the bioanalytical method validated for all compounds, sampling adequate for all APIs, and the 90% confidence intervals of all active ingredients within the acceptance limits?", ar: "بالنسبة للتوليفة ثابتة الجرعة، هل قورن المستحضر الجنيس بالتوليفة المرجعية المكافئة صيدلانياً (أو بتوليفة حرة مبررة)، وتم التحقق من الطريقة التحليلية الحيوية لجميع المركبات، وكان السحب كافياً لجميع المواد الفعالة، ووقعت فترات الثقة 90% لجميع المواد الفعالة ضمن حدود القبول؟"}
  applies: "true"
  severity: critical
  evidence:
    slots: [M5-04]
    keywords: ["fixed-dose", "fixed dose", "combination", "all active"]
    data: [be]
  auto: {kind: none}
  deficiency: {en: "The applicant should present the statistical analysis for every active ingredient of the fixed-dose combination with the 90% confidence intervals within the acceptance limits, and validation of the bioanalytical method for all measured compounds.", ar: "يجب على مقدم الطلب عرض التحليل الإحصائي لكل مادة فعالة في التوليفة ثابتة الجرعة مع فترات ثقة 90% ضمن حدود القبول، والتحقق من الطريقة التحليلية الحيوية لجميع المركبات المقاسة."}
  action: {type: upload, target: "M5-04"}
  source: {code: "GL.CAPP.024 v4/2026", section: "3.1 Fixed-dose combination products", quote: "the 90% confidence intervals of test / reference ratio of all active ingredients should be within acceptance limits"}
- id: BE-35
  dept: be
  layer: eda
  ctd: "5.3.1.2"
  title: {en: "Highly variable drug: reference scaling", ar: "الدواء عالي التباين: التوسيع المرجعي"}
  question: {en: "Where widened Cmax limits are claimed for a highly variable drug, was a three-way partial or four-way full replicate design used with the approach pre-defined in the protocol, the reference intra-subject CV for Cmax shown to exceed 30% (sWR at or above 0.294) and not due to outliers, the limits widened at most to 69.84-143.19%, the Cmax GMR within 80.00-125.00%, and AUC assessed unscaled?", ar: "عند طلب توسيع حدود Cmax لدواء عالي التباين، هل استُخدم تصميم مكرر جزئي ثلاثي الاتجاه أو كامل رباعي الاتجاه مع تحديد النهج مسبقاً في البروتوكول، وأُثبت أن معامل التباين داخل الفرد للمرجع لـ Cmax يتجاوز 30% (sWR عند 0.294 أو أعلى) وليس ناتجاً عن قيم شاذة، ووُسعت الحدود بحد أقصى 69.84-143.19%، ووقعت نسبة المتوسط الهندسي لـ Cmax ضمن 80.00-125.00%، وقُيمت AUC دون توسيع؟"}
  applies: "true"
  severity: critical
  evidence:
    slots: [M5-04]
    keywords: ["highly variable", "reference-scaled", "reference scaled", "sWR", "replicate"]
    data: [be]
  auto: {kind: none}
  deficiency: {en: "The applicant should demonstrate from a replicate design that the reference intra-subject variability for Cmax exceeds 30%, apply the pre-specified scaled limits not wider than 69.84-143.19% with the Cmax GMR within 80.00-125.00%, and keep the standard 80-125% criterion for AUC.", ar: "يجب على مقدم الطلب الإثبات من تصميم مكرر أن التباين داخل الفرد للمرجع لـ Cmax يتجاوز 30%، وتطبيق الحدود الموسعة المحددة مسبقاً بما لا يتجاوز 69.84-143.19% مع نسبة متوسط هندسي لـ Cmax ضمن 80.00-125.00%، والإبقاء على المعيار القياسي 80-125% لـ AUC."}
  action: {type: upload, target: "M5-04"}
  source: {code: "GL.CAPP.024 v4/2026", section: "3.2 Highly variable drugs", quote: "the acceptance criteria for C max can be widened to a maximum of 69.84 –143.19%"}
- id: BE-36
  dept: be
  layer: eda
  ctd: "5.3.1.2"
  title: {en: "Narrow therapeutic index limits", ar: "حدود الأدوية ذات المؤشر العلاجي الضيق"}
  question: {en: "For a narrow therapeutic index drug, was the AUC acceptance interval tightened to 90.00-111.11% (also for Cmax where it matters for safety, efficacy or drug monitoring), or a four-way fully replicated design used with reference-scaled limits capped at 80-125%, the unscaled 80-125% also passed and the test/reference within-subject SD ratio upper 90% CI at or below 2.5, with potency specifications of 95.0-105.0%?", ar: "بالنسبة لدواء ذي مؤشر علاجي ضيق، هل ضُيقت فترة القبول لـ AUC إلى 90.00-111.11% (ولـ Cmax أيضاً عند أهميتها للسلامة أو الفعالية أو مراقبة مستوى الدواء)، أو استُخدم تصميم مكرر كامل رباعي الاتجاه بحدود موسعة مرجعياً لا تتجاوز 80-125% مع اجتياز حدود 80-125% غير الموسعة وكون الحد الأعلى لفترة الثقة 90% لنسبة الانحراف المعياري داخل الفرد بين المختبر والمرجع 2.5 أو أقل، مع مواصفات فاعلية 95.0-105.0%؟"}
  applies: "true"
  severity: critical
  evidence:
    slots: [M5-04, P-09]
    keywords: ["narrow therapeutic", "NTI", "90.00", "111.11", "95.0"]
    data: [be, specs.product]
  auto: {kind: none}
  deficiency: {en: "The applicant should apply the NTI acceptance interval of 90.00-111.11% for AUC (and Cmax where relevant) or the four-way replicate reference-scaled approach with the variability comparison (upper 90% CI of the SD ratio at or below 2.5), and set assayed potency specifications of 95.0-105.0%.", ar: "يجب على مقدم الطلب تطبيق فترة القبول للأدوية ذات المؤشر العلاجي الضيق 90.00-111.11% لـ AUC (ولـ Cmax عند الاقتضاء) أو نهج التصميم المكرر رباعي الاتجاه الموسع مرجعياً مع مقارنة التباين (الحد الأعلى لفترة الثقة 90% لنسبة الانحراف المعياري 2.5 أو أقل)، ووضع مواصفات فاعلية معايرة 95.0-105.0%."}
  action: {type: upload, target: "M5-04"}
  source: {code: "GL.CAPP.024 v4/2026", section: "3.3 Narrow therapeutic index drugs", quote: "The acceptance interval for AUC of NTI drugs should be tightened to 90.00 –111.11 %."}
- id: BE-37
  dept: be
  layer: eda
  ctd: "5.3.1.2"
  title: {en: "Locally acting products: systemic exposure", ar: "المستحضرات موضعية التأثير: التعرض الجهازي"}
  question: {en: "For a locally applied, locally acting product, is equivalence addressed per the applicable guidance (solution waiver only with the same type of solution and concentration and justified excipients), and where systemic exposure carries a risk of systemic adverse reactions, is it measured and shown not higher than the reference (upper 90% CI not exceeding 125.00)?", ar: "بالنسبة لمستحضر موضعي التطبيق والتأثير، هل عولج التكافؤ وفق الإرشادات المنطبقة (الإعفاء للمحاليل فقط بنفس نوع المحلول والتركيز مع تبرير السواغات)، وعندما يحمل التعرض الجهازي خطر تفاعلات ضارة جهازية، هل قيس وأُثبت أنه ليس أعلى من المرجع (الحد الأعلى لفترة الثقة 90% لا يتجاوز 125.00)؟"}
  applies: "local_action"
  severity: major
  evidence:
    slots: [M5-04]
    keywords: ["systemic exposure", "locally acting", "local action", "125.00"]
    data: [be]
  auto: {kind: none}
  deficiency: {en: "The applicant should justify the equivalence approach for the locally acting product and, where systemic exposure entails a risk of systemic adverse reactions, measure it and show that the upper limit of the 90% confidence interval does not exceed 125.00.", ar: "يجب على مقدم الطلب تبرير نهج التكافؤ للمستحضر موضعي التأثير، وعندما ينطوي التعرض الجهازي على خطر تفاعلات ضارة جهازية، قياسه وإثبات أن الحد الأعلى لفترة الثقة 90% لا يتجاوز 125.00."}
  action: {type: upload, target: "M5-04"}
  source: {code: "GL.CAPP.024 v4/2026", section: "3.13 Locally acting locally applied products", quote: "the upper limit of the 90% confidence interval should not exceed the upper bioequivalence acceptance limit 125.00"}
- id: BE-38
  dept: be
  layer: eda
  ctd: "5.3.1.3"
  title: {en: "Comparative dissolution test conditions", ar: "ظروف اختبار الانحلال المقارن"}
  question: {en: "Were comparative dissolution profiles generated with USP apparatus I or II (basket usually 100 rpm, paddle 50-75 rpm), 900 ml or less at 37 plus or minus 1 degrees C, in pH 1.2, 4.5 and 6.8 plus the most suitable FDA/pharmacopoeial medium (two stages only for delayed-release), no surfactant, 12 units of each product, sampling at least every 15 minutes including 15 minutes, and a validated method?", ar: "هل أُنشئت منحنيات الانحلال المقارن بجهاز USP الأول أو الثاني (السلة عادة 100 دورة/دقيقة والمجداف 50-75 دورة/دقيقة)، في 900 مل أو أقل عند 37 ± 1 درجة مئوية، في أوساط pH 1.2 و4.5 و6.8 إضافة إلى الوسط الأنسب وفق FDA أو دساتير الأدوية (مرحلتان فقط للإطلاق المتأخر)، دون مادة خافضة للتوتر السطحي، على 12 وحدة من كل مستحضر، بسحب كل 15 دقيقة على الأقل بما فيها نقطة 15 دقيقة، وبطريقة تحليل متحقق من صلاحيتها؟"}
  applies: "true"
  severity: major
  evidence:
    slots: [M5-05]
    keywords: ["pH 1.2", "pH 4.5", "pH 6.8", "paddle", "basket"]
    data: [results]
  auto: {kind: text}
  deficiency: {en: "The applicant should provide comparative dissolution profiles under the usual conditions (apparatus I or II, 900 ml or less, 37 plus or minus 1 degrees C, pH 1.2, 4.5 and 6.8 plus the most suitable medium, no surfactant, 12 units of each product, sampling at least every 15 minutes) with a validated analytical method (Table 6).", ar: "يجب على مقدم الطلب تقديم منحنيات انحلال مقارن بالظروف المعتادة (الجهاز الأول أو الثاني، 900 مل أو أقل، 37 ± 1 درجة مئوية، أوساط pH 1.2 و4.5 و6.8 إضافة إلى الوسط الأنسب، دون مادة خافضة للتوتر السطحي، 12 وحدة من كل مستحضر، وسحب كل 15 دقيقة على الأقل) بطريقة تحليل متحقق من صلاحيتها (الجدول 6)."}
  action: {type: upload, target: "M5-05"}
  source: {code: "GL.CAPP.024 v4/2026", section: "4.2 The usual experimental conditions for in vitro dissolution testing; Section 6 First, rule 4", quote: "Number of dosage units: A minimum of 12 dosage units of each product should be evaluated."}
- id: BE-39
  dept: be
  layer: eda
  ctd: "5.3.1.3"
  title: {en: "Dissolution similarity f2 and f1", ar: "تشابه الانحلال f2 وf1"}
  question: {en: "Is similarity shown with f2 of 50 or more (and f1 reported) using at least three identical time points, 12 individual values per point, not more than one mean above 85%, CV below 20% at the first point and below 10% thereafter, without omitting early points, or justified as very rapidly dissolving (more than 85% in 15 minutes in all media for both products)?", ar: "هل أُثبت التشابه بقيمة f2 تساوي 50 أو أكثر (مع بيان f1) باستخدام ثلاث نقاط زمنية متطابقة على الأقل، و12 قيمة فردية لكل نقطة، وبما لا يزيد عن متوسط واحد أعلى من 85%، ومعامل تباين أقل من 20% عند النقطة الأولى وأقل من 10% بعدها، دون إغفال النقاط المبكرة، أو بُرر كمنتج سريع الانحلال جداً (أكثر من 85% خلال 15 دقيقة في جميع الأوساط لكلا المستحضرين)؟"}
  applies: "true"
  severity: major
  evidence:
    slots: [M5-05]
    keywords: ["f2", "similarity factor", "f1", "difference factor"]
    data: [results]
  auto: {kind: text}
  deficiency: {en: "The applicant should report f2 (and f1) for each medium meeting the conditions of section 4.4 (at least three identical time points, 12 units, not more than one mean above 85%, CV limits of 20% and 10%), with f2 of 50 or more, or demonstrate that more than 85% dissolves within 15 minutes for both products in all media.", ar: "يجب على مقدم الطلب الإبلاغ عن f2 (وf1) لكل وسط مع استيفاء شروط القسم 4.4 (ثلاث نقاط زمنية متطابقة على الأقل، و12 وحدة، وبما لا يزيد عن متوسط واحد أعلى من 85%، وحدود معامل التباين 20% و10%)، بقيمة f2 تساوي 50 أو أكثر، أو إثبات انحلال أكثر من 85% خلال 15 دقيقة لكلا المستحضرين في جميع الأوساط."}
  action: {type: edit_data, target: "results"}
  source: {code: "GL.CAPP.024 v4/2026", section: "4.4 Similarity of dissolution profiles", quote: "An f2 value of 50 or greater (50 –100) reflects sameness or equivalence of the two curves (less than 10% difference)"}
- id: BE-40
  dept: be
  layer: eda
  ctd: "5.3.1.3"
  title: {en: "BCS class I/III biowaiver criteria", ar: "معايير الإعفاء الحيوي لفئتي BCS الأولى والثالثة"}
  question: {en: "For a BCS-based biowaiver, is high solubility shown (highest single dose dissolved in 250 ml at pH 1-6.8 and 37 plus or minus 1 degrees C in at least three buffers and at the pKa), absorption documented (85% or more for class I, below 85% for class III), dissolution very rapid (more than 85% in 15 minutes) or similarly rapid (85% in 30 minutes, class I only), excipients not affecting bioavailability (qualitatively the same and quantitatively very similar for class III), and the drug not NTI, not non-linear, not modified release and not absorbed in the oral cavity?", ar: "بالنسبة للإعفاء الحيوي القائم على BCS، هل أُثبتت الذوبانية العالية (أعلى جرعة وحيدة تذوب في 250 مل عند pH 1-6.8 و37 ± 1 درجة مئوية في ثلاثة محاليل منظمة على الأقل وعند pKa)، ووُثق الامتصاص (85% أو أكثر للفئة الأولى، وأقل من 85% للفئة الثالثة)، وكان الانحلال سريعاً جداً (أكثر من 85% خلال 15 دقيقة) أو سريعاً بالمثل (85% خلال 30 دقيقة للفئة الأولى فقط)، ولم تؤثر السواغات على التوافر الحيوي (متطابقة نوعياً ومتشابهة جداً كمياً للفئة الثالثة)، والدواء ليس ذا مؤشر علاجي ضيق ولا حركية لا خطية ولا إطلاق معدل ولا يُمتص في تجويف الفم؟"}
  applies: "bcs_waiver"
  severity: critical
  evidence:
    slots: [M5-05]
    keywords: ["BCS", "solubility", "permeability", "85%", "15 minutes"]
    data: [results, composition]
  auto: {kind: text}
  deficiency: {en: "The applicant should document the BCS biowaiver conditions: pH-solubility profile in at least three buffers (pH 1.2, 4.5, 6.8 and the pKa) at 37 plus or minus 1 degrees C for the highest single dose in 250 ml, human absorption data, very rapid or similarly rapid comparative dissolution, and an excipient comparison, and confirm that none of the exclusions (NTI, non-linear PK, modified release, oral-cavity absorption, different ester/ether/isomer) applies.", ar: "يجب على مقدم الطلب توثيق شروط الإعفاء الحيوي القائم على BCS: منحنى الذوبانية مع pH في ثلاثة محاليل منظمة على الأقل (pH 1.2 و4.5 و6.8 وعند pKa) عند 37 ± 1 درجة مئوية لأعلى جرعة وحيدة في 250 مل، وبيانات الامتصاص في الإنسان، وانحلالاً مقارناً سريعاً جداً أو سريعاً بالمثل، ومقارنة السواغات، وتأكيد عدم انطباق أي من الاستثناءات (المؤشر العلاجي الضيق، الحركية اللاخطية، الإطلاق المعدل، الامتصاص في تجويف الفم، اختلاف الإستر أو الإيثر أو الأيزومر)."}
  action: {type: upload, target: "M5-05"}
  source: {code: "GL.CAPP.024 v4/2026", section: "4.5.1 Biowaivers based on the BCS (4.5.1.1-4.5.1.3 and exclusions)", quote: "Either very rapid (> 85 % within 15 minutes) or similarly rapid (85 % within 30 minutes) in vitro dissolution characteristics"}
  anchor: {code: "ICH M9", section: ""}
- id: BE-41
  dept: be
  layer: eda
  ctd: "5.3.1.3"
  title: {en: "BCS class II weak acid biowaiver", ar: "الإعفاء الحيوي للأحماض الضعيفة من فئة BCS الثانية"}
  question: {en: "For a BCS class II weak acid biowaiver, does the API have a dose:solubility ratio of 250 ml or less at pH 6.8, is the generic rapidly dissolving (not less than 85% at pH 6.8 in 30 minutes) with profiles similar to the reference at pH 1.2, 4.5 and 6.8, are the excipients (e.g. surfactants) critically evaluated, and is Cmax not critical to the therapeutic effect?", ar: "بالنسبة للإعفاء الحيوي لحمض ضعيف من فئة BCS الثانية، هل نسبة الجرعة إلى الذوبانية للمادة الفعالة 250 مل أو أقل عند pH 6.8، وهل المستحضر الجنيس سريع الانحلال (لا يقل عن 85% عند pH 6.8 خلال 30 دقيقة) بمنحنيات مشابهة للمرجع عند pH 1.2 و4.5 و6.8، وهل قُيمت السواغات (مثل خافضات التوتر السطحي) تقييماً نقدياً، وهل Cmax غير حرجة للتأثير العلاجي؟"}
  applies: "bcs_waiver"
  severity: critical
  evidence:
    slots: [M5-05]
    keywords: ["weak acid", "pH 6.8", "dose", "solubility", "surfactant"]
    data: [results, composition]
  auto: {kind: none}
  deficiency: {en: "The applicant should demonstrate for the weak acid API a dose:solubility ratio of 250 ml or less at pH 6.8, rapid dissolution of not less than 85% at pH 6.8 in 30 minutes, similar profiles to the reference at pH 1.2, 4.5 and 6.8, and a critical evaluation of the type and amount of excipients such as surfactants.", ar: "يجب على مقدم الطلب إثبات أن نسبة الجرعة إلى الذوبانية للمادة الفعالة الحمضية الضعيفة 250 مل أو أقل عند pH 6.8، وانحلالاً سريعاً لا يقل عن 85% عند pH 6.8 خلال 30 دقيقة، ومنحنيات مشابهة للمرجع عند pH 1.2 و4.5 و6.8، وتقييماً نقدياً لنوع وكميات السواغات مثل خافضات التوتر السطحي."}
  action: {type: upload, target: "M5-05"}
  source: {code: "GL.CAPP.024 v4/2026", section: "4.5.1.4 BCS-Class II Weak Acids biowaivers", quote: "The generic product is rapidly dissolving (no less than 85% in pH 6.8 in 30minutes)"}
- id: BE-42
  dept: be
  layer: eda
  ctd: "5.3.1.3"
  title: {en: "Additional strengths: dose-proportionality waiver", ar: "التركيزات الإضافية: إعفاء التناسب في الجرعة"}
  question: {en: "Where additional strengths are waived, has one strength been shown bioequivalent in vivo, are all strengths made by the same process with the same qualitative and quantitatively proportional composition (or the permitted deviations: API below 5% of core weight with filler-only change, or high-potency API up to 10 mg with total weight within 10%), and is comparative dissolution on 12 units of every test strength versus the respective reference strength submitted?", ar: "عند طلب إعفاء التركيزات الإضافية، هل أُثبت التكافؤ الحيوي في الجسم الحي لتركيز واحد، وهل جميع التركيزات مصنعة بنفس العملية وبنفس التركيبة النوعية والمتناسبة كمياً (أو ضمن الانحرافات المسموح بها: مادة فعالة أقل من 5% من وزن القلب مع تغيير المادة المالئة فقط، أو مادة فعالة عالية الفاعلية حتى 10 مجم مع وزن كلي ضمن 10%)، وهل قُدم انحلال مقارن على 12 وحدة لكل تركيز مختبر مقابل التركيز المرجعي المقابل؟"}
  applies: "dossier_kind == 'generic'"
  severity: major
  evidence:
    slots: [M5-05, P-01]
    keywords: ["proportional", "additional strength", "waiver", "12 dosage units"]
    data: [composition, results]
  auto: {kind: none}
  deficiency: {en: "The applicant should justify the waiver for the additional strength(s) by showing the same manufacturing process, qualitatively identical and quantitatively proportional composition (or a permitted deviation per section 4.5.2), and comparative dissolution on 12 dosage units of each test strength against the respective reference strength.", ar: "يجب على مقدم الطلب تبرير إعفاء التركيز/التركيزات الإضافية بإثبات نفس عملية التصنيع وتركيبة متطابقة نوعياً ومتناسبة كمياً (أو انحراف مسموح به وفق القسم 4.5.2)، وانحلال مقارن على 12 وحدة جرعية لكل تركيز مختبر مقابل التركيز المرجعي المقابل."}
  action: {type: upload, target: "M5-05"}
  source: {code: "GL.CAPP.024 v4/2026", section: "4.5.2 Biowaivers based on dose-proportionality of formulations", quote: "Comparative dissolution testing should be conducted on 12 dosage units each of all strengths of the test"}
