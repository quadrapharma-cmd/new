  auto: {kind: none}
  deficiency: {en: "The applicant should show that the two-stage approach and its adjusted significance levels were pre-specified in the protocol, that a stage factor was included in the final ANOVA, and that the center rules (maximum two stages, washout between stages not exceeding two weeks) were met.", ar: "يجب على مقدم الطلب إثبات أن نهج المرحلتين ومستويات المعنوية المعدلة كانت محددة مسبقاً في البروتوكول، وأن عامل المرحلة أُدرج في نموذج ANOVA النهائي، وأن قواعد المراكز (مرحلتان كحد أقصى وفترة غسيل بينهما لا تتجاوز أسبوعين) قد استُوفيت."}
