- id: GCC-1.7.2
  module: 1
  group: MODULE 1 — Regional administrative information (GCC)
  ctd:
    number: 1.7.2
  ectd:
    nodes:
    - 1.7.2
    source: GCC Module 1 Specifications v1.5 (2015-11) Appendix 2
    provenance: GCC-IN-FORCE
  title:
    en: CPP or free-sales certificate
    ar: شهادة المستحضر الصيدلي (CPP) أو البيع الحر
  applies: 'true'
  required:
    I:
      cases:
      - &id002
        when: gcc_agency == 'SA'
        level: O
        reason:
          en: 'SFDA: the CPP / free-sales certificate is optional and no longer required for new marketing authorization applications in any pathway; SFDA
            may still ask for it at any time.'
          ar: 'السعودية: شهادة الـ CPP / البيع الحر اختيارية ومش مطلوبة لطلبات التسجيل الجديدة في أي مسار؛ والهيئة ممكن تطلبها في أي وقت.'
        provenance: SFDA Data Requirements for Human Drugs Submission v4.0 (2025-08-03) §1.7.2
      - &id003
        level: R
        note:
          en: 'Outside Saudi Arabia the certificate is taken as required for an imported product: the other GCC authorities'' own texts were not read for
            this pack — confirm with the authority.'
          ar: 'برّه السعودية الشهادة محسوبة مطلوبة للمستحضر المستورد: نصوص باقي هيئات الخليج ما اتقرتش للملف ده — راجع مع الهيئة.'
    G_IMP:
      cases:
      - *id002
      - *id003
    G_LOC: NR
  doc_class: third_party_certificate
  produced_by: Third party
  acceptance_text: 'CPP per the WHO format. If there is none: a marketing authorization or free-sales certificate from the country of origin giving the
    trade name there, the number and date of the authorization, the active and inactive substances with their concentrations, a statement that the product
    is marketed there (or the reason it is not, with an authorization from a reference country), proof of at least one year of registration there, the SPC
    and the leaflet.'
  sources:
  - SFDA Data Requirements for Human Drugs Submission v4.0 (2025-08-03) §1.7.2
  provenance: GCC-IN-FORCE
  kinds:
  - cpp
