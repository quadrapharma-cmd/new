- id: gcc_agency
  title:
    en: The authority that receives the dossier
    ar: الهيئة اللي هتستلم الملف
  options:
  - id: SA
    en: Saudi Arabia — SFDA
    ar: السعودية — الهيئة العامة للغذاء والدواء
  - id: AE
    en: United Arab Emirates
    ar: الإمارات العربية المتحدة
  - id: KW
    en: Kuwait
    ar: الكويت
  - id: BH
    en: Bahrain
    ar: البحرين
  - id: OM
    en: Oman
    ar: عُمان
  - id: QA
    en: Qatar
    ar: قطر
  - id: YE
    en: Yemen
    ar: اليمن
  - id: GCC
    en: GCC centralised procedure (Gulf Health Council)
    ar: التسجيل المركزي الخليجي (مجلس الصحة لدول مجلس التعاون)
  default: SA
  from_country: true
module1_note:
  when: gcc_agency != 'SA'
  en: What this section must hold is written from the Saudi (SFDA) text; the structure is common to the Gulf. For this authority check its own guidance
    — its forms, the certificates it asks for and their legalisation, its pricing documents.
  ar: محتوى البند مكتوب من نص SFDA السعودي؛ والهيكل مشترك في الخليج. للهيئة دي راجع دليلها — نماذجها، الشهادات اللي بتطلبها وتوثيقها، مستندات التسعير.
