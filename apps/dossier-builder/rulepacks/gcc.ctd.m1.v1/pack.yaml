  ar: متطلبات SFDA الإصدار 4.0 / موديول ١ الخليجي
columns:
  I:
    en: New chemical entity / biological
    ar: مادة جديدة / بيولوجي
  G_IMP:
    en: Generic — imported
    ar: مثيل — مستورد
  G_LOC:
    en: Generic — made in the country
    ar: مثيل — مصنّع في الدولة
