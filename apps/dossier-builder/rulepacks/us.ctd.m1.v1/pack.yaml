- id: us_application
  title:
    en: Type of application
    ar: نوع الطلب
  options:
  - id: anda
    en: ANDA — generic, 505(j)
    ar: ANDA — مثيل، 505(j)
  - id: nda
    en: NDA — 505(b)(1)
    ar: NDA — 505(b)(1)
  - id: nda_b2
    en: NDA — 505(b)(2)
    ar: NDA — 505(b)(2)
  - id: bla
    en: BLA — biological
    ar: BLA — بيولوجي
  - id: ind
    en: IND — investigational new drug
    ar: IND — مستحضر تحت البحث
  default: anda
overrides:
  M2-NCO:
    required:
      I: R
      G_IMP: NR
      G_LOC: NR
    level_note: &id001
      en: 'Which headings an application needs is set by FDA''s own forms and filing checklists, not by the table of headings: the level here marks the
        usual case — confirm it.'
      ar: 'العناوين المطلوبة لكل طلب بتحددها نماذج FDA وقوائم الفحص بتاعتها مش جدول العناوين: المستوى هنا للحالة المعتادة — راجعه.'
  M2-CO:
    required:
      I: R
      G_IMP: NR
      G_LOC: NR
    level_note: *id001
  M2-NCS:
    level_note: *id001
  M2-CS:
    required:
      I: R
      G_IMP: R
      G_LOC: R
    level_note: *id001
  M4-TOC:
    level_note: *id001
sources:
- code: FDA — The Comprehensive Table of Contents Headings and Hierarchy
  version: 2.3.3
