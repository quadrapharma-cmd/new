id: us.ctd.m1.v1
extends: ich.ctd.m4.v1
order: 40
authority:
  id: US-FDA
  countries:
  - US
  name:
    en: United States — Food and Drug Administration (FDA)
    ar: الولايات المتحدة — إدارة الغذاء والدواء (FDA)
title:
  en: US CTD dossier — FDA Module 1 (table of contents headings v2.3.3)
  ar: ملف CTD للولايات المتحدة — موديول ١ لـ FDA (جدول العناوين 2.3.3)
status: in-force
valid_from: '2020-11-09'
valid_to: null
