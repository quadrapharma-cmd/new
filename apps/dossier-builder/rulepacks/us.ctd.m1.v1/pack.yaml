note:
  en: 'The headings and numbers are the FDA document''s own (the detailed sub-headings of 1.15 and 1.16.2 are kept under their parent; 1.9.5, no longer
    applicable, is left out). Which headings a given application needs is set by FDA forms and filing checklists: the levels here mark the usual ones and
    say so on each item — confirm them.'
  ar: 'العناوين والأرقام من مستند FDA نفسه (العناوين الفرعية التفصيلية في 1.15 و 1.16.2 تحت العنوان الأب؛ و 1.9.5 الملغي مش موجود). العناوين المطلوبة لكل
    طلب بتحددها نماذج FDA وقوائم الفحص بتاعتها: المستويات هنا للمعتاد ومكتوب ده على كل بند — راجعها.'
