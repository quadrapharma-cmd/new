  I:
    en: New drug / biological
    ar: دواء جديد / بيولوجي
  G_IMP:
    en: Generic (ANDA) — made outside the US
    ar: مثيل (ANDA) — مصنّع خارج أمريكا
  G_LOC:
    en: Generic (ANDA) — made in the US
    ar: مثيل (ANDA) — مصنّع في أمريكا
