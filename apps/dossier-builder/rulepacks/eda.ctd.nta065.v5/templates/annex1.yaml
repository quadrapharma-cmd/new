undertaking_intro_ar: "وأتعهد أنا الموقع أدناه {signatory} {signatory_title} شركة {company} بالآتي:"
undertaking_ar:
  - {text: "بأن كافة البيانات المذكورة أعلاه صحيحة ودقيقة وكاملة."}
  - {text: "الالتزام بأحكام قانون حماية حقوق الملكية الفكرية رقم 82 لسنة 2002 ولائحته التنفيذية دون أدنى مسؤولية على هيئة الدواء المصرية."}
  - {text: "الالتزام بطباعة اسم المصنع وعنوانه والشركة مالكة المستحضر (أو اسم الشركة مالكة الحق في التسويق للمستحضرات المستوردة بدلًا من الشركة مالكة المستحضر وذلك طبقًا لشهادة CPP المقدمة) وتاريخ الإنتاج وتاريخ انتهاء الصلاحية ورقم التشغيلة ورقم التسجيل والسعر على العبوة الخارجية وعدم إحداث أي تغيير في المستحضر إلا بعد الحصول على موافقة هيئة الدواء المصرية."}
  - {text: "إخطار هيئة الدواء المصرية بأسماء جميع الموزعين المعتمدين وبأي تغيير يطرأ على البيانات الخاصة بهم والتأكد من أن الموزع المعتمد يطبق قواعد التخزين والتوزيع الجيد (GSP&GDP) ومتابعتها من قبل الإدارة العامة للتفتيش على المصانع."}
  - {text: "عدم تغيير مصادر المادة الخام الفعالة إلا بعد موافقة الإدارة العامة لتسجيل المستحضرات البشرية، وإلا يلغى إخطار التسجيل."}
  - {text: "تحمل المسئولية الكاملة عن تخزين المواد الخام، وعن جميع مراحل تصنيع المستحضر، وعن مطابقة المستحضر للمواصفات الفنية وتخزين المنتج حتى تمام التوزيع وفى حالة التصنيع لدى الغير يشترط أن يكون المصنع مرخصًا وأن يلتزم بجميع الالتزامات الواردة بهذا القرار بقواعد التصنيع الجيد وما ورد بالقرار الوزاري 539 لسنة 2007 بشأن اعتماد المدونة المصرية لأساليب التصنيع الجيد للمستحضرات الصيدلية."}
  - {text: "لا يتم نقل مكان التصنيع أو نقل الملكية إلا بعد موافقة الإدارة العامة لتسجيل المستحضرات البشرية، وإلا يلغى إخطار التسجيل."}
  - {when: "origin == 'local' and decree_case == '450-Case1'",
     text: "لا يتم نقل ملكية المستحضرات المحلية إلا بعد مرور ثلاث سنوات من التداول المحلي وموافقة الإدارة العامة لتسجيل المستحضرات البشرية، وإلا يلغى إخطار التسجيل (في حالة المستحضرات المقدمة طبقًا للقرار الوزاري 425/2015 وقرار رئيس هيئة الدواء المصرية رقم 450/2023 الحالة الأولى)."}
  - {when: "origin == 'local' and decree_case == '450-Case3'",
     text: "لا يتم نقل ملكية المستحضرات المحلية إلا بعد مرور خمس سنوات من التداول المحلي وموافقة الإدارة العامة لتسجيل المستحضرات البشرية، وإلا يلغى إخطار التسجيل (في حالة المستحضرات المقدمة طبقًا للقرار الوزاري 645/2018 وقرار رئيس هيئة الدواء المصرية رقم 450/2023 الحالة الثالثة)."}
  - {text: "أن جميع البيانات المقدمة بملف التحليل بالإدارة المركزية للرقابة الدوائية للمستحضر مطابقة لما تم تقديمه بملف التسجيل بهيئة الدواء المصرية وأن جميع المستندات والبيانات صحيحة وعلى مسئوليتي الخاصة."}
  - {text: "تقديم شهادة الـ GMP وشهادة التحليل الخاصة بالمادة الخام، وذلك عند التقدم لاستيراد المادة الخام بهيئة الدواء المصرية."}
  - {text: "إبلاغ الإدارة العامة لليقظة الصيدلية عن أي آثار عكسية خطيرة يتم رصدها عن هذا المستحضر وتقديم تقرير Periodic Safety Update Report، ومتابعة مأمونية مستحضراتها وتنفيذ جميع أنشطة اليقظة الدوائية وذلك وفقًا للمهل المحددة والقواعد الواردة بأسس الممارسة الجيدة لليقظة الدوائية الصادرة والمفعلة من الإدارة."}
  - {text: "سوف يتم توزيع المستحضر عن طريق الشركات الآتية: {distributors}"}
  - {when: "activity == 're_registration'",
     text: "تم إجراء دراسات إعادة التسجيل (تحليل بالإدارة المركزية للرقابة الدوائية / دراسة الثبات / دراسة التكافؤ الحيوي / معدل الذوبان) على تشغيلات إنتاجية باستخدام مصدر المادة الخام: {rereg_studies_api_source}"}
  - {when: "activity == 're_registration' and pending_studies_api_source",
     text: "تتعهد الشركة باستكمال الدراسات على تشغيلات إنتاجية باستخدام مصدر المادة الخام: {pending_studies_api_source}"}
  - {text: "{variations_statement}"}
variations_statement_ar:
  with: "تم عمل المتغيرات (Variations) الآتية للمستحضر عن آخر إخطار تسجيل للمستحضر (لإعادة التسجيل) / موافقة طلب الاستعلام (للمستحضرات الجديدة):"
  none: "لم يتم عمل أي متغيرات (Variations) للمستحضر عن آخر إخطار تسجيل للمستحضر (لإعادة التسجيل) / موافقة طلب الاستعلام (للمستحضرات الجديدة)."
variations_table: [Type of Variation, From, To, "Status (Final /Conditioned)"]
signature_ar: ["رئيس مجلس الإدارة أو المفوض إليه بالإمضاء", "ختم الشركة", "الاسم:", "التوقيع:", "التاريخ:"]
