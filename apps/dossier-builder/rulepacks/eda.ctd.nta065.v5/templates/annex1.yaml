# Annex I — Application form (NP.CAPP.065 v5, pp.27–30). Arabic clauses transcribed
# from the PDF text layer (pypdf), normalised only for: mirrored brackets, tanween
# («اا» → «ًا»), spacing around numbers, final ى→ي, «تقديمة»→«تقديمه», and
# «Safety Periodic Report Update» (split across lines in the PDF) → «Periodic Safety
# Update Report». Verify against the official EDA form before first real use
# (provenance EG-IN-FORCE, transcription check = PENDING).
id: annex1
source: {doc: NP.CAPP.065, ver: 5, pages: 27-30}
transcription_check: pending
