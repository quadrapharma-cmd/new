    source: ICH M4(R4) / eCTD 3.2.2 App. 4 (same number as the CTD section)
    provenance: ICH
  title:
    en: Comparative BA & BE study reports
    ar: تقرير دراسة التكافؤ الحيوي
  matrix:
    I: R
    G_IMP: R
    G_LOC: R
  applies: 'true'
  required:
    I: R
    G_IMP:
      cases:
      - when: biowaiver != ''
        level: R
        reason:
          en: 'No equivalence study: the product is exempt (aqueous solution / BCS). This slot holds the exemption justification (same API and molar concentration, same or similar excipients; BCS data where claimed) instead of a BE report.'
          ar: 'مفيش دراسة تكافؤ مطلوبة: المستحضر معفي (محلول مائي / BCS). البند ده بيتحط فيه مبرر الإعفاء (نفس المادة الفعالة بنفس التركيز، ومواد مضافة مماثلة، وبيانات BCS لو مطلوبة) بدل تقرير الدراسة.'
        provenance: 'EDA GL.CAPP.024 v4/2026 §2.2 p.25 (aqueous solutions, powders for solution, gases) and §4.5.1 p.119-121 (BCS I, III, II weak acids)'
      - when: local_equivalence
        level: R
        reason:
          en: 'Locally acting product that is not a solution: no exemption. Equivalence must be shown by comparative clinical, pharmacodynamic, skin-PK or in-vitro data instead of a plasma BE study; measure systemic exposure if it carries a systemic risk.'
          ar: 'مستحضر موضعي التأثير ومش محلول: مفيش إعفاء. لازم إثبات التكافؤ بدراسة إكلينيكية مقارنة، أو دراسة ديناميكية، أو قياس في الجلد، أو اختبارات معملية مقارنة، بدل دراسة التكافؤ في البلازما. ولو فيه خطر امتصاص للجسم، لازم يتقاس.'
        provenance: 'EDA GL.CAPP.024 v4/2026 §3.13 p.111-112'
      - level: R
    G_LOC:
      cases:
      - when: biowaiver != ''
        level: R
        reason:
          en: 'No equivalence study: the product is exempt (aqueous solution / BCS). This slot holds the exemption justification (same API and molar concentration, same or similar excipients; BCS data where claimed) instead of a BE report.'
