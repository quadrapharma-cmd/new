  ar: الهيكل والترقيم من المواصفة حرفياً. الأقسام المطلوبة بتتحدد بالأساس القانوني للطلب؛ المستويات هي القاعدة العامة في Notice to Applicants — والدولة
    العضو ممكن تطلب أكتر تحت «بيانات إضافية».
