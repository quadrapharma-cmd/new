    en: Comparative BA & BE study reports
    ar: تقرير دراسة التكافؤ الحيوي
  applies: 'true'
  required:
    I: R
    G_IMP:
      cases:
      - when: biowaiver != ''
        level: R
        reason:
          en: 'No equivalence study: the product is exempt (aqueous solution / BCS). This slot holds the exemption justification (same API and molar concentration,
            same or similar excipients; BCS data where claimed) instead of a BE report.'
          ar: 'مفيش دراسة تكافؤ مطلوبة: المستحضر معفي (محلول مائي / BCS). البند ده بيتحط فيه مبرر الإعفاء (نفس المادة الفعالة بنفس التركيز، ومواد مضافة
            مماثلة، وبيانات BCS لو مطلوبة) بدل تقرير الدراسة.'
        provenance: General practice (ICH M4E; WHO TRS 1003 Annex 6 for the exemptions) — the authority's own bioequivalence guideline decides the exemption.
      - when: local_equivalence
        level: R
        reason:
          en: 'Locally acting product that is not a solution: no exemption. Equivalence must be shown by comparative clinical, pharmacodynamic, skin-PK
            or in-vitro data instead of a plasma BE study; measure systemic exposure if it carries a systemic risk.'
          ar: 'مستحضر موضعي التأثير ومش محلول: مفيش إعفاء. لازم إثبات التكافؤ بدراسة إكلينيكية مقارنة، أو دراسة ديناميكية، أو قياس في الجلد، أو اختبارات
            معملية مقارنة، بدل دراسة التكافؤ في البلازما. ولو فيه خطر امتصاص للجسم، لازم يتقاس.'
        provenance: General practice (ICH M4E; WHO TRS 1003 Annex 6 for the exemptions) — the authority's own bioequivalence guideline decides the exemption.
      - level: R
    G_LOC:
      cases:
      - when: biowaiver != ''
        level: R
        reason:
          en: 'No equivalence study: the product is exempt (aqueous solution / BCS). This slot holds the exemption justification (same API and molar concentration,
            same or similar excipients; BCS data where claimed) instead of a BE report.'
          ar: 'مفيش دراسة تكافؤ مطلوبة: المستحضر معفي (محلول مائي / BCS). البند ده بيتحط فيه مبرر الإعفاء (نفس المادة الفعالة بنفس التركيز، ومواد مضافة
            مماثلة، وبيانات BCS لو مطلوبة) بدل تقرير الدراسة.'
        provenance: General practice (ICH M4E; WHO TRS 1003 Annex 6 for the exemptions) — the authority's own bioequivalence guideline decides the exemption.
      - when: local_equivalence
        level: R
        reason:
          en: 'Locally acting product that is not a solution: no exemption. Equivalence must be shown by comparative clinical, pharmacodynamic, skin-PK
