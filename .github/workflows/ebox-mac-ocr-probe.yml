# eBOX for the Mac — which build of the text recognition reads a scanned page as the cloud edition does (Debian's tesseract 5.3.4
# with leptonica 1.82.0, tessdata_fast 4.1.0). The Mac runtime's (conda-forge's tesseract 5.3.4, leptonica 1.83.1) read pages 26
# and 28 of the made-up dossier otherwise (M-O7 for M-07, 22/11). Each candidate reads the cloud edition's own images of those
# pages (tests/expected/mac-same/ocr-probe), with the same language file, as OCRmyPDF calls it. By hand only; prints, changes
# nothing.
name: ebox-mac-ocr-probe
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: The candidates
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP/probe"; mkdir -p "$T"
          curl -fsSL "https://micro.mamba.pm/api/micromamba/osx-arm64/latest" | tar -xj -C "$T" bin/micromamba
          export MAMBA_ROOT_PREFIX="$T/mamba"
          M="$T/bin/micromamba"
          # A: the runtime's (conda-forge tesseract 5.3.4 on leptonica 1.83.1)
          "$M" create -q -y -p "$T/a" -c conda-forge --override-channels tesseract=5.3.4
          # B: conda-forge's last tesseract on leptonica 1.82.0 (5.3.1)
          "$M" create -q -y -p "$T/b" -c conda-forge --override-channels tesseract=5.3.1 leptonica=1.82.0
          # C and D: tesseract 5.3.4 from its source on leptonica 1.82.0 (C) and 1.83.1 (D), built here (Xcode's compiler,
          # conda-forge's autotools and image libraries)
          "$M" create -q -y -p "$T/tools" -c conda-forge --override-channels autoconf automake libtool pkg-config make \
            libpng zlib
          export PATH="$T/tools/bin:$PATH"
          curl -fsSL -o "$T/l182.tgz" https://github.com/DanBloomberg/leptonica/releases/download/1.82.0/leptonica-1.82.0.tar.gz
          curl -fsSL -o "$T/l183.tgz" https://github.com/DanBloomberg/leptonica/releases/download/1.83.1/leptonica-1.83.1.tar.gz
          echo "155302ee914668c27b6fe3ca9ff2da63b245f6d62f3061c8f27563774b8ae2d6  $T/l182.tgz" | shasum -a 256 -c -
          echo "8f18615e0743af7df7f50985c730dfcf0c93548073d1f56621e4156a8b54d3dd  $T/l183.tgz" | shasum -a 256 -c -
          git clone -q --depth 1 --branch 5.3.4 https://github.com/tesseract-ocr/tesseract.git "$T/tess-src"
          for L in 182 183; do
            mkdir -p "$T/lsrc$L" && tar -xzf "$T/l$L.tgz" -C "$T/lsrc$L" --strip-components 1
            (cd "$T/lsrc$L" && CPPFLAGS="-I$T/tools/include" LDFLAGS="-L$T/tools/lib -Wl,-rpath,$T/tools/lib" \
              ./configure -q --prefix="$T/l$L" --disable-programs --without-jpeg --without-giflib --without-libtiff \
              --without-libwebp --without-libwebpmux --without-libopenjpeg && make -s -j4 && make -s install) >/dev/null
            cp -R "$T/tess-src" "$T/tsrc$L"
            (cd "$T/tsrc$L" && ./autogen.sh && PKG_CONFIG_PATH="$T/l$L/lib/pkgconfig" ./configure -q --prefix="$T/t$L" \
              --disable-graphics --disable-doc --without-curl --without-archive && make -s -j4 && make -s install) >/dev/null 2>&1
          done
          ln -s "$T/t182" "$T/c"; ln -s "$T/t183" "$T/d"
          # the language file (tessdata_fast 4.1.0, as the runtime's) and tesseract's own configs, for every candidate
          mkdir -p "$T/tessdata"
          curl -fsSL -o "$T/tessdata/eng.traineddata" https://github.com/tesseract-ocr/tessdata_fast/raw/4.1.0/eng.traineddata
          (cd "$T/tessdata" && grep 'eng.traineddata' "$GITHUB_WORKSPACE/apps/dossier-builder/mac/tessdata.sha256" | shasum -a 256 -c -)
          cp -R "$T/a/share/tessdata/configs" "$T/a/share/tessdata/tessconfigs" "$T/tessdata/"
          P="$GITHUB_WORKSPACE/apps/dossier-builder/tests/expected/mac-same/ocr-probe"
          echo "== the cloud edition read:"; cat "$P/probe.json"
          for c in a b c d; do
            echo "== candidate $c: $("$T/$c/bin/tesseract" --version 2>&1 | head -2 | tr '\n' ' ')"
            for n in 25 26 28; do
              "$T/$c/bin/tesseract" --tessdata-dir "$T/tessdata" -l eng "$P/page$n.png" "$T/out-$c-$n" hocr txt >/dev/null 2>&1
              echo "   page $n: $(tr '\n' ' ' < "$T/out-$c-$n.txt" | tr -s ' ')"
            done
          done
