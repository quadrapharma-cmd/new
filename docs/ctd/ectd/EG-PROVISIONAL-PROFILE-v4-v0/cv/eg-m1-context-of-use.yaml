# =====================================================================================
# PROVISIONAL — NOT ISSUED BY EDA.  EG provisional regional profile v0 for eCTD v4.0.
# Every OID containing "EG-PLACEHOLDER" is a deliberately INVALID marker, not an OID.
# EDA must register real OIDs before any of these codes can pass ICH rules
# eCTD4-008/009/031/075/081/083/084.  See ../README.md (provenance tags, OID plan).
# Provenance tags:  ICH | EU-DERIVED | EG-DRAFT | ASSUMPTION
# Source short-cites: IG = ICH eCTD v4.0 IG v1.7 (5 May 2026); CV = ICH CV package v1.0.3;
#   EU-IG = EU eCTD v4.0 M1 IG draft v1.2 (Oct 2024, cited by heading); SPEC = EG M1 eCTD
#   Specification DRAFT v1.0 (2026, page/line/App.2 row); TG = EDA draft Technical Guidance
#   for eCTD Submissions in Egypt v1.0/2026 (PDF page / margin line).
# =====================================================================================

code_system:
  name: EG eCTD Context of Use (Module 1)
  short_name: eg-context-of-use
  oid: 2.16.840.1.113883.3.989.5.x.EG-PLACEHOLDER.1.1.0
  version: 0 (provisional)
  status: PROVISIONAL - not issued by EDA
  xpath: /PORP_IN000001UV/controlActProcess/subject/submissionUnit/component/contextOfUse/code/@code
  purpose: Module 1 headings for Egypt; ICH CoU list covers M2-M5 only (IG §6.1 "Consult Regional/Module 1 IG to
    complete the list"; IG §6.2 "Context of Use Codes ... specifically Module 1").
  naming: Code pattern eg_<CTD number> follows the ICH CoU pattern ich_<section> (CV sheet "ICH Context of Use")
    with the regional prefix style seen in ICH/EU samples (us_application_type_1, IG §9.2.14; eu_keyword_definition_type_2,
    EU-IG "Keyword Definition"). Display names follow the EU M1 CoU display style "M1.0 Cover Letter" (EU-IG Table
    3). The EU itself uses opaque numeric SPOR-RMS term IDs (OID 2.16.840.1.113883.3.6905.1.17.1); EDA may later
    replace these mnemonic codes with opaque IDs — the maps_from_v322 block keeps the forward-compatibility link
    either way. ASSUMPTION.
  hierarchy_rule: 'No ICH table of contents exists for v4 (VEN 30 Sep 2026 Open Discussion #2); viewers build the
    tree from the parent field. The Module 1 root itself has NO code (cf. ich_2 retired in CV v1.0.3, CR 00790).'
  keyword_rule: Keyword types not listed for a code are not allowed on it (rule eCTD4-071); R types are required
    (eCTD4-070); one keyword per type per CoU (eCTD4-072).
  source_rows: 185 rows of SPEC App.2 (p.28-78); util rows 180-183 and the eg-regional.xml row 2 have no v4 equivalent
    (IG §5.1 no util folder; one submissionunit.xml).
count: 151
