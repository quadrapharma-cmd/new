# =====================================================================================
# PROVISIONAL — NOT ISSUED BY EDA.  EG provisional regional profile v0 for eCTD v4.0.
# Every OID containing "EG-PLACEHOLDER" is a deliberately INVALID marker, not an OID.
# EDA must register real OIDs before any of these codes can pass ICH rules
# eCTD4-008/009/031/075/081/083/084.  See ../README.md (provenance tags, OID plan).
# Provenance tags:  ICH | EU-DERIVED | EG-DRAFT | ASSUMPTION
# Source short-cites: IG = ICH eCTD v4.0 IG v1.7 (5 May 2026); CV = ICH CV package v1.0.3;
#   EU-IG = EU eCTD v4.0 M1 IG draft v1.2 (Oct 2024, cited by heading); SPEC = EG M1 eCTD
#   Specification DRAFT v1.0 (2026, page/line/App.2 row); TG = EDA draft Technical Guidance
#   for eCTD Submissions in Egypt v1.0/2026 (PDF page / margin line).
# =====================================================================================

code_system:
  name: EG Submission Type (regulatory activity)
  short_name: eg-submission-type
  oid: 2.16.840.1.113883.3.989.5.x.EG-PLACEHOLDER.1.3.0
  version: 0 (provisional)
  xpath: /PORP_IN000001UV/controlActProcess/subject/submissionUnit/componentOf1/submission/code/@code
  ich_basis: 'IG Table 11 / §12.2: submission code + codeSystem regional (rules eCTD4-034..037); IG §6.2 "Submission
    Codes".'
  eu_model: 'EU-IG "Submission": OID 2.16.840.1.113883.3.6905.1.11.1, e.g. 100000155689 = initial MAA; submission
    id.item@root stays the same for all SUs of the regulatory activity; only one id item.'
  v322_source: eg-envelope submission/@type (SPEC App.1.1 p.14) - the CV itself is NOT in SPEC; values from TG Annex
    6 (TG p.59-71, l.1417 ff.).
  code_pattern: eg_st_<EG v3.2.2 token> (ASSUMPTION)
mode_required_for:
  tokens:
  - var-pac-n
  - var-pac-b
  - var-pac-a
  - var-pac-ii
  - ipv-admc
  - ipv-admlc
  - ipv-tlc
  - ipv-pu
  - ipv-safeffc
  - imv-majvar
  - imv-minvar
  - imv-not
  - ibv-majqualc
  - ibv-modqualc
  - ibv-minqualc
  - ibv-qcnoimp
  - np-modqualc
  - np-pilc
  - np-majqualc
  - np-safeffc
  - np-admpilc
  - np-packup
  - np-adminc
  - rp-majcq
  - rp-modqc
  - rl-pilc
  - not-minqc
  - not-qcnoimp
  rule: submission/subject3/mode required in every SU of these activities (SPEC p.8 l.78-80, p.15; TG p.27 l.722-724).
    Which tokens count as "variation" is inferred from the token names = ASSUMPTION.
