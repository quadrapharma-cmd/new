# EG submission unit - EG provisional profile v0 (PROVISIONAL, not issued by EDA). Built 2026-11-06.
# Field: envelope/submission-unit/@type
# provenance: EG-DRAFT (stated in an EDA draft) | EU-DERIVED | ASSUMPTION (reason in note)
# Sources: SPEC = EG Module 1 eCTD Specification draft v1.0/2026; TG = Technical Guidance for eCTD Submissions in Egypt draft v1.0/2026;
#          HPG = EG Human Pharmaceutical Module 1 Submission Guidance draft v1/2026; EU = EU M1 v3.1.1 / eu-envelope.mod 3.1.
vocabulary: "EG submission unit"
field: "envelope/submission-unit/@type"
status: PROVISIONAL
intro: "TG Annex 6 'EG Submission Unit' pp.73-74."
values:
  - value: "initial"
    label: "Initial submission to start any regulatory activity"
    provenance: "EG-DRAFT"
    source: "TG p.73; SPEC p.24 l.269-273"
    note: ""
  - value: "validation-response"
    label: "Rectifying submission in response to content validation issues"
    provenance: "EG-DRAFT"
    source: "TG p.73; SPEC p.24 Table 1"
    note: ""
  - value: "response"
    label: "Response to questions / outstanding issues; also the consolidation sequence after withdrawal or rejection of a single regulatory activity"
    provenance: "EG-DRAFT"
    source: "TG p.73; TG p.39 l.1073-1074; SPEC p.25 l.283-287"
    note: "SPEC p.25 Table 4 prints 'responses' and SPEC p.25 l.285 'Response' - both typos of this token (decision D-05)."
  - value: "additional-info"
    label: "Other additional information (e.g. missing files) when validation-response or response is not suitable"
    provenance: "EG-DRAFT"
    source: "TG p.73; TG p.10 l.209-211; SPEC p.22"
    note: ""
  - value: "corrigendum"
    label: "Correction of information after the regulatory activity has concluded; only after case-by-case agreement with EDA"
    provenance: "EG-DRAFT"
    source: "TG p.73; TG p.10 l.212-214"
    note: "TG p.10 l.212 calls it a 'submission type' (EU HTG remnant); Annex 6 lists it as a unit."
  - value: "reformat"
    label: "Baseline: reformatting of an existing application into eCTD, no content change, not reviewed; always with submission type 'none'"
    provenance: "EG-DRAFT"
    source: "TG p.74; SPEC p.25 l.279-280"
    note: "TG p.23 l.606 says 'The submission type reformat' - wrong, reformat is a unit."
  - value: "re-examination"
    label: "Request for re-examination of an authority opinion (MAA, type II variation)"
    provenance: "EG-DRAFT"
    source: "TG p.74"
    note: ""
excluded_values:
  - value: "closing"
    source: "EU eu-envelope.mod"
    reason: "EU centralised-procedure final documents; not in TG Annex 6."
  - value: "consolidating"
    source: "EU eu-envelope.mod"
    reason: "EG uses 'response' for consolidation sequences (TG p.39 l.1074; TG p.73; SPEC p.25 l.285)."
