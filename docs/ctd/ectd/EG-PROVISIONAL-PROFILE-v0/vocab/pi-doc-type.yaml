# EG product-information document type - EG provisional profile v0 (PROVISIONAL, not issued by EDA). Built 2026-11-06.
# Field: m1-3-1-spc-label-pl/pi-doc/@type (also PIDOC file-name component)
# provenance: EG-DRAFT (stated in an EDA draft) | EU-DERIVED | ASSUMPTION (reason in note)
# Sources: SPEC = EG Module 1 eCTD Specification draft v1.0/2026; TG = Technical Guidance for eCTD Submissions in Egypt draft v1.0/2026;
#          HPG = EG Human Pharmaceutical Module 1 Submission Guidance draft v1/2026; EU = EU M1 v3.1.1 / eu-envelope.mod 3.1.
vocabulary: "EG product-information document type"
field: "m1-3-1-spc-label-pl/pi-doc/@type (also PIDOC file-name component)"
status: PROVISIONAL
intro: "SPEC App. 2.3 lists only spc and pl but the drafts use five more tokens (decision D-16)."
values:
  - value: "spc"
    label: "Summary of Product Characteristics"
    provenance: "EG-DRAFT"
    source: "SPEC App. 2.3 p.78"
    note: "Required by EDA (SPEC p.58 row 130)."
  - value: "pl"
    label: "Package Leaflet"
    provenance: "EG-DRAFT"
    source: "SPEC App. 2.3 p.78"
    note: "Required by EDA (SPEC p.58 row 130)."
  - value: "interpack"
    label: "Outer and immediate labelling submitted as one file"
    provenance: "EG-DRAFT"
    source: "SPEC App. 2.3 footnote p.78"
    note: "The footnote '*' is attached to no row; meaning taken from the footnote text."
  - value: "outer"
    label: "Outer packaging (labelling)"
    provenance: "EU-DERIVED"
    source: "SPEC p.11 l.171 (file name 'outer-tablet10mg.pdf'); EU App. 2.3"
    note: "Used in an EG file-name example; value list from EU."
  - value: "impack"
    label: "Immediate packaging (labelling)"
    provenance: "EU-DERIVED"
    source: "EU App. 2.3; eu-regional.dtd pi-doc/@type"
    note: "Needed when outer and immediate labelling are separate files (counterpart of 'interpack')."
  - value: "combined"
    label: "Combined product information (SmPC + labelling + PL in one file)"
    provenance: "EG-DRAFT"
    source: "SPEC p.27 (App. 1.2 example); SPEC p.11 l.172-173; TG p.19 l.471"
    note: ""
  - value: "other"
    label: "Other product information"
    provenance: "EG-DRAFT"
    source: "TG p.19 l.473 (example type=\"other\"); EU App. 2.3"
    note: "Not in SPEC App. 2.3."
excluded_values:
  - value: "annex2"
    source: "EU App. 2.3"
    reason: "Annex II of an EU centralised marketing authorisation; no EG equivalent."
