<title>المراجع الرقابي</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Dossier Builder design system — "regulatory instrument": dark-first, precise, bilingual (RTL/LTR). */
:root{
  --bg:#070B12; --bg-2:#0A101A; --surface:#0E1520; --surface-2:#131C2A; --surface-3:#1A2536;
  --line:#1C2838; --line-2:#2A3A52; --ink:#E9EFF7; --ink-2:#C4CFDD; --muted:#8C9BB0; --faint:#5E6D83;
  --brand:#22D3EE; --brand-ink:#04161B; --brand-soft:rgba(34,211,238,.12); --brand-glow:rgba(34,211,238,.32);
  --accent:#A78BFA; --accent-soft:rgba(167,139,250,.14);
  --ok:#34D399; --ok-soft:rgba(52,211,153,.13); --warn:#FBBF24; --warn-soft:rgba(251,191,36,.13);
  --bad:#F87171; --bad-soft:rgba(248,113,113,.13); --info:#60A5FA; --info-soft:rgba(96,165,250,.13);
  --wait:#C084FC; --wait-soft:rgba(192,132,252,.14); --na:#6B7A90; --na-soft:rgba(107,122,144,.16); --rec:#60A5FA; --rec-soft:rgba(96,165,250,.13);
  --f-ui:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,"Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --r:12px; --r-sm:8px;
  --shadow:0 1px 0 rgba(255,255,255,.025) inset,0 10px 30px rgba(0,0,0,.35);
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --rail-w:252px; --top-h:58px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F2F5F9; --bg-2:#EAF0F7; --surface:#FFFFFF; --surface-2:#F5F8FC; --surface-3:#EAF0F7;
  --line:#DCE4EE; --line-2:#C7D3E2; --ink:#0B1424; --ink-2:#263447; --muted:#5A6A80; --faint:#8B99AD;
  --brand:#0891B2; --brand-ink:#FFFFFF; --brand-soft:rgba(8,145,178,.10); --brand-glow:rgba(8,145,178,.22);
  --accent:#6D28D9; --accent-soft:rgba(109,40,217,.10);
  --ok:#15803D; --ok-soft:rgba(21,128,61,.10); --warn:#B45309; --warn-soft:rgba(180,83,9,.10);
  --bad:#C62828; --bad-soft:rgba(198,40,40,.10); --info:#1D4ED8; --info-soft:rgba(29,78,216,.10);
  --wait:#7E22CE; --wait-soft:rgba(126,34,206,.10); --na:#64748B; --na-soft:rgba(100,116,139,.12); --rec:#1D4ED8; --rec-soft:rgba(29,78,216,.10);
  --shadow:0 1px 2px rgba(15,27,42,.05),0 6px 18px rgba(15,27,42,.06);
  --shadow-sm:0 1px 2px rgba(15,27,42,.08);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(900px 420px at 15% -10%,color-mix(in srgb,var(--brand) 9%,transparent),transparent 70%),
                   radial-gradient(700px 380px at 95% 0%,color-mix(in srgb,var(--accent) 7%,transparent),transparent 70%);
  background-attachment:fixed}
html[lang="ar"] body{font-family:var(--f-ar)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
a.btn{text-decoration:none;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
h1{font-size:24px;margin:0;font-weight:700;letter-spacing:-.01em;text-wrap:balance} h2{font-size:16px;margin:0;font-weight:650} h3{font-size:14px;margin:0;font-weight:650}
html[lang="ar"] h1{letter-spacing:0}
p{margin:0}
.sub{color:var(--muted);margin-top:3px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px} .tiny{font-size:11.5px} .b{font-weight:650}
.num,.tabular{font-variant-numeric:tabular-nums}
.code,.mono{font-family:var(--f-mono);font-size:12.5px;direction:ltr;unicode-bidi:isolate}
.code.wrap{white-space:normal;overflow-wrap:anywhere}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap} .grow{flex:1;min-width:0} .nowrap{white-space:nowrap}
.stack{display:flex;flex-direction:column;gap:14px} .gap-s{gap:8px} .gap-l{gap:20px}
.end{text-align:end} .center{text-align:center}
.right{margin-inline-start:auto}

/* ---------- app frame */
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:2px;padding:14px 12px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 92%,transparent),color-mix(in srgb,var(--bg) 85%,transparent));
  border-inline-end:1px solid var(--line);backdrop-filter:blur(10px);overflow:auto}
.logo{display:flex;align-items:center;gap:11px;padding:6px 8px 16px;text-decoration:none;color:inherit}
.logo .tile{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;flex:none;font-family:var(--f-mono);font-weight:600;font-size:12.5px;
  color:#04161B;background:linear-gradient(135deg,var(--brand),var(--accent));box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 6px 18px var(--brand-glow)}
.logo .name{font-weight:700;font-size:14.5px;line-height:1.2}
.logo .tag{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:2px;font-family:var(--f-mono);letter-spacing:.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;color:var(--muted);text-decoration:none;font-weight:500;position:relative;min-height:38px}
.nav a svg{flex:none;opacity:.85}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav a.on::before{content:"";position:absolute;inset-block:8px;inset-inline-start:0;width:3px;border-radius:3px;background:var(--brand);box-shadow:0 0 10px var(--brand-glow)}
.nav a[aria-disabled="true"]{opacity:.4;pointer-events:none}
.nav .grp{font-size:10.5px;color:var(--faint);padding:14px 11px 5px;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
html[lang="ar"] .nav .grp{letter-spacing:0;text-transform:none;font-size:11.5px}
.nav .cnt{margin-inline-start:auto;font-size:11px;background:var(--bad-soft);color:var(--bad);border-radius:999px;padding:0 7px;font-weight:650;font-variant-numeric:tabular-nums;min-width:20px;text-align:center}
.nav .cnt.ok{background:var(--ok-soft);color:var(--ok)}
.rail .foot{margin-top:auto;padding:12px 8px 4px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line)}
.rail .foot .led{display:inline-flex;align-items:center;gap:7px}
.led::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--ok-soft)}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:8;min-height:var(--top-h);display:flex;gap:10px;align-items:center;padding:8px 22px;
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .crumb{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.top .crumb .sep{color:var(--faint)}
.view{padding:22px 22px 60px;display:flex;flex-direction:column;gap:20px;max-width:1480px;width:100%;animation:view-in .22s ease-out}
@keyframes view-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.head{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
.head .title{display:flex;flex-direction:column;gap:2px;min-width:0}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--brand);font-weight:650;font-family:var(--f-mono)}
html[lang="ar"] .eyebrow{letter-spacing:.02em;text-transform:none}

/* ---------- buttons, segments, chips */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:var(--surface-2);color:var(--ink);
  padding:7px 13px;border-radius:10px;cursor:pointer;font-weight:550;white-space:nowrap;min-height:36px;text-decoration:none;transition:background .15s,border-color .15s,transform .15s}
.btn:hover{background:var(--surface-3);border-color:var(--line-2)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);font-weight:650;box-shadow:0 4px 16px var(--brand-glow)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)} .btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.soft{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.sm{padding:3px 10px;min-height:30px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:10px 18px;min-height:44px;font-size:15px;border-radius:12px}
.btn.link{border:0;background:none;color:var(--brand);padding:0;min-height:0}
.btn[disabled]{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn svg{flex:none}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--surface);padding:2px;gap:2px}
.seg button,.seg a{border:0;background:transparent;padding:5px 11px;cursor:pointer;color:var(--muted);min-height:30px;border-radius:8px;text-decoration:none;font-weight:500;display:inline-flex;align-items:center;gap:6px}
.seg button.on,.seg a.on{background:var(--brand-soft);color:var(--brand);font-weight:650}
.modeswitch{display:inline-flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;padding:2px;gap:2px;background:var(--surface)}
.modeswitch a{padding:5px 12px;text-decoration:none;color:var(--muted);border-radius:8px;min-height:30px;display:inline-flex;align-items:center} .modeswitch a.on{background:var(--brand);color:var(--brand-ink);font-weight:650}
.chip{display:inline-flex;align-items:center;gap:6px;padding:1px 9px 1px 7px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:20px}
.chip::before,.chip i{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 2px color-mix(in srgb,currentColor 25%,transparent);display:inline-block;flex:none}
.chip i+*{margin:0}
.c-ok,.s-valid{background:var(--ok-soft);color:var(--ok)} .c-warn,.s-expiring{background:var(--warn-soft);color:var(--warn)}
.c-bad,.s-expired,.s-missing{background:var(--bad-soft);color:var(--bad)} .c-wait,.s-needs_date{background:var(--wait-soft);color:var(--wait)}
.c-na,.s-no_expiry{background:var(--na-soft);color:var(--muted)} .c-rec,.c-info,.s-renewal{background:var(--rec-soft);color:var(--rec)}
.c-brand{background:var(--brand-soft);color:var(--brand)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;border:1px solid var(--line-2);border-radius:6px;padding:0 7px;color:var(--muted);white-space:nowrap;font-family:var(--f-mono);line-height:20px}
.tag.brand{border-color:color-mix(in srgb,var(--brand) 40%,transparent);color:var(--brand)}
.tag.warn,.prov.ASSUMPTION{border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn)}
.prov{font-size:11.5px;border:1px solid var(--line-2);border-radius:6px;padding:0 6px;color:var(--muted);white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 12px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line-2);font-family:var(--f-mono);font-size:12.5px;color:var(--ink-2)}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--brand);box-shadow:0 0 8px var(--brand-glow)}
.op{font-family:var(--f-mono);font-size:11.5px;padding:1px 7px;border-radius:5px;background:var(--ok-soft);color:var(--ok)}
.op.replace{background:var(--info-soft);color:var(--info)} .op.delete{background:var(--bad-soft);color:var(--bad)}

/* ---------- cards, KPIs, meters */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none;background:var(--surface-2)}
.card.glow{border-color:color-mix(in srgb,var(--brand) 35%,var(--line));box-shadow:var(--shadow),0 0 0 1px color-mix(in srgb,var(--brand) 12%,transparent),0 0 40px -10px var(--brand-glow)}
.pad{padding:16px 18px}
.card>.hd,.hd{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hd h2,.hd h3{flex:1;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px;border-inline-start:3px solid var(--line-2);position:relative;overflow:hidden}
.kpi .n{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.02em}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi.ok,.kpi.br{border-inline-start-color:var(--brand)} .kpi.ok .n{color:var(--ok)} .kpi.br .n{color:var(--brand)}
.kpi.bad{border-inline-start-color:var(--bad)} .kpi.bad .n{color:var(--bad)}
.kpi.warn{border-inline-start-color:var(--warn)} .kpi.warn .n{color:var(--warn)}
.kpi.info{border-inline-start-color:var(--info)} .kpi.info .n{color:var(--info)}
.kpi.wait{border-inline-start-color:var(--wait)} .kpi.wait .n{color:var(--wait)}
.kpi.ns{border-inline-start-color:var(--na)}
.kpi.ok{border-inline-start-color:var(--ok)}
.meter{height:7px;border-radius:999px;background:var(--surface-3);overflow:hidden;min-width:80px;flex:1}
.meter i,.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),color-mix(in srgb,var(--brand) 60%,var(--accent)));border-radius:999px;transition:width .4s ease}
.bar{height:7px;border-radius:999px;background:var(--surface-3);overflow:hidden;min-width:90px}
.meter.ok i,.bar.ok i{background:var(--ok)} .meter.bad i{background:var(--bad)} .meter.warn i{background:var(--warn)}
.ring{--v:0;--size:64px;width:var(--size);height:var(--size);border-radius:50%;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--brand) calc(var(--v)*1%),var(--surface-3) 0);box-shadow:0 0 24px -6px var(--brand-glow)}
.ring b{width:calc(var(--size) - 14px);height:calc(var(--size) - 14px);border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:calc(var(--size)/4.4);font-variant-numeric:tabular-nums;font-weight:650}
.ring.lg{--size:112px} .ring.sm{--size:44px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media (max-width:1000px){.grid2,.two{grid-template-columns:1fr} .grid3{grid-template-columns:1fr 1fr}}

/* ---------- hero, capabilities, workflow */
.hero{position:relative;overflow:hidden;padding:30px 30px 26px;border-radius:16px;border:1px solid color-mix(in srgb,var(--brand) 30%,var(--line));
  background:linear-gradient(135deg,color-mix(in srgb,var(--brand) 12%,var(--surface)),var(--surface) 55%,color-mix(in srgb,var(--accent) 10%,var(--surface)))}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;
  background-image:linear-gradient(var(--line-2) 1px,transparent 1px),linear-gradient(90deg,var(--line-2) 1px,transparent 1px);background-size:34px 34px;
  -webkit-mask-image:radial-gradient(80% 70% at 70% 30%,#000 30%,transparent 100%);mask-image:radial-gradient(80% 70% at 70% 30%,#000 30%,transparent 100%)}
.hero>*{position:relative}
.hero h1{font-size:30px;line-height:1.2;max-width:22ch}
.hero .lead{color:var(--ink-2);max-width:62ch;font-size:15px;margin-top:8px}
.hero .badges{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.caps{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.cap{display:flex;flex-direction:column;gap:10px;padding:16px;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
.cap:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.cap .ic{display:grid;place-items:center;width:40px;height:40px;border-radius:11px;background:var(--brand-soft);color:var(--brand)}
.cap .ic.accent{background:var(--accent-soft);color:var(--accent)} .cap .ic.ok{background:var(--ok-soft);color:var(--ok)} .cap .ic.warn{background:var(--warn-soft);color:var(--warn)} .cap .ic.info{background:var(--info-soft);color:var(--info)}
.cap .n{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em;line-height:1}
.cap .n small{font-size:12px;color:var(--muted);font-weight:500;margin-inline-start:5px;letter-spacing:0}
.cap h3{font-size:14.5px}
.cap p{color:var(--muted);font-size:12.5px;line-height:1.5}
.cap .src{margin-top:auto;font-family:var(--f-mono);font-size:11px;color:var(--faint);direction:ltr;text-align:start}
.flow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;counter-reset:step}
.flow .st{position:relative;padding:14px 12px 14px 0;display:flex;flex-direction:column;gap:6px}
.flow .st .k{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--surface-2);border:1px solid var(--line-2);font-family:var(--f-mono);font-size:12.5px;color:var(--brand);font-weight:600;position:relative;z-index:1}
.flow .st::after{content:"";position:absolute;top:28px;inset-inline-start:30px;inset-inline-end:-2px;height:1px;background:var(--line-2)}
.flow .st:last-child::after{display:none}
.flow .st b{font-size:13.5px} .flow .st span{font-size:12px;color:var(--muted)}
@media (max-width:1000px){.flow{grid-template-columns:repeat(3,minmax(0,1fr))} .flow .st:nth-child(3n)::after{display:none}}
@media (max-width:560px){.flow{grid-template-columns:repeat(2,minmax(0,1fr))} .flow .st::after{display:none}}

/* ---------- journey (guide) */
.journey{display:flex;flex-direction:column}
.jstep{display:grid;grid-template-columns:34px minmax(0,1fr);gap:0 14px;position:relative;padding-bottom:18px}
.jstep::before{content:"";position:absolute;inset-block:34px 0;inset-inline-start:16px;width:2px;background:var(--line)}
.jstep:last-child::before{display:none}
.jdot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted);font-family:var(--f-mono);font-weight:600;font-size:13px;z-index:1}
.jstep.done .jdot{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ok)}
.jstep.now .jdot{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);box-shadow:0 0 0 5px var(--brand-soft),0 0 18px var(--brand-glow)}
.jstep.warn .jdot{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 50%,transparent);color:var(--warn)}
.jstep.bad .jdot{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}
.jbody{display:flex;flex-direction:column;gap:8px;padding-top:5px;min-width:0}
.jbody .jt{display:flex;gap:10px;align-items:center;flex-wrap:wrap} .jbody .jt h3{font-size:15px}
.jbody .jd{color:var(--muted);font-size:13px}
.jitems{display:flex;flex-direction:column;gap:6px}
.jitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface-2)}
.jitem .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.next{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:18px 20px}
.next .ic{display:grid;place-items:center;width:48px;height:48px;border-radius:14px;background:var(--brand);color:var(--brand-ink);box-shadow:0 6px 20px var(--brand-glow)}
@media (max-width:700px){.next{grid-template-columns:auto minmax(0,1fr)} .next .act{grid-column:1/-1}}

/* ---------- tables */

  return `${head(t('screening'))}
  <section class="gate ${gateOk ? 'ok' : 'bad'}"><span class="ic-tile ${gateOk ? 'ok' : 'bad'}">${icon(gateOk ? 'check' : 'alert',18)}</span><div><h3>${esc(gateOk ? t('gateOk') : t('gateBad'))}</h3><p>${esc(L({ar:`${SCREEN_ROWS.length} بنداً مطلوباً حسب الملف الشخصي · ${bad} غير مقبول · ${part} ناقص جزئياً. إعادة التقديم بعد الرفض: خلال 3 شهور (المسار السريع) أو 30 يوم عمل (المسار العادي للمستورد).`, en:`${SCREEN_ROWS.length} items required by the profile · ${bad} not acceptable · ${part} partial. Resubmission after rejection: within 3 months (fast track) or 30 WDs (normal track, imported).`}))}</p></div>
    ${gateOk ? '' : `<button class="btn" id="rejPrev">${icon('mail',16)} ${esc(t('rejectPreview'))}</button>`}</section>
  <section class="card"><div class="tbl"><table><thead><tr><th>${esc(L({ar:'رقم', en:'No.'}))}</th><th>${esc(t('item'))}</th><th>${esc(t('status'))}</th><th>${esc(t('notes'))}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>
  <section class="card pad stack gap-s"><h3>${esc(t('whoItems'))}</h3><div class="checks">${['cover letter: «true, complete and correct»', 'QOS / QIS as Word, latest template', 'nitrosamine risk assessment declared', 'list of all BE studies incl. failed & pilot', 'full site address incl. unit and block', 'contract-manufacturing responsibilities defined'].map((x, i) => `<span class="chip ${i === 0 ? 'c-bad' : 'c-ok'}"><i></i>${esc(x)}</span>`).join('')}</div><p class="tiny-note">WHO PQ screening checklist (May 2021) — items the EDA screener is known to look for; shown as Minor unless NP.CAPP.065 requires them.</p></section>`;
}
function rejectPreview(){
  const items = SCREEN_ROWS.filter(r => r.st !== 'present');
  openDrawer(t('rejectPreview'), `<div class="letter" style="padding:20px 22px;max-width:none"><div class="lh"><div><h2>Screening outcome: In-completed</h2><div class="small muted">Administration of Human Pharmaceuticals Regulatory Affairs (simulated)</div></div><span class="stamp">SIMULATION</span></div>

    <ol>${items.map(r => `<li><b>${esc(r.id)}</b> — ${esc(r.en)}: ${esc(r.note ? r.note.en : '')}<div class="ar">${esc(r.ar)}: ${esc(r.note ? r.note.ar : '')}</div></li>`).join('')}</ol></div>`, true);

/* ---- assessment workspace */
function tree(){
  return DEPTS.filter(d => d.id !== 'technical').map(d => { const secs = SECTIONS[d.id] || []; const v = deptVerdict(d.id);
    return `<details ${S.dept === d.id ? 'open' : ''}><summary><span class="dot" style="background:var(--${v === 'approve' ? 'ok' : v === 'reject' ? 'bad' : v === 'clock_stop' ? 'warn' : 'info'})"></span>${esc(L(d))}<span class="cnt">${byDept(d.id).filter(isOpen).length}</span></summary>
      <div class="node ${S.dept === d.id && !S.sec ? 'sel' : ''}" data-dept="${d.id}" data-sec=""><span class="dot" style="background:var(--na)"></span><span>${esc(t('allSecs'))}</span></div>
      ${secs.map(([k, n]) => { const fs = byDept(d.id).filter(f => f.sec === k); const c = fs.some(f => isOpen(f) && f.sev === 'critical') ? 'bad' : fs.some(isOpen) ? 'warn' : fs.some(f => f.verdict === 'not_assessable') ? 'wait' : fs.length ? 'ok' : 'na';
        return `<div class="node ${S.dept === d.id && S.sec === k ? 'sel' : ''}" data-dept="${d.id}" data-sec="${esc(k)}"><span class="dot" style="background:var(--${c})"></span><span><span class="code">${esc(k)}</span> ${esc(L(n))}</span></div>`; }).join('')}</details>`; }).join('');
}
function evItem(f, i, e){
  const on = S.ev && S.ev.id === f.id && S.ev.i === i;
  return e.data ? `<button class="evi data ${on ? 'on' : ''}" data-ev="${f.id}:${i}"><span class="m">${icon('database',13)} ${esc(e.data)}</span><span class="x code wrap">${esc(e.v)}</span></button>`
    : `<button class="evi ${on ? 'on' : ''}" data-ev="${f.id}:${i}"><span class="m">${icon('file',13)} ${esc(e.doc)} · ${esc(t('page'))} ${e.page}</span><span class="x">${e.x}</span></button>`;
}
function qcard(f){
  const aiBox = f.aiBox ? `<div class="ai"><div class="aih">${icon('sparkles',15)} ${esc(L({ar:'اقتراح المُقيِّم الذكي', en:'AI assessor suggestion'}))}<span class="conf">confidence ${Math.round(f.aiBox.conf*100)}%</span></div>
      <div class="fnd"><div class="en">${esc(f.aiBox.en)}</div><div class="ar">${esc(f.aiBox.ar)}</div></div>${f.aiBox.ev ? evItem(f, 'ai', f.aiBox.ev) : ''}
      <div class="row gap-s"><button class="btn sm primary" data-aiok="${f.id}">${icon('check',14)} ${esc(t('confirm'))}</button><button class="btn sm ghost" data-aino="${f.id}">${esc(t('dismiss'))}</button><span class="tiny-note">${esc(L({ar:'لا يدخل الخطاب قبل التأكيد', en:'Enters the letter only after confirmation'}))}</span></div></div>` : '';
  return `<article class="qcard ${f.verdict} ${f.sev}" id="q-${f.id}">
    <div class="qh"><span class="code">${esc(f.id)}</span><span class="code muted">${esc(f.sec)}</span>${vChip(f.verdict)}${sevTag(f.sev)}${oTag(f)}${f.status === 'answered' ? `<span class="chip c-info"><i></i>${esc(L({ar:'رد مقدَّم', en:'response submitted'}))}</span>` : ''}${['accepted','closed'].includes(f.status) && f.verdict === 'deficient' ? `<span class="chip c-ok"><i></i>${esc(L({ar:'مقبول بعد إعادة التقييم', en:'accepted after re-assessment'}))}</span>` : ''}</div>
    <div class="q">${esc(L(f.q))}</div>
    <div class="ev"><span class="tiny-note">${esc(t('evidence'))}</span>${f.ev.map((e, i) => evItem(f, i, e)).join('')}</div>
    <div class="fnd"><span class="tiny-note">${esc(t('finding'))}</span><div class="en">${esc(f.fnd.en)}</div><div class="ar">${esc(f.fnd.ar)}</div><div class="src">${esc(t('ref'))}: ${esc(f.ref)}</div></div>
    ${aiBox}
    <div class="qa">${f.act && f.verdict !== 'adequate' ? `<button class="btn sm" data-act="${f.id}">${icon('arrow',14)} ${esc(L(f.act))}</button>` : ''}
      ${pendingAI(f) ? `<button class="btn sm primary" data-conf="${f.id}">${icon('check',14)} ${esc(t('confirm'))} AI</button>` : ''}
      ${S.aiOn && !f.aiBox && !pendingAI(f) ? `<button class="btn sm ghost" data-ai="${f.id}">${icon('sparkles',14)} ${esc(t('askAI'))}</button>` : ''}
      <button class="btn sm ghost" data-ovr="${f.id}">${icon('pen',14)} ${esc(t('override'))}</button></div></article>`;
}
function viewer(){
  if(!S.ev) return `<div class="empty">${icon('eye',34)}<div>${esc(t('pickEv'))}</div></div>`;
  const f = F.find(x => x.id === S.ev.id); const e = S.ev.i === 'ai' ? f.aiBox && f.aiBox.ev : f.ev[S.ev.i]; if(!e) return '';
  if(e.data) return `<div class="vh">${icon('database',15)}<span class="code">${esc(e.data)}</span></div><div class="pad stack gap-s"><div class="eyebrow">${esc(t('dataCard'))}</div><div class="code wrap" style="font-size:14px">${esc(e.v)}</div><p class="small muted">${esc(L({ar:'القيمة جاية من صفحة «البيانات» في منشئ الملفات؛ تعديلها هناك يعيد تقييم السؤال تلقائياً.', en:'The value comes from the builder’s Data page; changing it there re-assesses the question automatically.'}))}</p></div>`;
  return `<div class="vh">${icon('file',15)}<span class="code">${esc(e.doc)}</span><span class="tag">${esc(t('page'))} ${e.page}</span></div>
    <div class="page"><div class="ph"><span>${esc(DOSSIER.name)}</span><span>${esc(e.doc.split(' ')[0])}</span></div><h4>${esc(e.doc.replace(/\.pdf$/, '').replace(/^[\d.A-Z-]+\s/, ''))}</h4>
      <div class="skel m"></div><div class="skel"></div><div class="skel s"></div><p>${e.x}</p><div class="skel"></div><div class="skel m"></div><div class="skel s"></div><div class="skel"></div><span class="pn">${e.page}</span></div>`;
}
function assess(){
  let fs = byDept(S.dept).filter(f => !S.sec || f.sec === S.sec);
  if(S.filter === 'open') fs = fs.filter(f => isOpen(f) || pendingAI(f) || f.verdict === 'not_assessable');
  else if(S.filter !== 'all') fs = fs.filter(f => f.sev === S.filter && f.verdict === 'deficient');
  const d = DEPTS.find(x => x.id === S.dept), secName = S.sec ? L((SECTIONS[S.dept] || []).find(s => s[0] === S.sec)[1]) : t('allSecs');
  return `${head(t('assess'), `<div class="seg" id="fseg">${['all','open','critical','major','minor'].map(k => `<button data-f="${k}" class="${S.filter === k ? 'on' : ''}">${esc(t(k))}</button>`).join('')}</div>`)}
  <div class="legend"><span><i style="background:var(--ok)"></i>${esc(t('adequate'))}</span><span><i style="background:var(--warn)"></i>${esc(t('deficient'))} (${esc(t('major'))})</span><span><i style="background:var(--bad)"></i>${esc(t('critical'))}</span><span><i style="background:var(--wait)"></i>${esc(t('na'))}</span><span><i style="background:var(--na)"></i>${esc(L({ar:'لم يُفحص', en:'not checked'}))}</span></div>
  <div class="ws">
    <aside class="card tree" id="tree">${tree()}</aside>
    <section class="stack gap-s"><div class="row"><h2>${esc(L(d))} · <span class="code">${esc(S.sec || '')}</span> ${esc(secName)}</h2><span class="muted small">${fs.length} ${esc(L({ar:'سؤال', en:'questions'}))}</span>${S.sec ? `<button class="btn sm ghost" id="askSec">${icon('sparkles',14)} ${esc(L({ar:'اسأل الذكاء عن القسم كله', en:'Ask AI about the whole section'}))}</button>` : ''}</div>
      <div class="qlist">${fs.length ? fs.map(qcard).join('') : `<div class="card empty">${icon('checklist',34)}<div>${esc(t('noQ'))}</div></div>`}</div></section>
    <aside class="card viewer" id="viewer">${viewer()}</aside>
  </div>`;
}
function askAI(id){
  const f = F.find(x => x.id === id); const sug = AI_SUGGEST[id];
  f.aiBox = sug || {verdict: f.verdict === 'not_assessable' ? 'deficient' : f.verdict, conf: 0.74, en:`Reading ${f.sec}: the evidence above supports the current verdict (${f.verdict}). No additional deficiency identified beyond the published rule set.`, ar:`قراءة ${f.sec}: الدليل أعلاه يدعم الحكم الحالي (${t(f.verdict)}). لا ملاحظة إضافية خارج القواعد المنشورة.`};
  render(); toast(L({ar:'قرأ المُقيِّم الذكي المستندات (محاكاة) — راجع الاقتراح وأكده', en:'The AI assessor read the documents (simulated) — review and confirm the suggestion'}));
}
function overrideDlg(id){
  const f = F.find(x => x.id === id);
  openDrawer(`${t('override')} · ${id}`, `<div class="stack"><div class="f"><label>${esc(t('verdict'))}</label><select id="ovV">${['adequate','deficient','not_assessable'].map(v => `<option value="${v}" ${f.verdict === v ? 'selected' : ''}>${esc(t(v))}</option>`).join('')}</select></div>
    <div class="f"><label>${esc(t('reason'))}</label><textarea id="ovR" rows="3" placeholder="${esc(L({ar:'مثال: الدليل موجود في ملحق خارجي رُفع في 3.2.A', en:'e.g. the evidence is in an external annex filed under 3.2.A'}))}"></textarea></div>
    <div class="row"><button class="btn primary" id="ovSave">${esc(t('save'))}</button><button class="btn ghost" id="ovCancel">${esc(t('cancel'))}</button></div></div>`);
  $('#ovCancel').onclick = closeDrawer;
  $('#ovSave').onclick = () => { const r = $('#ovR').value.trim(); if(!r){ $('#ovR').focus(); return; } f.verdict = $('#ovV').value; f.origin = 'human'; f.confirmed = true; f.override = r; if(f.verdict === 'adequate') f.status = 'closed'; closeDrawer(); render(); toast(L({ar:'تم تسجيل التعديل في سجل التدقيق', en:'Override recorded in the audit log'})); };
}

/* Regulatory Reviewer prototype — part B: deficiency letter, response cycle, verdict, settings, routing and events. */
const DUE_DAYS = 90, RUN_DATE = new Date(DOSSIER.run.date + 'T00:00:00'), TODAY = new Date('2026-11-23T00:00:00');
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const addWds = (d, n) => addDays(d, Math.round(n * 7 / 5));
const fmt = d => d.toLocaleDateString(LANG === 'ar' ? 'ar-EG' : 'en-GB', {year:'numeric', month:'short', day:'numeric'});
const fmtEn = d => d.toLocaleDateString('en-GB', {year:'numeric', month:'short', day:'numeric'});
const letterItems = dept => byDept(dept).filter(f => f.verdict === 'deficient' && !pendingAI(f) && counted(f) && f.status !== 'withdrawn');

function letter(){
  const depts = DEPTS.filter(d => letterItems(d.id).length);
  if(!depts.find(d => d.id === S.letterDept)) S.letterDept = depts.length ? depts[0].id : 'quality';
  const d = DEPTS.find(x => x.id === S.letterDept), items = letterItems(S.letterDept);
  const groups = [...new Set(items.map(f => f.sec))];
  let n = 0;
  const body = groups.map(sec => { const name = (SECTIONS[S.letterDept] || []).find(s => s[0] === sec); return `<h3>${esc(sec)} ${name ? '— ' + esc(name[1].en) : ''}</h3><ol start="${n+1}">${items.filter(f => f.sec === sec).map(f => { n++; return `<li><b>${esc(f.fnd.en)}</b><div class="ar">${esc(f.fnd.ar)}</div><div class="lm"><span>${esc(f.id)}</span><span>${sevTag(f.sev)}</span><span>Ref: ${esc(f.ref)}</span>${f.act ? `<span>Requested: ${esc(f.act.en)}</span>` : ''}${['accepted','closed'].includes(f.status) ? `<span class="chip c-ok"><i></i>closed in round ${f.resp ? f.resp.round : 1}</span>` : ''}</div></li>`; }).join('')}</ol>`; }).join('');
  return `${head(t('letter'), `<div class="seg wrapseg">${depts.map(x => `<button data-ld="${x.id}" class="${S.letterDept === x.id ? 'on' : ''}">${esc(L(x))} <span class="code">${letterItems(x.id).length}</span></button>`).join('')}</div>`)}
  <div class="row"><button class="btn" id="dlDocx">${icon('download',16)} Word</button><button class="btn" id="dlPdf">${icon('download',16)} PDF</button><button class="btn ghost" id="cpTxt">${icon('file',16)} ${esc(L({ar:'نسخ النص', en:'Copy text'}))}</button><a class="btn ghost" href="#responses">${icon('repeat',16)} ${esc(L({ar:'افتح دورة الردود', en:'Open the response cycle'}))}</a><span class="small muted">${esc(L({ar:'الإنجليزي أولاً زي خطابات الهيئة، ثم العربي', en:'English first, as EDA letters are written, then Arabic'}))}</span></div>
  <article class="letter" id="letterDoc">
    <div class="lh"><div><h2>Request for supplementary information — ${esc(d.en)}</h2><div class="small muted">${esc(d.body.en)} · simulated assessor · ${esc(DOSSIER.run.pack)}</div></div><div class="ref"><span class="stamp">SIMULATION · NOT AN EDA LETTER</span><div style="margin-top:8px">Ref. ${esc(DOSSIER.run.id)}/${esc(S.letterDept.toUpperCase())}-${String(items.length).padStart(3,'0')}<br>${esc(DOSSIER.run.date)}</div></div></div>
    <dl class="meta"><dt>Applicant</dt><dd>${esc(DOSSIER.applicant)}</dd><dt>Product</dt><dd>${esc(DOSSIER.name)}</dd><dt>Tracking</dt><dd>${esc(DOSSIER.tracking)}</dd><dt>Submission</dt><dd>${esc(DOSSIER.kind.en)}</dd><dt>Clock</dt><dd>Stopped at technical evaluation — reply within <b>3 months</b> as supplementary documents (submission procedures, Step 3)</dd></dl>
    <p>Dear Sir / Madam,</p><p>Following the assessment of the above dossier against the published requirements, the applicant is requested to address the following points. All supporting documents should be submitted within the relevant CTD folders, as new versions of the affected documents.</p>
    ${body}
    <div class="sign"><span>Reply deadline: ${esc(fmtEn(addDays(RUN_DATE, DUE_DAYS)))} · open queries: ${items.filter(isOpen).length} of ${items.length}</span><span>${esc(d.en)} assessor (simulation)</span></div>
  </article>`;
}

function responses(){
  const fs = F.filter(f => f.verdict === 'deficient' && !pendingAI(f) && counted(f)).sort((a, b) => ['critical','major','minor'].indexOf(a.sev) - ['critical','major','minor'].indexOf(b.sev));
  const due = addDays(RUN_DATE, DUE_DAYS), left = Math.round((due - TODAY) / 864e5);
  const st = f => f.status === 'open' ? 'open' : f.status === 'answered' ? 'answered' : ['accepted','closed'].includes(f.status) ? 'accepted' : f.status;
  const stChip = s => `<span class="chip ${s === 'open' ? 'c-warn' : s === 'answered' ? 'c-info' : s === 'accepted' ? 'c-ok' : 'c-bad'}"><i></i>${esc(L({open:{ar:'مفتوح', en:'Open'}, answered:{ar:'تم الرد', en:'Answered'}, accepted:{ar:'مقبول', en:'Accepted'}, not_accepted:{ar:'غير مقبول', en:'Not accepted'}}[s]))}</span>`;
  const who = {quality:'Mona A.', screening:'Mona A.', cadc:'QC lab · Hossam', stability:'Stability · Rania', labelling:'RA · Sara', gates:'RA · Mona A.', be:'CRO liaison'};
  const rows = fs.map(f => `<tr><td class="code">${esc(f.id)}</td><td>${esc(L(DEPTS.find(d => d.id === f.dept)))}<div class="small muted code">${esc(f.sec)}</div></td><td>${sevTag(f.sev)}</td><td>${stChip(st(f))}</td><td class="hide-m">${esc(who[f.dept] || '—')}</td><td class="hide-m"><span class="due ${left < 15 ? 'soon' : ''}">${esc(fmt(due))} · ${left} d</span></td><td>${f.resp ? `<span class="small">${esc(f.resp.text.slice(0, 70))}${f.resp.text.length > 70 ? '…' : ''}</span><div class="small muted">${(f.resp.docs || []).map(x => `<span class="pchip">${esc(x)}</span>`).join(' ')}</div>` : '<span class="muted small">—</span>'}</td>
    <td class="end nowrap"><button class="btn sm" data-resp="${f.id}">${icon('pen',14)} ${esc(L({ar:'رد', en:'Respond'}))}</button> ${f.status === 'answered' ? `<button class="btn sm primary" data-reassess="${f.id}">${icon('repeat',14)} ${esc(L({ar:'أعد التقييم', en:'Re-assess'}))}</button>` : ''}</td></tr>`).join('');
  const c = {open: fs.filter(f => st(f) === 'open').length, answered: fs.filter(f => st(f) === 'answered').length, accepted: fs.filter(f => st(f) === 'accepted').length};
  return `${head(t('responses'), `<span class="badge">${esc(L({ar:'الجولة 1', en:'Round 1'}))} · ${esc(L({ar:'المهلة', en:'deadline'}))} ${esc(fmt(due))}</span>`)}
  <div class="kpis"><div class="card kpi warn"><span class="n">${c.open}</span><span class="l">${esc(L({ar:'مفتوح', en:'Open'}))}</span></div><div class="card kpi info"><span class="n">${c.answered}</span><span class="l">${esc(L({ar:'تم الرد — بانتظار إعادة التقييم', en:'Answered — awaiting re-assessment'}))}</span></div><div class="card kpi ok"><span class="n">${c.accepted}</span><span class="l">${esc(L({ar:'مقبول ومقفول', en:'Accepted and closed'}))}</span></div><div class="card kpi wait"><span class="n">${left}</span><span class="l">${esc(L({ar:'يوم متبقٍ من مهلة الـ Clock stop', en:'days left in the clock-stop period'}))}</span></div></div>
  <section class="card rtable"><div class="tbl"><table><thead><tr><th>#</th><th>${esc(L({ar:'الإدارة · البند', en:'Department · section'}))}</th><th>${esc(L({ar:'الخطورة', en:'Severity'}))}</th><th>${esc(t('status'))}</th><th class="hide-m">${esc(L({ar:'المسؤول', en:'Owner'}))}</th><th class="hide-m">${esc(L({ar:'المهلة', en:'Due'}))}</th><th>${esc(L({ar:'الرد والمستندات', en:'Response & documents'}))}</th><th></th></tr></thead><tbody>${rows}</tbody></table></div></section>
  <p class="tiny-note">${esc(L({ar:'نفس الشاشة تظهر في ملف المنتجات باسم «أسئلة الهيئة» لما تيجي الاستفسارات الحقيقية — بمصدر «الهيئة» بدل «محاكاة». أي مستند يُرفع هنا = نسخة جديدة في خانته الأصلية.', en:'The same screen appears in the product file as «EDA questions» when real queries arrive, sourced «authority» instead of «simulation». Any document uploaded here becomes a new version in its original slot.'}))}</p>`;
}
function respondDlg(id){
  const f = F.find(x => x.id === id);
  openDrawer(`${L({ar:'الرد على', en:'Respond to'})} ${id}`, `<div class="stack"><div class="fnd"><div class="en">${esc(f.fnd.en)}</div><div class="ar">${esc(f.fnd.ar)}</div><div class="src">${esc(f.ref)}</div></div>

    <div class="f"><label>${esc(L({ar:'المستندات (نسخ جديدة في خاناتها)', en:'Documents (new versions in their slots)'}))}</label><div class="picks"><label><input type="checkbox" checked> ${esc(f.act ? f.act.en : 'Updated document')} — v2.pdf</label><label><input type="checkbox"> Cover note to the department (generated)</label></div></div>
    <div class="row"><button class="btn primary" id="rsSave">${esc(t('save'))}</button><button class="btn ghost" id="rsCancel">${esc(t('cancel'))}</button></div></div>`);
  $('#rsCancel').onclick = closeDrawer;
  $('#rsSave').onclick = () => { const txt = $('#rsT').value.trim(); if(!txt){ $('#rsT').focus(); return; } f.resp = {round: 1, text: txt, docs: [`${f.sec} updated v2.pdf`]}; f.status = 'answered'; closeDrawer(); render(); toast(L({ar:'تم حفظ الرد — اضغط «أعد التقييم» لإعادة تشغيل سؤال المُقيِّم على النسخة الجديدة', en:'Response saved — press «Re-assess» to re-run the assessor question on the new version'})); };
}
function reassess(id){ const f = F.find(x => x.id === id); f.verdict = 'adequate'; f.status = 'accepted'; render(); toast(L({ar:`${id}: الحكم بعد إعادة التقييم كافٍ — الملاحظة اتقفلت`, en:`${id}: adequate after re-assessment — the finding is closed`})); }

function verdictView(){
  const o = overall(), tr = TRACKS[S.track];
  const impacts = F.filter(isOpen).sort((a, b) => ['critical','major','minor'].indexOf(a.sev) - ['critical','major','minor'].indexOf(b.sev)).slice(0, 6).map(f => { const d = DEPTS.find(x => x.id === f.dept); const cur = deptVerdict(f.dept); const was = f.status; f.status = 'closed'; const nxt = deptVerdict(f.dept); f.status = was;
    return `<div class="impact">${sevTag(f.sev)}<div><b>${esc(f.id)}</b> · ${esc(L(d))} · <span class="code">${esc(f.sec)}</span><div class="d">${esc(L(f.act || f.q))}</div></div><span class="delta">${cur === nxt ? esc(L({ar:'يقلّل الملاحظات', en:'fewer findings'})) : `${esc(L(VERDICT[cur]))} → ${esc(L(VERDICT[nxt]))}`}</span></div>`; }).join('');
  const stops = DEPTS.filter(d => !S.off.has(d.id) && ['clock_stop','reject'].includes(deptVerdict(d.id))).length;
  let cur = new Date('2026-12-01T00:00:00'); const tl = [];
  const push = (cls, label, sub) => tl.push({cls, label, sub, d: new Date(cur)});
  push('now', {ar:'التقديم المفترض', en:'Assumed submission'}, {ar:'الوحدة 1 كاملة + soft copy', en:'Complete Module 1 + soft copy'});
  cur = addWds(cur, tr.wds[0]); push('', {ar:'نتيجة الفحص الأولي', en:'Screening outcome'}, {ar:`${tr.wds[0]} ${t('wds')}`, en:`${tr.wds[0]} WDs`});
  cur = addWds(cur, typeof tr.wds[1] === 'number' ? tr.wds[1] : 60); push('', {ar:'انتهاء التقييم الفني', en:'Technical evaluation ends'}, {ar:`${tr.wds[1]} ${t('wds')}`, en:`${tr.wds[1]} WDs`});
  if(stops){ cur = addDays(cur, DUE_DAYS); push('stop', {ar:`جولة استيفاء (${stops} إدارة)`, en:`Deficiency round (${stops} departments)`}, {ar:'حتى 3 شهور — Clock stop', en:'Up to 3 months — clock stop'}); }
  cur = addWds(cur, typeof tr.wds[2] === 'number' ? tr.wds[2] : 60); push('', {ar:'صدور موافقات الإدارات', en:'Departmental approvals'}, {ar:`${tr.wds[2]} ${t('wds')}`, en:`${tr.wds[2]} WDs`});
  cur = addWds(cur, typeof tr.wds[3] === 'number' ? tr.wds[3] : 40); push('end', {ar:'اللجنة الفنية → الرخصة', en:'Technical Committee → licence'}, {ar:`${tr.wds[3]} ${t('wds')}`, en:`${tr.wds[3]} WDs`});
  const hist = [['R-0001', '2026-10-12', 31, 'notReady'], ['R-0002', '2026-10-28', 19, 'notReady'], [DOSSIER.run.id, DOSSIER.run.date, F.filter(isOpen).length, o.key]];
  return `${head(t('verdict'))}
  <section class="vstrip" style="--v-color:${o.color}">${ring(readiness(), 'lg')}<div><div class="vlabel">${esc(t('readiness'))}</div><h1>${esc(t(o.key))}</h1><p class="why">${esc(L(o.why))}</p></div><div class="acts"><button class="btn" id="runBtn">${icon('zap',16)} ${esc(t('rerun'))}</button></div></section>
  <div class="grid2">
    <section class="card"><div class="hd pad" style="padding-bottom:0"><h3>${esc(L({ar:'إيه اللي يغيّر الحكم', en:'What changes the verdict'}))}</h3><span class="small muted">${esc(L({ar:'مرتّبة بالأثر', en:'ordered by impact'}))}</span></div><div>${impacts || `<div class="empty">${icon('check',30)}<div>${esc(L({ar:'لا ملاحظات مفتوحة', en:'No open findings'}))}</div></div>`}</div></section>
    <section class="card"><div class="hd pad" style="padding-bottom:0"><h3>${esc(t('depts'))}</h3></div><div class="pad vbars">${DEPTS.map(d => { const v = deptVerdict(d.id), p = Math.round(100 * d.assessed[0] / d.assessed[1]), c = counts(byDept(d.id)); return `<div class="vbar"><span>${esc(L(d))}</span>${meter(p, v === 'approve' ? 'ok' : v === 'reject' ? 'bad' : v === 'clock_stop' ? 'warn' : '')}<span class="n">${c.critical + c.major + c.minor} ${esc(t('openQ'))}</span></div>`; }).join('')}</div></section>
  </div>
  <div class="grid2">
    <section class="card"><div class="hd pad" style="padding-bottom:0"><h3>${esc(L({ar:'الخط الزمني المتوقع', en:'Expected timeline'}))}</h3><span class="small muted">${esc(L(tr.label))}</span></div><div class="pad tl">${tl.map(x => `<div class="ti ${x.cls}"><span class="dt">${esc(fmt(x.d))}</span><span class="pt"></span><div><b>${esc(L(x.label))}</b><span>${esc(L(x.sub))}</span></div></div>`).join('')}</div><p class="tiny-note pad" style="padding-top:0">${esc(L({ar:'أيام العمل تتحول لتقويم تقريبي (5 أيام عمل = 7 أيام). الجدول المنشور لا يشمل جولات الاستيفاء.', en:'Working days are converted approximately (5 WDs = 7 calendar days). The published table excludes deficiency rounds.'}))}</p></section>
    <section class="card"><div class="hd pad" style="padding-bottom:0"><h3>${esc(L({ar:'سجل الجولات', en:'Run history'}))}</h3></div><div class="tbl"><table><thead><tr><th>${esc(L({ar:'الجولة', en:'Run'}))}</th><th>${esc(L({ar:'التاريخ', en:'Date'}))}</th><th>${esc(t('openQ'))}</th><th>${esc(t('verdict'))}</th></tr></thead><tbody>${hist.map(h => `<tr><td class="code">${esc(h[0])}</td><td class="code">${esc(h[1])}</td><td class="num">${h[2]}</td><td><span class="chip ${h[3] === 'ready' ? 'c-ok' : h[3] === 'risks' ? 'c-warn' : 'c-bad'}"><i></i>${esc(t(h[3]))}</span></td></tr>`).join('')}</tbody></table></div></section>
  </div>`;
}

function settingsView(){
  return `${head(t('settings'))}
  <div class="grid2">
    <section class="card pad stack">
      <div class="f"><label>${esc(L({ar:'الصرامة', en:'Strictness'}))}</label><div class="choice">${[['lenient', {ar:'متساهل', en:'Lenient'}, {ar:'Critical و Major فقط', en:'Critical and Major only'}], ['standard', {ar:'قياسي', en:'Standard'}, {ar:'الافتراضي — كل ما تنشره الهيئة', en:'Default — everything EDA publishes'}], ['strict', {ar:'صارم', en:'Strict'}, {ar:'+ بنود WHO التحضيرية كـ Minor', en:'+ WHO preparatory items as Minor'}]].map(([k, n, d]) => `<button data-strict="${k}" class="${S.strict === k ? 'on' : ''}"><b>${esc(L(n))}</b><span>${esc(L(d))}</span></button>`).join('')}</div></div>
      <div class="f"><label>${esc(L({ar:'المسار (لمحاكاة الساعة)', en:'Track (for the clock simulation)'}))}</label><select id="trackSel">${Object.entries(TRACKS).map(([k, v]) => `<option value="${k}" ${S.track === k ? 'selected' : ''}>${esc(L(v.label))}</option>`).join('')}</select></div>
      <div class="f"><label>${esc(L({ar:'الإدارات المفعّلة', en:'Departments enabled'}))}</label><div class="picks">${DEPTS.map(d => `<label><input type="checkbox" data-dep="${d.id}" ${S.off.has(d.id) ? '' : 'checked'}> ${esc(L(d))} <span class="muted small">— ${esc(L(d.body))}</span></label>`).join('')}</div></div>
      <div class="f"><label>${esc(L({ar:'المُقيِّم الذكي', en:'AI assessor'}))}</label><label class="opt"><input type="checkbox" id="aiTog" ${S.aiOn ? 'checked' : ''}><span><b>${esc(L({ar:'مفعّل', en:'Enabled'}))}</b><span>${esc(L({ar:'يقرأ النصوص وصور صفحات السكان ويقترح الحكم؛ لا يدخل الخطاب قبل التأكيد. في نسخة المتصفح عبر قدرة claude.ai؛ على الخادم بمفتاح.', en:'Reads text and scanned page images and suggests verdicts; nothing enters the letter before confirmation. In the browser edition via the claude.ai capability; on a server with a key.'}))}</span></span></label></div>
    </section>
    <section class="stack">
      <div class="card pad stack gap-s"><h3>${esc(t('pack'))}</h3><dl class="props" style="padding:0"><dt>eda.review.v1</dt><dd>2026-11 · 146 ${esc(L({ar:'سؤالاً', en:'questions'}))}</dd><dt>screening.yaml</dt><dd>NP.CAPP.065 v5 · WHO checklist 05/2021</dd><dt>quality.yaml</dt><dd>Quality Module guideline v2/2023 · NP.CAPP.040 · GL.CAPP.039 · TRS 986 A6</dd><dt>cadc.yaml</dt><dd>GL.CADC.002 v02/2024 §6.6 + Annexes I–VI</dd><dt>stability.yaml</dt><dd>NP.CAPP.090 v2 (06/08/2026) · Q1A/Q1E</dd><dt>be.yaml</dt><dd>GL.CAPP.024 v4/2026</dd><dt>clocks.yaml</dt><dd>${esc(L({ar:'دليل إجراءات التقديم — جدول المواعيد', en:'Submission procedures — timelines table'}))}</dd></dl></div>
      <div class="alert info">${icon('info',18)}<p>${esc(L({ar:'سلم الخطورة (Critical / Major / Minor) من الأداة — الهيئة لا تنشر سلماً رسمياً لتعليقاتها. دليل النشرة ومعايير تحقق eCTD المصرية غير مقروءة بعد: أسئلتها معلَّمة «مؤقت».', en:'The severity scale (Critical / Major / Minor) is the tool’s own — EDA publishes no formal scale for its comments. The labelling guideline and the Egyptian eCTD validation criteria are not yet read: their questions are marked «provisional».'}))}</p></div>
    </section>
  </div>`;
}

/* ---- render + events */
const VIEWS = {desk, screening, assess, letter, responses, verdict: verdictView, settings: settingsView};
function render(){
  document.documentElement.lang = LANG; document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  paintNav(); $('#view').innerHTML = VIEWS[route()](); DS.theme.paint();
  const rb = $('#runBtn'); if(rb) rb.onclick = runDemo;
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-dept],[data-sec],[data-ev],[data-ai],[data-aiok],[data-aino],[data-conf],[data-ovr],[data-act],[data-f],[data-ld],[data-slot],[data-resp],[data-reassess],[data-strict],#rejPrev,#dlDocx,#dlPdf,#cpTxt,#askSec'); if(!b) return;
  const d = b.dataset;
  if(b.classList.contains('dept')){ S.dept = d.dept; S.sec = ''; location.hash = 'assess'; render(); return; }
  if(b.classList.contains('node')){ S.dept = d.dept; S.sec = d.sec; render(); return; }
  if(d.ev){ const [id, i] = d.ev.split(':'); S.ev = {id, i: i === 'ai' ? 'ai' : +i}; render(); $('#viewer').scrollIntoView({block:'nearest', behavior:'smooth'}); return; }
  if(d.ai){ askAI(d.ai); return; }
  if(d.aiok){ const f = F.find(x => x.id === d.aiok); f.verdict = f.aiBox.verdict; f.origin = 'ai'; f.conf = f.aiBox.conf; f.confirmed = true; f.fnd = {en: f.aiBox.en, ar: f.aiBox.ar}; if(f.aiBox.ev) f.ev = [...f.ev, f.aiBox.ev]; delete f.aiBox; render(); toast(L({ar:'اتأكدت ملاحظة الذكاء الاصطناعي ودخلت الخطاب', en:'AI finding confirmed and added to the letter'})); return; }
  if(d.aino){ delete F.find(x => x.id === d.aino).aiBox; render(); return; }
  if(d.conf){ const f = F.find(x => x.id === d.conf); f.confirmed = true; render(); toast(L({ar:`${f.id}: اتأكدت`, en:`${f.id}: confirmed`})); return; }
  if(d.ovr){ overrideDlg(d.ovr); return; }
  if(d.act){ const f = F.find(x => x.id === d.act); toast(L({ar:`في المنتج: ${L(f.act)} — يفتح في منشئ الملفات (${f.sec})`, en:`In the product: ${L(f.act)} — opens in the Dossier Builder (${f.sec})`})); return; }
  if(d.f){ S.filter = d.f; render(); return; }
  if(d.ld){ S.letterDept = d.ld; render(); return; }
  if(d.slot){ toast(L({ar:`يفتح الخانة ${d.slot} في لوحة المتطلبات`, en:`Opens slot ${d.slot} in the requirements board`})); return; }
  if(d.resp){ respondDlg(d.resp); return; }
  if(d.reassess){ reassess(d.reassess); return; }
  if(d.strict){ S.strict = d.strict; render(); return; }
  if(b.id === 'rejPrev'){ rejectPreview(); return; }
  if(b.id === 'dlDocx' || b.id === 'dlPdf'){ toast(L({ar:'في المنتج: الخطاب يتولد Word/PDF بمولدات المحرك ويتنزل', en:'In the product: the letter is generated as Word/PDF by the engine and downloaded'})); return; }
  if(b.id === 'cpTxt'){ const txt = $('#letterDoc').innerText; navigator.clipboard.writeText(txt).then(() => toast(L({ar:'اتنسخ', en:'Copied'}))).catch(() => { const r = document.createRange(); r.selectNodeContents($('#letterDoc')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }); return; }
  if(b.id === 'askSec'){ byDept(S.dept).filter(f => f.sec === S.sec && !pendingAI(f) && !f.aiBox).forEach(f => { const sug = AI_SUGGEST[f.id]; f.aiBox = sug || {verdict: f.verdict === 'not_assessable' ? 'deficient' : f.verdict, conf: 0.72, en:`Section ${f.sec} read in full: the current verdict (${f.verdict}) is supported by the cited evidence.`, ar:`قراءة القسم ${f.sec} كاملاً: الحكم الحالي (${t(f.verdict)}) مدعوم بالدليل المذكور.`}; }); render(); toast(L({ar:'اقتراحات الذكاء الاصطناعي جاهزة للمراجعة', en:'AI suggestions are ready for review'})); return; }
});
document.addEventListener('change', e => {
  const el = e.target;
  if(el.id === 'mobnav'){ location.hash = el.value; return; }
  if(el.id === 'trackSel'){ S.track = el.value; render(); return; }
  if(el.id === 'aiTog'){ S.aiOn = el.checked; return; }
  if(el.dataset.dep){ if(el.checked) S.off.delete(el.dataset.dep); else S.off.add(el.dataset.dep); paintNav(); return; }
});
$('#lang-ar').onclick = () => { LANG = 'ar'; store.set('db.lang', 'ar'); render(); };
$('#lang-en').onclick = () => { LANG = 'en'; store.set('db.lang', 'en'); render(); };
$('#theme').onclick = () => DS.theme.toggle();
window.addEventListener('hashchange', render);
DS.wireChrome(); DS.theme.init(); render();

</script>
