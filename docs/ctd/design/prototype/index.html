<title>EDA Dossier Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — side rail + top bar + content; RTL/LTR mirrored; regulatory-desk density */
:root{
  --bg:#F4F6F8; --surface:#FFFFFF; --surface-2:#EEF2F5; --line:#DCE2E8; --ink:#0F1B2A; --muted:#5B6B7C;
  --brand:#0E7C86; --brand-ink:#FFFFFF; --brand-soft:#E3F3F4; --accent:#1E3A8A;
  --ok:#15803D; --ok-soft:#E5F4EA; --warn:#B45309; --warn-soft:#FBF0E1; --bad:#C62828; --bad-soft:#FBE7E7;
  --wait:#6D28D9; --wait-soft:#F0EAFC; --na:#8A97A6; --na-soft:#EEF1F4;
  --f-ui:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-ar:"IBM Plex Sans Arabic","IBM Plex Sans",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --r:10px; --shadow:0 1px 2px rgba(15,27,42,.06),0 4px 14px rgba(15,27,42,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D141C; --surface:#131C26; --surface-2:#18232F; --line:#253343; --ink:#E6EDF3; --muted:#93A3B5;
  --brand:#2BB3BD; --brand-ink:#04161A; --brand-soft:#0F2F33; --accent:#8FA8FF;
  --ok:#4ADE80; --ok-soft:#10261A; --warn:#F5A64A; --warn-soft:#2B1F0E; --bad:#F87171; --bad-soft:#2C1414;
  --wait:#B49AF7; --wait-soft:#211A36; --na:#7C8B9C; --na-soft:#1B2531; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D141C; --surface:#131C26; --surface-2:#18232F; --line:#253343; --ink:#E6EDF3; --muted:#93A3B5;
  --brand:#2BB3BD; --brand-ink:#04161A; --brand-soft:#0F2F33; --accent:#8FA8FF;
  --ok:#4ADE80; --ok-soft:#10261A; --warn:#F5A64A; --warn-soft:#2B1F0E; --bad:#F87171; --bad-soft:#2C1414;
  --wait:#B49AF7; --wait-soft:#211A36; --na:#7C8B9C; --na-soft:#1B2531; --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:14px;line-height:1.5}
html[lang="ar"] body{font-family:var(--f-ar)}
button{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.rail{background:var(--surface);border-inline-end:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;font-weight:700;letter-spacing:.2px}
.logo b{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--brand);color:var(--brand-ink);font-family:var(--f-mono);font-size:12px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.on{background:var(--brand-soft);color:var(--brand)}
.nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.nav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--na);padding:12px 10px 4px}
html[lang="ar"] .nav .grp{letter-spacing:0}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ws{display:flex;align-items:center;gap:8px;padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-weight:600;white-space:nowrap}
.ws small{color:var(--muted);font-weight:500}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--muted)}
.search kbd{margin-inline-start:auto;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.content{padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1440px;width:100%;display:flex;flex-direction:column;gap:18px}
h1{font-size:22px;margin:0;text-wrap:balance}
h2{font-size:16px;margin:0}
.sub{color:var(--muted);margin:2px 0 0}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.kpi .n{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi.b{border-inline-start:3px solid var(--bad)} .kpi.w{border-inline-start:3px solid var(--wait)} .kpi.o{border-inline-start:3px solid var(--ok)} .kpi.p{border-inline-start:3px solid var(--brand)}
.alert{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r);background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
.alert p{margin:0;flex:1;min-width:0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2)}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.c-ok{background:var(--ok-soft);color:var(--ok)} .c-warn{background:var(--warn-soft);color:var(--warn)} .c-bad{background:var(--bad-soft);color:var(--bad)}
.c-wait{background:var(--wait-soft);color:var(--wait)} .c-na{background:var(--na-soft);color:var(--na)} .c-rec{background:#E6EEFB;color:#1E40AF}
:root[data-theme="dark"] .c-rec{background:#13213D;color:#93B4FF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .c-rec{background:#13213D;color:#93B4FF}}
.src{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.code{font-family:var(--f-mono);font-size:12px;direction:ltr;unicode-bidi:isolate}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:80px}
.bar span{display:block;height:100%;background:var(--brand)}
.ring{--p:60;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--brand) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center}
.ring::after{content:attr(data-v);width:48px;height:48px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-weight:700;font-size:13px}
.mods{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.mod{display:flex;align-items:center;gap:12px;padding:14px}
.mod small{display:block;color:var(--muted)}
.two{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li p{margin:0;min-width:0;flex:1}
.li .muted{color:var(--muted);font-size:12.5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 10px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.sec-h td{background:var(--bg);font-weight:700;font-size:12.5px;color:var(--muted)}
.drawer-bg{position:fixed;inset:0;background:rgba(10,18,28,.35);z-index:20}
.drawer{position:fixed;top:0;bottom:0;inset-inline-end:0;width:min(520px,100%);background:var(--surface);z-index:21;border-inline-start:1px solid var(--line);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.drawer header{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.drawer header div{flex:1;min-width:0}
.drawer .body{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:16px;flex:1}
.drawer footer{padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.check{display:flex;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.check .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.check.ok .ic{background:var(--ok-soft);color:var(--ok)} .check.bad .ic{background:var(--bad-soft);color:var(--bad)} .check.warn .ic{background:var(--warn-soft);color:var(--warn)}
.check p{margin:0;min-width:0}
.lock{display:flex;gap:10px;padding:12px;border-radius:8px;background:var(--wait-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--wait) 30%,transparent)}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:30;background:rgba(10,18,28,.4);padding:16px}
.modal .card{max-width:480px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px}
.steps{display:flex;gap:8px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:13px}
.step b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface-2);font-size:11px}
.step.on{border-color:var(--brand);color:var(--brand)} .step.on b{background:var(--brand);color:var(--brand-ink)}
.step.done b{background:var(--ok);color:#fff}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:4px}
.f label{font-size:12.5px;color:var(--muted);font-weight:500}
.f input,.f select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
.f .err{color:var(--bad);font-size:12px}
.side-note{position:sticky;top:76px}
.big{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums}
.tpl{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.tpl .card{padding:14px;display:flex;flex-direction:column;gap:8px}
.tpl .card p{margin:0;color:var(--muted);font-size:13px}
.miss{color:var(--bad);font-size:12.5px}
.pac{font-family:var(--f-mono);font-weight:600;padding:2px 8px;border-radius:6px;font-size:12px}
.pac.N{background:var(--ok-soft);color:var(--ok)} .pac.A{background:#E6EEFB;color:#1E40AF} .pac.B{background:var(--warn-soft);color:var(--warn)} .pac.II{background:var(--bad-soft);color:var(--bad)}
.gate{display:flex;flex-direction:column;gap:8px}
.gate div{display:flex;gap:10px;align-items:center}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));inset-inline-start:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:40;max-width:calc(100% - 32px)}
html[dir="rtl"] .toast{transform:translateX(50%)}
.ex{font-size:11px;color:var(--muted);border:1px dashed var(--line);border-radius:6px;padding:1px 6px}
@media (max-width:1100px){.mods{grid-template-columns:repeat(3,minmax(0,1fr))}.tpl{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));border-inline-end:0;border-bottom:1px solid var(--line)}
  .nav{display:flex;gap:4px}.nav .grp,.logo span{display:none}.logo{padding:0 8px 0 0}
  .grid4{grid-template-columns:repeat(2,minmax(0,1fr))}.mods{grid-template-columns:repeat(2,minmax(0,1fr))}
  .form,.tpl{grid-template-columns:1fr}.search kbd{display:none}.ws small{display:none}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:in .18s ease-out}@keyframes in{from{transform:translateX(16px);opacity:.6}}}
</style>

    <main class="content" id="view"></main>
  </div>
</div>
<div id="layer"></div>
